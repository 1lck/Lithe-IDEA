<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; worker-src 'self'; connect-src 'self';">
<title>Lithe Editor</title>
<link rel="stylesheet" href="editor.css">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
  #editor { position: absolute; inset: 0; }
</style>
<script>
  window.__litheBootErrors = [];
  function showBootError(message) {
    window.__litheBootErrors.push(String(message));
    var box = document.getElementById('boot-error');
    if (!box) {
      box = document.createElement('div');
      box.id = 'boot-error';
      box.style.cssText = 'position:fixed;left:0;top:0;right:0;max-height:60%;overflow:auto;background:#8b2525;color:#fff;font:12px monospace;padding:8px;z-index:9999;white-space:pre-wrap';
      document.body.appendChild(box);
    }
    box.textContent = window.__litheBootErrors.join('\n');
  }
  window.addEventListener('error', function (event) {
    showBootError((event.message || 'script error') + ' @ ' + (event.filename || '') + ':' + (event.lineno || 0));
  }, true);
  window.addEventListener('unhandledrejection', function (event) {
    showBootError('unhandled rejection: ' + String(event.reason));
  });
</script>
</head>
<body>
<div id="editor"></div>
<script src="editor.js" onerror="showBootError('editor.js failed to load')"></script>
</body>
</html>
