[package]
name = "lithe-features"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit = { workspace = true, features = ["syntect"] }
alacritty_terminal = "0.26.0"
lsp-types = "0.97"
lithe-ui = { path = "../lithe-ui" }
lithe-agent-host = { path = "../../rust/lithe-agent-host" }
lithe-core = { workspace = true }
lithe-core-client = { path = "../lithe-core-client" }
lithe-git-host = { path = "../../rust/lithe-git-host" }
lithe-platform = { path = "../lithe-platform" }
lithe-terminal = { path = "../../rust/lithe-terminal" }
memory-stats = "1"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
zip = { version = "2.6", default-features = false }
