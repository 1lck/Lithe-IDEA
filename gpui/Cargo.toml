[workspace]
resolver = "2"
members = [
    "lithe-ui",
    "lithe-core-client",
    "lithe-platform",
    "lithe-workbench",
    "lithe-features",
    "lithe-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = "0.8.1"
gpui-webview = "0.8.1"
wry = { version = "0.53.3", package = "lb-wry" }
lithe-core = { path = "../rust/lithe-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
