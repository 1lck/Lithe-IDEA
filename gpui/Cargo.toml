[workspace]
resolver = "2"
members = [
    "lithe-ui",
    "lithe-core-client",
    "lithe-platform",
    "lithe-workbench",
    "lithe-features",
    "lithe-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui-kit = "0.8.1"
lithe-core = { path = "../rust/lithe-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rfd = "0.15"
# 移到系统回收站：Windows 走 IFileOperation，macOS 走 NSFileManager，
# Linux 走 Freedesktop Trash 规范。默认特性必须保留，Windows 编译期要求
# `coinit_apartmentthreaded` 或 `coinit_multithreaded` 之一。
trash = "5.2"
