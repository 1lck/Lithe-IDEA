<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Lithe 设置 · 构建、执行、部署（大规模插件注入）交互原型</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  交互原型，不是实现。数据全部是示例：插件 ID 除截图里的三个外均为虚构（io.github.example.*）。
  “生效值、分组、筛选、计数”在原型里由 JS 模拟；正式实现中这些都由 Core 计算，Viva 只呈现可见窗口。
  可用地址参数直接打开某个状态，例如：
    #page=toolchains&scale=5000&sel=java.jdk&scope=project&dark=1&notes=0
-->
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --side:#f2f3f5; --sel:#dfe7f8; --hover:#eceef1;
  --text:#1f2329; --sub:#6c707e; --faint:#9aa0ab; --line:#e4e6ea; --accent:#3574f0;
  --ok:#208a3c; --warn:#c27d00; --err:#d1453b; --pill:#eef1f6; --chip:#e8f0fe;
  --note:#ffd75e; --shadow:0 8px 28px rgba(0,0,0,.14); --hl:#fff3c4;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
  font-size:13px; color:var(--text);
}
html.dark{
  --bg:#1e1f22; --surface:#2b2d30; --side:#26282b; --sel:#2e436e; --hover:#33363a;
  --text:#dfe1e5; --sub:#9da0a8; --faint:#6f737a; --line:#3a3d41; --accent:#548af7;
  --ok:#5fb865; --warn:#e0a83e; --err:#f0716a; --pill:#393b40; --chip:#25324d;
  --shadow:0 8px 28px rgba(0,0,0,.5); --hl:#4a4220;
}
*{box-sizing:border-box}
body{margin:0;background:#c9ccd3;min-height:100vh;display:flex;flex-direction:column;align-items:center}
html.dark body{background:#111214}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:"SF Mono",Menlo,monospace;font-size:11.5px}
.demobar{width:100%;min-width:1180px;white-space:nowrap;display:flex;gap:14px;align-items:center;padding:8px 16px;background:#24262b;color:#ddd;font-size:12px}
.demobar b{color:#fff}.demobar label{display:flex;gap:5px;align-items:center;cursor:pointer}.demobar .sp{flex:1}
.demobar select{background:#34373d;border:1px solid #484b52;border-radius:5px;padding:2px 6px;color:#eee}
.demobar .perf{color:#9fb4d8;font-family:"SF Mono",Menlo,monospace;font-size:11px}
.win{margin:18px;min-width:1180px;width:min(1560px,calc(100vw - 36px));height:min(880px,calc(100vh - 80px));min-height:640px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.titlebar{height:38px;display:flex;align-items:center;padding:0 14px;gap:8px;border-bottom:1px solid var(--line);background:var(--side);flex:none}
.dot{width:12px;height:12px;border-radius:50%}
.titlebar .t{flex:1;text-align:center;font-weight:600;color:var(--sub);margin-right:52px}
.body{flex:1;display:flex;min-height:0}
/* 侧栏 */
.side{width:240px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side .search{margin:10px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);display:flex;gap:6px;align-items:center;color:var(--faint)}
.side .search input{border:0;outline:0;background:transparent;width:100%;color:var(--text)}
.nav{overflow:auto;padding:0 6px 10px;flex:1}
.nav .r{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer;min-height:26px;white-space:nowrap}
.nav .r:hover{background:var(--hover)}
.nav .r.sel{background:var(--sel)}
.nav .r.l1{padding-left:34px}.nav .r.l2{padding-left:52px}
.nav .r.more{color:var(--accent);font-size:12px}
.nav .caret{width:12px;color:var(--faint);font-size:9px;transition:transform .12s;flex:none;text-align:center}
.nav .caret.open{transform:rotate(90deg)}
.nav .caret.none{visibility:hidden}
.nav .gi{width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;flex:none}
.nav .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav .cnt{margin-left:auto;font-size:10.5px;color:var(--faint)}
.nav .hd{font-size:10.5px;color:var(--faint);font-weight:600;padding:10px 8px 3px}
.nav .path{font-size:10.5px;color:var(--faint);margin-left:auto;padding-left:6px;overflow:hidden;text-overflow:ellipsis}
.bad{margin-left:auto;min-width:16px;height:16px;padding:0 5px;border-radius:8px;background:var(--err);color:#fff;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none}
.bad.warn{background:var(--warn)}
/* 主区 */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface)}
.crumb{height:42px;flex:none;display:flex;align-items:center;gap:8px;padding:0 18px;border-bottom:1px solid var(--line)}
.crumb .c{color:var(--sub);cursor:pointer}.crumb .c:hover{color:var(--accent)}
.crumb .c.last{color:var(--text);font-weight:600;cursor:default}
.crumb .sep{color:var(--faint)}
.content{flex:1;overflow:auto;min-height:0;position:relative}
.content.fixed{overflow:hidden}
.page{padding:16px 20px 30px}
.footer{height:50px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--surface)}
.footer .msg{margin-right:auto;color:var(--sub);font-size:12px;display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.footer .msg b{color:var(--text);font-weight:500}
.moddot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;display:inline-block}
/* 通用控件 */
.btn{border:1px solid var(--line);background:var(--surface);padding:4px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:2px 9px;font-size:12px}
.btn.link{border-color:transparent;background:transparent;color:var(--accent);padding:2px 4px}
.btn[disabled]{opacity:.45;cursor:default}
.icon-btn{border:0;background:transparent;cursor:pointer;width:26px;height:26px;border-radius:6px;color:var(--sub);font-size:14px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--hover)}
.seg{display:inline-flex;background:var(--pill);border-radius:7px;padding:2px;flex:none}
.seg button{border:0;background:transparent;padding:3px 12px;border-radius:5px;cursor:pointer;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg .mod{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
.inp{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);outline:0;min-width:0}
.inp:focus{border-color:var(--accent)}
select.inp{padding:3px 6px}
.finput{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--surface);color:var(--faint);min-width:0}
.finput:focus-within{border-color:var(--accent)}
.finput input{border:0;outline:0;background:transparent;width:100%;color:var(--text)}
.chip{padding:2px 9px;border-radius:999px;background:var(--pill);cursor:pointer;font-size:12px;color:var(--sub);border:1px solid transparent;user-select:none;white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.chip b{font-weight:600;color:var(--text)}
.chip.on{background:var(--chip);color:var(--accent);border-color:var(--accent)}
.chip.on b{color:var(--accent)}
.chip .e{color:var(--err)} .chip .w{color:var(--warn)}
.tag{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--pill);color:var(--sub);white-space:nowrap;flex:none}
.tag.blue{background:var(--chip);color:var(--accent)}
.tag.green{background:#e6f4ea;color:var(--ok)} html.dark .tag.green{background:#22382a}
.tag.warn{background:#fff1d6;color:var(--warn)} html.dark .tag.warn{background:#3d3220}
.tag.err{background:#fbe5e3;color:var(--err)} html.dark .tag.err{background:#45282a}
.tag.src{background:transparent;border:1px solid var(--line);color:var(--sub)}
.sw{width:30px;height:18px;border-radius:9px;background:#c4c7cd;position:relative;cursor:pointer;flex:none;border:0;padding:0;transition:background .15s}
html.dark .sw{background:#55585e}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)} .sw.on::after{left:14px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;display:inline-block}
.sdot.err{background:var(--err)} .sdot.warn{background:var(--warn)} .sdot.idle{background:var(--faint)}
.muted{color:var(--sub);font-size:12px}.faint{color:var(--faint);font-size:11.5px}
.box{border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.55;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.box.warn{border:1px solid #f1d29a;background:#fdf6e7;color:#7a5400} html.dark .box.warn{background:#3a301d;border-color:#5c4a24;color:#e8c47a}
.box.info{border:1px solid var(--line);background:var(--pill);color:var(--sub)}
.box.err{border:1px solid #f0c4c0;background:#fdf0ef;color:#8a2a22} html.dark .box.err{background:#3d2524;border-color:#5f3532;color:#f2a39c}
.box.next{border:1px solid #bcd0f7;background:#eef4ff;color:#23468f} html.dark .box.next{background:#22314d;border-color:#36507e;color:#a9c3f5}
.box .grow{flex:1;min-width:200px}
i.info{width:15px;height:15px;border-radius:50%;border:1px solid var(--faint);color:var(--faint);font-size:9.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;cursor:help;flex:none;font-style:normal}
i.info:hover{border-color:var(--accent);color:var(--accent)}
.nb{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--note);color:#3a2d00;font-size:10px;font-weight:700;cursor:pointer;flex:none;box-shadow:0 0 0 2px rgba(255,215,94,.35);font-style:normal}
html.nonotes .nb{display:none}
#tip{position:fixed;z-index:100;max-width:340px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 11px;font-size:12px;line-height:1.55;white-space:pre-line;pointer-events:none;display:none;color:var(--text)}
.toast{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:#2b2d30;color:#fff;padding:7px 14px;border-radius:8px;font-size:12px;z-index:60;box-shadow:var(--shadow);max-width:70%}
.pi{width:28px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;flex:none;letter-spacing:-.3px}
.pi.sm{width:20px;height:20px;border-radius:5px;font-size:9px}
.pi.lg{width:40px;height:40px;border-radius:10px;font-size:14px}
h2{margin:0;font-size:17px}
.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:var(--surface)}
.sec>.sh{display:flex;align-items:center;gap:6px;padding:10px 12px 6px;font-weight:600}
.sec>.sh .sp{flex:1}
.sec>.sb{padding:0 6px 8px}
.srow{display:flex;align-items:center;gap:10px;min-height:34px;padding:3px 8px;border-radius:7px}
.srow:hover{background:var(--hover)}
.srow .lab{width:200px;flex:none;display:flex;align-items:center;gap:5px}
.srow .ctl{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
/* 概览目录 */
.dir .drow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer}
.dir .drow:hover{background:var(--hover)}
.dir .drow+.drow{border-top:1px solid var(--line)}
.dir .drow:hover+.drow{border-top-color:transparent}
.dir .t{font-weight:600}
.dir .d{color:var(--sub);font-size:12px;margin-top:2px}
.dir .chev{color:var(--faint);margin-left:auto}
.issues .irow{display:flex;align-items:center;gap:8px;padding:5px 4px;cursor:pointer;border-radius:6px}
.issues .irow:hover{background:rgba(0,0,0,.04)}
/* 工具链页 */
.tc{display:flex;flex-direction:column;height:100%}
.tbar{display:flex;align-items:center;gap:8px;padding:10px 14px 6px;flex:none}
.tbar .sp{flex:1}
.tbar2{display:flex;align-items:center;gap:6px;padding:2px 14px 8px;flex:none;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow:hidden}
.tbar2 .sp{flex:1}
.tbanner{padding:8px 14px 0;flex:none}
.split2{display:flex;flex:1;min-height:0}
.lpane2{width:372px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rpane2{flex:1;min-width:0;overflow:auto}
.lfoot{flex:none;border-top:1px solid var(--line);padding:5px 12px;font-size:11px;color:var(--faint);display:flex;gap:8px}
.vl{flex:1;overflow:auto;min-height:0;position:relative;outline:0}
.vsp{position:relative}
.vr{position:absolute;left:0;right:0}
.gh{display:flex;align-items:center;gap:6px;height:100%;padding:0 12px;font-size:11.5px;font-weight:600;color:var(--sub);cursor:pointer;background:var(--side);border-bottom:1px solid var(--line);user-select:none}
.gh .caret{width:10px;font-size:8px;color:var(--faint);transition:transform .12s}
.gh.open .caret{transform:rotate(90deg)}
.gh .n{font-weight:400;color:var(--faint)}
.gh .bad{margin-left:4px}
.gh .sp{flex:1}
.trow{display:flex;align-items:center;gap:9px;height:100%;padding:0 12px 0 14px;cursor:pointer;position:relative}
.trow:hover{background:var(--hover)}
.trow.sel{background:var(--sel)}
.trow .grow{flex:1;min-width:0}
.trow .l1{display:flex;align-items:center;gap:6px;min-width:0}
.trow .l1 b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.trow .l1 .v{color:var(--sub);font-family:"SF Mono",Menlo,monospace;font-size:11px;white-space:nowrap}
.trow .l1 .to{color:var(--accent);font-family:"SF Mono",Menlo,monospace;font-size:11px;white-space:nowrap}
.trow .l1 .sp{flex:1}
.trow .l2{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.trow .l2 .e{color:var(--err)} .trow .l2 .w{color:var(--warn)}
.trow .mk{position:absolute;left:4px;top:50%;margin-top:-3px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.empty{color:var(--faint);text-align:center;padding:50px 20px;line-height:1.8}
/* 详情 */
.dt{padding:16px 20px 30px}
.dt .head{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.dt .head .sub{color:var(--sub);font-size:12px;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dt .head .acts{margin-left:auto;display:flex;gap:6px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;padding:2px 12px 4px;align-items:center}
.kv .k{color:var(--sub);font-size:12px}
.kv .v{display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}
.kv .v.nw{flex-wrap:nowrap;align-items:flex-start}
.pathv{font-family:"SF Mono",Menlo,monospace;font-size:11.5px;overflow-wrap:anywhere;min-width:0}
.opts{padding:0 4px}
.opt{display:grid;grid-template-columns:18px 92px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;cursor:pointer}
.opt:hover{background:var(--hover)}
.opt.on{background:var(--chip)}
.opt.dis{cursor:default;opacity:.62}
.opt.dis:hover{background:transparent}
.opt .rd{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--faint);position:relative}
.opt.on .rd{border-color:var(--accent)}
.opt.on .rd::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--accent)}
.opt .ov{font-family:"SF Mono",Menlo,monospace;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt .op{font-family:"SF Mono",Menlo,monospace;font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.opt .os{display:flex;gap:4px;justify-content:flex-end}
.opt.auto .ov{font-family:inherit;font-size:12.5px;grid-column:2 / 4;color:var(--text)}
.addrow{display:flex;gap:6px;align-items:center;padding:6px 8px}
.trace{margin:4px 12px 2px;padding:0;list-style:none;font-size:12px}
.trace li{display:flex;gap:8px;align-items:baseline;padding:3px 0;color:var(--sub)}
.trace li .m{width:14px;text-align:center;flex:none;font-weight:700}
.trace li.use{color:var(--text)} .trace li.use .m{color:var(--ok)}
.trace li.blk .m{color:var(--warn)}
.disclose{color:var(--accent);cursor:pointer;font-size:12px;padding:4px 12px;display:inline-block;user-select:none}
.users{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 4px}
.ufoot{padding:10px 12px 0;color:var(--faint);font-size:11px;font-family:"SF Mono",Menlo,monospace}
/* 调试器 */
.lst{border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:1;min-width:0}
.lst .lrow{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--line)}
.lst .lrow:hover{background:var(--hover)}
.lst .lrow .x{margin-left:auto;opacity:0}
.lst .lrow:hover .x{opacity:1}
.lst .ladd{display:flex;gap:6px;padding:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:transparent;padding:6px 12px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.tabs button[disabled]{opacity:.45;cursor:default}
/* 插件页 */
.canvas{border:1.5px dashed var(--line);border-radius:10px;padding:10px 6px 8px;position:relative}
.canvas .cap{position:absolute;top:-9px;left:12px;background:var(--surface);padding:0 6px;font-size:11px;color:var(--faint)}
/* 设计标注 */
.notes{width:320px;flex:none;background:var(--side);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.notes .h{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center;gap:6px}
.notes .l{overflow:auto;padding:10px 14px 20px;display:flex;flex-direction:column;gap:11px}
.notes .n{display:flex;gap:8px;line-height:1.6;font-size:12px}
.notes .n.hl{background:var(--hl);border-radius:6px;padding:4px}
.notes .old{font-size:12px;line-height:1.6;color:var(--sub);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.notes .old b{color:var(--text)}
.notes .old ol{margin:4px 0 0;padding-left:18px}
.notes .tt{font-size:11px;font-weight:600;color:var(--faint);margin-top:4px}
.notes code{font-family:"SF Mono",Menlo,monospace;font-size:11px;background:var(--pill);padding:0 3px;border-radius:3px}
#err{position:fixed;left:10px;bottom:10px;background:#d1453b;color:#fff;padding:8px 12px;border-radius:8px;font:12px Menlo,monospace;display:none;z-index:200;max-width:80vw;white-space:pre-wrap}
</style>
</head>
<body>
<div class="demobar">
  <b>交互原型</b><span>设置 › 构建、执行、部署（面向大量插件注入）</span>
  <label>插件规模
    <select id="optScale">
      <option value="shot">截图现状（3 个插件）</option>
      <option value="sample" selected>示例（约 20 个插件）</option>
      <option value="1000">1,000 个插件</option>
      <option value="5000">5,000 个插件</option>
    </select>
  </label>
  <label><input type="checkbox" id="optDark"> 深色</label>
  <label><input type="checkbox" id="optNotes" checked> 设计标注</label>
  <span class="sp"></span>
  <span class="perf" id="perf"></span>
</div>
<div class="win" id="win">
  <div class="titlebar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="t">设置</span></div>
  <div class="body">
    <div class="side">
      <div class="search">⌕<input id="navq" placeholder="搜索设置、工具、调试器" autocomplete="off"></div>
      <div class="nav" id="nav"></div>
    </div>

function pinOf(scope,id,useDraft){const d=S.draft[scope];if(useDraft&&d&&Object.prototype.hasOwnProperty.call(d,id))return d[id];return S.saved[scope][id]||"";}
// 返回 {c, layer, trace} 或 {err, trace}
function resolve(t,scope,useDraft){
  const trace=[];
  if(t.conflict){return {err:"conflict",trace:[{s:"blk",t:`工具 ID “${t.id}” 同时由 ${[t.pk,...t.conflict].map(k=>P[k]?P[k].name:k).join("、")} 声明，已暂停解析`}]};}
  const usable=c=>!c.bad&&(!c.proj||(scope==="project"&&S.trusted));
  const find=h=>allCands(t,"global").concat(allCands(t,"project")).find(c=>c.home===h);
  if(scope==="project"){
    const pp=pinOf("project",t.id,useDraft);
    if(pp){const c=find(pp);if(c&&usable(c)){trace.push({s:"use",t:`项目指定：${c.ver} · ${c.home}`});return {c,layer:"pinned",trace};}
      trace.push({s:"blk",t:`项目指定：${pp}（不可用）`});}
    else trace.push({s:"skip",t:"项目指定：未设置（.lithe/toolchains/local.json）"});
    const pc=t.cands.find(c=>c.proj);
    if(pc){
      if(!S.trusted){trace.push({s:"blk",t:`项目环境：${pc.home}（${pc.src[0]}）需要先信任项目`});return {err:"trust",trace,pc};}
      if(!pc.bad){trace.push({s:"use",t:`项目环境：${pc.ver} · ${pc.home}（${pc.src[0]}）`});return {c:pc,layer:"project",trace};}
    } else trace.push({s:"skip",t:"项目环境：插件没有在项目中找到对应文件"});
  }
  const gp=pinOf("global",t.id,scope==="global"?useDraft:true);
  if(gp){const c=find(gp);if(c&&!c.bad){trace.push({s:"use",t:`全局默认：${c.ver} · ${c.home}`});return {c,layer:"global",trace};}
    trace.push({s:"blk",t:`全局默认：${gp}（不可用）`});}
  else trace.push({s:"skip",t:"全局默认：未设置"});
  const order=t.cands.filter(c=>!c.proj);
  const a=order.find(c=>!c.bad);
  const orderText=order.length?order.map(c=>c.src[0]).filter((v,i,arr)=>arr.indexOf(v)===i).join(" → "):"插件没有声明可探测的位置";
  if(a){trace.push({s:"use",t:`自动发现（${orderText}）：${a.ver} · ${a.home}`});return {c:a,layer:"automatic",trace};}
  trace.push({s:"blk",t:`自动发现（${orderText}）：没有可用安装`});
  if(scope==="global"&&t.cands.length&&t.cands.every(c=>c.proj))return {err:"projectOnly",trace};
  if(t.cands.some(c=>c.bad==="probeFailed"))return {err:"probeFailed",trace};
  if(t.cands.some(c=>c.bad==="versionUnsatisfied"))return {err:"versionUnsatisfied",trace};
  return {err:"notFound",trace};
}

const draftsIn=scope=>Object.keys(S.draft[scope]).length+Object.keys(S.custom[scope]).filter(id=>!(id in S.draft[scope])&&(S.custom[scope][id]||[]).length).length*0;
function hasDraft(scope,id){return Object.prototype.hasOwnProperty.call(S.draft[scope],id);}
function dbgDraftCount(){return Object.keys(S.dbgDraft).length;}
function totalDrafts(){return draftsIn("global")+draftsIn("project")+dbgDraftCount();}

/* 统计与行投影（正式实现里由 Core 完成，平台只取可见窗口） */
let STAT={},STAT_KEY="";
function toolInfo(t){const res=resolve(t,S.scope,false);return {res,st:statusOf(res)};}
function stats(){
  const key=S.scale+S.scope+S.trusted+JSON.stringify(S.saved)+JSON.stringify(S.draft)+JSON.stringify(S.custom);
  if(key===STAT_KEY)return STAT;
  const info={};let problems=0,pinned=0,changed=0,err=0,warn=0;
  for(const t of TOOLS){const i=toolInfo(t);info[t.id]=i;if(i.st==="err"||i.st==="warn"){problems++;i.st==="err"?err++:warn++;}
    if(S.saved[S.scope][t.id])pinned++;if(hasDraft(S.scope,t.id))changed++;}
  STAT={info,problems,pinned,changed,err,warn,total:TOOLS.length};STAT_KEY=key;return STAT;
}
function matches(t,q){if(!q)return true;q=q.toLowerCase();if(t.name.toLowerCase().includes(q)||t.id.includes(q))return true;const p=P[t.pk];if(p&&(p.name.toLowerCase().includes(q)||p.id.includes(q)))return true;return t.cands.some(c=>c.home.toLowerCase().includes(q)||c.ver.includes(q));}
function toolRows(){
  const st=stats(), q=S.q.trim(), list=[];
  for(const t of TOOLS){
    if(!matches(t,q))continue;
    const s=st.info[t.id].st;
    if(S.filter==="problems"&&s!=="err"&&s!=="warn")continue;
    if(S.filter==="pinned"&&!S.saved[S.scope][t.id])continue;
    if(S.filter==="changed"&&!hasDraft(S.scope,t.id))continue;
    list.push(t);
  }
  const rank=t=>{const s=st.info[t.id].st;return s==="err"?0:s==="warn"?1:2;};
  const sorter=(a,b)=>rank(a)-rank(b)||a.name.localeCompare(b.name,"zh-CN");
  const filtering=!!q||S.filter!=="all";
  const rows=[];
  if(S.groupBy==="none"){list.sort(sorter);for(const t of list)rows.push({type:"t",h:46,t});return rows;}
  const groups=new Map();
  for(const t of list){const key=S.groupBy==="plugin"?"p:"+t.pk:(t.aud==="plugin"?"plugin":t.cat);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(t);}
  let keys=[...groups.keys()];
  if(S.groupBy==="category")keys.sort((a,b)=>CAT_ORDER.indexOf(a)-CAT_ORDER.indexOf(b));
  else keys.sort((a,b)=>(P[a.slice(2)]?.name||a).localeCompare(P[b.slice(2)]?.name||b,"zh-CN"));
  for(const key of keys){
    const items=groups.get(key).sort(sorter);
    const bad=items.filter(t=>{const s=st.info[t.id].st;return s==="err"||s==="warn";}).length;
    const label=S.groupBy==="plugin"?(P[key.slice(2)]?.name||key):CATS[key];
    const collapsed=!filtering&&(S.collapsed[key]??(S.groupBy==="plugin"&&keys.length>40));
    rows.push({type:"g",h:30,key,label,n:items.length,bad,collapsed,info:key==="plugin"&&S.groupBy==="category"?"插件为自己的语言服务器或后台进程声明的运行时。平时不用改，所以默认折叠；出了问题仍会计入“需要处理”。":""});
    if(!collapsed)for(const t of items)rows.push({type:"t",h:46,t});
  }
  return rows;
}

/* ================= 虚拟列表 ================= */
const VL={};
function vlist(key,rows,renderRow,emptyHtml){
  const offs=new Array(rows.length+1);offs[0]=0;for(let i=0;i<rows.length;i++)offs[i+1]=offs[i]+rows[i].h;
  VL[key]={rows,offs,renderRow,rendered:0};
  if(!rows.length)return `<div class="vl" data-vl="${key}" tabindex="0"><div class="empty">${emptyHtml}</div></div>`;
  return `<div class="vl" data-vl="${key}" tabindex="0"><div class="vsp" style="height:${offs[rows.length]}px"></div></div>`;
}
function paintVL(key){
  const v=VL[key],host=document.querySelector(`[data-vl="${key}"]`);if(!v||!host||!v.rows.length)return;
  const top=host.scrollTop,h=host.clientHeight||600;
  let lo=0,hi=v.rows.length;while(lo<hi){const m=(lo+hi)>>1;if(v.offs[m+1]<=top)lo=m+1;else hi=m;}
  const start=Math.max(0,lo-3);let end=lo;while(end<v.rows.length&&v.offs[end]<top+h)end++;end=Math.min(v.rows.length,end+3);
  let html="";for(let i=start;i<end;i++)html+=`<div class="vr" style="top:${v.offs[i]}px;height:${v.rows[i].h}px">${v.renderRow(v.rows[i],i)}</div>`;
  host.firstElementChild.innerHTML=html;v.rendered=end-start;perf();
}
function mountVLs(){
  document.querySelectorAll("[data-vl]").forEach(el=>{const k=el.dataset.vl;if(S.scroll[k]!=null)el.scrollTop=S.scroll[k];paintVL(k);});
}
document.addEventListener("scroll",e=>{const el=e.target;if(el&&el.dataset&&el.dataset.vl){S.scroll[el.dataset.vl]=el.scrollTop;requestAnimationFrame(()=>paintVL(el.dataset.vl));}},true);
function reveal(key,pred){
  const v=VL[key],host=document.querySelector(`[data-vl="${key}"]`);if(!v||!host)return;
  const i=v.rows.findIndex(pred);if(i<0)return;
  const top=v.offs[i],bottom=v.offs[i+1];
  if(top<host.scrollTop)host.scrollTop=top-30;else if(bottom>host.scrollTop+host.clientHeight)host.scrollTop=bottom-host.clientHeight+30;
  S.scroll[key]=host.scrollTop;paintVL(key);
}

const info=t=>`<i class="info" data-tip="${esc(t)}" tabindex="0">i</i>`;
const nb=n=>`<i class="nb" data-note="${n}">${n}</i>`;
const picon=(k,cls="")=>{const p=P[k]||{name:k,color:"#888"};return `<span class="pi ${cls}" style="background:${p.color}">${esc(abbr(p.name))}</span>`;};
const ticon=(t,cls="")=>`<span class="pi ${cls}" style="background:${P[t.pk]?.color||hue(t.name)}">${esc(abbr(t.name))}</span>`;
const srcTags=c=>c.src.map(s=>`<span class="tag src">${esc(s)}</span>`).join("");
function layerTag(res){if(res.err)return `<span class="tag ${res.err==="projectOnly"?"":res.err==="trust"||res.err==="probeFailed"?"warn":"err"}">${esc(REASON[res.err])}</span>`;const [l,c]=LAYER[res.layer];return `<span class="tag ${c}">${l}</span>`;}
function reasonText(t,res){
  if(res.err==="versionUnsatisfied")return `找到的安装都不满足最低版本要求（需要 ≥ ${t.req}）`;
  if(res.err==="notFound")return t.install?`没有找到安装 · 可以用 ${TOOL[t.install]?.name||"安装器"} 安装`:"没有找到安装";
  if(res.err==="probeFailed")return `版本检测失败：${t.probe||"无法读取版本"}`;
  if(res.err==="trust")return `来自项目内的 ${res.pc?.src[0]||"环境"}，需要先信任项目`;
  if(res.err==="conflict")return `同时由 ${[t.pk,...t.conflict].map(k=>P[k]?.name||k).join("、")} 声明`;
  if(res.err==="projectOnly")return "只在项目中提供，切到“当前项目”查看";
  return REASON[res.err]||res.err;
}

// 列表行右侧已经有原因标签，第二行只补标签里没有的信息，避免同一句话出现两次。
function reasonDetail(t,res){
  if(res.err==="versionUnsatisfied")return `需要 ≥ ${t.req}`;
  if(res.err==="notFound")return t.install?`可以用 ${TOOL[t.install]?.name||"安装器"} 安装`:"";
  if(res.err==="probeFailed")return t.probe||"";
  if(res.err==="trust")return `来自 ${res.pc?.src[0]||"项目环境"}`;
  if(res.err==="conflict")return `${[t.pk,...t.conflict].map(k=>P[k]?.name||k).join("、")}`;
  if(res.err==="projectOnly")return "切到“当前项目”查看";
  return "";
}

function navHtml(){

      const k="k."+kind,o=S.open[k];
      h+=`<div class="r l1 ${S.page==="folder:"+kind?"sel":""}" data-nav="folder:${kind}" style="padding-left:18px"><span class="caret ${o?"open":""}" data-tog="${k}">▶</span><span class="nm">${KIND[kind]}</span><span class="cnt">${fmt(pages.length)}</span></div>`;

function navSearch(q){
  const ql=q.toLowerCase();let h="";
  const pages=[["toolchains","构建、执行、部署 › 工具链","工具链 sdk jdk 版本 toolchain"],["debugger","构建、执行、部署 › 调试器","调试器 单步 debugger stepping 过滤"],["build","构建、执行、部署","构建 执行 部署 build"]].filter(p=>p[1].toLowerCase().includes(ql)||p[2].includes(ql));
  for(const p of PAGES)if(p.name.toLowerCase().includes(ql)||(P[p.pk]?.name||"").toLowerCase().includes(ql))pages.push([p.id,`构建、执行、部署 › ${KIND[p.kind]} › ${p.name}`]);
  const tools=TOOLS.filter(t=>t.name.toLowerCase().includes(ql));
  const ads=ADAPTERS.filter(a=>a.name.toLowerCase().includes(ql));
  if(pages.length){h+=`<div class="hd">设置页</div>`;for(const [id,label] of pages.slice(0,8))h+=`<div class="r" data-nav="${id}"><span class="nm">${esc(label)}</span></div>`;}

    if(tools.length>8)h+=`<div class="r more" data-filter-tools="${esc(q)}">在工具链中查看全部 ${fmt(tools.length)} 个…</div>`;}
  if(ads.length){h+=`<div class="hd">调试器</div>`;for(const a of ads.slice(0,5))h+=`<div class="r" data-goto-dbg="${a.id}"><span class="nm">${esc(a.name)}</span><span class="path">单步</span></div>`;}
  if(!h)h=`<div class="empty" style="padding:30px 10px">没有匹配的设置</div>`;
  return h;
}

function toolOptions(t){
  const scope=S.scope,opts=[];
  const autoRes=(()=>{const save=S.draft[scope][t.id],had=hasDraft(scope,t.id);S.draft[scope][t.id]="";const r=resolve(t,scope,true);if(had)S.draft[scope][t.id]=save;else delete S.draft[scope][t.id];return r;})();
  let autoLabel;
  if(autoRes.err)autoLabel=`自动（${autoRes.err==="trust"?"需要信任项目":autoRes.err==="projectOnly"?"只在项目中提供":REASON[autoRes.err]}）`;
  else if(scope==="project"&&autoRes.layer==="global")autoLabel=`继承（全局默认 · ${autoRes.c.ver}）`;
  else if(scope==="project"&&autoRes.layer==="project")autoLabel=`自动（项目环境 · ${autoRes.c.ver} · ${autoRes.c.src[0]}）`;
  else autoLabel=`自动（${autoRes.c.ver} · ${autoRes.c.src[0]}）`;
  opts.push({home:"",auto:true,label:autoLabel});
  const seen=new Set();
  for(const c of allCands(t,scope)){
    if(seen.has(c.home))continue;seen.add(c.home);
    if(c.proj&&scope!=="project")continue;

 [8,["toolchains"],"路径只出现一次。候选安装用单选列表代替“下拉框 + 下方重复几行”；版本、路径、来源（PATH、JAVA_HOME、SDKMAN 等，由插件给出）各占一列。不满足要求的候选灰显，写明原因，原因码全部翻译（现状直接显示 versionUnsatisfied）。第一项写成“自动（实际生效值）”或“继承（全局默认 · 版本）”。"],
 [9,["toolchains"],"“当前生效”只显示工具实际在用的值；草稿另起一行“应用后”，不把草稿当生效值（Source-backed settings 第 5 条）。"],
 [10,["toolchains"],"“为什么是这个？”把 Core 已有的决策链（tool.Trace）按层展示：项目指定 → 项目环境 → 全局默认 → 自动发现，用户能看懂为什么选中这个版本。"],
 [11,["toolchains"],"问题就地给出办法：未找到时，如果插件声明了安装器（API-23 commandInstallers），直接给“用 Homebrew 安装…”；冲突时引导到插件页。示例里看 lldb-dap、Gradle、.NET SDK、Terraform。"],
 [12,["*"],"提交统一走窗口底部的“应用 / 好”，并写明写入目标和作用域；去掉卡片里的“保存”和“使用自动”两个按钮，单个工具用“恢复自动 / 恢复继承”。"],
 [13,["toolchains"],"项目信任只在“当前项目”作用域、确实有工具来自项目内环境时才出现；信任后在工具栏显示状态和“撤销”。"],
 [14,["debugger"],"调试器单步从工具链页拆出，成为独立的“调试器”页：左侧列出支持单步过滤的调试器（API-30 debugAdapters:3 的 features），右侧编辑。以后其他调试设置按标签页加，不再挤在工具链下面。"],
 [15,["debugger"],"“不进入的类”改成逐条列表，添加、删除不用手改多行文本；标题改成通用的“不进入的代码”，写法示例由插件给出（宿主不写 Java 专属的“类”）。宿主只显示调试器声明支持的开关。"],
 [16,["folder"],"插件页目录：可搜索、按需渲染，每行写明提供插件。侧栏折叠里放不下的页面都从这里进。"],
 [17,["plugin"],"插件页需要 JDK、Maven 这类工具时，不再自己放选择框，而是按工具 ID 引用工具链，并链接过去：同一个 JDK 只在一处选，避免几个页面各选各的。"],
 [18,["*"],"侧栏搜索同时命中设置页、工具和调试器，点结果直接跳到对应工具并选中。试试搜“jdk”。"],
];
function noteScope(){if(S.page==="toolchains")return "toolchains";if(S.page==="debugger")return "debugger";if(S.page==="build")return "build";if(S.page.startsWith("folder:"))return "folder";if(S.page.startsWith("pp."))return "plugin";return "other";}
function notesHtml(){
  if(!S.notes||!S.notesOpen)return "";
  const sc=noteScope();
  const list=NOTES.filter(([,pg])=>pg.includes("*")||pg.includes(sc));
  const before=PLUGIN_COUNT*150+700;
  return `<div class="notes"><div class="h">设计标注<span style="flex:1"></span><button class="btn sm link" data-act="closeNotes">收起</button></div><div class="l">
    <div class="old"><b>现状的问题（截图）</b><ol>
      <li>一页装了三件事：作用域与保存、每个插件声明的工具卡片、调试器单步。页面高度随插件数量线性增长，按现在的卡片高度，${fmt(PLUGIN_COUNT)} 个插件约 ${fmt(before)} 像素高。</li>
      <li>同一路径在一张卡片里出现三次（生效行、下拉框、候选行）；插件 ID 原样显示；原因码 versionUnsatisfied 没有翻译。</li>
      <li>说明文字常驻，违反“用 ⓘ 解释”的规则。</li>
      <li>卡片里的“保存”和窗口底部的“好”是两套提交。</li>
      <li>“JDK for JDT LS”“Homebrew”这类插件自用或辅助的工具，和用户真正关心的 JDK 平铺在一起。</li>
    </ol></div>
    <div class="tt">本页的设计点</div>
    ${list.map(([n,,t])=>`<div class="n ${S.noteHl==n?"hl":""}" id="note-${n}"><i class="nb" data-note="${n}">${n}</i><div>${t}</div></div>`).join("")}
  </div></div>`;
}
function perf(){
  const v=VL.tools||VL.folder||VL.adapters;
  const key=S.page==="toolchains"?"tools":S.page==="debugger"?"adapters":S.page.startsWith("folder:")?"folder":null;
  const vv=key?VL[key]:null;
  $("#perf").textContent=`插件 ${fmt(PLUGIN_COUNT)} · 工具 ${fmt(TOOLS.length)}`+(vv?` · 列表 ${fmt(vv.rows.length)} 行，渲染 ${vv.rendered} 行`:"");
  const f=$("#tfoot");if(f&&VL.tools){const st=stats();f.innerHTML=`<span>${fmt(VL.tools.rows.filter(r=>r.type==="t").length)} / ${fmt(st.total)} 个工具</span><span style="margin-left:auto">渲染 ${VL.tools.rendered} 行 ${nb(4)}</span>`;}
}

/* ================= 渲染 ================= */
function render(){
  document.documentElement.classList.toggle("dark",S.dark);
  document.documentElement.classList.toggle("nonotes",!S.notes);
  $("#nav").innerHTML=navHtml();
  $("#crumb").innerHTML=crumbHtml();
  const content=$("#content");
  let html,fixed=true;
  if(S.page==="toolchains")html=pgToolchains();
  else if(S.page==="debugger")html=pgDebugger();
  else if(S.page.startsWith("folder:"))html=pgFolder(S.page.slice(7));
  else{fixed=false;html=S.page==="build"?pgBuild():S.page.startsWith("pp.")?pgPlugin(S.page):pgOther();}
  content.classList.toggle("fixed",fixed);
  for(const k in VL)if(!html.includes(`data-vl="${k}"`))delete VL[k];
  content.innerHTML=html;
  $("#footer").innerHTML=footerHtml();
  $("#notesHost").innerHTML=notesHtml();
  $("#overlay").innerHTML=(S.notes&&!S.notesOpen?`<button class="btn sm" style="position:absolute;right:16px;bottom:62px;z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.15)" data-act="openNotes">设计标注</button>`:"")+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:"");
  mountVLs();perf();
}
function refreshTools(){ // 只刷新列表和计数，保留输入框焦点
  $("#tchips").innerHTML=chipsHtml();
  const host=document.querySelector('[data-vl="tools"]');
  const html=vlist("tools",toolRows(),renderToolRow,S.filter==="problems"&&!S.q?"✓ 没有需要处理的工具":"没有匹配的工具");
  const tmp=document.createElement("div");tmp.innerHTML=html;host.replaceWith(tmp.firstElementChild);
  S.scroll.tools=0;mountVLs();
}
let toastTimer;
function toast(m){S.toast=m;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{S.toast=null;$("#overlay .toast")?.remove();},2200);}
function go(page){S.page=page;S.navq&&(S.navq="",$("#navq").value="");render();}
function gotoTool(id){
  const t=TOOL[id];if(!t)return;
  S.page="toolchains";S.sel=id;S.q="";S.filter="all";S.navq="";$("#navq").value="";S.open.build=true;
  const key=S.groupBy==="plugin"?"p:"+t.pk:(t.aud==="plugin"?"plugin":t.cat);S.collapsed[key]=false;
  render();reveal("tools",r=>r.type==="t"&&r.t.id===id);
}

/* ================= 交互 ================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act],[data-nav],[data-tog],[data-tool],[data-grp],[data-filter],[data-scope],[data-opt],[data-note],[data-goto-tool],[data-goto-dbg],[data-adapter],[data-filter-tools]");
  if(!el)return;
  const d=el.dataset;
  if(d.note){S.notes=true;S.notesOpen=true;S.noteHl=+d.note;$("#optNotes").checked=true;render();document.getElementById("note-"+d.note)?.scrollIntoView({block:"center"});return;}
  if(d.tog!==undefined&&e.target.closest("[data-tog]")===el){if(d.tog==="build"||d.tog.startsWith("k."))S.open[d.tog]=!S.open[d.tog];else toast("原型只覆盖“构建、执行、部署”分组");render();return;}
  if(d.nav){if(["appearance","plugins","vcs","langs","tools","ai","about"].includes(d.nav)){S.page=d.nav;render();return;}if(d.nav==="build")S.open.build=true;go(d.nav);return;}
  if(d.gotoTool){gotoTool(d.gotoTool);return;}
  if(d.filterTools!==undefined){S.page="toolchains";S.q=d.filterTools;S.filter="all";S.navq="";$("#navq").value="";render();return;}
  if(d.gotoDbg){S.page="debugger";S.dbgSel=d.gotoDbg;S.navq="";$("#navq").value="";render();return;}
  if(d.adapter){S.dbgSel=d.adapter;S.dbgAdd="";render();return;}
  if(d.tool){S.sel=d.tool;S.adding=null;render();return;}
  if(d.grp){const r=VL.tools?.rows.find(x=>x.type==="g"&&x.key===d.grp);S.collapsed[d.grp]=!(r&&r.collapsed);const sc=S.scroll.tools;render();const host=document.querySelector('[data-vl="tools"]');if(host){host.scrollTop=sc||0;paintVL("tools");}return;}
  if(d.filter){S.filter=S.filter===d.filter&&d.filter!=="all"?"all":d.filter;refreshTools();return;}
  if(d.scope&&d.scope!==""){S.scope=d.scope;S.adding=null;render();return;}
  if(d.opt!==undefined){const o=CUR_OPTS[+d.opt];if(!o||o.dis)return;const t=TOOL[S.sel];
    const saved=S.saved[S.scope][t.id]||"";if(o.home===saved)delete S.draft[S.scope][t.id];else S.draft[S.scope][t.id]=o.home;
    const sc=S.scroll.tools;render();return;}
  const act=d.act;if(!act)return;
  const t=TOOL[S.sel];
  switch(act){
    case "toast":toast(d.msg);break;
    case "redetect":toast("已重新检测 "+fmt(TOOLS.length)+" 个工具（演示）");break;
    case "trust":S.trusted=true;render();break;
    case "untrust":S.trusted=false;render();break;
    case "why":S.whyOpen=!S.whyOpen;render();break;
    case "undoTool":delete S.draft[S.scope][t.id];render();break;
    case "autoTool":{const saved=S.saved[S.scope][t.id]||"";if(!saved)delete S.draft[S.scope][t.id];else S.draft[S.scope][t.id]="";render();break;}
    case "addDir":S.adding=t.id;S.addPath="";render();$("#addPath")?.focus();break;
    case "cancelAdd":S.adding=null;render();break;
    case "checkDir":{const v=($("#addPath")?.value||"").trim();if(!v){toast("请先填写目录");break;}
      const c={home:v,exe:t.cands[0]?.exe||"bin/"+t.name.toLowerCase(),ver:(t.cands[0]?.ver||"1.0.0").replace(/\d+$/,m=>String(+m+1)),src:["手动添加"]};
      (S.custom[S.scope][t.id]||(S.custom[S.scope][t.id]=[])).push(c);S.draft[S.scope][t.id]=v;S.adding=null;render();break;}
    case "apply":doApply(false);break;
    case "ok":if(totalDrafts())doApply(true);else toast("演示：关闭设置窗口");break;
    case "cancel":S.draft={global:{},project:{}};S.custom={global:{},project:{}};S.dbgDraft={};render();toast("已放弃全部修改，没有写入任何文件");break;
    case "closeNotes":S.notesOpen=false;render();break;
    case "openNotes":S.notesOpen=true;render();break;
    case "dbgToggle":{const a=ADAPTERS.find(x=>x.id===S.dbgSel)||ADAPTERS[0];const cur={...dbgState(a),patterns:[...dbgState(a).patterns]};cur[d.f]=!cur[d.f];setDbg(a,cur);render();break;}
    case "dbgDel":{const a=ADAPTERS.find(x=>x.id===S.dbgSel)||ADAPTERS[0];const cur={...dbgState(a),patterns:[...dbgState(a).patterns]};cur.patterns.splice(+d.i,1);setDbg(a,cur);render();break;}
    case "dbgAdd":{const a=ADAPTERS.find(x=>x.id===S.dbgSel)||ADAPTERS[0];const v=($("#dbgAdd")?.value||"").trim();if(!v)break;const cur={...dbgState(a),patterns:[...dbgState(a).patterns,v]};S.dbgAdd="";setDbg(a,cur);render();break;}
    case "dbgReset":{const a=ADAPTERS.find(x=>x.id===S.dbgSel)||ADAPTERS[0];if(S.dbgSaved[a.id])S.dbgDraft[a.id]={...a.def,patterns:[...a.def.patterns],_reset:true};else delete S.dbgDraft[a.id];render();break;}
    case "showProblems":S.page="toolchains";S.filter="problems";S.q="";render();break;
  }
});
function setDbg(a,cur){const base=S.dbgSaved[a.id]||a.def;const same=JSON.stringify({...base,_reset:0})===JSON.stringify({...cur,_reset:0});if(same)delete S.dbgDraft[a.id];else S.dbgDraft[a.id]=cur;}
function doApply(close){
  S.applying=true;render();
  setTimeout(()=>{
    for(const sc of ["global","project"]){for(const [id,h] of Object.entries(S.draft[sc])){if(h)S.saved[sc][id]=h;else delete S.saved[sc][id];}
      for(const [id,list] of Object.entries(S.custom[sc])){const t=TOOL[id];if(t)for(const c of list)if(!t.cands.some(x=>x.home===c.home))t.cands.push(c);}}
    for(const [id,v] of Object.entries(S.dbgDraft)){const a=ADAPTERS.find(x=>x.id===id);if(v._reset||JSON.stringify(v)===JSON.stringify(a.def))delete S.dbgSaved[id];else S.dbgSaved[id]=v;}
    const n=totalDrafts();S.draft={global:{},project:{}};S.custom={global:{},project:{}};S.dbgDraft={};S.applying=false;
    toast(close?`已应用 ${n} 项并重新读取生效值（演示：随后关闭窗口）`:`已应用 ${n} 项，界面显示的是重新读取后的生效值`);
  },450);
}
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="tq"){S.q=e.target.value;refreshTools();}
  else if(id==="navq"){S.navq=e.target.value;$("#nav").innerHTML=navHtml();}
  else if(id==="addPath")S.addPath=e.target.value;
  else if(id==="dbgAdd")S.dbgAdd=e.target.value;
  else if(id==="dq"||id==="fq"){if(id==="dq")S.dbgQ=e.target.value;else S.folderQ=e.target.value;const pos=e.target.selectionStart;render();const el=$("#"+id);el.focus();el.setSelectionRange(pos,pos);}
});
document.addEventListener("change",e=>{
  if(e.target.matches("[data-groupby]")){S.groupBy=e.target.value;S.scroll.tools=0;render();}
  else if(e.target.id==="optScale"){S.scale=e.target.value;build(S.scale);STAT_KEY="";if(!TOOL[S.sel])S.sel=TOOLS[0]?.id;if(!ADAPTERS.find(a=>a.id===S.dbgSel))S.dbgSel=ADAPTERS[0]?.id;if(S.page.startsWith("pp.")&&!PAGES.find(p=>p.id===S.page))S.page="build";S.scroll={};render();}
  else if(e.target.id==="optDark"){S.dark=e.target.checked;render();}
  else if(e.target.id==="optNotes"){S.notes=e.target.checked;S.notesOpen=S.notes;render();}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="dbgAdd"){e.preventDefault();document.querySelector('[data-act="dbgAdd"]')?.click();return;}
  if(e.key==="Enter"&&e.target.id==="addPath"){e.preventDefault();document.querySelector('[data-act="checkDir"]')?.click();return;}
  if(S.page!=="toolchains"||(e.key!=="ArrowDown"&&e.key!=="ArrowUp"))return;
  if(e.target.matches("input,select,textarea"))return;
  const items=(VL.tools?.rows||[]).filter(r=>r.type==="t");if(!items.length)return;
  let i=items.findIndex(r=>r.t.id===S.sel);i=e.key==="ArrowDown"?Math.min(items.length-1,i+1):Math.max(0,i-1);
  S.sel=items[i].t.id;e.preventDefault();const sc=S.scroll.tools;render();const host=document.querySelector('[data-vl="tools"]');host.scrollTop=sc||0;reveal("tools",r=>r.type==="t"&&r.t.id===S.sel);host.focus();
});
/* ⓘ 提示：鼠标和键盘焦点都能打开 */
const tip=$("#tip");
function showTip(el){const r=el.getBoundingClientRect();tip.textContent=el.dataset.tip;tip.style.display="block";const w=tip.offsetWidth,h=tip.offsetHeight;let x=Math.min(window.innerWidth-w-8,Math.max(8,r.left-10)),y=r.bottom+6;if(y+h>window.innerHeight-8)y=r.top-h-6;tip.style.left=x+"px";tip.style.top=y+"px";}
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");if(el)showTip(el);else tip.style.display="none";});
document.addEventListener("focusin",e=>{const el=e.target.closest("[data-tip]");if(el)showTip(el);});
document.addEventListener("focusout",()=>{tip.style.display="none";});

/* ================= 启动：支持地址参数 ================= */
(function init(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("scale"))S.scale=h.get("scale");
  if(h.get("page"))S.page=h.get("page");
  if(h.get("scope"))S.scope=h.get("scope");
  if(h.get("sel"))S.sel=h.get("sel");
  if(h.get("filter"))S.filter=h.get("filter");
  if(h.get("group"))S.groupBy=h.get("group");
  if(h.get("q"))S.q=h.get("q");
  if(h.get("navq"))S.navq=h.get("navq");
  if(h.get("dbg"))S.dbgSel=h.get("dbg");
  if(h.get("why")==="1")S.whyOpen=true;
  if(h.get("trusted")==="1")S.trusted=true;
  if(h.get("dark")==="1")S.dark=true;
  if(h.get("notes")==="0"){S.notes=false;S.notesOpen=false;}
  if(h.get("draft")){const [id,home]=h.get("draft").split("|");S.draft[S.scope][id]=home;}
  $("#optScale").value=S.scale;$("#optDark").checked=S.dark;$("#optNotes").checked=S.notes;$("#navq").value=S.navq;
  build(S.scale);if(!TOOL[S.sel])S.sel=TOOLS[0]?.id;
  render();
  if(S.page==="toolchains")reveal("tools",r=>r.type==="t"&&r.t.id===S.sel);
})();
</script>
