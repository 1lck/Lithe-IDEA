<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Lithe 设置 · 插件与能力配置交互原型</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --side:#f2f3f5; --sel:#dfe7f8; --hover:#eceef1;
  --text:#1f2329; --sub:#6c707e; --faint:#9aa0ab; --line:#e4e6ea; --accent:#3574f0;
  --ok:#208a3c; --warn:#c27d00; --err:#d1453b; --pill:#eef1f6; --chip:#e8f0fe;
  --note:#ffd75e; --shadow:0 8px 28px rgba(0,0,0,.14); --hl:#fff3c4;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
  font-size:13px; color:var(--text);
}
html.dark{
  --bg:#1e1f22; --surface:#2b2d30; --side:#26282b; --sel:#2e436e; --hover:#33363a;
  --text:#dfe1e5; --sub:#9da0a8; --faint:#6f737a; --line:#3a3d41; --accent:#548af7;
  --ok:#5fb865; --warn:#e0a83e; --err:#f0716a; --pill:#393b40; --chip:#25324d;
  --shadow:0 8px 28px rgba(0,0,0,.5); --hl:#4a4220;
}
*{box-sizing:border-box}
body{margin:0;background:#c9ccd3;min-height:100vh;display:flex;flex-direction:column;align-items:center}
html.dark body{background:#111214}
button,input,select,textarea{font:inherit;color:inherit}
code,.mono{font-family:"SF Mono",Menlo,monospace;font-size:11.5px}
.demobar{width:100%;min-width:1120px;white-space:nowrap;display:flex;gap:12px;align-items:center;padding:8px 16px;background:#24262b;color:#ddd;font-size:12px}
.demobar b{color:#fff}.demobar label{display:flex;gap:5px;align-items:center;cursor:pointer}.demobar .sp{flex:1}
.demobar select{background:#34373d;border:1px solid #484b52;border-radius:5px;padding:2px 6px;color:#eee}
.win{margin:18px;min-width:1100px;width:min(1400px,calc(100vw - 36px));height:min(860px,calc(100vh - 80px));min-height:640px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.titlebar{height:38px;display:flex;align-items:center;padding:0 14px;gap:8px;border-bottom:1px solid var(--line);background:var(--side);flex:none}
.dot{width:12px;height:12px;border-radius:50%}
.titlebar .t{flex:1;text-align:center;font-weight:600;color:var(--sub);margin-right:52px}
.body{flex:1;display:flex;min-height:0}
.side{width:240px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side .search{margin:10px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);display:flex;gap:6px;align-items:center}
.side .search input{border:0;outline:0;background:transparent;width:100%}
.nav{overflow:auto;padding:0 6px 10px;flex:1}
.nav .grp{display:flex;align-items:center;gap:4px;padding:5px 8px;border-radius:6px;cursor:pointer}
.nav .grp:hover,.nav .item:hover{background:var(--hover)}
.nav .caret{width:12px;color:var(--faint);font-size:9px;transition:transform .15s;flex:none}
.nav .open>.caret{transform:rotate(90deg)}
.nav .item{padding:5px 8px 5px 26px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px}
.nav .item.l2{padding-left:42px}
.nav .sel{background:var(--sel)!important}
.nav .from{margin-left:auto;font-size:10px;color:var(--faint);white-space:nowrap}
.nav .new{font-size:9px;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 3px;margin-left:2px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface)}
.crumb{height:42px;flex:none;display:flex;align-items:center;gap:8px;padding:0 18px;border-bottom:1px solid var(--line)}
.crumb .c{color:var(--sub)} .crumb .c.last{color:var(--text);font-weight:600}
.crumb .sp{flex:1}
.content{flex:1;overflow:auto;min-height:0;position:relative}
.page{padding:16px 20px 30px;max-width:860px}
.footer{height:50px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 16px;background:var(--surface)}
.footer .msg{margin-right:auto;color:var(--sub);font-size:12px}
.footer .msg.warn{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);padding:4px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:2px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--err)}
.btn.pri.danger{background:var(--err);border-color:var(--err);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.icon-btn{border:0;background:transparent;cursor:pointer;width:26px;height:26px;border-radius:6px;color:var(--sub);font-size:14px}
.icon-btn:hover{background:var(--hover)}
.seg{display:inline-flex;background:var(--pill);border-radius:7px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:5px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button[disabled]{opacity:.4;cursor:default}
.inp{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);outline:0;min-width:0}
.inp:focus{border-color:var(--accent)}
.inp.bad{border-color:var(--err)}
select.inp{padding:3px 6px}
textarea.inp{width:100%;resize:vertical;font-family:"SF Mono",Menlo,monospace;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:2px 9px;border-radius:999px;background:var(--pill);cursor:pointer;font-size:12px;color:var(--sub);border:1px solid transparent;user-select:none}
.chip.on{background:var(--chip);color:var(--accent);border-color:var(--accent)}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--pill);color:var(--sub);white-space:nowrap}
.tag.upd{background:#e5f3e8;color:var(--ok)} html.dark .tag.upd{background:#20372a}
.tag.comm{background:#fdf1dc;color:var(--warn)} html.dark .tag.comm{background:#3b3020}
.tag.off{background:#f7e3e1;color:var(--err)} html.dark .tag.off{background:#40292a}
.tag.blue{background:var(--chip);color:var(--accent)}
.sw{width:30px;height:18px;border-radius:9px;background:#c4c7cd;position:relative;cursor:pointer;flex:none;border:0;padding:0;transition:background .15s}
html.dark .sw{background:#55585e}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)} .sw.on::after{left:14px}
.sw.pending{outline:2px solid var(--warn);outline-offset:1px}
.sw[disabled]{opacity:.45;cursor:default}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--sub)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.st.run::before{background:var(--ok)} .st.err::before{background:var(--err)} .st.warn::before{background:var(--warn)}
.st.err{color:var(--err)}
.link{color:var(--accent);cursor:pointer;font-size:12px}
.link:hover{text-decoration:underline}
.muted{color:var(--sub);font-size:12px}.faint{color:var(--faint);font-size:11.5px}
h3{font-size:14px;margin:18px 0 8px} h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;color:var(--sub)} .kv b{color:var(--text);font-weight:500;min-width:0;overflow-wrap:anywhere}
.box{border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.55;display:flex;gap:8px;align-items:flex-start}
.box.warn{border:1px solid #f1d29a;background:#fdf6e7;color:#7a5400} html.dark .box.warn{background:#3a301d;border-color:#5c4a24;color:#e8c47a}
.box.info{border:1px solid var(--line);background:var(--pill);color:var(--sub)}
.box.err{border:1px solid #f0c4c0;background:#fdf0ef;color:#8a2a22} html.dark .box.err{background:#3d2524;border-color:#5f3532;color:#f2a39c}
.box .grow{flex:1}
.code{font-family:"SF Mono",Menlo,monospace;font-size:11.5px;background:var(--pill);border-radius:6px;padding:7px 9px;white-space:pre-wrap;word-break:break-all}
.code.new{outline:1px solid var(--ok);background:#e9f6ec} html.dark .code.new{background:#1f3527}
.sec{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:var(--surface)}
.sec>.sh{display:flex;align-items:center;gap:6px;padding:10px 12px 4px;font-weight:600}
.sec>.sh .acc{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400}
.sec>.sb{padding:2px 6px 8px}
.srow{display:flex;align-items:center;gap:10px;min-height:34px;padding:3px 8px;border-radius:7px;position:relative}
.srow:hover{background:var(--hover)}
.srow .lab{width:220px;flex:none;display:flex;align-items:center;gap:5px}
.srow .mod{width:6px;height:6px;border-radius:50%;background:var(--accent);position:absolute;left:-1px}
.srow .ctl{display:flex;align-items:center;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
.srow .badges{display:flex;gap:4px;margin-left:auto;flex:none;align-items:center}
.srow.hit{background:var(--hl)}
i.info{width:15px;height:15px;border-radius:50%;border:1px solid var(--faint);color:var(--faint);font-size:9.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;position:relative;font-style:normal}
i.info:hover{border-color:var(--accent);color:var(--accent)}
.pop{position:absolute;z-index:30;top:20px;left:-10px;width:300px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:9px 11px;color:var(--text);font-size:12px;line-height:1.55;font-weight:400;cursor:default;text-align:left;white-space:pre-line}
.cap2{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--pill);color:var(--sub);white-space:nowrap}
.cap2.proj{background:#e6f4ea;color:var(--ok)} html.dark .cap2.proj{background:#22382a}
.cap2.eff{background:#fff1d6;color:var(--warn)} html.dark .cap2.eff{background:#3d3220}
.cap2.val{background:var(--chip);color:var(--accent);font-family:"SF Mono",Menlo,monospace}
.eff-label{font-size:11.5px;color:var(--sub);padding:0 8px 4px 238px;display:flex;gap:6px;align-items:center}
.eff-label b{color:var(--text);font-weight:500}
.reset{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:13px;padding:0 3px}
.reset:hover{color:var(--accent)}
.banner{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;background:var(--pill);margin-bottom:12px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.banner b{color:var(--text)}
.provider{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 3px;border-radius:999px;background:var(--surface);border:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--text);white-space:nowrap}
.provider .picon{width:16px;height:16px;border-radius:4px;font-size:8.5px}
.restartbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:#fff6e0;color:#7a5400;margin-bottom:12px;font-size:12px}
html.dark .restartbar{background:#3a301d;color:#e8c47a}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-weight:600;font-size:11px;color:var(--faint);padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:var(--hover)}
.split{display:flex;height:100%}
.lpane{width:330px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lpane .tools{padding:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.lpane .rows{overflow:auto;flex:1}
.sechead{padding:10px 12px 4px;font-size:11px;color:var(--faint);font-weight:600;display:flex;gap:6px;align-items:center}
.prow{display:flex;gap:10px;padding:8px 12px;cursor:pointer;align-items:center}
.prow:hover{background:var(--hover)} .prow.sel{background:var(--sel)}
.picon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.prow .nm{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow .meta{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .grow{flex:1;min-width:0}
.rpane{flex:1;display:flex;flex-direction:column;min-width:0}
.dhead{padding:18px 22px 0;display:flex;gap:14px;align-items:flex-start}
.dhead .picon{width:48px;height:48px;font-size:17px;border-radius:12px}
.dhead h2{margin:0;font-size:20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dhead .sub{color:var(--sub);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dhead .acts{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.dtabs{display:flex;gap:2px;padding:12px 22px 0;border-bottom:1px solid var(--line);align-items:flex-end}
.dtabs button{border:0;background:transparent;padding:7px 12px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.dtabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.dtabs .cnt{font-size:10px;background:var(--pill);border-radius:8px;padding:0 5px;margin-left:4px}
.dbody{flex:1;overflow:auto;padding:16px 22px 30px}
.card{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cap{display:flex;flex-direction:column;gap:5px}
.cap .k{font-size:11px;color:var(--faint);font-weight:600}
.cap .v{font-weight:600}
.cap .d{color:var(--sub);font-size:12px}
.cap .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:4px}
details summary{cursor:pointer;color:var(--accent);font-size:12px;margin:6px 0}
.mask{position:absolute;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{width:600px;max-height:86%;overflow:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px}
.modal h3{margin-top:0;font-size:15px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;align-items:center}
.modal .foot .sp{flex:1}
.menu{position:absolute;z-index:45;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:220px}
.menu div{padding:5px 10px;border-radius:5px;cursor:pointer}
.menu div:hover{background:var(--sel)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.nb{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--note);color:#3a2d00;font-size:10px;font-weight:700;cursor:pointer;flex:none;box-shadow:0 0 0 2px rgba(255,215,94,.35);vertical-align:middle;font-style:normal}
.notes{width:310px;flex:none;background:var(--side);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.notes .h{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center;gap:6px}
.notes .l{overflow:auto;padding:10px 14px;display:flex;flex-direction:column;gap:11px}
.notes .n{display:flex;gap:8px;line-height:1.55;font-size:12px}
.notes .n.hl{background:var(--hl);border-radius:6px;padding:4px}
.notes .ported{font-size:12px;line-height:1.55;color:var(--sub);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.empty{color:var(--faint);text-align:center;padding:60px 20px;line-height:1.7}
.toast{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:#2b2d30;color:#fff;padding:7px 14px;border-radius:8px;font-size:12px;z-index:60;box-shadow:var(--shadow);max-width:70%}
.preview{font-family:"SF Mono",Menlo,monospace;background:var(--pill);border-radius:8px;padding:10px 12px;font-size:12px}
.kbd{font-family:"SF Mono",Menlo,monospace;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--pill)}
.tree .tr{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer}
.tree .tr:hover{background:var(--hover)} .tree .tr.sel{background:var(--sel)}
.subhead{font-size:11.5px;font-weight:600;color:var(--sub);padding:8px 8px 2px}
/* 变更标记 */
.mk{display:inline-flex;align-items:center;font-size:9.5px;font-weight:600;padding:0 5px;border-radius:3px;cursor:pointer;white-space:nowrap;line-height:15px;font-style:normal;flex:none;vertical-align:middle;margin-left:2px}
.mk.dev{background:#efe7fd;color:#7048c8} html.dark .mk.dev{background:#352a4d;color:#c3a8ff}
.mk.chg{background:#e3eefc;color:#2f6ad6} html.dark .mk.chg{background:#23344f;color:#8db4ff}
.mk.mov{background:#e2f3f1;color:#167a6e} html.dark .mk.mov{background:#1f3835;color:#7fd3c6}
.mk.del{background:#fbe5e3;color:#c0392b} html.dark .mk.del{background:#45282a;color:#f0948b}
.mk.q{background:#fff0d4;color:#a86a00} html.dark .mk.q{background:#43361d;color:#f1c470}
.ghostrow{opacity:.6} .ghostrow .gt{text-decoration:line-through}
.chg-item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;background:var(--surface)}
.chg-item:hover{background:var(--hover)}
.chg-item .h{display:flex;gap:6px;align-items:center;font-weight:600;font-size:12.5px}
.chg-item .b{font-size:12px;color:var(--sub);line-height:1.55;margin-top:4px}
.chg-item.hl{outline:2px solid var(--note)}
.flash{animation:flash 1.8s}
/* ===== 视觉打磨：macOS 系统设置风格 ===== */
:root{--bg:#f5f5f7;--side:#ececee;--sel:#d6e3fb;--line:#e3e4e8;--line2:#ededf0;--pill:#f0f1f4;--card-sh:0 0 0 .5px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04)}
html.dark{--bg:#1c1d20;--side:#232427;--line2:#34363a;--card-sh:0 0 0 .5px rgba(255,255,255,.06)}
body{background:linear-gradient(160deg,#c9cfdb,#d9d3e3)} html.dark body{background:#0d0e10}
.win{border-radius:14px;box-shadow:0 24px 60px rgba(20,24,40,.28),0 0 0 .5px rgba(0,0,0,.25)}
.titlebar{background:var(--side);border-bottom-color:var(--line2)}
.side{background:var(--side);border-right-color:var(--line2)}
.side .search{border-radius:8px;background:rgba(0,0,0,.045);border-color:transparent} html.dark .side .search{background:rgba(255,255,255,.06)}
.nav .grp{padding:6px 8px;gap:8px;font-weight:500;margin-top:2px}
.nav .gi{width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;flex:none;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12)}
.nav .grp .caret{order:3;margin-left:auto}
.nav .item{padding:5px 8px 5px 36px;font-size:12.5px;color:var(--sub)}
.nav .item.sel{color:var(--text);font-weight:500}
.nav .item.l2{padding-left:50px}
.nav .sel{background:var(--sel)!important}
.main{background:var(--bg)}
.crumb{background:var(--surface);border-bottom-color:var(--line2);height:46px}
.crumb .c.last{font-size:14px}
.page{padding:20px 26px 36px;max-width:900px}
.footer{border-top-color:var(--line2)}
.sec{border:0;background:transparent;margin-bottom:18px}
.sec>.sh{padding:0 6px 6px;font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.2px}
.sec>.sb{background:var(--surface);border-radius:10px;box-shadow:var(--card-sh);padding:0;overflow:visible}
.sec>.sb>.srow{border-radius:0;padding:5px 14px;min-height:40px}
.sec>.sb>.srow+.srow,.sec>.sb>.subhead+.srow{border-top:1px solid var(--line2)}
.sec>.sb>.srow:first-child{border-radius:10px 10px 0 0}.sec>.sb>.srow:last-child{border-radius:0 0 10px 10px}
.sec>.sb>.srow:only-child{border-radius:10px}
.sec>.sb>.subhead{padding:12px 14px 5px;font-size:11px;color:var(--faint);text-transform:none;border-top:1px solid var(--line2);display:flex;gap:6px;align-items:center}

const clone = o=>JSON.parse(JSON.stringify(o));
function initial(){ return {
  page:"plugins", pluginTab:"installed", selected:"java", detailTab:"overview", filter:"all", query:"",
  mSelected:"io.lithestore.php-support", mQuery:"", mSource:"all", mSort:"name",
  values:{}, project:{}, instance:{}, misc:{}, langScope:"application", buildScope:{}, runtimeSel:"__defaults",
  plugins:clone(PLUGINS_INIT), sources:clone(SOURCES_INIT),
  loaded:{}, pending:{}, nextLaunch:null, uninstalling:{}, installedNext:{},
  pendingRestart:{}, navOpen:{appearance:false, vcs:false, build:true, lang:true, tools:false, ai:false},
  popover:null, notesOpen:window.innerWidth>=1450, modal:null, menu:null, lspOff:{}, toast:null, hit:null, runSel:"r1"
};}
let S = initial();
S.plugins.forEach(p=>S.loaded[p.short]=!p.disabled);
let projectKey = "shop";
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P = short=>S.plugins.find(p=>p.short===short);
const PById = id=>S.plugins.find(p=>p.id===id);
const proj = ()=>PROJECTS[projectKey];
const loaded = p=>!!p && S.loaded[p.short] && !p.removed;
const baseline = p=>S.nextLaunch && p.short in S.nextLaunch ? S.nextLaunch[p.short] : S.loaded[p.short];
const staged = p=>p.short in S.pending ? S.pending[p.short] : baseline(p);
const notesOn = ()=>$("#optNotes").checked;
function nb(page,n){ return notesOn()&&NOTES[page] ? `<i class="nb" data-note="${page}:${n}" title="${esc(NOTES[page][n-1])}">${n}</i>` : ""; }
function info(id,text){ if(!text) return ""; return `<i class="info" data-info="${esc(id)}">i${S.popover===id?`<span class="pop">${esc(text)}</span>`:""}</i>`; }

/* 通用控件：值存在 S.misc */
const mv=(k,d)=>k in S.misc?S.misc[k]:d;
const W={
  tg:(k,d)=>`<button class="sw ${mv(k,d)?"on":""}" data-misc="${k}" data-def="${d}"></button>`,
  sel:(k,opts,d,w)=>`<select class="inp" style="${w?`width:${w}px`:""}" data-misc="${k}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(mv(k,d))===String(v)?"selected":""}>${esc(l)}</option>`}).join("")}</select>`,
  txt:(k,d,ph,w)=>`<input class="inp" style="width:${w||260}px" data-misc="${k}" value="${esc(mv(k,d))}" placeholder="${esc(ph||"")}">`,
  path:(k,ph,btn)=>`<input class="inp" style="flex:1;min-width:200px;max-width:360px" data-misc="${k}" value="${esc(mv(k,""))}" placeholder="${esc(ph||"")}"><button class="btn sm" data-pickmisc="${k}">${btn||"选择…"}</button>`
};
function section(title, infoText, body, acc="", id="", m=""){ return `<div class="sec"><div class="sh">${esc(title)} ${mk(m)} ${info("sec:"+title+id,infoText)}${acc?`<span class="acc">${acc}</span>`:""}</div><div class="sb">${body}</div></div>`; }
function row(label, infoText, ctl, extra="", m=""){ return `<div class="srow" data-search="${esc(label)}"><div class="lab">${esc(label)} ${mk(m)} ${info("row:"+label,infoText)}</div><div class="ctl">${ctl}</div>${extra?`<div class="badges">${extra}</div>`:""}</div>`; }
const marksOn=()=>$("#optMarks").checked;
const mkStatic=t=>`<i class="mk ${t}" style="cursor:default">${MK[t]}</i>`;
function mk(id){ if(!id||!marksOn()) return ""; const c=CH[id]; return `<i class="mk ${c.type}" data-chg="${id}" title="${esc(MK[c.type]+"："+c.title)}">${MK[c.type]}</i>`; }
function ghost(label,id,where){ return marksOn()?`<div class="srow ghostrow"><div class="lab"><span class="gt">${esc(label)}</span> ${mk(id)}</div><div class="ctl faint">${esc(where)}</div></div>`:""; }
const pageMatch=(p,pg)=>p===pg||(p.endsWith("*")&&pg.startsWith(p.slice(0,-1)));
function pageLabel(c){ const p=c.page; if(p==="lang:*") return "语言与框架 › 各语言页"; if(p==="build:*") return "构建工具 › 各构建系统页"; if(p==="tool:*") return "工具 › 插件生成的页面"; const g=GROUPS.find(g=>g.pages&&g.pages.includes(p)); return (g?g.title+" › ":"")+(PAGE_TITLES[p]||p); }
function chgItem(c,inNotes){ return `<div class="chg-item ${S.chgHl===c.id?"hl":""}" ${inNotes?`id="note-chg-${c.id}"`:""} data-gochg="${c.id}"><div class="h">${mkStatic(c.type)}<span>${esc(c.title)}</span><span class="cap2" style="margin-left:auto">${c.prio} · PR-${c.pr}</span></div><div class="b"><b>现在：</b>${esc(c.now)}<br><b>改成：</b>${esc(c.next)}${inNotes?"":`<br><span class="link">${esc(pageLabel(c))} →</span>`}</div></div>`; }
function changesMarkdown(){ return Object.keys(PRS).map(k=>{const items=CHANGES_O.filter(c=>c.pr===k); return items.length?`## PR-${k} ${PRS[k]}\n\n`+items.map(c=>`- [${MK[c.type]}][${c.prio}] ${c.title}（${pageLabel(c)}）\n  - 现在：${c.now}\n  - 改成：${c.next}`).join("\n")+"\n":""}).join("\n"); }

  if(s.scope==="buildInstance" && instanceID){
    let cur=instanceID;
    while(cur){ const k=`${projectKey}|${cur}|${s.id}`; if(k in S.instance) return {value:S.instance[k], layer:cur===instanceID?"instance":"parent"}; cur=proj().builds.find(b=>b.id===cur)?.parent; }
  }
  if(proj().name && projectable(s)){ const k=`${projectKey}|${s.plugin}.${s.id}`; if(k in S.project) return {value:S.project[k], layer:"project"}; }
  const g=`${s.plugin}.${s.id}`; if(g in S.values) return {value:S.values[g], layer:"application"};
  return {value:s.def, layer:"default"};
}
function setValue(s,value,layer,inst){
  if(layer==="instance") S.instance[`${projectKey}|${inst}|${s.id}`]=value;
  else if(layer==="project") S.project[`${projectKey}|${s.plugin}.${s.id}`]=value;
  else { S.values[`${s.plugin}.${s.id}`]=value; if(JSON.stringify(value)===JSON.stringify(s.def)) delete S.values[`${s.plugin}.${s.id}`]; }
  if(s.effect==="restart") S.pendingRestart[s.cap]=true;
  if(s.effect==="reload") toast(`已保存 · ${capTitle(s.cap)} 将重新同步项目模型`);
}
function resetValue(s,layer,inst){
  if(layer==="instance") delete S.instance[`${projectKey}|${inst}|${s.id}`];
  else if(layer==="project") delete S.project[`${projectKey}|${s.plugin}.${s.id}`];
  else delete S.values[`${s.plugin}.${s.id}`];
  if(s.effect==="restart") S.pendingRestart[s.cap]=true;
}
function fmt(s,v){
  if(s.type==="boolean") return v?"开":"关";
  if(s.type==="multiSelect") return v.length?v.join(", "):"无";
  if(s.type==="integer") return `${v} ${s.unit||""}`.trim();
  if(s.type==="enum") return (s.options.find(o=>o[0]===v)||[v,v])[1];
  return v||"默认";
}
function capOwner(cap){ const [kind,id]=cap.split(":"); return S.plugins.find(p=>!p.removed&&p.caps.some(c=>c.kind===kind&&c.id===id)); }
function capTitle(cap){ const [kind,id]=cap.split(":"); for(const p of S.plugins){const c=p.caps.find(c=>c.kind===kind&&c.id===id); if(c) return c.title.replace(/（.*）/,"");} return "插件"; }
function capLocation(cap,pluginShort){
  const [kind,id]=cap.split(":");
  if(kind==="languageServer"){ for(const p of S.plugins){const c=p.caps.find(c=>c.id===id&&c.kind===kind); if(c&&SETTINGS.some(s=>s.cap===cap)) return {page:`lang:${c.lang}`, label:`语言与框架 › ${LANG_NAMES[c.lang]}`};} return null; }
  if(kind==="buildSystem") return {page:`build:${id}`, label:`构建、执行、部署 › 构建工具 › ${BUILD_NAMES[id]}`};
  if(kind==="runtime") return {page:"runtimes", label:"构建、执行、部署 › 项目运行时"};
  if(kind==="plugin"&&pluginShort&&loaded(P(pluginShort))) return {page:`tool:${pluginShort}`, label:`工具 › ${P(pluginShort).name}`};
  return null;
}

function settingRow(s, mode){
  const eff=effective(s, mode.instanceID);
  let layer="application", editable=true, note="";
  if(s.scope==="buildInstance"){ layer = mode.instanceID?"instance":mode.layer==="project"?"project":"application"; }
  else if(mode.layer==="instance"||mode.layer==="project"){ if(projectable(s)&&proj().name) layer="project"; else if(mode.layer==="project"){ editable=false; note="只能全局设置"; } }
  const own=eff.layer===layer;
  const v=eff.value, key=`${s.plugin}.${s.id}`;
  const dis=editable?"":"disabled";
  const on=`data-set="${key}" data-layer="${layer}" data-inst="${mode.instanceID||""}"`;
  let ctl="";
  if(s.type==="boolean") ctl=`<button class="sw ${v?"on":""}" ${on} data-kind="bool" ${dis}></button>`;
  else if(s.type==="integer") ctl=`<input class="inp" style="width:90px" type="number" value="${v}" ${on} data-kind="int" ${dis}><span class="faint">${s.unit||""}</span>`;
  else if(s.type==="enum") ctl=`<select class="inp" ${on} data-kind="enum" ${dis}>${s.options.map(o=>`<option value="${o[0]}" ${o[0]===v?"selected":""}>${o[1]}</option>`).join("")}</select>`;
  else if(s.type==="multiSelect"){
    const syncing=mode.instanceID && proj().builds.find(b=>b.id===mode.instanceID)?.state==="syncing";
    ctl = syncing?`<span class="st warn">项目模型同步中，候选值稍后出现</span>`:`<div class="chips">${s.choicesFromModel.map(c=>`<span class="chip ${v.includes(c)?"on":""}" ${editable?`${on} data-kind="multi" data-choice="${c}"`:""}>${c}</span>`).join("")}</div>`;
  }
  else if(s.type==="file"||s.type==="directory") ctl=`<input class="inp" style="flex:1;min-width:180px;max-width:320px" value="${esc(v)}" placeholder="${esc(s.placeholder||"")}" ${on} data-kind="text" ${dis}><button class="btn sm" ${dis} data-pick="${key}" data-layer="${layer}" data-inst="${mode.instanceID||""}">选择…</button>`;
  else if(s.type==="text") ctl=`<input class="inp" style="width:240px" value="${esc(v)}" placeholder="${esc(s.placeholder||"")}" ${on} data-kind="text" data-pattern="${esc(s.pattern||"")}" ${dis}>`;
  const scopeCap = s.scope==="buildInstance"?`<span class="cap2 proj">${eff.layer==="parent"?"继承父模块":"构建实例"}</span>`
    : eff.layer==="project"?`<span class="cap2 proj">本项目</span>` : projectable(s)?`<span class="cap2">全局 · 项目可覆盖</span>`:`<span class="cap2">全局</span>`;
  const effCap={restart:`<span class="cap2 eff">重启语言服务器生效</span>`,reload:`<span class="cap2 eff">重新同步模型</span>`,nextRun:`<span class="cap2">下次运行生效</span>`,immediate:`<span class="cap2">立即生效</span>`}[s.effect];
  const inh = note?`<span class="faint">${note}</span>` : (!own&&layer!=="application"&&editable)?`<span class="faint">继承：${({default:"默认值",application:"全局",project:"本项目",parent:"父模块"})[eff.layer]}</span>`:"";
  return `<div class="srow ${S.hit===key?"hit":""}" data-search="${esc(s.title+" "+s.id+" "+(s.info||""))}">${own&&eff.layer!=="default"?`<span class="mod"></span>`:""}
    <div class="lab">${esc(s.title)} ${mk(s.mk)} ${info(key,(s.info||"")+`\nID：${s.plugin}.${s.id} · 类型：${s.type}${s.toolbar?" · 也显示在工具窗口工具栏":""}`)}</div>
    <div class="ctl">${ctl}${inh}</div>
    <div class="badges"><span class="cap2 val" title="Core 合并后的实际生效值">= ${esc(fmt(s,v))}</span>${scopeCap}${effCap}${own&&eff.layer!=="default"?`<button class="reset" title="${layer==="application"?"恢复默认值":"清除覆盖"}" data-reset="${key}" data-layer="${layer}" data-inst="${mode.instanceID||""}">↺</button>`:""}</div></div>`;

function settingGroups(list,mode){

function marketState(m){
  const inst=S.plugins.find(p=>p.id===m.id&&!p.removed);
  if(m.apiUnsupported) return {label:"不支持", dis:true, why:"该插件需要更新版本的 Lithe。"};
  if(m.unsupported) return {label:"不支持", dis:true, why:m.unsupported};
  if(S.installedNext[m.name]) return {label:"已安装", dis:true, why:`已安装版本 ${m.version}，重启 Lithe 后生效。`};
  if(m.replaces){ const old=PById(m.replaces); if(old&&!old.removed){ return S.uninstalling[old.short]?{label:"需先卸载旧版",dis:true,why:`请重启 Lithe 以完成 ${old.name} 的卸载，然后再安装此插件。`}:{label:"需先卸载旧版",dis:true,why:`请先在“已安装”中卸载 ${old.name} 并重启 Lithe。它是此插件已退役的官方版本，支持同一种语言。`}; } }
  if(inst&&inst.update) return {label:"更新", update:true, why:`从 ${S.sources.find(s=>s.id===inst.source)?.name} 安装，更新只会来自该仓库。`};
  if(inst) return {label:"已安装", dis:true, why: inst.bundled?`版本 ${inst.version} 为内置或从磁盘安装。`:`已安装版本 ${inst.version}。`};
  return {label:"安装"};
}

/* ===================== 语言服务与语言页 ===================== */
function lspRows(){
  const pr=proj(), rows=[];
  pr.languages.forEach(lang=>{
    const providers=S.plugins.filter(p=>!p.removed&&p.caps.some(c=>c.kind==="languageServer"&&c.lang===lang));
    const live=providers.find(p=>loaded(p)&&!p.retired);
    const retired=providers.find(p=>p.retired);
    if(live){ rows.push({lang, p:live, c:live.caps.find(c=>c.kind==="languageServer"&&c.lang===lang)}); return; }
    let hint, action;
    const market=MARKET.find(m=>m.provides.includes(`语言：${LANG_NAMES[lang]}`));
    if(lang==="typescript"){ rows.push({lang, hint:"由内置 TypeScript 支持提供（不经插件），不在这里显示开关。", builtin:true}); return; }
    if(retired && S.uninstalling[retired.short]) hint=`请重启 Lithe 以完成旧版 ${retired.name} 的卸载，然后从插件市场安装社区插件 ${market.name}。`;
    else if(retired) hint=`${retired.name} 已迁移为 Lithe Store 社区插件，旧官方版不再更新。请在插件管理中卸载旧版并重启 Lithe，再安装社区版。`;
    else if(providers.length && staged(providers[0])) hint=`${providers[0].name} 已安装，重启 Lithe 后才能在这里控制语言服务器。`;
    else if(providers.length) hint=`${providers[0].name} 插件已禁用，请先在插件管理中启用。`;
    else if(market && S.installedNext[market.name]) hint=`${market.name} 已安装，重启 Lithe 后才能在这里控制语言服务器。`;
    else if(market) { hint=`检测到 ${LANG_NAMES[lang]} 项目，请在插件管理的插件市场中，从 Lithe Store 安装 ${market.name}。`; action=market.id; }
    else hint=`检测到 ${LANG_NAMES[lang]} 文件，暂无提供语言服务的插件。`;
    rows.push({lang, hint, action:action||(retired&&S.uninstalling[retired.short]?market.id:null), owner:retired||providers[0]});
  });
  return rows;
}

function pageRuntimes(){

      + (sp.kind==="java"?`${ghost("继承项目 Maven / Maven JDK","d-subproject-maven","→ 构建工具 › Maven（选中该模块的构建实例）")}<div class="faint">此子项目的 Maven 来源、Maven JDK 在 <span class="link" data-page="build:maven" data-binst="maven:${sp.id}">构建工具 › Maven › ${esc(sp.path)}/pom.xml</span> 中覆盖。</div>`:"");
  }
  return `<div class="split"><div class="lpane" style="width:260px"><div class="sechead">${esc(pr.name)} ${nb("runtimes",2)}</div><div class="tree">

function goChange(id){
  const c=CH[id]; let pg=c.page;
  if(pg==="lang:*") pg="lang:java"; else if(pg==="build:*") pg="build:maven"; else if(pg==="tool:*") pg="tool:database";
  if(c.state&&c.state.project&&c.state.project!==projectKey){ projectKey=c.state.project; $("#optProject").value=projectKey; S.runtimeSel="__defaults"; }
  if(c.state&&c.state.page) pg=c.state.page;
  S.page=pg; if(pg==="plugins"){ S.pluginTab=(c.state&&c.state.pluginTab)||"installed"; if(S.pluginTab==="installed") S.selected="java"; }
  if(c.state){ ["detailTab","runtimeSel"].forEach(k=>{ if(c.state[k]) S[k]=c.state[k]; }); }
  S.chgHl=id; S.notesOpen=true; S.modal=null; S.menu=(c.state&&c.state.menu)||null; render();
  const el=$(`#content [data-chg="${id}"]`)||$(`#crumb [data-chg="${id}"]`)||$(`.menu [data-chg="${id}"]`);
  if(el){ const box=el.closest(".srow,.sec,.card,tr,.dtabs,.banner,h3,.item")||el; box.scrollIntoView({block:"center"}); box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash"); }
  const n=document.getElementById(`note-chg-${id}`); if(n) n.scrollIntoView({block:"nearest"});
}
let toastTimer;
function toast(t){ S.toast=t; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{S.toast=null;render();},2200); }
function findSetting(key){ const i=key.indexOf("."); return SETTINGS.find(s=>s.plugin===key.slice(0,i)&&s.id===key.slice(i+1)); }
function goPlugins(tab){ S.page="plugins"; S.pluginTab=tab; }

function restartLithe(){
  Object.assign(S.loaded,S.nextLaunch||{}); S.nextLaunch=null;
  Object.keys(S.uninstalling).forEach(id=>P(id).removed=true); S.uninstalling={};
  Object.keys(S.installedNext).forEach(name=>{
    const x=MARKET.find(m=>m.name===name);
    if(x.id==="io.lithestore.python-support"&&!P("python")){
      S.plugins.push({id:x.id,short:"python",name:x.name,vendor:x.author,version:x.version,color:x.color,letter:x.letter,origin:"community",source:x.source,summary:x.desc,
        caps:[{kind:"language",id:"python",title:"Python",detail:".py · pyproject.toml"},{kind:"languageServer",id:"basedpyright",title:"basedpyright（插件内置）",detail:"需要 Node ≥ 18",lang:"python",program:"packaged"},{kind:"test",id:"pytest",title:"pytest",detail:"JUnit XML 结果"}],
        permissions:["languageServer.launch","build.systems","execution.test"],programs:x.programs});
      S.loaded.python=true; SETTINGS.push(Object.assign({plugin:"python",section:"类型检查",info:"basedpyright.analysis.typeCheckingMode"},x.settings[0]));
    } else if(x.id==="io.lithestore.php-support"&&!P("php")){
      S.plugins.push({id:x.id,short:"php",name:x.name,vendor:x.author,version:x.version,color:x.color,letter:x.letter,origin:"community",source:x.source,summary:x.desc,
        caps:[{kind:"language",id:"php",title:"PHP",detail:".php"},{kind:"languageServer",id:"intelephense",title:"Intelephense 1.12（插件内置）",detail:"需要 Node ≥ 18",lang:"php",program:"packaged"},{kind:"test",id:"phpunit",title:"PHPUnit",detail:"JUnit XML 结果"}],
        permissions:["languageServer.launch","execution.run","execution.test"],programs:x.programs});
      S.loaded.php=true;
      SETTINGS.push({id:"phpVersion",plugin:"php",cap:"languageServer:intelephense",section:"语言服务",title:"目标 PHP 版本",type:"enum",def:"8.3",options:[["8.2","8.2"],["8.3","8.3"],["8.4","8.4"]],scope:"workspace",effect:"immediate",info:"intelephense.environment.phpVersion"});
    }
  });
  S.installedNext={}; toast("Lithe 已重启，插件变更已生效");
}

/* ===================== 事件 ===================== */
const CLICK_SEL="[data-chg],[data-gochg],[data-chgview],[data-chgexport],[data-note],[data-info],[data-page],[data-toggle],[data-ptab],[data-sel],[data-enable],[data-filter],[data-dtab],[data-reset],[data-restart],[data-dismiss],[data-goplugin],[data-gomarket],[data-lscope],[data-lspoff],[data-msel],[data-minstall],[data-confirminstall],[data-uninstall],[data-confirmuninstall],[data-closemodal],[data-closemask],[data-menu],[data-modal],[data-update],[data-reinstall],[data-cancelpend],[data-applypend],[data-restartlithe],[data-closenotes],[data-opennotes],[data-toast],[data-pick],[data-pickmisc],[data-misc-set],[data-addrepo],[data-refreshrepo],[data-removerepo],[data-refreshall],[data-rtsel],[data-runsel],[data-resetplugin],[data-toggle-maven],.sw[data-set],.chip[data-set],.sw[data-misc]";
document.addEventListener("click",e=>{
  if(e.target.closest("select,input,textarea")) return;
  const t=e.target.closest(CLICK_SEL);
  const hadMenu=!!S.menu; S.menu=null;
  if(!t){ if(S.popover||hadMenu){S.popover=null;render();} return; }
  const d=t.dataset;
  if(d.closemask!==undefined){ if(e.target===t){ S.modal=null; render(); } return; }
  if(t.disabled) return;
  if(d.note){ const [k,n]=d.note.split(":"); S.notesOpen=true; render(); const el=document.getElementById(`note-${k}-${n}`); if(el){el.classList.add("hl");el.scrollIntoView({block:"center"});} return; }
  if(d.info){ S.popover=S.popover===d.info?null:d.info; render(); return; }
  if(d.chg){ e.stopPropagation(); S.chgHl=d.chg; S.notesOpen=true; if(!$("#optNotes").checked) $("#optNotes").checked=true; render(); const el=document.getElementById(`note-chg-${d.chg}`); if(el) el.scrollIntoView({block:"center"}); else toast(`${MK[CH[d.chg].type]}：${CH[d.chg].title}`); return; }
  if(d.gochg){ goChange(d.gochg); return; }
  if(d.chgview){ S.chgView=d.chgview; render(); return; }
  if(d.chgexport!==undefined){ S.modal={type:"export"}; render(); return; }
  S.popover=null;
  if(d.enable){ const p=P(d.enable); if(p.required) return; const target=!staged(p); if(target===baseline(p)) delete S.pending[p.short]; else S.pending[p.short]=target; }
  else if(d.set&&t.classList.contains("sw")){ const s=findSetting(d.set); setValue(s,!effective(s,d.inst||null).value,d.layer,d.inst||null); }
  else if(d.set&&d.kind==="multi"){ const s=findSetting(d.set); const v=[...effective(s,d.inst||null).value]; const i=v.indexOf(d.choice); i>=0?v.splice(i,1):v.push(d.choice); setValue(s,v,d.layer,d.inst||null); }
  else if(d.misc&&t.classList.contains("sw")){ S.misc[d.misc]=!mv(d.misc,d.def==="true"); }
  else if(d.miscSet){ S.misc[d.miscSet]= d.val==="true"?true:d.val==="false"?false:d.val; }
  else if(d.page){ S.page=d.page; if(d.binst) S.buildScope[d.page.slice(6)]=d.binst; S.hit=null; }
  else if(d.toggle){ S.navOpen[d.toggle]=!S.navOpen[d.toggle]; }
  else if(d.ptab){ S.pluginTab=d.ptab; }
  else if(d.sel){ S.selected=d.sel; }
  else if(d.filter){ S.filter=d.filter; if(d.clearq) S.query=""; }
  else if(d.dtab){ S.detailTab=d.dtab; }
  else if(d.reset){ resetValue(findSetting(d.reset),d.layer,d.inst||null); }
  else if(d.resetplugin){ SETTINGS.filter(s=>s.plugin===d.resetplugin).forEach(s=>resetValue(s,"application")); toast("已恢复默认值"); }
  else if(d.restart){ delete S.pendingRestart[d.restart]; toast(`正在重启 ${capTitle(d.restart)}…`); }
  else if(d.dismiss){ delete S.pendingRestart[d.dismiss]; }
  else if(d.goplugin!==undefined){ goPlugins("installed"); if(d.goplugin){S.selected=d.goplugin; S.detailTab="overview";} }
  else if(d.gomarket){ goPlugins("marketplace"); S.mSelected=d.gomarket; S.mSource="all"; S.mQuery=""; }
  else if(d.lscope){ S.langScope=d.lscope; }
  else if(d.lspoff){ const k=`${projectKey}|${d.lspoff}`; if(S.lspOff[k]) delete S.lspOff[k]; else S.lspOff[k]=true; toast(S.lspOff[k]?"已停止语言服务器并释放资源":"正在启动"); }
  else if(d.toggleMaven!==undefined){ S.misc.mavenFailed=!S.misc.mavenFailed; }
  else if(d.msel){ S.mSelected=d.msel; }
  else if(d.minstall){ const x=MARKET.find(i=>i.id===d.minstall); if(x.source==="official"&&!S.plugins.find(p=>p.id===x.id)){ S.installedNext[x.name]=true; toast(`已安装版本 ${x.version}，重启 Lithe 后生效。`);} else S.modal={type:"install",id:x.id}; }
  else if(d.confirminstall){ const x=MARKET.find(i=>i.id===d.confirminstall), inst=S.plugins.find(p=>p.id===x.id&&!p.removed); S.modal=null; if(inst){ inst.prev=inst.version; inst.version=inst.update; delete inst.update; toast(`已安装版本 ${inst.version}，重启 Lithe 后生效。`);} else { S.installedNext[x.name]=true; toast(`已安装版本 ${x.version}，重启 Lithe 后生效。`);} }
  else if(d.uninstall){ S.modal={type:"uninstall",id:d.uninstall}; }
  else if(d.confirmuninstall){ S.uninstalling[d.confirmuninstall]=true; delete S.pending[d.confirmuninstall]; S.modal=null; }
  else if(d.menu){ S.menu=hadMenu?null:d.menu; }
  else if(d.modal){ S.modal={type:d.modal}; }
  else if(d.update){ const p=P(d.update); if(p.origin==="community") S.modal={type:"install",id:p.id}; else { p.prev=p.version; p.version=p.update; delete p.update; } }
  else if(d.reinstall){ toast(`正在从 ${S.sources.find(s=>s.id===P(d.reinstall).source)?.name} 重新安装…`); }
  else if(d.cancelpend!==undefined){ S.pending={}; }
  else if(d.applypend!==undefined){ S.nextLaunch=Object.assign(S.nextLaunch||{},S.pending); S.pending={}; }
  else if(d.restartlithe!==undefined){ restartLithe(); }
  else if(d.closenotes!==undefined){ S.notesOpen=false; }
  else if(d.opennotes!==undefined){ S.notesOpen=true; }
  else if(d.pick){ const s=findSetting(d.pick); setValue(s,s.type==="file"?"~/work/maven/settings-corp.xml":"~/work/cache",d.layer,d.inst||null); }
  else if(d.pickmisc){ if(!d.pickmisc.startsWith("rt.")) S.misc[d.pickmisc]="~/opt/tool"; toast("演示：这里会打开系统选择器"); }
  else if(d.addrepo!==undefined){ const v=$("#repoUrl").value.trim(); if(!/^https:\/\//.test(v)){ toast("请输入 https 插件索引地址或 GitHub 仓库地址"); render(); return; } S.sources.push({id:"u"+Date.now(),name:v.replace(/^https:\/\/(github\.com\/)?/,"").split("/").slice(0,2).join("/"),url:v,refreshed:null,ignored:0}); }
  else if(d.refreshrepo){ S.sources.find(s=>s.id===d.refreshrepo).refreshed="刚刚"; }
  else if(d.removerepo){ S.sources=S.sources.filter(s=>s.id!==d.removerepo); if(S.mSource===d.removerepo) S.mSource="all"; }
  else if(d.refreshall!==undefined){ S.sources.forEach(s=>s.refreshed="刚刚"); toast("已刷新全部插件仓库"); }
  else if(d.rtsel){ S.runtimeSel=d.rtsel; }
  else if(d.runsel){ S.runSel=d.runsel; }
  if(d.closemodal!==undefined) S.modal=null;
  if(d.toast) toast(d.toast);
  render();
});
document.addEventListener("change",e=>{
  const t=e.target, d=t.dataset;
  if(t.id==="bscope"){ S.buildScope[d.sys]=t.value; render(); return; }
  if(t.id==="mSource"){ S.mSource=t.value; render(); return; }
  if(t.id==="mSort"){ S.mSort=t.value; render(); return; }
  if(t.id==="navSearch"||t.id==="pq"||t.id==="mq"||t.id==="sq"||t.id==="repoUrl") return;
  if(d.misc){ S.misc[d.misc]=t.value; render(); return; }
  if(!d.set) return;
  const s=findSetting(d.set);
  if(d.kind==="int"){ const n=Number(t.value); if(!Number.isInteger(n)||n<s.min||n>s.max){ t.classList.add("bad"); toast(`请输入 ${s.min} 到 ${s.max} 之间的整数。`); return; } setValue(s,n,d.layer,d.inst||null); }
  else if(d.kind==="enum") setValue(s,t.value,d.layer,d.inst||null);
  else if(d.kind==="text"){ if(d.pattern&&!new RegExp(d.pattern).test(t.value)){ t.classList.add("bad"); toast("格式不符合声明的 pattern，未保存"); return; } setValue(s,t.value,d.layer,d.inst||null); }
  render();
});
function keepFocus(id,fn){ const el=$("#"+id), pos=el.selectionStart; fn(el.value); render(); const n=$("#"+id); if(n){ n.focus(); n.setSelectionRange(pos,pos);} }
document.addEventListener("input",e=>{
  if(e.target.id==="pq") keepFocus("pq",v=>S.query=v);
  if(e.target.id==="mq") keepFocus("mq",v=>S.mQuery=v);
});
function navSearch(q){
  q=q.trim().toLowerCase(); if(!q) return;
  const hit=SETTINGS.find(s=>loaded(P(s.plugin))&&(s.title+s.id).toLowerCase().includes(q));
  if(hit){ const l=capLocation(hit.cap,hit.plugin); if(l) S.page=l.page; else { goPlugins("installed"); S.selected=hit.plugin; S.detailTab="settings"; } S.hit=`${hit.plugin}.${hit.id}`; render(); return; }
  const pg=Object.entries(PAGE_TITLES).find(([k,v])=>v.toLowerCase().includes(q));
  if(pg){ S.page=pg[0]; render(); } else toast("未找到设置 · 请尝试其他搜索词。");
}
$("#navSearch").addEventListener("keydown",e=>{ if(e.key==="Enter") navSearch(e.target.value); });
$("#optChanges").addEventListener("click",()=>{ S.page="changes"; render(); });
["optNotes","optDark","optMarks"].forEach(id=>$("#"+id).addEventListener("change",render));
$("#optProject").addEventListener("change",e=>{ projectKey=e.target.value; S.runtimeSel="__defaults"; S.runSel="r1"; render(); });
document.addEventListener("click",e=>{ if(e.target.id==="copymd"){ const t=$("#chgmd"); t.select(); navigator.clipboard?.writeText(t.value).catch(()=>{}); try{document.execCommand("copy")}catch(_){} toast("已复制"); } },true);
$("#optReset").addEventListener("click",()=>location.reload());
render();
</script>
