<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Lithe 设置 · 插件画布节点（描述模式）交互原型</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  交互原型，不是实现。演示设置窗口里的插件内容区怎样只用“描述模式 + 画布节点”做出风格各异的页面，而不嵌网页。
  插件全部是虚构的（io.github.example.*）。“插件后端”是本页里模拟的进程：宿主和它之间只交换 JSON 消息，
  每条消息都经过 JSON 序列化，并按演示栏里的响应时间延迟送达。字段名都还没定，写法只是示意。
  可用地址参数直接打开某个状态，例如：
    #page=maven&click=deps:guava31&panel=log
    #page=theme&dark=1      #page=build&tip=builds:b:1290      #page=maven&fault=label
  参数：page=maven|theme|build，dark=1，panel=notes|scene|log|0，fault=none|budget|label|timeout|crash|flood，
        lat=20|60|200|800，click=<画布>:<节点>，tip=<画布>:<节点>，contrib=deps|mavenSupport
-->
<style>
:root{
  --bg:#f7f8fa; --surface:#ffffff; --side:#f2f3f5; --sel:#dfe7f8; --hover:#eceef1;
  --text:#1f2329; --sub:#6c707e; --faint:#9aa0ab; --line:#e4e6ea; --accent:#3574f0;
  --ok:#208a3c; --warn:#c27d00; --err:#d1453b; --pill:#eef1f6; --chip:#e8f0fe;
  --note:#ffd75e; --shadow:0 8px 28px rgba(0,0,0,.14); --hl:#fff3c4;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
  font-size:13px; color:var(--text);
}
html.dark{
  --bg:#1e1f22; --surface:#2b2d30; --side:#26282b; --sel:#2e436e; --hover:#33363a;
  --text:#dfe1e5; --sub:#9da0a8; --faint:#6f737a; --line:#3a3d41; --accent:#548af7;
  --ok:#5fb865; --warn:#e0a83e; --err:#f0716a; --pill:#393b40; --chip:#25324d;
  --shadow:0 8px 28px rgba(0,0,0,.5); --hl:#4a4220;
}
*{box-sizing:border-box}
body{margin:0;background:#c9ccd3;min-height:100vh;display:flex;flex-direction:column;align-items:center}
html.dark body{background:#111214}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:"SF Mono",Menlo,monospace;font-size:11.5px}
.demobar{width:100%;min-width:1240px;white-space:nowrap;display:flex;gap:14px;align-items:center;padding:8px 16px;background:#24262b;color:#ddd;font-size:12px}
.demobar b{color:#fff}.demobar label{display:flex;gap:5px;align-items:center;cursor:pointer}.demobar .sp{flex:1}
.demobar select{background:#34373d;border:1px solid #484b52;border-radius:5px;padding:2px 6px;color:#eee}
.demobar .perf{color:#9fb4d8;font-family:"SF Mono",Menlo,monospace;font-size:11px}
.win{margin:16px;min-width:1240px;width:min(1640px,calc(100vw - 32px));height:min(940px,calc(100vh - 76px));min-height:680px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;position:relative}
.titlebar{height:38px;display:flex;align-items:center;padding:0 14px;gap:8px;border-bottom:1px solid var(--line);background:var(--side);flex:none}
.dot{width:12px;height:12px;border-radius:50%}
.titlebar .t{flex:1;text-align:center;font-weight:600;color:var(--sub);margin-right:52px}
.body{flex:1;display:flex;min-height:0}
/* 侧栏 */
.side{width:232px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side .search{margin:10px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);display:flex;gap:6px;align-items:center;color:var(--faint)}
.side .search input{border:0;outline:0;background:transparent;width:100%;color:var(--text)}
.nav{overflow:auto;padding:0 6px 10px;flex:1}
.nav .r{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer;min-height:26px;white-space:nowrap}
.nav .r:hover{background:var(--hover)}
.nav .r.sel{background:var(--sel)}
.nav .r.l1{padding-left:26px}.nav .r.l2{padding-left:44px}
.nav .r .chev{width:10px;color:var(--faint);font-size:10px}
.nav .hit{display:block;padding:6px 8px;border-radius:6px;cursor:pointer}
.nav .hit:hover{background:var(--hover)}
.nav .hit .k{color:var(--sub);font-size:11.5px}
.nav .hit mark{background:var(--hl);color:inherit;border-radius:2px}
/* 主区 */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.crumb{height:40px;flex:none;display:flex;align-items:center;gap:6px;padding:0 24px;border-bottom:1px solid var(--line);color:var(--sub)}
.crumb .last{color:var(--text);font-weight:600}.crumb .sep{color:var(--faint)}
.content{flex:1;overflow:auto;padding:18px 26px 30px}
.page{max-width:920px}
.footer{height:52px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--surface)}
.footer .msg{flex:1;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--sub)}
.moddot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.btn{border:1px solid var(--line);background:var(--surface);padding:4px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:2px 9px;font-size:12px}
.btn.link{border-color:transparent;background:transparent;color:var(--accent);padding:2px 4px}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:inline-flex;background:var(--pill);border-radius:7px;padding:2px;flex:none}
.seg button{border:0;background:transparent;padding:3px 12px;border-radius:5px;cursor:pointer;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.inp{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface);outline:0;min-width:0}
.inp:focus{border-color:var(--accent)}
select.inp{padding:3px 6px}
.tag{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--pill);color:var(--sub);white-space:nowrap;flex:none}
.tag.blue{background:var(--chip);color:var(--accent)}
.tag.green{background:#e6f4ea;color:var(--ok)} html.dark .tag.green{background:#22382a}
.tag.warn{background:#fff1d6;color:var(--warn)} html.dark .tag.warn{background:#3d3220}
.tag.err{background:#fbe5e3;color:var(--err)} html.dark .tag.err{background:#45282a}
.sw{width:30px;height:18px;border-radius:9px;background:#c4c7cd;position:relative;cursor:pointer;flex:none;border:0;padding:0;transition:background .15s}
html.dark .sw{background:#55585e}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on,html.dark .sw.on{background:var(--accent)} .sw.on::after{left:14px}
.muted{color:var(--sub);font-size:12px}.faint{color:var(--faint);font-size:11.5px}
.link{color:var(--accent);cursor:pointer;white-space:nowrap}
.info{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;color:var(--faint);font-size:12px;cursor:help;flex:none}
.info:hover,.info:focus{color:var(--accent);outline:0}
.nb{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--note);color:#5a4500;font-size:10px;font-weight:700;font-style:normal;cursor:pointer;flex:none;vertical-align:middle}
html.nonotes .nb{display:none}
.toast{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:#2b2d30;color:#fff;padding:7px 14px;border-radius:8px;font-size:12px;z-index:60;box-shadow:var(--shadow);max-width:70%}
.tip{position:fixed;pointer-events:none;background:#24262b;color:#fff;font-size:12px;line-height:1.5;padding:5px 9px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:80;white-space:pre-line;max-width:360px}
/* 页头 */
.ph{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ph h2{margin:0;font-size:18px}
.picon{width:36px;height:36px;border-radius:9px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 16px}
.tabs span{padding:7px 14px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs span.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.contrib{display:flex;align-items:center;gap:10px;margin:0 0 14px}
/* 插件内容区 */
.region{border:1.5px dashed var(--line);border-radius:10px;padding:14px 14px 10px;position:relative;margin-top:14px}
.region>.cap{position:absolute;top:-9px;left:12px;background:var(--surface);padding:0 6px;font-size:11px;color:var(--faint);display:flex;gap:6px;align-items:center}
.d-row{display:flex;align-items:center;gap:10px;margin:4px 0 8px;flex-wrap:wrap}
.d-label{display:inline-flex;align-items:center;gap:4px}
.d-label.sub{color:var(--sub)} .d-label.warn{color:var(--warn)} .d-label.err{color:var(--err)}
.d-tg{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.d-sec{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.d-sec-h{font-weight:600;margin-bottom:6px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:4px 12px;margin:2px 0 8px}
.kv .k{color:var(--sub)} .kv .v.warn{color:var(--warn)} .kv .v.ok{color:var(--ok)} .kv .v.err{color:var(--err)}
.tbl{border-collapse:collapse;width:100%;margin:4px 0 6px}
.tbl th{text-align:left;color:var(--sub);font-weight:500;font-size:12px;padding:4px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:4px 8px;border-bottom:1px solid var(--line)}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.banner{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:7px;margin:4px 0 10px;line-height:1.55}
.banner.info{background:var(--chip)} .banner.err{background:#fbe5e3;color:#8f2a22} .banner.warn{background:#fff1d6;color:#7a5200}
html.dark .banner.err{background:#45282a;color:#f6c7c3} html.dark .banner.warn{background:#3d3220;color:#f3d79e}
.banner .acts{margin-left:auto;display:flex;gap:6px;flex:none}
.srow{display:flex;align-items:center;gap:10px;min-height:34px;padding:3px 8px;border-radius:7px}
.srow:hover{background:var(--hover)}
.srow .lab{width:200px;flex:none;display:flex;align-items:center;gap:5px}
.srow .ctl{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.cvwrap{position:relative;border-radius:8px;margin:6px 0 2px;outline:1px solid var(--line)}
.cvwrap canvas{display:block;width:100%;border-radius:8px;touch-action:none}
.cvwrap canvas:focus{outline:0}
.cvtools{position:absolute;bottom:8px;right:8px;display:flex;align-items:center;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.cvtools button{border:0;background:transparent;border-radius:5px;padding:1px 8px;cursor:pointer;color:var(--sub);min-width:26px}
.cvtools button:hover{background:var(--hover);color:var(--text)}
.cvtools .z{font-size:11px;font-family:"SF Mono",Menlo,monospace;color:var(--sub);padding:0 4px}
.cvstatus{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--sub);padding:4px 2px 8px;min-height:24px}
.cvstatus .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.wait{color:var(--accent)}
.skel{height:14px;border-radius:5px;background:var(--pill);margin:10px 0;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
/* 右侧面板 */
.panel{width:372px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg);min-height:0}
.ptabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);flex:none}
.ptabs span{padding:6px 10px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:5px;align-items:center}
.ptabs span.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.pbody{flex:1;overflow:auto;padding:12px 14px 20px;line-height:1.6}
.pbody .n{display:flex;gap:8px;padding:6px 6px;border-radius:6px;margin-bottom:2px}
.pbody .n.hl{background:var(--hl)}
.pbody .n .nb{margin-top:2px}
.pbody code{font-family:"SF Mono",Menlo,monospace;font-size:11px;background:var(--pill);padding:0 3px;border-radius:3px}
.pbody .tt{font-weight:600;margin:14px 0 6px}
.pbody .lead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px}
.cnt{display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.cnt .h{grid-column:1/-1;font-weight:600;margin-top:4px}
.cnt .v{text-align:right;font-family:"SF Mono",Menlo,monospace;font-size:11.5px}
.lg{font-family:"SF Mono",Menlo,monospace;font-size:11px;line-height:1.5;border-top:1px solid var(--line)}
.lg div{padding:3px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:46px 18px 1fr;gap:4px;word-break:break-all}
.lg .t{color:var(--faint)} .lg .out{color:var(--accent)} .lg .in{color:var(--ok)} .lg .host{color:var(--warn)} .lg .push{color:#8e6ad8}
.meter{display:grid;grid-template-columns:72px 1fr 118px;gap:8px;align-items:center;font-size:11.5px;margin:3px 0}
.meter .bar{height:6px;border-radius:3px;background:var(--pill);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter .bar i.over{background:var(--err)}
.meter .v{text-align:right;font-family:"SF Mono",Menlo,monospace;font-size:11px}
pre.json{font-family:"SF Mono",Menlo,monospace;font-size:10.5px;line-height:1.45;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow:auto;white-space:pre;max-height:none}
#err{position:fixed;bottom:0;left:0;right:0;background:#b00020;color:#fff;font:12px monospace;white-space:pre-wrap}
#err:empty{display:none}
</style>
</head>
<body>
<div class="demobar">
  <b>原型：插件画布节点（描述模式）</b>
  <label><input type="checkbox" id="optDark"> 深色</label>
  <label>插件响应 <select id="optLat"><option value="20">20 ms</option><option value="60">60 ms</option><option value="200">200 ms</option><option value="800">800 ms</option></select></label>
  <label>故障演示 <select id="optFault">
    <option value="none">无</option>
    <option value="budget">节点超出预算</option>
    <option value="label">可点节点缺少 label</option>
    <option value="timeout">插件不响应（超时）</option>
    <option value="crash">插件后端崩溃</option>
    <option value="flood">推送过快（构建分析页）</option>
  </select></label>
  <label>右侧面板 <select id="optPanel"><option value="notes">设计标注</option><option value="scene">场景与预算</option><option value="log">消息</option><option value="0">隐藏</option></select></label>
  <span class="sp"></span>
  <span class="perf" id="perf"></span>
</div>
<div class="win">
  <div class="titlebar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="t">设置</span></div>
  <div class="body">
    <aside class="side">
      <div class="search">⌕<input id="navq" placeholder="搜索设置"><i class="nb" data-note="13">13</i></div>
      <div class="nav" id="nav"></div>
    </aside>
    <main class="main">
      <div class="crumb" id="crumb"></div>
      <div class="content" id="content"></div>
      <div class="footer" id="footer"></div>
    </main>
    <aside class="panel" id="panel"></aside>
  </div>
  <div id="toast"></div>
</div>
<div class="tip" id="tip" hidden></div>
<div id="err"></div>
<script>
"use strict";
window.addEventListener("error",e=>{document.getElementById("err").textContent+=`${e.message} @${e.lineno}:${e.colno}\n`;});

/* ================= 基础 ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString("en-US");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const now=()=>performance.now();
const T0=now();
const f1=n=>Math.round(n*10)/10;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* 宿主给每个画布的预算。正式实现中这些值由 Core 统一给出，写进契约说明。 */
const BUDGET={nodes:2000,bytes:256*1024,applyPerSec:30,timeoutMs:2000,viewportMs:400,slowMs:300};
/* 计数：宿主本地处理的交互 vs 跨进程消息 */
const CNT={hover:0,press:0,focus:0,pan:0,zoom:0,tip:0,sent:0,recv:0,applied:0,merged:0,rejected:0};
const LOG=[];

const H=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const S={page:H.page||"maven",dark:H.dark==="1",panel:H.panel||"notes",fault:H.fault||"none",lat:+(H.lat||60),
  navq:"",contrib:{maven:H.contrib||"deps"},noteHl:0,applying:false,open:{buildgrp:true,buildTools:true,plugins:true}};

/* ================= 插件清单（宿主可见的声明部分） ================= */
const PL={
  mavenSupport:{id:"io.github.example.maven",name:"Maven 支持",ver:"1.4.0",bg:"#c0392b",letter:"M",
    keywords:["settings.xml","本地仓库","离线"],
    settings:[
      {id:"maven.userSettings",type:"string",title:"用户 settings.xml",description:"Maven 读取的用户级配置。保存时只改动修改过的字段，保留注释和其他内容。",default:"~/.m2/settings.xml",mono:true},
      {id:"maven.localRepo",type:"string",title:"本地仓库",description:"没有在 settings.xml 中设置时，使用 Maven 的默认位置。",default:"",placeholder:"自动（~/.m2/repository）",mono:true},
      {id:"maven.offline",type:"bool",title:"离线模式",description:"构建时不访问远程仓库，只用本地仓库里已有的构件。",default:false}]},
  deps:{id:"io.github.example.maven-deps",name:"Maven 依赖图",ver:"0.3.0",bg:"#6d5bd0",letter:"图",
    keywords:["依赖","冲突","依赖树","排除","dependency","conflict"],
    settings:[
      {id:"deps.analyzeOnOpen",type:"bool",title:"打开项目时分析依赖",description:"打开 Maven 项目后在后台解析一次依赖，结果只保存在本机缓存。",default:true},
      {id:"deps.defaultScope",type:"enum",title:"默认依赖范围",description:"打开依赖图时先显示哪个范围：compile 只含编译依赖，runtime 再加运行时依赖，test 再加测试依赖。",options:[["compile","compile"],["runtime","runtime"],["test","test"]],default:"compile"}]},
  theme:{id:"io.github.example.dusk-theme",name:"Dusk 配色主题",ver:"1.2.0",bg:"linear-gradient(135deg,#6d5bd0,#e27396)",letter:"D",
    keywords:["配色","颜色","主题","对比度","color","theme"],
    settings:[
      {id:"dusk.variant",type:"enum",title:"变体",description:"暮色和高对比是深色，黎明是浅色。高对比提高了所有语法颜色与背景的对比度。",options:[["dusk","暮色"],["dawn","黎明"],["contrast","高对比"]],default:"dusk"}]},
  build:{id:"io.github.example.gradle-insights",name:"Gradle 构建分析",ver:"0.9.1",bg:"#0f766e",letter:"G",
    keywords:["耗时","构建缓存","缓存命中","构建分析","build time","cache"],
    settings:[
      {id:"gradle.insights.collect",type:"bool",title:"收集构建数据",description:"每次构建结束后读取 Gradle 生成的构建报告，数据只保存在本机。",default:true},
      {id:"gradle.insights.keep",type:"number",title:"保留最近几次构建",description:"超过这个数量的旧记录会被删除。",default:30,min:5,max:500}]},
};

    if(n.id){if(ids.has(n.id))bad=bad||{code:"dup",detail:{id:n.id}};ids.add(n.id);}
    if(interactive(n)&&!(n.label&&String(n.label).trim()))bad=bad||{code:"label",detail:{id:n.id||"（无 ID）"}};
    if(interactive(n)&&!n.id)bad=bad||{code:"label",detail:{id:"（无 ID）"}};
    if(depth>16)bad=bad||{code:"depth",detail:{}};
    if(n.type==="group")walk(n.children,depth+1);

  walk(cv.nodes,1);
  const bytes=bytesOf(cv);
  if(!bad&&count>BUDGET.nodes)bad={code:"budget",detail:{count}};
  if(!bad&&bytes>BUDGET.bytes)bad={code:"bytes",detail:{bytes}};
  return {ok:!bad,...(bad||{}),count,bytes};

function walkTree(list,fn,parent=null){for(let i=0;i<(list||[]).length;i++){const n=list[i];if(fn(n,list,i,parent)===false)return false;if(n.children&&n.type!=="canvas"&&walkTree(n.children,fn,n)===false)return false;}return true;}

function indexCanvas(R,cv){

  walk(cv.nodes,null);R.idx[cv.id]=m;

function adoptCanvas(R,cv){

  if(C.scene&&JSON.stringify(C.scene.viewBox)!==JSON.stringify(cv.viewBox))C.view={k:1,tx:0,ty:0};

function receive(R,res,ms,bytes,req){

    for(const cv of canvasesOf(res.tree)){const v=validateCanvas(cv);if(!v.ok){fail(R,v.code,{...v.detail,count:v.count,bytes:v.bytes});return;}}
    R.tree=res.tree;R.status="ready";R.err=null;
    const keep=new Set();
    for(const cv of canvasesOf(R.tree)){adoptCanvas(R,cv);keep.add(cv.id);}
    for(const id of Object.keys(R.canv))if(!keep.has(id))delete R.canv[id];
    parts.push("界面树");
  }
  if(res.applied){for(const id of res.applied){const i=WRITES.findIndex(w=>w.id===id);if(i>=0)WRITES.splice(i,1);}parts.push(`已写入 ${res.applied.length} 项`);}
  if(res.write){const i=WRITES.findIndex(w=>w.id===res.write.id);if(i>=0)WRITES[i]={...res.write,owner:R.key};else WRITES.push({...res.write,owner:R.key});parts.push("待应用写入 1 项");}

function applyPatches(R,patches){
  let ui=false;const touched=new Set();

    if(p.op==="ui"){

      if(!done)log("host",R.key,`忽略补丁：界面树里没有节点 ${p.node}`);
      for(const cv of canvasesOf([p.with]))adoptCanvas(R,cv);
      ui=true;continue;
    }
    const C=R.canv[p.canvas];
    if(!C){log("host",R.key,`忽略补丁：没有画布 ${p.canvas}`);continue;}
    if(p.op==="scene"){
      let ok=true;
      walkTree(R.tree,(n,list,i)=>{if(n.type==="canvas"&&n.id===p.canvas){
        const v=validateCanvas(p.scene);if(!v.ok){fail(R,v.code,{...v.detail,count:v.count,bytes:v.bytes});ok=false;return false;}
        list[i]=p.scene;adoptCanvas(R,p.scene);return false;}});
      if(!ok)return false;
      ui=ui||p.scene.height!==C.el?.clientHeight;
      touched.add(p.canvas);continue;
    }
    const ref=R.idx[p.canvas]?.get(p.node);
    if(!ref){log("host",R.key,`忽略补丁：画布 ${p.canvas} 里没有节点 ${p.node}`);continue;}
    if(p.op==="set")Object.assign(ref.node,p.props);
    else if(p.op==="replace"){ref.list[ref.i]=p.with;}
    else if(p.op==="remove"){ref.list.splice(ref.i,1);}
    if(p.op!=="set"){const v=adoptCanvas(R,C.scene);if(!v.ok){fail(R,v.code,{...v.detail,count:v.count,bytes:v.bytes});return false;}}

  }

}
/* 插件主动推送：按节点合并，每秒最多应用 BUDGET.applyPerSec 次 */
function hostPush(R,res){
  if(!REG[R.key]||R.status!=="ready")return;
  CNT.recv++;R.rate.recv++;
  for(let p of res.patches||[]){
    let key;
    if(p.op==="set")key=`${p.canvas}/${p.node}`;
    else if(p.op==="scene"){key=`${p.canvas}/*`;for(const k of [...R.pushQ.keys()])if(k.startsWith(p.canvas+"/")){R.pushQ.delete(k);CNT.merged++;}}
    else key=`${p.op}/${p.canvas||""}/${p.node||""}/${Math.random()}`;
    if(R.pushQ.has(key)){CNT.merged++;const old=R.pushQ.get(key);if(p.op==="set")p={...p,props:{...old.props,...p.props}};}
    R.pushQ.set(key,p);
  }
  if(!R.flushT){
    const wait=Math.max(0,R.lastFlush+1000/BUDGET.applyPerSec-now());
    R.flushT=setTimeout(()=>{R.flushT=null;if(!REG[R.key])return;R.lastFlush=now();
      const ps=[...R.pushQ.values()];R.pushQ.clear();CNT.applied++;R.rate.applied++;
      const r=applyPatches(R,ps);if(r===false)return;
      if(r.ui)render();else{redrawAll(R);updateStatuses();schedPanel();}
      renderCounters();},wait);
  }
}
const FAIL_TEXT={

  bytes:d=>`插件画布被拒绝：场景有 ${fmt(Math.round(d.bytes/1024))} KB，超过上限 ${BUDGET.bytes/1024} KB。`,
  label:d=>`插件画布被拒绝：节点“${d.id}”可以点击，但没有 label（读屏软件读不出它是什么）。`,
  dup:d=>`插件画布被拒绝：节点 ID“${d.id}”重复。`,
  type:d=>`插件画布被拒绝：不支持的节点类型“${d.type}”。`,
  depth:()=>`插件画布被拒绝：分组嵌套超过 16 层。`,

const UIF='-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif';
const MONO='"SF Mono",Menlo,monospace';
const FONTS={title:["600",14,UIF],strong:["600",13,UIF],body:["400",13,UIF],caption:["400",11,UIF],display:["600",22,UIF],mono:["400",12,MONO],monoSmall:["400",10.5,MONO]};

function hitTest(C,x,y){
  const el=C.el;if(!el)return null;const ctx=el.getContext("2d");
  for(let i=C.hits.length-1;i>=0;i--){const h=C.hits[i];ctx.setTransform(h.m);if(ctx.isPointInPath(h.path,x*C.dpr,y*C.dpr)){ctx.setTransform(1,0,0,1,0,0);return h;}}
  ctx.setTransform(1,0,0,1,0,0);return null;
}

/* ---- 画布交互：全部在宿主本地处理，只有语义事件发回插件 ---- */
let tipT=null;
function showTip(text,x,y){const t=$("#tip");t.textContent=text;t.hidden=false;t.style.left=Math.min(x+14,innerWidth-370)+"px";t.style.top=(y+16)+"px";}
function hideTip(){clearTimeout(tipT);$("#tip").hidden=true;}
function bindCanvas(el){
  const [rk,cid]=el.dataset.cv.split("/");const R=REG[rk];if(!R)return;const C=R.canv[cid];if(!C)return;
  C.el=el;draw(C);
  const loc=e=>{const r=el.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
  el.onpointermove=e=>{
    const {x,y}=loc(e);
    if(C.drag){
      const dx=x-C.drag.x,dy=y-C.drag.y;if(!C.drag.moved&&Math.hypot(dx,dy)<3)return;
      C.drag.moved=true;C.view.tx=C.drag.tx+dx;C.view.ty=C.drag.ty+dy;CNT.pan++;hideTip();schedViewport(R,C);draw(C);renderCounters();return;
    }
    const h=hitTest(C,x,y),id=h?.id||null;
    if(id!==C.hover){
      C.hover=id;CNT.hover++;el.style.cursor=id?"pointer":(C.scene.pan?"grab":"default");hideTip();
      if(h?.tip){const cx=e.clientX,cy=e.clientY;tipT=setTimeout(()=>{if(C.hover===id){CNT.tip++;showTip(h.tip,cx,cy);renderCounters();}},350);}
      draw(C);updateStatus(R,C);renderCounters();
    }else if(id&&!$("#tip").hidden)showTip($("#tip").textContent,e.clientX,e.clientY);
  };
  el.onpointerdown=e=>{
    const {x,y}=loc(e);try{el.setPointerCapture(e.pointerId);}catch{}
    const h=hitTest(C,x,y);
    if(h){C.press=h.id;CNT.press++;draw(C);}
    else if(C.scene.pan){C.drag={x,y,tx:C.view.tx,ty:C.view.ty,moved:false};el.style.cursor="grabbing";}
    renderCounters();
  };
  el.onpointerup=e=>{
    const {x,y}=loc(e);
    if(C.press){const h=hitTest(C,x,y);const id=C.press;C.press=null;draw(C);if(h&&h.id===id)canvasClick(R,C,id);}
    if(C.drag){C.drag=null;el.style.cursor=C.hover?"pointer":(C.scene.pan?"grab":"default");}
  };
  el.onpointerleave=()=>{if(C.drag)return;if(C.hover){C.hover=null;draw(C);updateStatus(R,C);}hideTip();};
  el.onwheel=e=>{
    if(!(e.ctrlKey||e.metaKey)||!C.scene.zoom)return;  // 普通滚轮归设置页滚动
    e.preventDefault();const {x,y}=loc(e);zoomAt(R,C,x,y,Math.exp(-e.deltaY*0.01));
  };
  el.onfocus=()=>{if(!C.focus&&el.matches(":focus-visible")){const f=uniqHits(C)[0];if(f){C.focus=f.id;CNT.focus++;}}draw(C);updateStatus(R,C);};
  el.onblur=()=>{draw(C);updateStatus(R,C);};
  el.onkeydown=e=>{
    const list=uniqHits(C);
    if(e.key==="Tab"&&list.length){
      const i=list.findIndex(h=>h.id===C.focus);const j=e.shiftKey?i-1:i+1;
      if(j>=0&&j<list.length){e.preventDefault();C.focus=list[j].id;CNT.focus++;draw(C);updateStatus(R,C);renderCounters();}
      else C.focus=null;
    }else if((e.key==="Enter"||e.key===" ")&&C.focus){e.preventDefault();canvasClick(R,C,C.focus);}
    else if(e.key==="Escape"){C.focus=null;draw(C);updateStatus(R,C);}
  };
}
function uniqHits(C){const seen=new Set();return C.hits.filter(h=>!seen.has(h.id)&&seen.add(h.id));}
function zoomAt(R,C,px,py,f){
  const [z0,z1]=C.scene.zoom||[1,1];const k=clamp(C.view.k*f,z0/C.k0>0?z0:z0,z1);
  const r=k/C.view.k;if(r===1)return;
  C.view.tx=px-(px-C.view.tx)*r;C.view.ty=py-(py-C.view.ty)*r;C.view.k=k;CNT.zoom++;
  schedViewport(R,C);draw(C);updateStatus(R,C);renderCounters();
}
function schedViewport(R,C){
  if(!(C.scene.on||[]).includes("viewport"))return;
  clearTimeout(C.vpT);
  C.vpT=setTimeout(()=>{
    if(!REG[R.key]||R.status!=="ready"||!C.el)return;
    const s=C.k0*C.view.k,[vx,vy,vw,vh]=C.scene.viewBox;const cw=C.el.clientWidth,ch=C.scene.height;
    const ox=((cw-vw*C.k0)/2-vx*C.k0)*C.view.k+C.view.tx,oy=((ch-vh*C.k0)/2-vy*C.k0)*C.view.k+C.view.ty;
    call(R,{event:"viewport",canvas:C.id,rect:[f1(-ox/s),f1(-oy/s),f1(cw/s),f1(ch/s)],zoom:f1(C.view.k)});
  },BUDGET.viewportMs);
}
function canvasClick(R,C,id){
  if(R.status!=="ready")return;
  call(R,{event:"click",canvas:C.id,node:id});
}
function updateStatus(R,C){
  const el=document.getElementById(`cvs-${R.key}-${C.id}`);if(!el)return;
  const focused=C.el&&document.activeElement===C.el&&C.focus;
  const lab=id=>C.hits.find(h=>h.id===id)?.label||id;
  let left;
  if(focused)left=`焦点：${esc(lab(C.focus))} · Enter 选中，Tab 下一个`;
  else if(C.hover)left=esc(lab(C.hover));
  else left=C.scene.pan?"拖动空白处平移 · ⌘/Ctrl + 滚轮缩放 · Tab 键进入画布":"Tab 键进入画布，在可点击的节点间移动";
  const waiting=[...R.pending.values()].some(p=>now()-p.t0>BUDGET.slowMs);
  const push=R.rate.shownRecv?`<span>推送 ${R.rate.shownRecv}/s → 应用 ${R.rate.shownApplied}/s</span>`:"";
  el.innerHTML=`<span>${left}</span><i class="nb" data-note="9">9</i><span class="r">${push}${waiting?`<span class="wait">等待插件…</span>`:""}<span>节点 ${fmt(C.stats?.count||0)}</span>${C.scene.zoom?`<span>${Math.round(C.k0*C.view.k*100)}%</span>`:""}<i class="nb" data-note="2">2</i></span>`;
}
function updateStatuses(){for(const R of Object.values(REG))for(const C of Object.values(R.canv))updateStatus(R,C);}

/* ================= 描述模式界面树 → 宿主控件 ================= */
const info=t=>`<span class="info" tabindex="0" data-tip="${esc(t)}">ⓘ</span>`;
const nb=n=>`<i class="nb" data-note="${n}">${n}</i>`;
function renderTree(R,list){return (list||[]).map(n=>renderNode(R,n)).join("");}
function boundVal(n){return n.setting?eff(n.setting):n.value;}
function renderNode(R,n){
  const ui=`data-ui="${esc(n.id||"")}" ${n.setting?`data-setting="${esc(n.setting)}"`:""}`;
  switch(n.type){
    case "row":return `<div class="d-row">${renderTree(R,n.children)}</div>`;
    case "label":return `<span class="d-label ${n.tone||""}" ${n.width?`style="width:${n.width}px"`:""}>${esc(n.text)}${n.info?info(n.info):""}</span>`;
    case "textfield":return `<input class="inp ${n.mono?"mono":""}" ${ui} data-kind="text" value="${esc(n.value||"")}" placeholder="${esc(n.placeholder||"")}" style="${n.width==="fill"?"flex:1":`width:${(n.chars||20)*8}px`}">`;
    case "select":{const v=boundVal(n);return `<select class="inp" ${ui}>${n.options.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(v)?"selected":""}>${esc(l)}</option>`).join("")}</select>`;}
    case "segmented":{const v=boundVal(n);return `<span class="seg">${n.options.map(([k,l])=>`<button ${ui} data-val="${esc(k)}" class="${k===v?"on":""}">${esc(l)}</button>`).join("")}</span>`;}
    case "toggle":{const v=!!boundVal(n);return `<span class="d-tg"><button class="sw ${v?"on":""}" ${ui} data-kind="toggle" role="switch" aria-checked="${v}"></button>${n.label?`<span>${esc(n.label)}</span>`:""}${n.info?info(n.info):""}</span>`;}
    case "button":return `<button class="btn ${n.tone==="primary"?"pri":""} sm" ${ui}>${esc(n.text)}</button>`;
    case "keyvalue":return `<div class="kv">${n.items.map(([k,v,t])=>`<span class="k">${esc(k)}</span><span class="v ${t||""}">${esc(v)}</span>`).join("")}</div>`;
    case "table":return `<table class="tbl"><tr>${n.columns.map(([c,a])=>`<th style="${a==="end"?"text-align:right":""}">${esc(c)}</th>`).join("")}</tr>${n.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${n.columns[i][1]==="end"?"num":""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
    case "banner":return `<div class="banner ${n.tone||"info"}">${esc(n.text)}</div>`;
    case "section":return `<div class="d-sec">${n.title?`<div class="d-sec-h">${esc(n.title)}</div>`:""}${renderTree(R,n.children)}</div>`;
    case "setting":return settingRow(SETTING(n.setting));
    case "tool":{const t=TOOLS[n.tool];return `<div class="srow"><div class="lab">${esc(t.name)} ${info("这一项引用工具链里的工具，插件页不自己放选择框。改动请到工具链。")}</div><div class="ctl"><span class="mono">${esc(t.ver)} · ${esc(t.home)}</span><span class="tag">${esc(t.src)}</span><a class="link" data-act="toast" data-msg="演示：跳到工具链并选中 ${esc(t.name)}">在工具链中修改 ›</a></div></div>`;}
    case "canvas":return canvasHtml(R,n);
    default:return `<div class="faint">（宿主不认识的节点类型 ${esc(n.type)}，已跳过）</div>`;
  }
}
function settingRow(s){
  if(!s)return "";
  const v=eff(s.id),changed=s.id in DRAFT;
  let ctl;
  if(s.type==="bool")ctl=`<button class="sw ${v?"on":""}" data-setting="${s.id}" data-kind="toggle" role="switch" aria-checked="${!!v}"></button>`;
  else if(s.type==="enum")ctl=`<select class="inp" data-setting="${s.id}">${s.options.map(([k,l])=>`<option value="${esc(k)}" ${k===v?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
  else if(s.type==="number")ctl=`<input class="inp" type="number" data-setting="${s.id}" data-kind="number" value="${esc(v)}" min="${s.min}" max="${s.max}" style="width:90px">`;
  else ctl=`<input class="inp ${s.mono?"mono":""}" data-setting="${s.id}" data-kind="string" value="${esc(v)}" placeholder="${esc(s.placeholder||"")}" style="flex:1">`;
  const tag=changed?`<span class="tag blue">未应用</span>`:v===s.default?`<span class="tag">默认值</span>`:`<span class="tag">已修改</span>`;
  return `<div class="srow"><div class="lab">${esc(s.title)} ${s.description?info(s.description):""}</div><div class="ctl">${ctl}${tag}</div></div>`;
}
function canvasHtml(R,n){
  const C=R.canv[n.id];
  const tools=n.zoom?`<div class="cvtools"><button data-act="zoomOut" data-cv="${R.key}/${n.id}" title="缩小">−</button><span class="z" id="cvz-${R.key}-${n.id}"></span><button data-act="zoomIn" data-cv="${R.key}/${n.id}" title="放大">+</button><button data-act="zoomFit" data-cv="${R.key}/${n.id}" title="适应画布">适应</button>${nb(6)}</div>`:"";
  return `<div class="cvwrap"><canvas data-cv="${R.key}/${n.id}" tabindex="0" role="application" aria-label="${esc(n.label||"插件画布")}" style="height:${n.height}px"></canvas>${tools}</div><div class="cvstatus" id="cvs-${R.key}-${n.id}"></div>`;
}
function regionHtml(R){
  const p=R.plugin;
  const cap=`<span class="cap">插件内容区 · ${esc(p.name)} · 描述模式（可含画布节点），宿主按描述绘制 ${nb(1)}</span>`;
  if(R.status==="loading")return `<div class="region" data-region="${R.key}">${cap}<div class="skel" style="width:60%"></div><div class="skel"></div><div class="skel" style="height:220px"></div><div class="faint">正在等待插件返回界面…</div></div>`;
  if(R.status==="error"){
    return `<div class="region" data-region="${R.key}">${cap}
      <div class="banner err"><div><b>${esc(R.err.text)}</b><br>已改为显示插件在清单里声明的设置，窗口其他部分不受影响。</div><div class="acts"><button class="btn sm" data-act="retry" data-key="${R.key}">重试</button><button class="btn sm link" data-act="panel" data-p="log">查看消息</button>${nb(10)}</div></div>
      ${p.settings.map(settingRow).join("")}</div>`;
  }
  return `<div class="region" data-region="${R.key}">${cap}${renderTree(R,R.tree)}</div>`;
}

/* ================= 插件后端（模拟插件进程：只认 JSON 消息，不碰宿主状态） ================= */
const BACKENDS={};

/* ---- 1. Maven 依赖图：全部用主题 token，跟随深浅色 ---- */
const DEPS=[
  // id, groupId, artifactId, version, parent, scope, winner（被谁取代）, reason
  ["app","com.example","app","1.0.0",null,"compile"],
  ["web","org.springframework.boot","spring-boot-starter-web","3.3.1","app","compile"],
  ["libb","com.example","lib-b","1.8.0","app","compile"],
  ["jdb","com.fasterxml.jackson.core","jackson-databind","2.17.1","app","compile"],
  ["liba","com.example","lib-a","2.4.0","app","compile"],
  ["pg","org.postgresql","postgresql","42.7.3","app","runtime"],
  ["junit","org.junit.jupiter","junit-jupiter","5.10.2","app","test"],
  ["mockito","org.mockito","mockito-core","5.11.0","app","test"],
  ["mvc","org.springframework","spring-webmvc","6.1.10","web","compile"],
  ["tomcat","org.apache.tomcat.embed","tomcat-embed-core","10.1.25","web","compile"],
  ["guava32","com.google.guava","guava","32.1.2-jre","libb","compile"],
  ["slf4j","org.slf4j","slf4j-api","2.0.13","libb","compile"],
  ["jcore","com.fasterxml.jackson.core","jackson-core","2.17.1","jdb","compile"],
  ["guava31","com.google.guava","guava","31.1-jre","liba","compile","guava32","深度相同，先声明的 lib-b 优先"],
  ["lang3","org.apache.commons","commons-lang3","3.14.0","liba","compile"],
  ["jcore215","com.fasterxml.jackson.core","jackson-core","2.15.4","liba","compile","jcore","深度相同，先声明的 jackson-databind 优先"],
  ["bytebuddy","net.bytebuddy","byte-buddy","1.14.12","mockito","test"],
  ["score","org.springframework","spring-core","6.1.10","mvc","compile"],
  ["fa","com.google.guava","failureaccess","1.0.2","guava32","compile"],
].map(([id,g,a,v,parent,scope,winner,reason])=>({id,g,a,v,parent,scope,winner,reason}));
const DEP=Object.fromEntries(DEPS.map(d=>[d.id,d]));
const SCOPES={compile:["compile"],runtime:["compile","runtime"],test:["compile","runtime","test"]};
function depsVisible(st){
  const ok=new Set();
  for(const d of DEPS){if(!SCOPES[st.scope].includes(d.scope))continue;if(st.excluded[d.id])continue;if(d.parent&&!ok.has(d.parent))continue;ok.add(d.id);}
  return DEPS.filter(d=>ok.has(d.id));
}
const ancestors=id=>{const out=[];let c=DEP[id];while(c){out.push(c.id);c=c.parent&&DEP[c.parent];}return out;};
function depsLayout(list){
  const kids={};for(const d of list)if(d.parent)(kids[d.parent]||(kids[d.parent]=[])).push(d.id);
  const pos={};let row=0;
  const lvl=id=>ancestors(id).length-1;
  const place=id=>{const ch=kids[id]||[];if(!ch.length){pos[id]={x:24+lvl(id)*236,y:14+row*50};row++;return pos[id].y;}
    const ys=ch.map(place);pos[id]={x:24+lvl(id)*236,y:(ys[0]+ys[ys.length-1])/2};return pos[id].y;};
  place("app");
  return {pos,rows:row,kids};
}
function depsScene(st){
  const list=depsVisible(st);const {pos,rows}=depsLayout(list);
  const W=24+3*236+196+24,Hh=Math.max(14+rows*50,200);
  const edges=[],nodes=[];
  const path=new Set(st.sel?ancestors(st.sel):[]);
  for(const d of list){
    const p=pos[d.id];
    if(d.parent){const q=pos[d.parent];const x1=q.x+190,y1=q.y+20,x2=p.x,y2=p.y+20;
      edges.push({id:"e:"+d.id,type:"path",d:`M${x1} ${y1}C${x1+44} ${y1} ${x2-44} ${y2} ${x2} ${y2}`,
        stroke:path.has(d.id)?"$accent":d.winner?"$err":"$line",width:path.has(d.id)?2.5:1.5,dash:d.winner?[4,3]:null});}
    const root=d.id==="app",omit=!!d.winner;
    const node={id:d.id,type:"group",x:p.x,y:p.y,w:190,h:40,radius:8,on:["click"],
      label:`${d.g}:${d.a} ${d.v}${omit?"，因冲突未使用":""}`,
      tooltip:`${d.g}:${d.a}:${d.v}\n范围：${d.scope}${omit?`\n未使用：被 ${DEP[d.winner].v} 取代`:""}`,
      hover:root?{shadow:2}:{fill:"$hover"},pressed:{scale:.97},sel:{stroke:"$accent",width:2},selected:st.sel===d.id,
      children:[
        {type:"rect",w:190,h:40,radius:8,fill:root?{linear:[[0,"$accent"],[1,{light:"#7b5cf0",dark:"#8f78f5"}]],angle:0}:omit?{light:"#fdf0ef",dark:"#3a2726"}:"$surface",
          stroke:root?null:omit?"$err":"$line",width:1,dash:omit?[4,3]:null,shadow:root?1:0},
        {type:"text",x:12,y:13,text:d.g,style:"caption",color:root?"rgba(255,255,255,.8)":"$sub",maxWidth:168},
        {type:"text",x:12,y:28,style:"strong",maxWidth:168,runs:[{text:d.a,color:root?"#ffffff":"$text"},{text:"  "+d.v,color:root?"rgba(255,255,255,.85)":omit?"$err":"$sub"}]},
      ]};
    if(st.fault==="label"&&d.id==="libb")delete node.label;     // 故障演示：可点节点没写 label
    nodes.push(node);
  }
  const all=[...edges,...nodes];
  if(st.fault==="budget"){                                     // 故障演示：插件把 6,000 个点塞进画布
    const g={type:"group",x:0,y:0,children:[]};
    for(let i=0;i<6000;i++)g.children.push({type:"rect",x:(i%100)*9.4,y:Math.floor(i/100)*7,w:2,h:2,fill:"$line"});
    all.unshift(g);
  }
  return {type:"canvas",id:"deps",label:"依赖图",height:Math.min(440,Math.max(300,Hh*0.92)),viewBox:[0,0,W,Hh],pan:true,zoom:[0.4,3],on:["viewport"],nodes:all};
}
function depsRelevant(st,d){
  if(st.conflicts){const hot=new Set();for(const x of DEPS)if(x.winner){ancestors(x.id).forEach(i=>hot.add(i));ancestors(x.winner).forEach(i=>hot.add(i));}if(!hot.has(d.id))return false;}
  if(st.q){const q=st.q.toLowerCase();if(!`${d.g}:${d.a}`.toLowerCase().includes(q)&&d.id!=="app")return false;}
  return true;
}
function depsDim(st){
  const out=[];
  for(const d of depsVisible(st)){const o=depsRelevant(st,d)?1:.22;out.push({op:"set",canvas:"deps",node:d.id,props:{opacity:o}});if(d.parent)out.push({op:"set",canvas:"deps",node:"e:"+d.id,props:{opacity:o}});}
  return out;
}
function depsDetail(st){
  const d=st.sel&&DEP[st.sel];
  if(!d)return {type:"section",id:"detail",title:"构件详情",children:[{type:"label",tone:"sub",text:"点击图中的构件查看引入路径。红色虚线框是因版本冲突没有被使用的构件。"}]};
  const path=ancestors(d.id).reverse().map(id=>`${DEP[id].a} ${DEP[id].v}`).join(" → ");
  const items=[["坐标",`${d.g}:${d.a}:${d.v}`],["范围",d.scope],["引入路径",path]];
  if(d.winner)items.push(["状态",`未使用：与 ${DEP[d.winner].v} 冲突，${d.reason}`,"warn"]);
  else items.push(["状态",d.id==="app"?"当前项目":"已使用","ok"]);
  const ch=[{type:"keyvalue",items}];
  if(d.winner){
    if(st.write&&st.write.dep===d.id)ch.push({type:"banner",tone:"info",text:`已加入待应用：点窗口底部的“应用”后，插件在 app/pom.xml 的 ${DEP[d.parent].a} 依赖里加上排除项。`});
    else ch.push({type:"row",children:[{type:"button",id:"exclude",text:`在 ${DEP[d.parent].a} 中排除 ${d.a} ${d.v}`},{type:"button",id:"gotoWinner",text:`查看被选用的 ${DEP[d.winner].v}`}]});
  }
  return {type:"section",id:"detail",title:"构件详情",children:ch};
}
function depsSelect(st,id){
  st.sel=id;const path=new Set(ancestors(id));const out=[];
  for(const d of depsVisible(st)){
    out.push({op:"set",canvas:"deps",node:d.id,props:{selected:d.id===id}});
    if(d.parent)out.push({op:"set",canvas:"deps",node:"e:"+d.id,props:{stroke:path.has(d.id)?"$accent":d.winner?"$err":"$line",width:path.has(d.id)?2.5:1.5}});
  }
  out.push({op:"ui",node:"detail",with:depsDetail(st)});
  return {patches:out};
}
function depsTree(st){

    if(st.fault==="budget")for(let i=0;i<3000;i++)tree[1].nodes.push({type:"path",d:`M${i%820} 0V1`,stroke:"transparent"});
    return {tree};},
  handle(st,msg,ctx){
    if(msg.event==="click"&&msg.canvas==="builds"){const n=+msg.node.slice(2);if(st.run&&n===st.run.n)return {};st.sel=st.sel===n?null:n;
      return {patches:[...buildWindow(st).map(b=>({op:"set",canvas:"builds",node:"b:"+b.n,props:{opacity:st.sel&&st.sel!==b.n?.35:1}})),{op:"ui",node:"bdetail",with:buildDetail(st)}]};}
    if(msg.event==="change"&&msg.node==="range"){st.range=+msg.value;return {patches:[{op:"scene",canvas:"builds",scene:buildScene(st)}]};}
    if(msg.event==="change"&&msg.node==="live"){
      if(msg.value)startLive(st,ctx);else{st.live=false;st.run=null;ctx.clearTimers();}
      return {patches:[{op:"scene",canvas:"builds",scene:buildScene(st)}]};}
    return {};
  },
  close(st,ctx){st.live=false;ctx.clearTimers();},
};

function navHtml(){
  if(S.navq.trim()){
    const q=S.navq.trim().toLowerCase();const hits=[];
    for(const [pk,p] of Object.entries(PAGES)){
      if(p.title.toLowerCase().includes(q)||p.crumb.join(" ").toLowerCase().includes(q))hits.push({pk,contrib:null,why:"页面名称"});
      for(const c of p.contributors){const kw=PL[c].keywords.find(k=>k.toLowerCase().includes(q));if(kw)hits.push({pk,contrib:c,why:`${PL[c].name} 的关键词“${kw}”`});}
    }
    if(!hits.length)return `<div class="faint" style="padding:10px">没有匹配的设置页。画布里的文字不参与搜索，插件页靠清单里的关键词被搜到。</div>`;
    return hits.map(h=>`<div class="hit" data-goto="${h.pk}" ${h.contrib?`data-contrib="${h.contrib}"`:""}><div>${esc(PAGES[h.pk].crumb.join(" › "))}</div><div class="k">${esc(h.why)}</div></div>`).join("");
  }
  const rows=[];
  const walk=(items,l)=>{for(const [id,label,kids] of items){
    const has=!!kids,open=S.open[id];
    rows.push(`<div class="r l${l} ${S.page===id?"sel":""}" data-nav="${id}" ${has?`data-fold="${id}"`:""}><span class="chev">${has?(open?"▾":"▸"):""}</span>${esc(label)}</div>`);

  }};
  walk(NAV,0);return rows.join("");
}

function go(page,contrib){
  if(!PAGES[page]){toast("原型只覆盖三个示例页：Maven、Gradle 和 Dusk 配色主题");return;}
  const old=REG[visibleRegion()]?visibleRegion():null;
  S.page=page;if(contrib)S.contrib[page]=contrib;

function regionOf(el){const k=el.closest("[data-region]")?.dataset.region;return k&&REG[k];}
function uiEvent(el,value){
  const R=regionOf(el),settingId=el.dataset.setting||null,id=el.dataset.ui||null;
  if(settingId){setDraft(settingId,value);}
  if(R&&R.status==="ready"&&id){
    walkTree(R.tree,n=>{if(n.id===id){if(!n.setting)n.value=value;return false;}});
    call(R,{event:"change",node:id,setting:settingId,value});
  }
  render();
}

    else if(a==="zoomIn"||a==="zoomOut"||a==="zoomFit"){
      const [rk,cid]=act.dataset.cv.split("/");const R=REG[rk],C=R?.canv[cid];if(!C)return;
      if(a==="zoomFit"){C.view={k:1,tx:0,ty:0};CNT.zoom++;schedViewport(R,C);draw(C);}
      else zoomAt(R,C,C.el.clientWidth/2,C.scene.height/2,a==="zoomIn"?1.25:0.8);
      const z=document.getElementById(`cvz-${rk}-${cid}`);if(z)z.textContent=`${Math.round(C.k0*C.view.k*100)}%`;
    }
    return;
  }
  const sw=t.closest(".sw[data-kind=toggle]");
  if(sw){const v=!sw.classList.contains("on");uiEvent(sw,v);return;}
  const seg=t.closest(".seg button[data-ui]");
  if(seg){uiEvent(seg,seg.dataset.val);return;}
  const btn=t.closest("button.btn[data-ui]");
  if(btn){onRegionClick(btn);return;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.matches("select[data-ui],select[data-setting]")){uiEvent(t,t.value);return;}
  if(t.matches("input[data-kind=number]")){uiEvent(t,+t.value);return;}
  if(t.matches("input[data-kind=string]")){uiEvent(t,t.value);return;}
});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(e.key==="Enter"&&t.matches("input[data-kind=text]")){commitText(t);}
});
document.addEventListener("focusout",e=>{if(e.target.matches?.("input[data-kind=text]"))commitText(e.target);});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="navq"){S.navq=t.value;$("#nav").innerHTML=navHtml();return;}
  if(t.matches("input[data-kind=text]")){const R=regionOf(t);if(R)walkTree(R.tree,n=>{if(n.id===t.dataset.ui){n.pending=t.value;return false;}});}
});
function commitText(t){
  const R=regionOf(t);if(!R||R.status!=="ready")return;
  let node=null;walkTree(R.tree,n=>{if(n.id===t.dataset.ui){node=n;return false;}});
  if(!node||node.committed===t.value||(node.committed===undefined&&(node.value||"")===t.value))return;
  node.committed=t.value;node.value=t.value;
  call(R,{event:"change",node:node.id,value:t.value});
}
document.addEventListener("mouseover",e=>{const i=e.target.closest?.("[data-tip]");if(i){const r=i.getBoundingClientRect();showTip(i.dataset.tip,r.left,r.bottom-8);}});
document.addEventListener("mouseout",e=>{if(e.target.closest?.("[data-tip]"))hideTip();});
document.addEventListener("focusin",e=>{const i=e.target.closest?.("[data-tip]");if(i){const r=i.getBoundingClientRect();showTip(i.dataset.tip,r.left,r.bottom-8);}});
document.addEventListener("focusout",e=>{if(e.target.closest?.("[data-tip]"))hideTip();});
window.addEventListener("resize",()=>{for(const R of Object.values(REG))redrawAll(R);});

function applyAll(close){
  if(S.applying)return;
  const ds={...DRAFT},ws=[...WRITES];
  if(!Object.keys(ds).length&&!ws.length){if(close)toast("演示：关闭设置窗口");return;}
  S.applying=true;render();
  setTimeout(()=>{
    // Core 按清单校验：类型、取值范围、只能写本插件声明过的 ID
    const bad=Object.entries(ds).filter(([id,v])=>{const s=SETTING(id);if(!s)return true;if(s.type==="enum")return !s.options.some(o=>o[0]===v);if(s.type==="number")return !(v>=s.min&&v<=s.max);if(s.type==="bool")return typeof v!=="boolean";return typeof v!=="string";});
    if(bad.length){S.applying=false;toast(`Core 拒绝写入：${bad.map(b=>SETTING(b[0])?.title||b[0]).join("、")} 的值不合法，草稿已保留`);render();return;}
    for(const [id,v] of Object.entries(ds)){SAVED[id]=v;delete DRAFT[id];}
    const owners=new Set(ws.map(w=>w.owner));
    for(const o of owners){const R=REG[o];if(R&&R.status==="ready")call(R,{event:"apply",writes:ws.filter(w=>w.owner===o).map(w=>w.id)});else{for(const w of ws.filter(x=>x.owner===o))WRITES.splice(WRITES.indexOf(w),1);}}
    log("host","core",`Core 校验并写入 ${Object.keys(ds).length} 项插件设置${ws.length?`；请插件执行 ${ws.length} 项写入`:""}`);
    S.applying=false;
    toast(ws.length?"已应用：插件写入完成后会重新读取，界面显示读取到的结果":"已应用：Core 校验通过并写入");
    if(close)setTimeout(()=>toast("演示：关闭设置窗口"),900);
    render();
  },600);
}
function cancelAll(){
  const ds=Object.keys(DRAFT);for(const id of ds)delete DRAFT[id];
  for(const id of ds){const R=REG[OWNER(id)];if(R&&R.status==="ready"){
    let bound=null;walkTree(R.tree,n=>{if(n.setting===id&&n.id){bound=n;return false;}});
    if(bound)call(R,{event:"change",node:bound.id,setting:id,value:SAVED[id]});}}
  const ws=[...WRITES];WRITES.length=0;
  const owners=new Set(ws.map(w=>w.owner));
  for(const o of owners){const R=REG[o];if(R&&R.status==="ready")call(R,{event:"discard",writes:ws.filter(w=>w.owner===o).map(w=>w.id)});}
  render();
}

/* 地址参数里的 click / tip，只用于截图 */
function hashActions(R){
  const doClick=H.click&&H.click.split(":")[0];
  if(doClick&&R.canv[doClick]){const id=H.click.slice(doClick.length+1);setTimeout(()=>canvasClick(R,R.canv[doClick],id),30);}
  const tipCv=H.tip&&H.tip.split(":")[0];
  if(tipCv&&R.canv[tipCv]){const id=H.tip.slice(tipCv.length+1);setTimeout(()=>{const C=R.canv[tipCv];const h=C.hits.find(x=>x.id===id);if(!h||!C.el)return;
    const [x,y,w,hh]=h.bbox;const p=h.m.transformPoint(new DOMPoint(x+w/2,y+hh*0.55));const r=C.el.getBoundingClientRect();
    C.hover=id;draw(C);updateStatus(R,C);showTip(h.tip,r.left+p.x/C.dpr,r.top+p.y/C.dpr);},120);}
}

/* ================= 启动 ================= */
$("#optDark").checked=S.dark;$("#optLat").value=String(S.lat);$("#optFault").value=S.fault;$("#optPanel").value=S.panel;
$("#optDark").onchange=e=>{S.dark=e.target.checked;render();};
$("#optLat").onchange=e=>{S.lat=+e.target.value;};
$("#optFault").onchange=e=>{S.fault=e.target.value;retry(visibleRegion());toast(S.fault==="none"?"已恢复正常，重新打开插件区域":"已重新打开插件区域，看框里的变化");};
$("#optPanel").onchange=e=>{S.panel=e.target.value;render();};
if(!PAGES[S.page])S.page="maven";
openRegion(visibleRegion());
render();
</script>
