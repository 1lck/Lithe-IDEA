name: Prepare verified macOS dependency caches
description: Restore, validate, and safely fall back from repository-scoped macOS dependency caches.

inputs:
  swiftpm:
    description: Restore and resolve SwiftPM dependency repositories.
    required: false
    default: "false"
  cargo:
    description: Restore Cargo crate archives.
    required: false
    default: "false"
  cargo-build:
    description: Cache macOS Rust compilation outputs in addition to crate archives.
    required: false
    default: "false"
  cargo-build-architecture:
    description: Partition compilation caches by arm64, x86_64, or universal packaging.
    required: false
    default: "universal"
  restore-only:
    description: Restore caches without saving them at the end of the job. Cargo compilation outputs are always restore-only here; save them with save-macos-cargo-build-cache.
    required: false
    default: ${{ github.event_name == 'pull_request' }}

outputs:
  cargo-build-key:
    description: Exact Cargo compilation cache key for save-macos-cargo-build-cache.
    value: ${{ steps.cargo_build_key.outputs.key }}
  cargo-build-hit:
    description: Whether the exact Cargo compilation cache key was restored.
    value: ${{ steps.cargo_build.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Configure isolated dependency caches
      shell: zsh {0}
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.artifacts"
        {
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.artifacts/cargo-home"
          echo "LITHE_SWIFTPM_CACHE_PATH=$GITHUB_WORKSPACE/.artifacts/swiftpm-cache"
        } >> "$GITHUB_ENV"

    - name: Restore SwiftPM repositories
      id: swiftpm_cache
      if: inputs.swiftpm == 'true' && inputs.restore-only != 'true'
      continue-on-error: true
      uses: actions/cache@v6
      with:
        path: |
          .artifacts/swiftpm-cache/repositories
          .artifacts/swiftpm-cache/.lithe-integrity.json
        key: macos-swiftpm-repositories-${{ runner.os }}-${{ hashFiles('.swift-version') }}-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          macos-swiftpm-repositories-${{ runner.os }}-${{ hashFiles('.swift-version') }}-

    - name: Restore SwiftPM repositories without saving
      id: swiftpm_restore
      if: inputs.swiftpm == 'true' && inputs.restore-only == 'true'
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        path: |
          .artifacts/swiftpm-cache/repositories
          .artifacts/swiftpm-cache/.lithe-integrity.json
        key: macos-swiftpm-repositories-${{ runner.os }}-${{ hashFiles('.swift-version') }}-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          macos-swiftpm-repositories-${{ runner.os }}-${{ hashFiles('.swift-version') }}-

    - name: Restore Cargo crate archives
      id: cargo_cache
      if: inputs.cargo == 'true' && inputs.restore-only != 'true'
      continue-on-error: true
      uses: actions/cache@v6
      with:
        path: .artifacts/cargo-home/registry/cache
        key: macos-cargo-crates-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          macos-cargo-crates-${{ runner.os }}-

    - name: Restore Cargo crate archives without saving
      id: cargo_restore
      if: inputs.cargo == 'true' && inputs.restore-only == 'true'
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        path: .artifacts/cargo-home/registry/cache
        key: macos-cargo-crates-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
        restore-keys: |
          macos-cargo-crates-${{ runner.os }}-

    - name: Validate restored caches or fall back
      shell: zsh {0}
      env:
        RESTORE_ONLY: ${{ inputs.restore-only }}
        SWIFTPM_CACHE_OUTCOME: ${{ steps.swiftpm_cache.outcome }}
        SWIFTPM_CACHE_HIT: ${{ steps.swiftpm_cache.outputs.cache-hit }}
        SWIFTPM_RESTORE_OUTCOME: ${{ steps.swiftpm_restore.outcome }}
        SWIFTPM_RESTORE_HIT: ${{ steps.swiftpm_restore.outputs.cache-hit }}
        CARGO_CACHE_OUTCOME: ${{ steps.cargo_cache.outcome }}
        CARGO_RESTORE_OUTCOME: ${{ steps.cargo_restore.outcome }}
      run: |
        swiftpm_outcome="$SWIFTPM_CACHE_OUTCOME"
        swiftpm_hit="$SWIFTPM_CACHE_HIT"
        cargo_outcome="$CARGO_CACHE_OUTCOME"
        if [[ "$RESTORE_ONLY" == "true" ]]; then
          swiftpm_outcome="$SWIFTPM_RESTORE_OUTCOME"
          swiftpm_hit="$SWIFTPM_RESTORE_HIT"
          cargo_outcome="$CARGO_RESTORE_OUTCOME"
        fi
        "$GITHUB_WORKSPACE/scripts/macos/prepare/validate-macos-dependency-caches.sh" \
          --swiftpm-enabled "${{ inputs.swiftpm }}" \
          --swiftpm-outcome "${swiftpm_outcome:-skipped}" \
          --swiftpm-hit "${swiftpm_hit:-}" \
          --cargo-enabled "${{ inputs.cargo }}" \
          --cargo-outcome "${cargo_outcome:-skipped}"

    - name: Resolve SwiftPM dependencies with fallback
      if: inputs.swiftpm == 'true'
      shell: zsh {0}
      run: "$GITHUB_WORKSPACE/scripts/macos/prepare/prepare-macos-dependencies.sh"

    - name: Resolve Cargo compilation cache identity
      id: cargo_build_identity
      if: inputs.cargo-build == 'true'
      shell: bash
      env:
        BUILD_ARCHITECTURE: ${{ inputs.cargo-build-architecture }}
      run: |
        case "$BUILD_ARCHITECTURE" in
          arm64|x86_64|universal) ;;
          *) echo "Unsupported Cargo cache architecture: $BUILD_ARCHITECTURE" >&2; exit 2 ;;
        esac
        identity=$({
          rustc -Vv
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          sw_vers -productVersion
          printf '%s\n' "${MACOSX_DEPLOYMENT_TARGET:-13.0}" "${RUSTFLAGS:-}"
        } | shasum -a 256 | cut -d ' ' -f 1)
        echo "identity=$identity" >> "$GITHUB_OUTPUT"

    - name: Resolve Cargo compilation cache key
      id: cargo_build_key
      if: inputs.cargo-build == 'true'
      shell: bash
      env:
        KEY_PREFIX: macos-cargo-build-v1-${{ runner.arch }}-${{ steps.cargo_build_identity.outputs.identity }}
        BUILD_ARCHITECTURE: ${{ inputs.cargo-build-architecture }}
        SOURCE_HASH: ${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml', 'rust/.cargo/**', 'scripts/rust-core/build-rust-core.sh', 'scripts/ide-mcp/build-ide-mcp.sh') }}
      run: |
        echo "prefix=$KEY_PREFIX" >> "$GITHUB_OUTPUT"
        echo "key=$KEY_PREFIX-$BUILD_ARCHITECTURE-$SOURCE_HASH" >> "$GITHUB_OUTPUT"

    # Restore only: saving happens in save-macos-cargo-build-cache, which runs
    # with always() so a timed-out or superseded build still keeps its progress.
    # actions/cache's post step is skipped on failure, which let one cold build
    # time out, save nothing, and leave every following build cold as well.
    - name: Restore Cargo compilation outputs
      id: cargo_build
      if: inputs.cargo-build == 'true'
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        # Core uses target/macos; the MCP helper uses target directly. Include
        # both layouts, while leaving final executables for Cargo to regenerate.
        path: |
          rust/target/**/.fingerprint
          rust/target/**/build
          rust/target/**/deps
        # The primary key also prefix-matches partial saves of the same sources.
        # A universal build falls back to a single-slice cache, which still
        # covers half of its Rust work after the universal entry was evicted.
        # Single-slice builds do not fall back to the other slice, whose
        # target outputs they cannot use. actions/cache drops the empty lines.
        key: ${{ steps.cargo_build_key.outputs.key }}
        restore-keys: |
          ${{ steps.cargo_build_key.outputs.prefix }}-${{ inputs.cargo-build-architecture }}-
          ${{ steps.cargo_build_key.outputs.prefix }}-universal-
          ${{ inputs.cargo-build-architecture == 'universal' && format('{0}-arm64-', steps.cargo_build_key.outputs.prefix) || '' }}
          ${{ inputs.cargo-build-architecture == 'universal' && format('{0}-x86_64-', steps.cargo_build_key.outputs.prefix) || '' }}

    # save-macos-cargo-build-cache compares fingerprints against this marker so
    # a job that fails before compiling any Rust does not store a duplicate.
    - name: Mark restored Cargo compilation outputs
      if: inputs.cargo-build == 'true'
      shell: bash
      run: touch "$RUNNER_TEMP/lithe-cargo-build-restored"

    - name: Discard incomplete Cargo compilation cache
      if: inputs.cargo-build == 'true' && steps.cargo_build.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Cargo compilation cache restore failed; rebuilding from verified crate archives."
        rm -rf -- "$GITHUB_WORKSPACE/rust/target"
