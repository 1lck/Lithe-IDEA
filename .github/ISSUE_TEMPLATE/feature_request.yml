name: Feature request / 功能建议
description: Suggest an improvement or a new capability / 建议改进现有能力或增加新功能
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Lithe.
        感谢你参与 Lithe 的功能设计。

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 要解决的问题
      description: What workflow is difficult or missing today? / 当前哪个工作流不方便，或缺少什么能力？
      placeholder: Describe the user problem and its impact. / 请描述用户遇到的问题及其影响。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
      description: Describe the behavior or workflow you would like to see. / 请描述希望看到的行为或操作流程。
      placeholder: |
        I would like Lithe to ...
        我希望 Lithe 能够……
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Target platform / 目标平台
      options:
        - macOS
        - Windows
        - Cross-platform / 跨平台
        - Other / 其他
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area / 模块
      options:
        - Editor / 编辑器
        - Language support / 语言服务
        - Maven
        - Run / 运行
        - Debug / 调试
        - Test / 测试
        - Terminal / 终端
        - Git
        - GitHub
        - Project and workspace / 项目与工作区
        - Search / 搜索
        - Extensions / 扩展
        - Settings / 设置
        - Database / 数据库
        - Docker
        - Remote and WSL / 远程与 WSL
        - AI
        - UI and layout / 界面与布局
        - Other / 其他
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority / 优先级
      description: Choose the urgency that best matches the user impact. / 请选择最符合当前使用影响的紧急程度。
      options:
        - "P0 / 立即处理：已严重影响使用体验，核心流程受阻或无法正常使用"
        - "P1 / 尽快处理：使用体验大幅下降，但通常仍可继续使用"
        - "P2 / 后续考虑：目前不着急，可安排到后续版本"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 已考虑的替代方案
      description: Mention workarounds or how other tools handle this, if relevant. / 如有相关信息，请说明当前的替代做法或其他工具的处理方式。

  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
      description: Add examples, screenshots, links, or implementation context. / 可附上示例、截图、链接或实现背景。

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist / 提交前检查
      options:
        - label: I searched existing issues for duplicates. / 我已搜索现有 Issue，确认没有重复建议。
          required: true
