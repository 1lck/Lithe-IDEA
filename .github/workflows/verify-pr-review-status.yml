name: Verify PR review status automation

on:
  pull_request:
    paths:
      - ".github/workflows/lithe-pr-review-status.yml"
      - ".github/workflows/lithe-pr-review-status-observer.yml"
      - ".github/workflows/verify-pr-review-status.yml"
      - "scripts/pr-review-status.mjs"
      - "scripts/test-lithe-pr-review-status.mjs"
  push:
    branches: [main, preview]
    paths:
      - ".github/workflows/lithe-pr-review-status.yml"
      - ".github/workflows/lithe-pr-review-status-observer.yml"
      - ".github/workflows/verify-pr-review-status.yml"
      - "scripts/pr-review-status.mjs"
      - "scripts/test-lithe-pr-review-status.mjs"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Test PR review status decisions and workflow safety
        run: node --test --test-timeout=10000 scripts/test-lithe-pr-review-status.mjs
