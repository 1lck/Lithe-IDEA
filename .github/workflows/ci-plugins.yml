# Registered by the standalone preview repository.
name: macOS Plugin CI

on:
  pull_request:
    # ready_for_review reruns the deferred runner lane after a draft is ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  # The classify job reads active jobs to choose a macOS runner pool.
  actions: read

concurrency:
  group: macos-plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.classify.outputs.plugins }}
      macos_runners: ${{ steps.runners.outputs.runners }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "manual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$PUSH_BASE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          fi
          {
            echo "manual=false"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        env:
          MANUAL: ${{ steps.base.outputs.manual }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          LITHE_CI_DRAFT_PULL_REQUEST: ${{ github.event.pull_request.draft == true }}
        shell: bash
        run: |
          if [[ "$MANUAL" == "true" ]]; then
            echo "plugins=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ./scripts/classify-ci-changes.sh "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Choose macOS runner
        id: runners
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LITHE_MACOS_LANES: ${{ steps.classify.outputs.plugins == 'true' && 'plugins' || '' }}
        shell: bash
        run: node scripts/select-macos-ci-runners.mjs

      - name: Summarize selected lanes
        shell: bash
        env:
          PLUGINS: ${{ steps.classify.outputs.plugins }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          {
            echo "### Plugin CI lanes"
            echo "| Lane | Run |"
            echo "| --- | --- |"
            echo "| Plugin tests and package verification | $PLUGINS |"
            if [[ "$DRAFT" == "true" ]]; then
              echo ""
              echo "Draft pull request: the macOS plugin lane is deferred until it is marked ready for review."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  plugin-tests:
    name: Plugin tests and package verification
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.macos_runners).plugins }}
    timeout-minutes: 55

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # Self-hosted runners keep their build outputs between jobs; the
          # runner preparation step removes every other untracked file.
          clean: ${{ runner.environment != 'self-hosted' }}

      - name: Prepare shared Mac mini runner
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/prepare-macos-ci-runner

      - name: Set up Swift 6.3.3 and Xcode
        uses: ./.github/actions/setup-macos-toolchain

      # test-macos.sh links Rust Core; install it explicitly on every runner pool.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare verified SwiftPM cache
        uses: ./.github/actions/prepare-macos-dependency-cache
        with:
          swiftpm: "true"
          cargo: "true"
          # Java Support is assembled from the pinned JDT LS and JDK.
          jdtls: "true"
          jdk: "true"
          jdk-architecture: arm64

      # Compile and discover tests before starting the test execution deadline.
      - name: Build Swift tests
        timeout-minutes: 20
        run: ./scripts/test-macos.sh list > /dev/null

      - name: Run plugin-focused Swift tests
        timeout-minutes: 17
        run: ./.agents/skills/write-stable-tests/scripts/test-stability-macos.sh --report .artifacts/test-stability/macos-plugins.json --suite-timeout-seconds 960 -- --skip-build --filter '([Pp]lugin|LanguageExtensionProcessLifecycleTests|LanguageServerToolServiceTests|LinuxDo)'

      - name: Build and verify official plugin packages
        timeout-minutes: 10
        run: ./scripts/verify-official-plugins.sh

      - name: Generate combined plugin test report
        if: always()
        run: node .agents/skills/write-stable-tests/scripts/generate-test-report.mjs

      - name: Upload plugin test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stability-plugins
          path: .artifacts/test-stability/
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Plugin CI gate
    needs:
      - changes
      - plugin-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PLUGIN_SELECTED: ${{ needs.changes.outputs.plugins }}
          PLUGIN_RESULT: ${{ needs.plugin-tests.result }}
        shell: bash
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]
          if [[ "$PLUGIN_SELECTED" == "true" ]]; then
            [[ "$PLUGIN_RESULT" == "success" ]]
          else
            [[ "$PLUGIN_RESULT" == "skipped" ]]
          fi
