name: Verify Structured Logging

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".gitattributes"
      - "shared/logging/**"
      - "scripts/logging/**"
      - "macos/Sources/**"
      - "rust/lithe-core/src/**"
      - ".agents/skills/write-stable-tests/scripts/**"
      - ".github/workflows/verify-logging.yml"
      - "!**/*.md"
  push:
    branches: [preview]
    paths:
      - ".gitattributes"
      - "shared/logging/**"
      - "scripts/logging/**"
      - "macos/Sources/**"
      - "rust/lithe-core/src/**"
      - ".agents/skills/write-stable-tests/scripts/**"
      - ".github/workflows/verify-logging.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

# Every main commit gets its own group, including pending runs. PR pushes
# cancel their predecessor immediately; only completed results may be reused.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Structured Logging (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check generated log events
        run: node scripts/logging/generate-log-events.mjs --check
      - name: Test catalog generation and usage guard
        timeout-minutes: 2
        run: |
          mkdir -p .artifacts/test-stability
          # Node 22 also applies this timeout to the whole file. Each case keeps
          # its explicit 15s (or lower) bound in test-log-events.mjs.
          node --test --test-timeout=60000 --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=.artifacts/test-stability/logging-node.junit.xml \
            scripts/logging/test-log-events.mjs
      - name: Check log usage
        run: node scripts/logging/verify-log-usage.mjs
      - name: Generate per-test timing report
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseJUnitCases } from './.agents/skills/write-stable-tests/scripts/parse-junit-cases.mjs';
          import { writeTestReportArtifacts } from './.agents/skills/write-stable-tests/scripts/generate-test-report.mjs';
          const stem = '.artifacts/test-stability/logging-node';
          const tests = parseJUnitCases(fs.readFileSync(`${stem}.junit.xml`, 'utf8'));
          if (!tests.length) throw new Error('Missing logging test durations');
          fs.writeFileSync(`${stem}.json`, JSON.stringify({ runner: 'node', warnMs: 1000, maxMs: 15000, tests }));
          writeTestReportArtifacts(`${stem}.json`);
          NODE
      - name: Upload timing report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: structured-logging-ubuntu-latest
          path: .artifacts/test-stability/
