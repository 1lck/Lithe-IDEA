name: Desktop remote server

# The first stage of every desktop run that ships the remote workspace server (#2231): one job
# builds the server for all of its Linux targets and checks every executable without running
# it, then one job per target downloads those bytes and smoke tests them on a runner of the
# target's own architecture, never under an emulator. The artifact is remote-server-linux-musl.
# Desktop CI calls this to check a change; Desktop Release and Desktop AutoBuild call it before
# building the app, and every package job downloads the artifact and embeds those exact bytes
# (scripts/desktop/package-desktop.sh with LITHE_REMOTE_SERVER_STAGE), so all packages of a run
# carry the same server builds that were tested here.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build; the caller's commit when empty"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build for linux amd64 and arm64
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl

      - name: Resolve pinned Core revision
        id: core-pin
        run: |
          rev="$(sed -n 's/^PINNED_CORE_REVISION="\([0-9a-f]\{40\}\)"$/\1/p' scripts/desktop/build-desktop-core.sh)"
          if [[ -z "$rev" ]]; then
            printf '%s\n' 'Could not read PINNED_CORE_REVISION from scripts/desktop/build-desktop-core.sh.' >&2
            exit 1
          fi
          printf 'revision=%s\n' "$rev" >> "$GITHUB_OUTPUT"

      - name: Restore the core build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .artifacts/desktop/lithe-core-rust
          key: remote-server-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ steps.core-pin.outputs.revision }}-${{ hashFiles('scripts/desktop/build-remote-server.sh') }}
          restore-keys: |
            remote-server-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-

      - name: Build the remote server
        run: ./scripts/desktop/build-remote-server.sh

      # The manifest, hashes, ELF machine and static linking of every executable. The test jobs
      # run them. Sizes go to the job summary and never fail the lane (#2231, D9).
      - name: Check the remote server executables
        run: node scripts/desktop/verify/verify-remote-server-artifacts.mjs --smoke none --require-pinned

      - name: Upload the remote server builds
        uses: actions/upload-artifact@v7
        with:
          name: remote-server-linux-musl
          path: .artifacts/desktop/remote-server/
          if-no-files-found: error
          retention-days: 14

  test:
    name: Test on linux ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      # The same bytes that the build job built and uploaded, not a second build.
      - name: Download the remote server builds
        uses: actions/download-artifact@v8
        with:
          name: remote-server-linux-musl
          path: .artifacts/desktop/remote-server/

      # Artifacts do not keep file modes. The SHA-256 check below still proves that these are
      # the executables the build job checked.
      - name: Restore the executable mode
        run: chmod 0755 .artifacts/desktop/remote-server/*/lithe-remote-server

      - name: Smoke test the ${{ matrix.target }} server natively
        run: node scripts/desktop/verify/verify-remote-server-artifacts.mjs --smoke "$TARGET" --require-pinned
        env:
          TARGET: ${{ matrix.target }}
