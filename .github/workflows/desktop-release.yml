name: Desktop Release

# Releases the Viva desktop client (desktop/) for macOS, Windows and Linux. Its tags are
# desktop-vMAJOR.MINOR.PATCH, apart from the v* tags of the SwiftUI and Tauri clients, and each
# release is stable. The release of the highest desktop version is marked Latest, so the
# releases/latest link and the README download links lead to it; desktop updates select
# desktop-v tags and do not read Latest.
on:
  push:
    tags:
      - "desktop-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.7.0; it must equal the version in desktop/viva.toml"
        required: true
        type: string
      publish:
        description: "Publish the release after the packages are verified (off for a preflight)"
        type: boolean
        default: true
      feed_only:
        description: "Only sign the stable update feed again for the published release, with this commit's feed script; nothing is built or uploaded but the feed and its patches"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version
    if: github.actor == github.repository_owner || contains(format(',{0},', vars.LITHE_RELEASE_ACTOR), format(',{0},', github.actor))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      timestamp: ${{ steps.time.outputs.timestamp }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve the shared package matrix
        id: packages
        run: |
          matrix="$(node scripts/ci/common/desktop-packages.mjs matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Resolve the version and check the manifest and release notes
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: bash scripts/ci/desktop-release/resolve-release-version.sh "$REQUESTED_VERSION"

      # Every platform records the same build time.
      - name: Record the build time
        id: time
        run: printf 'timestamp=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  # A release runs in three stages. First the remote workspace server (linux amd64/arm64) and the
  # Windows GNU release Core are prepared in parallel on Linux runners (no Windows runner queue).
  remote-server:
    name: Remote server
    if: ${{ !inputs.feed_only }}
    needs: prepare
    uses: ./.github/workflows/desktop-remote-server.yml

  windows-core:
    name: Cross-build Windows Core on Linux
    if: ${{ !inputs.feed_only }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-gnu

      - name: Resolve pinned Core revision
        id: core-pin
        run: |
          rev="$(sed -n 's/^PINNED_CORE_REVISION="\([0-9a-f]\{40\}\)"$/\1/p' scripts/desktop/build-desktop-core.sh)"
          if [[ -z "$rev" ]]; then
            printf '%s\n' 'Could not read PINNED_CORE_REVISION from scripts/desktop/build-desktop-core.sh.' >&2
            exit 1
          fi
          printf 'revision=%s\n' "$rev" >> "$GITHUB_OUTPUT"

      - name: Restore staged Windows release Core
        id: core-stage
        uses: actions/cache@v6
        with:
          path: .artifacts/desktop/lithe-core/x86_64-pc-windows-gnu/release
          key: desktop-core-staged-x86_64-pc-windows-gnu-${{ steps.rust.outputs.cachekey }}-release-${{ steps.core-pin.outputs.revision }}

      - name: Install MinGW-w64 cross toolchain
        if: steps.core-stage.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Restore the core build
        if: steps.core-stage.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .artifacts/desktop/lithe-core-rust
          key: desktop-core-cross-Linux-x86_64-pc-windows-gnu-${{ steps.rust.outputs.cachekey }}-release-${{ steps.core-pin.outputs.revision }}
          restore-keys: |
            desktop-core-cross-Linux-x86_64-pc-windows-gnu-${{ steps.rust.outputs.cachekey }}-release-

      - name: Cross-build Windows release Core
        env:
          LITHE_CORE_TARGET: x86_64-pc-windows-gnu
        run: ./scripts/desktop/build-desktop-core.sh --release > /dev/null

      - name: Upload staged Windows release Core
        uses: actions/upload-artifact@v7
        with:
          name: core-windows-amd64-release
          path: .artifacts/desktop/lithe-core/x86_64-pc-windows-gnu/release
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # Then every platform builds the app with those server bytes embedded and packages it: macOS
  # arm64 and amd64 share one macOS runner to avoid queueing for a second macOS VM, and Windows
  # links the staged Core cross-compiled on Linux above.
  build:
    name: Package ${{ matrix.os }} ${{ matrix.arch }}
    if: ${{ !inputs.feed_only }}
    needs: [prepare, remote-server, windows-core]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    # What About and the updater show (package-desktop.sh). The feed keys are public; the
    # private signing key never reaches a packaging runner.
    env:
      LITHE_BUILD_TIME: ${{ needs.prepare.outputs.timestamp }}
      LITHE_BUILD_COMMIT: ${{ github.sha }}
      LITHE_UPDATE_PUBLIC_KEYS: ${{ vars.LITHE_UPDATE_PUBLIC_KEYS }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # package-desktop.sh checks the builds remote-server tested against the pinned core and
      # embeds them, instead of building the server again on this runner.
      - name: Download the remote server builds
        uses: actions/download-artifact@v8
        with:
          name: remote-server-linux-musl
          path: .artifacts/desktop/remote-server/

      # Artifacts do not keep file modes.
      - name: Use the downloaded remote server builds
        run: |
          chmod 0755 .artifacts/desktop/remote-server/*/lithe-remote-server
          printf 'LITHE_REMOTE_SERVER_STAGE=%s\n' "$PWD/.artifacts/desktop/remote-server" >> "$GITHUB_ENV"

      - name: Download cross-built Windows release Core
        if: matrix.os == 'windows'
        uses: actions/download-artifact@v8
        with:
          name: core-windows-amd64-release
          path: .artifacts/desktop/lithe-core/x86_64-pc-windows-gnu/release

      - name: Restore Windows helper executable mode
        if: matrix.os == 'windows'
        run: chmod 0755 .artifacts/desktop/lithe-core/x86_64-pc-windows-gnu/release/bin/lithe-mcp.exe

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.rust-target }}

      - name: Ensure Windows build tools
        if: matrix.os == 'windows'
        uses: ./.github/actions/setup-desktop-windows-build-tools

      - name: Ensure Linux package inspection tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Resolve pinned Core revision
        id: core-pin
        if: matrix.os != 'windows'
        run: |
          rev="$(sed -n 's/^PINNED_CORE_REVISION="\([0-9a-f]\{40\}\)"$/\1/p' scripts/desktop/build-desktop-core.sh)"
          if [[ -z "$rev" ]]; then
            printf '%s\n' 'Could not read PINNED_CORE_REVISION from scripts/desktop/build-desktop-core.sh.' >&2
            exit 1
          fi
          printf 'revision=%s\n' "$rev" >> "$GITHUB_OUTPUT"

      # Cache each target's compact staged release Core (~36 MiB) separately so Desktop CI,
      # AutoBuild and Desktop Release share them and build-desktop-core.sh takes its fast-path.
      - name: Restore staged release Core (macOS arm64)
        id: core-stage-darwin-arm64
        if: matrix.os == 'darwin'
        uses: actions/cache@v6
        with:
          path: .artifacts/desktop/lithe-core/aarch64-apple-darwin/release
          key: desktop-core-staged-aarch64-apple-darwin-${{ steps.rust.outputs.cachekey }}-release-${{ steps.core-pin.outputs.revision }}

      - name: Restore staged release Core (macOS amd64)
        id: core-stage-darwin-amd64
        if: matrix.os == 'darwin'
        uses: actions/cache@v6
        with:
          path: .artifacts/desktop/lithe-core/x86_64-apple-darwin/release
          key: desktop-core-staged-x86_64-apple-darwin-${{ steps.rust.outputs.cachekey }}-release-${{ steps.core-pin.outputs.revision }}

      - name: Restore staged release Core (Linux)
        id: core-stage-linux
        if: matrix.os == 'linux'
        uses: actions/cache@v6
        with:
          path: .artifacts/desktop/lithe-core/${{ matrix.rust-target }}/release
          key: desktop-core-staged-${{ matrix.rust-target }}-${{ steps.rust.outputs.cachekey }}-release-${{ steps.core-pin.outputs.revision }}

      - name: Restore the core build
        if: >-
          (matrix.os == 'darwin' && (steps.core-stage-darwin-arm64.outputs.cache-hit != 'true' || steps.core-stage-darwin-amd64.outputs.cache-hit != 'true')) ||
          (matrix.os == 'linux' && steps.core-stage-linux.outputs.cache-hit != 'true')
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .artifacts/desktop/lithe-core-rust
          key: desktop-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-release-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.core-pin.outputs.revision }}
          restore-keys: |
            desktop-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-release-${{ matrix.os }}-${{ matrix.arch }}-

      - name: Package and verify on macOS
        if: matrix.os == 'darwin'
        shell: bash
        env:
          # viva package imports the certificate into a temporary keychain and signs with it.
          APPLE_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          DESKTOP_ARCHES: ${{ matrix.arches }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for arch in $DESKTOP_ARCHES; do
            skip_check=0
            if [[ "$arch" != "arm64" ]]; then
              skip_check=1
            fi
            LITHE_SKIP_FILE_ASSOCIATIONS_CHECK="$skip_check" \
              bash scripts/ci/desktop-release/package-release.sh "$arch" "$DESKTOP_VERSION"
          done

      - name: Package and verify on Windows
        if: matrix.os == 'windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
          DESKTOP_ARCH: ${{ matrix.arches }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci/desktop-release/package-release.sh "$DESKTOP_ARCH" "$DESKTOP_VERSION"

      - name: Package and verify on Linux
        if: matrix.os == 'linux'
        shell: bash
        env:
          DESKTOP_ARCH: ${{ matrix.arches }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci/desktop-release/package-release.sh "$DESKTOP_ARCH" "$DESKTOP_VERSION"

      - name: Upload macOS arm64 packages
        if: matrix.os == 'darwin'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-darwin-arm64
          path: |
            dist/desktop/darwin-arm64/lithe-${{ needs.prepare.outputs.version }}-darwin-arm64.zip
            dist/desktop/darwin-arm64/lithe-${{ needs.prepare.outputs.version }}-darwin-arm64.zip.sha256
            dist/desktop/darwin-arm64/lithe-${{ needs.prepare.outputs.version }}-darwin-arm64.dmg
            dist/desktop/darwin-arm64/lithe-${{ needs.prepare.outputs.version }}-darwin-arm64.dmg.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Upload macOS amd64 packages
        if: matrix.os == 'darwin'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-darwin-amd64
          path: |
            dist/desktop/darwin-amd64/lithe-${{ needs.prepare.outputs.version }}-darwin-amd64.zip
            dist/desktop/darwin-amd64/lithe-${{ needs.prepare.outputs.version }}-darwin-amd64.zip.sha256
            dist/desktop/darwin-amd64/lithe-${{ needs.prepare.outputs.version }}-darwin-amd64.dmg
            dist/desktop/darwin-amd64/lithe-${{ needs.prepare.outputs.version }}-darwin-amd64.dmg.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Upload Windows packages
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-setup.exe.sha256
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}.zip
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}.zip.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Upload Linux packages
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz.sha256
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe_${{ needs.prepare.outputs.version }}_${{ matrix.arch }}.deb
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe_${{ needs.prepare.outputs.version }}_${{ matrix.arch }}.deb.sha256
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/*.rpm
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/*.rpm.sha256
          compression-level: 0
          if-no-files-found: error

  # Last, the packages of every platform are checked together and published as one release.
  publish:
    name: Publish the release
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && !inputs.feed_only }}
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Verify the complete inventory and checksums
        env:
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/ci/common/desktop-packages.mjs verify "$DESKTOP_VERSION" dist

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Mark this release Latest unless a published desktop release has a higher version,
          # so re-running the workflow for an older tag does not take Latest from a newer one.
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1000 --json tagName --jq '.[].tagName' | sed -n 's/^desktop-v//p' | sort -V | tail -n 1)
          latest=true
          if [[ -n "$newest" && "$(printf '%s\n%s\n' "$newest" "$DESKTOP_VERSION" | sort -V | tail -n 1)" != "$DESKTOP_VERSION" ]]; then
            latest=false
          fi
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --title "Lithe Desktop $DESKTOP_VERSION"
            --notes-file "docs/releases/v$DESKTOP_VERSION.md"
            --prerelease=false
            --latest="$latest"
          )
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" "${release_args[@]}" || \
              gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          gh release edit "$RELEASE_TAG" "${release_args[@]}"
          shopt -s nullglob
          release_files=(dist/*.zip dist/*.dmg dist/*.exe dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.sha256)
          if [[ ${#release_files[@]} -eq 0 ]]; then
            printf '%s\n' 'No desktop release artifacts were downloaded.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${release_files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  # The stable feed is signed apart from the packaging and the release: this job alone is given
  # the private key, and it runs once the release holds the packages the feed points to. With
  # feed_only it signs the feed of a release published earlier again, from that release's own
  # packages, so a change to the feed rules reaches clients without rebuilding the release.
  update-feed:
    name: Publish the stable update feed
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success'
      && (github.event_name != 'workflow_dispatch' || inputs.publish)
      && (needs.publish.result == 'success' || (inputs.feed_only && needs.publish.result == 'skipped')) }}
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Two releases never write the feed at once.
    concurrency:
      group: desktop-update-feed-stable
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # viva feed is built from the fork desktop/go.mod pins.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Download the packages
        if: ${{ !inputs.feed_only }}
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Download the published packages
        if: ${{ inputs.feed_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          patterns=()
          while IFS= read -r name; do
            patterns+=(--pattern "$name" --pattern "$name.sha256")
          done < <(node scripts/ci/common/desktop-packages.mjs names "$DESKTOP_VERSION")
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist "${patterns[@]}"

      - name: Sign and publish the feed, its delta updates and notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
          VIVA_UPDATE_KEY: ${{ secrets.VIVA_UPDATE_KEY }}
        run: bash scripts/ci/desktop-release/publish-update-feed.sh dist
