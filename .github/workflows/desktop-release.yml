name: Desktop Release

# Releases the Viva desktop client (desktop/) for macOS, Windows and Linux. Its tags are
# desktop-vMAJOR.MINOR.PATCH, apart from the v* tags of the SwiftUI and Tauri clients, and each
# release is stable. The release of the highest desktop version is marked Latest, so the
# releases/latest link and the README download links lead to it; desktop updates select
# desktop-v tags and do not read Latest.
on:
  push:
    tags:
      - "desktop-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.7.0; it must equal the version in desktop/viva.toml"
        required: true
        type: string
      publish:
        description: "Publish the release after the packages are verified (off for a preflight)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version
    if: github.actor == github.repository_owner || contains(format(',{0},', vars.LITHE_RELEASE_ACTOR), format(',{0},', github.actor))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      timestamp: ${{ steps.time.outputs.timestamp }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve the shared package matrix
        id: packages
        run: |
          matrix="$(node scripts/ci/common/desktop-packages.mjs matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Resolve the version and check the manifest and release notes
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: bash scripts/ci/desktop-release/resolve-release-version.sh "$REQUESTED_VERSION"

      # Every platform records the same build time.
      - name: Record the build time
        id: time
        run: printf 'timestamp=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.os }} ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    # What About and the updater show (package-desktop.sh). The feed keys are public; the
    # private signing key never reaches a packaging runner.
    env:
      LITHE_BUILD_TIME: ${{ needs.prepare.outputs.timestamp }}
      LITHE_BUILD_COMMIT: ${{ github.sha }}
      LITHE_UPDATE_PUBLIC_KEYS: ${{ vars.LITHE_UPDATE_PUBLIC_KEYS }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.rust-target }}

      - name: Ensure Windows build tools
        if: matrix.os == 'windows'
        uses: ./.github/actions/setup-desktop-windows-build-tools

      - name: Ensure Linux package inspection tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Restore the core build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .artifacts/desktop/lithe-core-rust
          key: desktop-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-release-${{ matrix.rust-target }}-${{ hashFiles('scripts/desktop/build-desktop-core.sh') }}
          restore-keys: |
            desktop-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-release-${{ matrix.rust-target }}-

      - name: Package and verify on macOS
        if: matrix.os == 'darwin'
        shell: bash
        env:
          # viva package imports the certificate into a temporary keychain and signs with it.
          APPLE_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          DESKTOP_ARCH: ${{ matrix.arch }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci/desktop-release/package-release.sh "$DESKTOP_ARCH" "$DESKTOP_VERSION"

      - name: Package and verify on Windows
        if: matrix.os == 'windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
          DESKTOP_ARCH: ${{ matrix.arch }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci/desktop-release/package-release.sh "$DESKTOP_ARCH" "$DESKTOP_VERSION"

      - name: Package and verify on Linux
        if: matrix.os == 'linux'
        shell: bash
        env:
          DESKTOP_ARCH: ${{ matrix.arch }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/ci/desktop-release/package-release.sh "$DESKTOP_ARCH" "$DESKTOP_VERSION"

      - name: Upload macOS packages
        if: matrix.os == 'darwin'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-darwin-${{ matrix.arch }}.zip
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-darwin-${{ matrix.arch }}.zip.sha256
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-darwin-${{ matrix.arch }}.dmg
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-darwin-${{ matrix.arch }}.dmg.sha256

          if-no-files-found: error

      - name: Upload Windows packages
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-setup.exe.sha256
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}.zip
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}.zip.sha256

          if-no-files-found: error

      - name: Upload Linux packages
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}.tar.gz.sha256
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe_${{ needs.prepare.outputs.version }}_${{ matrix.arch }}.deb
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/lithe_${{ needs.prepare.outputs.version }}_${{ matrix.arch }}.deb.sha256
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/*.rpm
            dist/desktop/${{ matrix.os }}-${{ matrix.arch }}/*.rpm.sha256

          if-no-files-found: error

  publish:
    name: Publish the release
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Verify the complete inventory and checksums
        env:
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/ci/common/desktop-packages.mjs verify "$DESKTOP_VERSION" dist

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Mark this release Latest unless a published desktop release has a higher version,
          # so re-running the workflow for an older tag does not take Latest from a newer one.
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1000 --json tagName --jq '.[].tagName' | sed -n 's/^desktop-v//p' | sort -V | tail -n 1)
          latest=true
          if [[ -n "$newest" && "$(printf '%s\n%s\n' "$newest" "$DESKTOP_VERSION" | sort -V | tail -n 1)" != "$DESKTOP_VERSION" ]]; then
            latest=false
          fi
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --title "Lithe Desktop $DESKTOP_VERSION"
            --notes-file "docs/releases/v$DESKTOP_VERSION.md"
            --prerelease=false
            --latest="$latest"
          )
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" "${release_args[@]}" || \
              gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          fi
          gh release edit "$RELEASE_TAG" "${release_args[@]}"
          shopt -s nullglob
          release_files=(dist/*.zip dist/*.dmg dist/*.exe dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.sha256)
          if [[ ${#release_files[@]} -eq 0 ]]; then
            printf '%s\n' 'No desktop release artifacts were downloaded.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${release_files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  # The stable feed is signed apart from the packaging and the release: this job alone is given
  # the private key, and it runs once the release holds the packages the feed points to.
  update-feed:
    name: Publish the stable update feed
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # Two releases never write the feed at once.
    concurrency:
      group: desktop-update-feed-stable
      cancel-in-progress: false

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # viva feed is built from the fork desktop/go.mod pins.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - name: Sign and publish the feed, its delta updates and notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
          VIVA_UPDATE_KEY: ${{ secrets.VIVA_UPDATE_KEY }}
        run: bash scripts/ci/desktop-release/publish-update-feed.sh dist
