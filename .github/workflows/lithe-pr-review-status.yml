name: Lithe PR review status

on:
  pull_request_target:
    types:
      - opened
      - ready_for_review
      - converted_to_draft
      - reopened
      - review_requested
      - review_request_removed
      - closed
  workflow_run:
    workflows:
      - Lithe PR review status observer
    types:
      - completed

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

concurrency:
  group: lithe-pr-review-status-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Download the unprivileged review event
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: lithe-pr-review-event
          path: ${{ runner.temp }}/lithe-pr-review-event
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve the pull request and trusted base revision
        id: event
        uses: actions/github-script@v7
        env:
          REVIEW_EVENT_PATH: ${{ runner.temp }}/lithe-pr-review-event/pull-request-review.json
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const isReviewEvent = context.eventName === "workflow_run";
            const payload = isReviewEvent
              ? JSON.parse(fs.readFileSync(process.env.REVIEW_EVENT_PATH, "utf8"))
              : context.payload;
            const repositoryName = `${context.repo.owner}/${context.repo.repo}`;
            const pullNumber = Number(payload.pull_request?.number);

            if (!Number.isInteger(pullNumber) || pullNumber < 1) {
              core.setFailed("The review event did not identify a pull request.");
              return;
            }

            if (isReviewEvent) {
              if (
                payload.repository?.full_name !== repositoryName ||
                payload.pull_request?.base?.repo?.full_name !== repositoryName
              ) {
                core.setFailed("The review event does not belong to this repository.");
                return;
              }
              const workflowPullRequests = context.payload.workflow_run.pull_requests ?? [];
              const belongsToWorkflowRun = workflowPullRequests.some(
                (pullRequest) => pullRequest.number === pullNumber,
              );
              if (!belongsToWorkflowRun) {
                core.setFailed("The review event does not match the completed workflow run.");
                return;
              }
              if (payload.action !== "submitted" && payload.action !== "dismissed") {
                core.setFailed(`Unsupported review action: ${payload.action ?? "missing"}`);
                return;
              }
            }

            const pullRequest = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            })).data;

            if (pullRequest.base.repo.full_name !== repositoryName) {
              core.setFailed("The pull request does not target this repository.");
              return;
            }

            core.setOutput("pull-number", String(pullNumber));
            core.setOutput("base-sha", pullRequest.base.sha);
            core.setOutput("event-name", isReviewEvent ? "pull_request_review" : "pull_request");
            core.setOutput("action", payload.action ?? "");
            core.setOutput("review-state", payload.review?.state?.toLowerCase() ?? "");

      - name: Check out trusted review tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.event.outputs.base-sha }}
          fetch-depth: 1
          sparse-checkout: scripts/pr-review-status.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Synchronize review status label
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");
            const { determineReviewStatus, getReviewLabelChanges, REVIEW_LABEL_DEFINITIONS } =
              await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, "scripts/pr-review-status.mjs")).href);
            const { owner, repo } = context.repo;
            const pullNumber = Number(process.env.PULL_REQUEST_NUMBER);
            const pullRequest = (await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            })).data;
            const currentLabels = pullRequest.labels ?? [];
            const hasOutstandingReviewers =
              (pullRequest.requested_reviewers ?? []).length > 0 ||
              (pullRequest.requested_teams ?? []).length > 0;
            const nextStatus = determineReviewStatus({
              action: process.env.REVIEW_ACTION,
              draft: pullRequest.draft === true,
              eventName: process.env.REVIEW_EVENT_NAME,
              hasOutstandingReviewers,
              pullRequestState: pullRequest.state,
              reviewState: process.env.REVIEW_STATE || null,
              currentLabels,
            });
            const { add, remove } = getReviewLabelChanges(currentLabels, nextStatus);

            for (const name of remove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pullNumber, name });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            for (const name of add) {
              const definition = REVIEW_LABEL_DEFINITIONS[name];
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: definition.color,
                  description: definition.description,
                }).catch((createError) => {
                  if (createError.status !== 422) throw createError;
                });
              }
            }

            if (add.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pullNumber, labels: add });
            }

            core.info(`PR #${pullNumber} review status: ${nextStatus ?? "none"}`);
          env:
            PULL_REQUEST_NUMBER: ${{ steps.event.outputs.pull-number }}
            REVIEW_EVENT_NAME: ${{ steps.event.outputs.event-name }}
            REVIEW_ACTION: ${{ steps.event.outputs.action }}
            REVIEW_STATE: ${{ steps.event.outputs.review-state }}
