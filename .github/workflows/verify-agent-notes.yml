# Registered by the standalone preview repository.
name: Verify Agent Notes

on:
  pull_request:
    paths:
      - ".agents/notes/**"
      - ".agents/skills/agent-notes/**"
      - "scripts/agent-notes/agent-notes-parser.mjs"
      - "scripts/agent-notes/verify-agent-notes.mjs"
      - "scripts/agent-notes/verify-agent-notes.sh"
      - ".github/workflows/deploy-agent-notes-board.yml"
      - ".github/workflows/verify-agent-notes.yml"
  workflow_dispatch:

permissions:
  contents: read

# Every main commit gets its own group, including pending runs. PR pushes
# cancel their predecessor immediately; only completed results may be reused.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify Agent Notes
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Agent Notes
        run: node scripts/agent-notes/verify-agent-notes.mjs
