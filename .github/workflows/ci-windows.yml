name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.classify.outputs.windows }}
      rust_core: ${{ steps.classify.outputs.rust_core }}
      windows_rust: ${{ steps.classify.outputs.windows_rust }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test dependency cache verification
        shell: bash
        run: node scripts/test-verify-download-cache.mjs

      - name: Resolve comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "manual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$PUSH_BASE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          fi
          {
            echo "manual=false"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        env:
          MANUAL: ${{ steps.base.outputs.manual }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        shell: bash
        run: |
          if [[ "$MANUAL" == "true" ]]; then
            {
              echo "rust_core=true"
              echo "windows=true"
              echo "windows_rust=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ./scripts/classify-ci-changes.sh "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Reject newly added Windows blocking test patterns
        if: steps.base.outputs.manual == 'false'
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        shell: bash
        run: ./.agents/skills/write-stable-tests/scripts/verify-test-stability.sh --platform windows --base "$BASE_SHA" --head "$GITHUB_SHA"

      - name: Summarize selected lanes
        shell: bash
        env:
          WINDOWS: ${{ steps.classify.outputs.windows }}
          RUST_CORE: ${{ steps.classify.outputs.rust_core }}
          WINDOWS_RUST: ${{ steps.classify.outputs.windows_rust }}
        run: |
          {
            echo "### Windows CI lanes"
            echo "| Lane | Run |"
            echo "| --- | --- |"
            echo "| Windows frontend tests | $WINDOWS |"
            echo "| Shared Rust Core tests | $RUST_CORE |"
            echo "| Windows Rust tests | $WINDOWS_RUST |"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Test Windows frontend
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: windows/tauri/package.json

      - name: Test shared editor source model
        shell: pwsh
        run: node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --working-directory frontend/editor --report .artifacts/test-stability/shared-editor.json

      - name: Configure isolated dependency caches
        shell: pwsh
        run: |
          # Bun's cache and temp directory must share a Windows volume so
          # lifecycle shims such as node-gyp.cmd are added to the correct PATH.
          "BUN_INSTALL_CACHE_DIR=$(Join-Path $env:GITHUB_WORKSPACE '.artifacts/bun-cache')" >> $env:GITHUB_ENV
          "BUN_TMPDIR=$(Join-Path $env:GITHUB_WORKSPACE '.artifacts/bun-tmp')" >> $env:GITHUB_ENV
          # The verified cache rejects links, so omit Bun's junction-only index.
          "BUN_FEATURE_FLAG_DISABLE_INSTALL_INDEX=1" >> $env:GITHUB_ENV

      - name: Restore Bun downloads
        id: bun-download-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: .artifacts/bun-cache
          key: lithe-${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            lithe-${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-v2-

      - name: Validate restored Bun cache or fall back
        shell: pwsh
        run: |
          if ("${{ steps.bun-download-cache.outcome }}" -eq "failure") {
            Write-Output "::warning title=Bun cache restore failed::Discarding the partial Bun cache and downloading dependencies normally."
            Remove-Item -Recurse -Force -LiteralPath .artifacts/bun-cache -ErrorAction SilentlyContinue
          }
          $package = Get-Content -Raw -LiteralPath windows/tauri/package.json | ConvertFrom-Json
          $bunVersion = ([string]$package.packageManager) -replace '^bun@', ''
          node scripts/verify-download-cache.mjs `
            --bun-version $bunVersion `
            --bun-lock bun.lock `
            --bun-cache .artifacts/bun-cache
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning title=Bun cache validation failed::Discarding the untrusted Bun cache and downloading dependencies normally."
            Remove-Item -Recurse -Force -LiteralPath .artifacts/bun-cache -ErrorAction SilentlyContinue
          }
          $manifest = ".artifacts/bun-cache/.lithe-integrity.json"
          $verified = $LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $manifest -PathType Leaf)
          "LITHE_BUN_CACHE_VERIFIED=$($verified.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Install Windows frontend dependencies
        shell: pwsh
        run: ./scripts/install-windows-frontend-dependencies.ps1

      - name: Check Windows frontend types
        working-directory: windows/tauri
        shell: pwsh
        run: bun run typecheck

      - name: Verify Windows boundaries
        shell: pwsh
        run: ./scripts/verify-windows-boundaries.ps1

      - name: Run Windows frontend tests
        shell: pwsh
        run: |
          bun test src/platform
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 120000 --report .artifacts/test-stability/windows-documents.json -- src/features/editor/stores/editor-app.store.test.ts src/features/editor/services/document-external-change-workflow.test.ts src/features/editor/services/document-save-lifecycle.test.ts src/features/editor/services/document-watch-controller.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test src/features/editor/lsp/language-server-navigation.test.ts src/features/editor/lsp/java-navigation-marker-loader.test.ts src/features/editor/engines/monaco/definition-link-scheduler.test.ts src/features/editor/engines/monaco/java-implementation-markers.test.ts
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-editor-ownership.json -- src/features/editor/extensions/api.owner-navigation.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-java-workspace.json -- src/features/editor/lsp/java-workspace-language-server.test.ts src/features/editor/lsp/java-workspace-change-scheduler.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test src/features/debugger/services/debug-adapter-events.test.ts
          bun test src/features/run
          bun test src/features/file-explorer/lib/java-clipboard-class.test.ts src/features/file-explorer/lib/paste-java-class-from-clipboard.test.ts
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-file-watcher.json -- src/features/file-system/services/file-watcher-listener.test.ts src/features/file-system/stores/file-watcher.store.test.ts

      - name: Test SVG editor preview modes and live updates
        shell: pwsh
        run: ./.agents/skills/write-stable-tests/scripts/test-stability-windows.ps1 -Scope Frontend -FrontendTestPath src/features/editor/components/svg-editor.test.tsx

      - name: Test welcome clone and modal isolation
        shell: pwsh
        run: |
          $runner = ".agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs"
          $welcomeTest = "src/features/layout/components/welcome-screen.integration.test.tsx"
          $localeTest = "src/features/maven/components/maven-source-root-rows.test.tsx"
          node $runner --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-welcome-clone.json -- $welcomeTest src/features/window/stores/ui-state/modal-slice.test.ts src/features/window/utils/project-picker-mode.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Run both file orders so a leaked locale mock cannot hide behind test discovery order.
          foreach ($seed in @(1, 3)) {
            node $runner --suite-timeout-ms 60000 --report ".artifacts/test-stability/windows-welcome-isolation-$seed.json" -- --randomize "--seed=$seed" $welcomeTest $localeTest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test Git query recovery and isolation
        shell: pwsh
        timeout-minutes: 5
        run: |
          $runner = ".agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs"
          $gitTests = @(
            "src/features/git/api/git-status-api.test.ts",
            "src/features/git/hooks/use-git-data-controller.integration.test.tsx",
            "src/features/git/stores/git-repository.store.test.ts",
            "src/features/git/stores/git.store.test.ts",
            "src/features/workspace/services/workspace-startup-priority.test.ts",
            "src/features/workspace/services/workspace-git-bootstrap.test.ts",
            "src/features/file-system/controllers/project-file-scan-coordinator.test.ts",
            "src/features/editor/lsp/resolve-editor-lsp-launch.test.ts",
            "src/features/git/utils/monaco-diff-rows.test.ts",
            "src/features/git/utils/monaco-diff-hunk-actions.test.ts"
          )
          foreach ($seed in @(1, 3, 7)) {
            node $runner --suite-timeout-ms 60000 --report ".artifacts/test-stability/windows-git-isolation-$seed.json" -- --randomize "--seed=$seed" @gitTests
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node $runner --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-git-execution-journal.json -- src/features/git/services/git-execution-journal.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test terminal discovery and profile selection
        shell: pwsh
        run: ./.agents/skills/write-stable-tests/scripts/test-stability-windows.ps1 -Scope Frontend -FrontendTestPath src/features/terminal/stores/shells.store.test.ts,src/features/terminal/utils/terminal-profiles.test.ts

      - name: Upload Windows frontend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stability-windows-frontend
          path: .artifacts/test-stability/
          if-no-files-found: ignore
          retention-days: 14

  rust-tests:
    name: Test Windows Rust implementation
    needs: changes
    if: needs.changes.outputs.rust_core == 'true' || needs.changes.outputs.windows_rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure isolated Cargo cache
        shell: pwsh
        run: |
          "CARGO_HOME=$(Join-Path $env:GITHUB_WORKSPACE '.artifacts/cargo-home')" >> $env:GITHUB_ENV

      - name: Resolve Rust cache identity
        id: rust-cache
        shell: pwsh
        run: |
          $commit = rustc -Vv |
            Select-String '^commit-hash:' |
            ForEach-Object { ($_.Line -split ':', 2)[1].Trim() } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($commit)) {
            throw "Could not resolve the Rust compiler commit hash."
          }
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Restore Cargo downloads
        id: cargo-download-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: .artifacts/cargo-home/registry/cache
          key: lithe-${{ runner.os }}-${{ runner.arch }}-cargo-downloads-v1-${{ hashFiles('rust/Cargo.lock', 'windows/tauri/src-tauri/Cargo.lock') }}
          restore-keys: |
            lithe-${{ runner.os }}-${{ runner.arch }}-cargo-downloads-v1-

      - name: Restore Cargo build outputs
        id: cargo-build-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: |
            windows/tauri/src-tauri/target/**/.fingerprint
            windows/tauri/src-tauri/target/**/build
            windows/tauri/src-tauri/target/**/deps
            windows/tauri/src-tauri/target/**/incremental
            rust/target/**/.fingerprint
            rust/target/**/build
            rust/target/**/deps
            rust/target/**/incremental
          key: lithe-${{ runner.os }}-${{ runner.arch }}-cargo-build-v1-x86_64-pc-windows-msvc-${{ steps.rust-cache.outputs.commit }}-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml', 'windows/tauri/src-tauri/Cargo.lock', 'windows/tauri/src-tauri/Cargo.toml', 'windows/tauri/crates/**/Cargo.toml', 'windows/tauri/rust-toolchain.toml') }}
          restore-keys: |
            lithe-${{ runner.os }}-${{ runner.arch }}-cargo-build-v1-x86_64-pc-windows-msvc-${{ steps.rust-cache.outputs.commit }}-

      - name: Validate restored Cargo caches or fall back
        shell: pwsh
        run: |
          ./scripts/validate-windows-build-caches.ps1 `
            -CargoDownloadsOutcome "${{ steps.cargo-download-cache.outcome }}" `
            -CargoBuildOutcome "${{ steps.cargo-build-cache.outcome }}" `
            -CargoBuildHit "${{ steps.cargo-build-cache.outputs.cache-hit }}"

      - name: Test shared Rust Core
        if: needs.changes.outputs.rust_core == 'true'
        shell: pwsh
        timeout-minutes: 20
        run: ./.agents/skills/write-stable-tests/scripts/test-stability-windows.ps1 -Scope SharedRust -SuiteTimeoutSeconds 1080

      - name: Test Windows Rust host
        if: needs.changes.outputs.windows_rust == 'true'
        shell: pwsh
        timeout-minutes: 20
        run: ./.agents/skills/write-stable-tests/scripts/test-stability-windows.ps1 -Scope WindowsRust -SuiteTimeoutSeconds 1080

      - name: Generate combined Windows Rust test report
        if: always()
        shell: pwsh
        run: node .agents/skills/write-stable-tests/scripts/generate-test-report.mjs

      - name: Upload Windows Rust test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stability-windows-rust
          path: .artifacts/test-stability/
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Windows CI gate
    needs:
      - changes
      - frontend
      - rust-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WINDOWS_SELECTED: ${{ needs.changes.outputs.windows }}
          RUST_CORE_SELECTED: ${{ needs.changes.outputs.rust_core }}
          WINDOWS_RUST_SELECTED: ${{ needs.changes.outputs.windows_rust }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
        shell: bash
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]
          if [[ "$WINDOWS_SELECTED" == "true" ]]; then
            [[ "$FRONTEND_RESULT" == "success" ]]
          else
            [[ "$FRONTEND_RESULT" == "skipped" ]]
          fi
          if [[ "$RUST_CORE_SELECTED" == "true" || "$WINDOWS_RUST_SELECTED" == "true" ]]; then
            [[ "$RUST_TESTS_RESULT" == "success" ]]
          else
            [[ "$RUST_TESTS_RESULT" == "skipped" ]]
          fi
