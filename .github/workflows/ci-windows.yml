name: Windows CI

on:
  pull_request:
    paths:
      - "windows/**"
      - "rust/**"
      - "shared/**"
      - "scripts/build-windows.ps1"
      - "scripts/verify-windows-boundaries.ps1"
      - "scripts/verify-winui-static.ps1"
      - ".github/workflows/ci-windows.yml"
  push:
    branches:
      - main
    paths:
      - "windows/**"
      - "rust/**"
      - "shared/**"
      - "scripts/build-windows.ps1"
      - "scripts/verify-windows-boundaries.ps1"
      - "scripts/verify-winui-static.ps1"
      - ".github/workflows/ci-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Windows implementation
    # The WinUI project targets the Visual Studio 2022 v143 toolset. Pin the
    # hosted image so a future windows-latest migration cannot silently select
    # Visual Studio 18 and drop the required UWP/WinUI build tools.
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Rust core, C++ targets, and WinUI workbench
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Release -BuildWinUI

      - name: Verify Windows boundaries
        shell: pwsh
        run: ./scripts/verify-windows-boundaries.ps1

      - name: Verify WinUI source contract
        shell: pwsh
        run: ./scripts/verify-winui-static.ps1

      - name: Run C++ tests
        shell: pwsh
        run: ctest --test-dir windows/build-windows -C Release --output-on-failure

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --manifest-path rust/Cargo.toml
