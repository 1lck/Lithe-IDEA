  rust-tests:
    name: Test Windows Rust implementation
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Configure isolated Cargo cache
        shell: pwsh
        run: |
          "CARGO_HOME=$(Join-Path $env:GITHUB_WORKSPACE '.artifacts/cargo-home')" >> $env:GITHUB_ENV

      - name: Resolve Rust cache identity
        id: rust-cache
        shell: pwsh
        run: |
          $commit = rustc -Vv |
            Select-String '^commit-hash:' |
            ForEach-Object { ($_.Line -split ':', 2)[1].Trim() } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($commit)) {
            throw "Could not resolve the Rust compiler commit hash."
          }
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Restore Cargo downloads
        id: cargo-download-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: .artifacts/cargo-home/registry/cache
          key: lithe-${{ runner.os }}-${{ runner.arch }}-cargo-downloads-v1-${{ hashFiles('rust/Cargo.lock', 'windows/tauri/src-tauri/Cargo.lock') }}
          restore-keys: |
            lithe-${{ runner.os }}-${{ runner.arch }}-cargo-downloads-v1-

      - name: Restore Cargo build outputs
        id: cargo-build-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: |
            windows/tauri/src-tauri/target/**/.fingerprint
            windows/tauri/src-tauri/target/**/build
            windows/tauri/src-tauri/target/**/deps
            windows/tauri/src-tauri/target/**/incremental
            rust/target/**/.fingerprint
            rust/target/**/build
            rust/target/**/deps
            rust/target/**/incremental
          key: lithe-${{ runner.os }}-${{ runner.arch }}-cargo-build-v1-x86_64-pc-windows-msvc-${{ steps.rust-cache.outputs.commit }}-${{ hashFiles('rust/Cargo.lock', 'rust/**/Cargo.toml', 'windows/tauri/src-tauri/Cargo.lock', 'windows/tauri/src-tauri/Cargo.toml', 'windows/tauri/crates/**/Cargo.toml', 'windows/tauri/rust-toolchain.toml') }}
          restore-keys: |
            lithe-${{ runner.os }}-${{ runner.arch }}-cargo-build-v1-x86_64-pc-windows-msvc-${{ steps.rust-cache.outputs.commit }}-

      - name: Validate restored Cargo caches or fall back
        shell: pwsh
        run: |
          ./scripts/validate-windows-build-caches.ps1 `
            -CargoDownloadsOutcome "${{ steps.cargo-download-cache.outcome }}" `
            -CargoBuildOutcome "${{ steps.cargo-build-cache.outcome }}" `
            -CargoBuildHit "${{ steps.cargo-build-cache.outputs.cache-hit }}"

      - name: Test shared Rust Core
        if: needs.changes.outputs.rust_core == 'true'
        shell: pwsh
        timeout-minutes: 20
        run: ./.agents/skills/write-stable-tests/scripts/test-stability-windows.ps1 -Scope SharedRust -SuiteTimeoutSeconds 1080

      - name: Verify Windows MCP stdio protocol
        if: needs.changes.outputs.rust_core == 'true'
        shell: pwsh
        timeout-minutes: 5
        run: |
          cargo build --locked --manifest-path rust/Cargo.toml -p lithe-ide-host --features mcp --bin lithe-mcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=.artifacts/test-stability/mcp-protocol.junit.xml scripts/test-ide-mcp.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows Rust host
        if: needs.changes.outputs.windows_rust == 'true'
        shell: pwsh
        timeout-minutes: 20
        run: ./.agents/skills/write-stable-tests/scripts/test-stability-windows.ps1 -Scope WindowsRust -SuiteTimeoutSeconds 1080

      - name: Test plugin VCS through real Core stdio
        if: needs.changes.outputs.windows_rust == 'true'
        shell: pwsh
        timeout-minutes: 20
        run: node scripts/test-windows-plugin-vcs-core.mjs

      - name: Generate combined Windows Rust test report
        if: always()
        shell: pwsh
        run: node .agents/skills/write-stable-tests/scripts/generate-test-report.mjs

      - name: Upload Windows Rust test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stability-windows-rust
          path: .artifacts/test-stability/
          if-no-files-found: ignore
          retention-days: 14

  real-jdt:
    name: Test real JDT on Windows
    needs: changes
    if: needs.changes.outputs.run_jdt == 'true'
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDT runtime JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Remember JDT runtime
        id: jdt-runtime
        shell: pwsh
        run: |
          "java_home=$env:JAVA_HOME" >> $env:GITHUB_OUTPUT

      - name: Set up Java 25 project JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Resolve project tools
        id: project-tools
        shell: pwsh
        run: |
          "java_home=$env:JAVA_HOME" >> $env:GITHUB_OUTPUT
          $maven = (Get-Command mvn.cmd -ErrorAction Stop).Source
          "maven=$maven" >> $env:GITHUB_OUTPUT

      - name: Restore JDT downloads
        uses: actions/cache@v6
        with:
          path: .artifacts/jdtls-downloads
          key: lithe-${{ runner.os }}-${{ runner.arch }}-jdtls-${{ hashFiles('third_party/jdtls/manifest.json', 'third_party/jdk/manifest.json') }}

      - name: Prepare packaged JDT and extensions
        shell: pwsh
        run: ./scripts/prepare-jdtls.ps1 -OutputDirectory .artifacts/jdtls

      - name: Run bounded real-JDT integration suite
        shell: pwsh
        timeout-minutes: 25
        env:
          LITHE_JDTLS_SMOKE_ROOT: ${{ github.workspace }}\.artifacts\jdtls
          LITHE_JDTLS_SMOKE_JAVA: ${{ steps.jdt-runtime.outputs.java_home }}\bin\java.exe
          LITHE_JDTLS_SMOKE_PROJECT_JDK: ${{ steps.project-tools.outputs.java_home }}
          LITHE_JDTLS_SMOKE_MAVEN: ${{ steps.project-tools.outputs.maven }}
        run: |
          node .agents/skills/write-stable-tests/scripts/run-rust-tests-with-timing.mjs `
            --manifest rust/Cargo.toml `
            --package lithe-core `
            --warn-ms 1000 `
            --max-ms 15000 `
            --test-budget git_paths_roundtrip_=60000 `
            --test-budget watch_context_distinguishes_linked_worktree_git_and_common_directories=30000 `
            --test-budget lsp::interface::engine::real_jdt_tests::real_jdtls_discovers_builds_and_launches_java_25_entrypoints=600000 `
            --test-budget tests::git_history_rewrite::=30000 `
            --test-budget tests::git_history_rewrite::native_rebase_skip_omits_conflicted_message_from_later_squash=45000 `
            --test-budget tests::git_remote_checkout::=30000 `
            --test-budget tests::git_workspace_commit::git_workspace_commit_push_checks_submodule_publication_before_updating_the_remote=30000 `
            --test-budget tests::git_workspace_commit::git_workspace_commit_push_confirms_each_repository_separately=60000 `
            --test-budget tests::git::git_write_squashes_=30000 `
            --test-budget tests::git::git_write_deletes_a_local_commit_=30000 `
            --test-budget tests::git::git_write_edits_a_local_commit_message_=30000 `
            --test-budget tests::git::git_write_updates_a_noncurrent_branch_without_switching_head=30000 `
            --test-budget tests::git::git_write_executes_checkout_preflight_clone_and_validation=30000 `
            --test-budget tests::git_patch_exchange::patch_exchange_detects_index_flags_and_hidden_destination_edits=30000 `
            --test-budget tests::git_patch_exchange::patch_exchange_rejects_stale_preview_and_forward_conflicts_without_writing=30000 `
            --test-budget tests::git_patch_exchange::patch_exchange_roundtrips_renames_deletes_and_platform_file_modes=30000 `
            --test-budget tests::git_patch_exchange::patch_exchange_snapshot_roundtrip_preserves_index_and_binary_files=30000 `
            --test-budget tests::git_patch_exchange::patch_exchange_distinguishes_sources_and_commit_direction=30000 `
            --test-budget tests::git_patch_exchange::patch_exchange_reverse_roundtrip_preserves_both_versions_and_untracked_bytes=60000 `
            --test-budget tests::git_patch_exchange::shelf_roundtrip_preserves_staged_deletions_with_retained_paths=60000 `
            --test-budget tests::git_patch_exchange::shelf_roundtrip_preserves_staged_rename_with_recreated_source=60000 `
            --test-budget tests::git_patch_exchange::patch_metadata_can_list_an_oversized_export_before_selecting_a_small_subset=30000 `
            --build-timeout-ms 600000 `
            --suite-timeout-ms 1200000 `
            --report .artifacts/test-stability/windows-real-jdt.json

      - name: Upload real JDT test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stability-windows-real-jdt
          path: .artifacts/test-stability/
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Windows CI gate
    needs:
      - changes
      - frontend
      - rust-tests
      - real-jdt
    if: always() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WINDOWS_SELECTED: ${{ needs.changes.outputs.windows }}
          RUST_CORE_SELECTED: ${{ needs.changes.outputs.rust_core }}
          WINDOWS_RUST_SELECTED: ${{ needs.changes.outputs.windows_rust }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_TESTS_RESULT: ${{ needs.rust-tests.result }}
          JAVA_JDT_SELECTED: ${{ needs.changes.outputs.java_jdt }}
          REAL_JDT_RESULT: ${{ needs.real-jdt.result }}
          RUST_SELECTED: ${{ needs.changes.outputs.rust_core == 'true' || needs.changes.outputs.windows_rust == 'true' }}
          RUN_FRONTEND: ${{ needs.changes.outputs.run_frontend }}
          RUN_RUST: ${{ needs.changes.outputs.run_rust }}
          RUN_JDT: ${{ needs.changes.outputs.run_jdt }}
          REUSE: ${{ needs.changes.outputs.reuse }}
        shell: bash
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]
          require_covered() {
            local selected="$1" ran="$2" lane="$3"
            [[ "$selected" != "true" || "$ran" == "true" ]] && return 0
            jq -e --arg lane "$lane" 'has($lane)' <<< "${REUSE:-{\}}" > /dev/null || {
              echo "::error::Lane $lane is selected but neither ran nor reused an earlier result"
              return 1
            }
          }
          require_job() {
            local ran="$1" result="$2"
            if [[ "$ran" == "true" ]]; then [[ "$result" == "success" ]]; else [[ "$result" == "skipped" ]]; fi
          }
          require_covered "$WINDOWS_SELECTED" "$RUN_FRONTEND" frontend
          require_covered "$RUST_SELECTED" "$RUN_RUST" rust
          require_covered "$JAVA_JDT_SELECTED" "$RUN_JDT" jdt
          require_job "$RUN_FRONTEND" "$FRONTEND_RESULT"
          require_job "$RUN_RUST" "$RUST_TESTS_RESULT"
          require_job "$RUN_JDT" "$REAL_JDT_RESULT"
      - name: Check out the reused-result verifier
        if: needs.changes.result == 'success' && needs.changes.outputs.reuse != '{}' && needs.changes.outputs.reuse != ''
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/verify-reused-ci-jobs.mjs
          sparse-checkout-cone-mode: false

      - name: Verify reused lane results
        if: needs.changes.result == 'success' && needs.changes.outputs.reuse != '{}' && needs.changes.outputs.reuse != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LITHE_CI_REUSE: ${{ needs.changes.outputs.reuse }}
        timeout-minutes: 95
        run: node scripts/verify-reused-ci-jobs.mjs
