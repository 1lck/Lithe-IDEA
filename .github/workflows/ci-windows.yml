# Registered by the standalone preview repository.
name: Windows CI

on:
  pull_request:
    # ready_for_review reruns the deferred runner lanes after a draft is ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  # The gate reads reused jobs from earlier runs of the same pull request.
  actions: read

# Pull request runs are not cancelled per branch: the lane-reuse step keeps an
# earlier run whose lanes it reuses and cancels the others.
concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('run-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Cancels earlier runs of the same pull request that no lane reuses.
      actions: write
    outputs:
      windows: ${{ steps.classify.outputs.windows }}
      rust_core: ${{ steps.classify.outputs.rust_core }}
      windows_rust: ${{ steps.classify.outputs.windows_rust }}
      java_jdt: ${{ steps.classify.outputs.java_jdt }}
      run_frontend: ${{ steps.reuse.outputs.run_frontend }}
      run_rust: ${{ steps.reuse.outputs.run_rust }}
      run_jdt: ${{ steps.reuse.outputs.run_jdt }}
      reuse: ${{ steps.reuse.outputs.reuse }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test dependency cache tooling
        shell: bash
        run: |
          node scripts/test-verify-download-cache.mjs
          node scripts/test-reuse-worktree-resources.mjs
          node --test --test-timeout=15000 scripts/windows-tree-sitter-proxy.test.cjs
          node --test --test-timeout=15000 scripts/test-codex-config-relay.mjs

      - name: Resolve comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "manual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$PUSH_BASE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          fi
          {
            echo "manual=false"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        env:
          MANUAL: ${{ steps.base.outputs.manual }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          LITHE_CI_DRAFT_PULL_REQUEST: ${{ github.event.pull_request.draft == true }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          if [[ "$MANUAL" == "true" ]]; then
            {
              echo "rust_core=true"
              echo "windows=true"
              echo "windows_rust=true"
              echo "java_jdt=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Promoting preview to main reruns no lane; macOS CI requires the
          # preview verification of the same commit instead.
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" == "preview" && "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            export LITHE_CI_SCOPE=release_promotion
          fi
          ./scripts/classify-ci-changes.sh "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # Reuse lanes that passed (or are running) on an earlier revision of this
      # pull request when its own new changes cannot affect them.
      - name: Reuse unaffected lane results
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LITHE_CI_WORKFLOW: windows
          LITHE_CI_WORKFLOW_FILE: ci-windows.yml
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          LITHE_CI_CLASSIFICATION: |
            ci_scope=${{ steps.classify.outputs.ci_scope }}
            windows=${{ steps.classify.outputs.windows }}
            rust_core=${{ steps.classify.outputs.rust_core }}
            windows_rust=${{ steps.classify.outputs.windows_rust }}
            java_jdt=${{ steps.classify.outputs.java_jdt }}
        shell: bash
        run: node scripts/plan-ci-lane-reuse.mjs

      - name: Reject newly added Windows blocking test patterns
        if: steps.base.outputs.manual == 'false'
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        shell: bash
        run: ./.agents/skills/write-stable-tests/scripts/verify-test-stability.sh --platform windows --base "$BASE_SHA" --head "$GITHUB_SHA"

      - name: Summarize selected lanes
        shell: bash
        env:
          WINDOWS: ${{ steps.classify.outputs.windows }}
          RUST_CORE: ${{ steps.classify.outputs.rust_core }}
          WINDOWS_RUST: ${{ steps.classify.outputs.windows_rust }}
          JAVA_JDT: ${{ steps.classify.outputs.java_jdt }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          {
            echo "### Windows CI lanes"
            echo "| Lane | Run |"
            echo "| --- | --- |"
            echo "| Windows frontend tests | $WINDOWS |"
            echo "| Shared Rust Core tests | $RUST_CORE |"
            echo "| Windows Rust tests | $WINDOWS_RUST |"
            echo "| Real JDT on Windows | $JAVA_JDT |"
            if [[ "$DRAFT" == "true" ]]; then
              echo ""
              echo "Draft pull request: Windows runner lanes are deferred until it is marked ready for review."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Test Windows frontend
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: windows/tauri/package.json

      - name: Test shared editor source model
        shell: pwsh
        run: node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --working-directory frontend/editor --report .artifacts/test-stability/shared-editor.json

      - name: Test Windows dependency install recovery
        shell: pwsh
        # Native PowerShell/Job Object startup and owned-process cleanup need
        # headroom beyond the fixture's separate five second install deadlines.
        run: node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --working-directory . --max-ms 60000 --suite-timeout-ms 180000 --report .artifacts/test-stability/windows-dependency-install.json -- scripts/windows-frontend-install.test.ts

      - name: Configure isolated dependency caches
        shell: pwsh
        run: |
          # Bun's cache and temp directory must share a Windows volume so
          # lifecycle shims such as node-gyp.cmd are added to the correct PATH.
          "BUN_INSTALL_CACHE_DIR=$(Join-Path $env:GITHUB_WORKSPACE '.artifacts/bun-cache')" >> $env:GITHUB_ENV
          "BUN_TMPDIR=$(Join-Path $env:GITHUB_WORKSPACE '.artifacts/bun-tmp')" >> $env:GITHUB_ENV
          # The verified cache rejects links, so omit Bun's junction-only index.
          "BUN_FEATURE_FLAG_DISABLE_INSTALL_INDEX=1" >> $env:GITHUB_ENV

      - name: Restore Bun downloads
        id: bun-download-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: .artifacts/bun-cache
          key: lithe-${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-v2-${{ hashFiles('bun.lock') }}
          restore-keys: |
            lithe-${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-v2-

      - name: Validate restored Bun cache or fall back
        shell: pwsh
        run: |
          if ("${{ steps.bun-download-cache.outcome }}" -eq "failure") {
            Write-Output "::warning title=Bun cache restore failed::Discarding the partial Bun cache and downloading dependencies normally."
            Remove-Item -Recurse -Force -LiteralPath .artifacts/bun-cache -ErrorAction SilentlyContinue
          }
          $package = Get-Content -Raw -LiteralPath windows/tauri/package.json | ConvertFrom-Json
          $bunVersion = ([string]$package.packageManager) -replace '^bun@', ''
          node scripts/verify-download-cache.mjs `
            --bun-version $bunVersion `
            --bun-lock bun.lock `
            --bun-cache .artifacts/bun-cache
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning title=Bun cache validation failed::Discarding the untrusted Bun cache and downloading dependencies normally."
            Remove-Item -Recurse -Force -LiteralPath .artifacts/bun-cache -ErrorAction SilentlyContinue
          }
          $manifest = ".artifacts/bun-cache/.lithe-integrity.json"
          $verified = $LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $manifest -PathType Leaf)
          "LITHE_BUN_CACHE_VERIFIED=$($verified.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Install Windows frontend dependencies
        shell: pwsh
        run: ./scripts/install-windows-frontend-dependencies.ps1

      - name: Check Windows frontend types
        working-directory: windows/tauri
        shell: pwsh
        run: bun run typecheck

      - name: Build and verify optional PHP worker plugin
        shell: pwsh
        run: |
          bun scripts/build-windows-php-plugin.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-windows-plugin-isolation.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --report .artifacts/test-stability/windows-optional-plugins.json -- src/extensions/registry/extension-package-bootstrap.test.ts src/extensions/packages/local-extension-package.test.ts src/extensions/run src/extensions/ui/services/ui-extension-worker-runtime.test.ts src/extensions/registry/extension-store-lifecycle.test.ts src/features/run-actions/utils/run-action-discovery.test.ts

      - name: Verify PHP is absent from the application bundle
        shell: pwsh
        run: |
          Push-Location windows/tauri
          try {
            bun run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
          node scripts/verify-windows-plugin-isolation.mjs --dist

      - name: Upload optional PHP plugin package
        uses: actions/upload-artifact@v6
        with:
          name: windows-php-plugin
          path: .artifacts/windows-plugins/*.lithe-extension
          if-no-files-found: error

      - name: Verify Windows boundaries
        shell: pwsh
        run: ./scripts/verify-windows-boundaries.ps1

      - name: Run Windows frontend tests
        shell: pwsh
        run: |
          bun test src/platform
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 120000 --report .artifacts/test-stability/windows-documents.json -- src/features/editor/stores/editor-app.store.test.ts src/features/editor/services/document-external-change-workflow.test.ts src/features/editor/services/document-save-lifecycle.test.ts src/features/editor/services/document-watch-controller.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test src/features/editor/lsp/language-server-navigation.test.ts src/features/editor/lsp/java-navigation-marker-loader.test.ts src/features/editor/engines/monaco/definition-link-scheduler.test.ts src/features/editor/engines/monaco/java-implementation-markers.test.ts src/features/editor/engines/monaco/java-run-markers.test.ts
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-definition-link.json -- src/features/editor/engines/monaco/definition-link.test.ts src/features/editor/engines/monaco/definition-link-scheduler.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-semantic-tokens.json -- src/platform/lsp-core-adapter.test.ts src/features/editor/lsp/lsp-client-semantic-tokens.test.ts src/features/editor/lsp/lsp-client-navigation-context.test.ts src/features/editor/engines/monaco/semantic-token-provider.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-editor-ownership.json -- src/features/editor/extensions/api.owner-navigation.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-java-workspace.json -- src/features/editor/lsp/java-workspace-language-server.test.ts src/features/editor/lsp/java-workspace-change-scheduler.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-debug-events.json -- src/features/debugger/services/debug-adapter-events.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The event bridge mocks the adapter module; run the real adapter tests in a separate process.
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-debug-service.json -- src/features/debugger/services/debug-adapter-service.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 120000 --report .artifacts/test-stability/windows-maven-run-markers.json -- --preload ./src/test-utils/vite-assets.ts src/features/maven/stores/maven.store.test.ts src/features/maven/services/java-test-discovery.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 120000 --report .artifacts/test-stability/windows-run.json -- --preload ./src/test-utils/vite-assets.ts src/features/run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test src/features/file-explorer/lib/java-clipboard-class.test.ts src/features/file-explorer/lib/paste-java-class-from-clipboard.test.ts
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-file-system.json -- src/features/file-system/services/file-watcher-listener.test.ts src/features/file-system/stores/file-watcher.store.test.ts src/features/file-system/stores/recent-folders.store.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Merged notification counts rely on toast identity, so the resend path
          # stays covered instead of only its formatter.
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-notifications.json -- src/features/notifications
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test MCP delivery and authorization lifecycle
        shell: pwsh
        run: |
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --report .artifacts/test-stability/windows-mcp-lifecycle.json -- src/features/host-api/mcp-lifecycle.test.ts src/features/host-api/ide-capabilities.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The real Tauri event API must run without other suites' module mocks.
          node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --report .artifacts/test-stability/windows-mcp-events.json -- src/features/host-api/mcp-events.integration.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test declarative plugin lifecycle and UI
        shell: pwsh
        timeout-minutes: 9
        run: |
          $runner = ".agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs"
          # Native/event and presentation mocks must not leak between suites.
          $pluginSuites = @('declarative-plugin-lifecycle', 'declarative-plugin-run', 'declarative-plugin-ui', 'plugin-lifecycle-listener', 'plugin-web-open-file', 'plugin-web-appearance')
          foreach ($suite in $pluginSuites) {
            node $runner --suite-timeout-ms 60000 --report ".artifacts/test-stability/windows-$suite.json" -- "src/features/plugins/$suite.test.ts"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node $runner --suite-timeout-ms 60000 --report .artifacts/test-stability/windows-plugin-lsp-launch.json -- src/features/editor/lsp/resolve-editor-lsp-launch.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test plugin sources details build models and editor admission
        shell: pwsh
        timeout-minutes: 12
        run: |
          $runner = ".agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs"
          # Each file owns its native/DOM mocks. Leading ./ selects an exact
          # file, so the .ts source service does not also run its .tsx view.
          $suites = @(
            "src/features/plugins/declarative-marketplace-sources.test.ts",
            "src/features/plugins/declarative-marketplace-sources.test.tsx",
            "src/features/plugins/declarative-marketplace.test.ts",
            "src/features/plugins/marketplace/marketplace-types.test.ts",
            "src/features/plugins/marketplace/marketplace-session.test.ts",
            "src/features/plugins/marketplace/marketplace-section.test.tsx",
            "src/features/plugins/marketplace/marketplace-host-service.test.ts",
            "src/features/plugins/details/plugin-details.service.test.ts",
            "src/features/plugins/details/plugin-details-view.test.tsx",
            "src/features/plugins/declarative-plugin-list-model.test.ts",
            "src/features/plugins/declarative-plugins-section.test.tsx",
            "src/features/build-systems/build-systems-service.test.ts",
            "src/features/build-systems/build-systems-store.test.ts",
            "src/features/build-systems/build-run-native.test.ts",
            "src/features/build-systems/build-run-session.test.ts",
            "src/features/build-systems/build-dependencies-native.test.ts",
            "src/features/build-systems/build-dependencies-session.test.ts",
            "src/features/build-systems/components/build-dependencies.test.tsx",
            "src/features/build-systems/build-language-import.test.ts",
            "src/features/maven/services/java-maven-configuration.test.ts",
            "src/features/editor/lsp/resolve-editor-lsp-launch.test.ts",
            "src/features/plugins/plugin-web-build.test.ts",
            "src/features/build-systems/components/build-run-controls.test.tsx",
            "src/features/build-systems/components/build-model-controls.test.tsx",
            "src/features/build-systems/components/build-system-pane.test.tsx",
            "src/features/build-systems/output/build-output-store.test.ts",
            "src/features/build-systems/output/build-output-path.test.ts",
            "src/features/build-systems/output/components/build-output-pane.test.tsx",
            "src/features/build-systems/output/components/build-output-log.test.tsx",
            "src/features/build-systems/output/components/build-output-problems.test.tsx",
            "src/features/build-systems/output/components/build-output-tests.test.tsx",
            "src/features/editor/lsp/built-in-language-support.test.ts",
            "src/features/editor/lsp/declarative-language-support.test.ts",
            "src/features/editor/hooks/use-lsp-integration-declarative.test.tsx",
            "src/features/editor/hooks/use-lsp-attachment-lifecycle.test.tsx",
            "src/features/editor/hooks/use-lsp-queued-owner.test.tsx",
            "src/features/editor/lsp/lsp-client-attachment-lifecycle.test.ts",
            "src/features/editor/stores/buffer-lsp-close.test.ts"
          )
          $index = 0
          foreach ($suite in $suites) {
            $index += 1
            node $runner --suite-timeout-ms 60000 --report ".artifacts/test-stability/windows-plugin-integration-$index.json" -- "./$suite"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test plugin docking and VCS write boundaries in isolation
        shell: pwsh
        timeout-minutes: 10
        run: |
          $runner = ".agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs"
          $suites = @(
            "src/ui/search.test.tsx",
            "src/ui/info-tip.test.tsx",
            "src/ui/icons.test.tsx",
            "src/features/plugins/native-ui/native-docking.test.tsx",
            "src/features/plugins/native-ui/native-main-layout.test.tsx",
            "src/features/plugins/native-ui/native-panel.test.tsx",
            "src/features/plugins/native-ui/native-functions.test.ts",
            "src/features/layout/components/plugin-activity-rail.test.ts",
            "src/features/layout/components/bottom-pane/bottom-pane-terminal-lifecycle.test.tsx",
            "src/features/layout/actions/workbench-tool-window-actions.test.ts",
            "src/features/layout/actions/right-tool-window-actions.test.ts",
            "src/features/layout/utils/sidebar-pane-utils.test.ts",
            "src/features/vcs/vcs-resolve-cleanup.test.ts",
            "src/features/vcs/vcs-file-operations.test.ts",
            "src/features/vcs/vcs-action-controller.test.ts",
            "src/features/vcs/vcs-actions-panel.test.tsx"
          )
          $index = 0
          foreach ($suite in $suites) {
            $index += 1
            node $runner --suite-timeout-ms 60000 --report ".artifacts/test-stability/windows-plugin-docking-vcs-$index.json" -- --preload ./src/test-utils/vite-assets.ts "./$suite"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Set up Python for plugin acceptance driver checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Test plugin acceptance process ownership, marketplace and LSP fixtures
        shell: pwsh
        timeout-minutes: 4
        run: |
          python -m pip install --disable-pip-version-check playwright==1.60.0 psutil==7.2.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/plugin-host-acceptance/acceptance_driver_test.py --report .artifacts/test-stability/plugin-host-driver.json --dom-browser msedge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/plugin-host-acceptance/marketplace_acceptance_test.py --report .artifacts/test-stability/plugin-marketplace-driver.json --dom-browser msedge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/plugin-host-acceptance/lsp_lifecycle_acceptance_test.py --report .artifacts/test-stability/plugin-lsp-lifecycle-driver.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/plugin-host-acceptance/settings_functions_acceptance_test.py --report .artifacts/test-stability/plugin-settings-functions-driver.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/plugin-host-acceptance/web_bridge_fallback_acceptance_test.py --report .artifacts/test-stability/plugin-web-fallback-helpers.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/plugin-host-acceptance/text_window_acceptance_test.py --report .artifacts/test-stability/plugin-text-window-helpers.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/plugin-host-acceptance/vcs_move_diagnostic_test.py --report .artifacts/test-stability/plugin-vcs-move-driver.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-plugin-vcs-move-diagnostic.mjs --report .artifacts/test-stability/plugin-vcs-move-node.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test offline Windows build preparation
        shell: pwsh
        timeout-minutes: 4
        run: |
          @'
          import json
          import sys
          import time
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts/plugin-host-acceptance').resolve()))
          from acceptance_driver import run_bounded_process
          report = Path('.artifacts/test-stability/plugin-build-preflight.json')
          report.parent.mkdir(parents=True, exist_ok=True)
          report.write_text(json.dumps({'runner': 'acceptance', 'maxMs': 190000, 'tests': [{'name': 'offline preparation pending completion', 'status': 'incomplete', 'durationMs': 0}]}), encoding='utf-8')
          started = time.perf_counter()
          try:
              result = run_bounded_process([sys.executable, '-B', 'scripts/plugin-host-acceptance/build_preflight_test.py', '--report', str(report)], 190)
              print(result.stdout, end='')
              print(result.stderr, end='', file=sys.stderr)
              code = result.returncode
              if code != 0:
                  evidence = json.loads(report.read_text(encoding='utf-8'))
                  evidence['tests'].append({'name': 'offline preparation process result', 'status': 'failed', 'durationMs': (time.perf_counter()-started)*1000, 'message': f'process exited {code}'})
                  report.write_text(json.dumps(evidence, indent=2), encoding='utf-8')
          except Exception as error:
              evidence = json.loads(report.read_text(encoding='utf-8'))
              evidence['tests'].append({'name': 'offline preparation process owner', 'status': 'failed', 'durationMs': (time.perf_counter()-started)*1000, 'message': str(error)})
              report.write_text(json.dumps(evidence, indent=2), encoding='utf-8')
              print(error, file=sys.stderr)
              code = 1
          raise SystemExit(code)
          '@ | python -B -
          $preflightExit = $LASTEXITCODE
          node --input-type=module -e "import {writeTestReportArtifacts} from './.agents/skills/write-stable-tests/scripts/generate-test-report.mjs'; writeTestReportArtifacts('.artifacts/test-stability/plugin-build-preflight.json');"
