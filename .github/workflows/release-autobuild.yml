name: Release Autobuild

on:
  schedule:
    # China Standard Time 08:30 and 17:00 (UTC 00:30 and 09:00).
    - cron: "30 0,9 * * *"
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Optional preview branch override (defaults to the highest preview version)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-autobuild
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve autobuild source
    if: github.actor == github.repository_owner || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.preview.outputs.branch }}
      version: ${{ steps.preview.outputs.version }}
      tag: ${{ steps.preview.outputs.tag }}
      sha: ${{ steps.preview.outputs.sha }}
    steps:
      - name: Check out repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select highest preview version
        id: preview
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$SOURCE_BRANCH" ]]; then
            branch="$SOURCE_BRANCH"
          else
            mapfile -t branches < <(
              git ls-remote --heads origin 'refs/heads/preview/*' |
                awk '{sub("refs/heads/", "", $2); print $2}' |
                while read -r candidate; do
                  [[ "$candidate" =~ ^preview/[0-9]+\.[0-9]+\.[0-9]+$ ]] && printf '%s\n' "$candidate"
                done |
                sort -t/ -k2,2V
            )
            [[ ${#branches[@]} -gt 0 ]] || {
              echo "No semantic-version preview branches found" >&2
              exit 1
            }
            branch="${branches[${#branches[@]}-1]}"
          fi

          [[ "$branch" =~ ^preview/([0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
            echo "Preview branch must use preview/MAJOR.MINOR.PATCH: $branch" >&2
            exit 1
          }
          base_version="${BASH_REMATCH[1]}"
          sha=$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not resolve ${branch}" >&2; exit 1; }
          build_date=$(TZ=Asia/Shanghai date +%m%d)
          version="${base_version}+autobuild.${build_date}.${sha:0:7}"
          {
            echo "branch=$branch"
            echo "version=$version"
            echo "tag=autobuild"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  macos:
    name: Build macOS ${{ matrix.architecture }} autobuild
    needs: prepare
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]
    steps:
      - name: Check out autobuild source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.architecture == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}

      - name: Restore SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/repositories
            ~/.cache/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-6.2-${{ hashFiles('Package.resolved') }}

      - name: Restore Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-dependencies-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Build and package macOS autobuild
        env:
          LITHE_ARCH: ${{ matrix.architecture }}
          LITHE_VERSION: ${{ needs.prepare.outputs.version }}
          LITHE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./scripts/package-app.sh
          ./scripts/create-dmg.sh
          dmg_name="Lithe-${LITHE_VERSION}-${LITHE_ARCH}.dmg"
          (cd dist && shasum -a 256 "$dmg_name" > "$dmg_name.sha256")

      - name: Verify macOS autobuild artifact
        env:
          LITHE_ARCH: ${{ matrix.architecture }}
          LITHE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          app_path="dist/Lithe-${LITHE_ARCH}.app"
          dmg_path="dist/Lithe-${LITHE_VERSION}-${LITHE_ARCH}.dmg"
          codesign --verify --deep --strict "$app_path"
          lipo "$app_path/Contents/MacOS/Lithe" -verify_arch "$LITHE_ARCH"
          hdiutil imageinfo "$dmg_path" > /dev/null
          (cd dist && shasum -a 256 -c "Lithe-${LITHE_VERSION}-${LITHE_ARCH}.dmg.sha256")

      - name: Upload macOS autobuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: autobuild-macos-${{ matrix.architecture }}
          path: |
            dist/Lithe-${{ needs.prepare.outputs.version }}-${{ matrix.architecture }}.dmg
            dist/Lithe-${{ needs.prepare.outputs.version }}-${{ matrix.architecture }}.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows autobuild
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out autobuild source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Build Windows Tauri application
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Release

      - name: Package Windows autobuild installer
        shell: pwsh
        env:
          LITHE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/package-windows.ps1 -Configuration Release -Version $env:LITHE_VERSION

      - name: Verify Windows autobuild checksum
        shell: pwsh
        env:
          LITHE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $installer = "dist/Lithe-$env:LITHE_VERSION-windows-x64.exe"
          $expected = ((Get-Content "$installer.sha256" -Raw) -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Installer checksum mismatch" }

      - name: Upload Windows autobuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: autobuild-windows
          path: |
            dist/Lithe-${{ needs.prepare.outputs.version }}-windows-x64.exe
            dist/Lithe-${{ needs.prepare.outputs.version }}-windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish autobuild release
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download autobuild artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: autobuild-*
          path: dist
          merge-multiple: true

      - name: Verify downloaded checksums
        env:
          LITHE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          for architecture in arm64 x86_64; do
            (cd dist && shasum -a 256 -c "Lithe-${LITHE_VERSION}-${architecture}.dmg.sha256")
          done
          (cd dist && shasum -a 256 -c "Lithe-${LITHE_VERSION}-windows-x64.exe.sha256")

      - name: Create or update autobuild release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          LITHE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_BRANCH: ${{ needs.prepare.outputs.branch }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        shell: bash
        run: |
          notes="Daily autobuild from ${SOURCE_BRANCH} at ${SOURCE_SHA}. This rolling prerelease is replaced by the next build."
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Lithe ${LITHE_VERSION} Autobuild" \
              --notes "$notes" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "Lithe ${LITHE_VERSION} Autobuild" \
              --notes "$notes" \
              --prerelease
          fi
          gh release upload "$RELEASE_TAG" \
            dist/Lithe-${LITHE_VERSION}-arm64.dmg \
            dist/Lithe-${LITHE_VERSION}-arm64.dmg.sha256 \
            dist/Lithe-${LITHE_VERSION}-x86_64.dmg \
            dist/Lithe-${LITHE_VERSION}-x86_64.dmg.sha256 \
            dist/Lithe-${LITHE_VERSION}-windows-x64.exe \
            dist/Lithe-${LITHE_VERSION}-windows-x64.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
