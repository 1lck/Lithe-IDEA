name: Deploy Agent Notes Board

# Publishes the engineering board (Agent Notes, plus the PRs and Issues of this repository and
# the public, unarchived Lithe-IDEA repositories) and the platform feature matrix to Pages.
# The board is a snapshot: it is rebuilt after each successful Desktop Release and on demand.
# A workflow_run job runs on the default branch, which the github-pages environment admits;
# a tag-triggered job would be refused by its branch policy.
# The GitHub records read last time are kept on the engineering-board-cache data branch, so each
# run asks GitHub only for what changed (scripts/ci/deploy-agent-notes-board/board-cache.sh).
# Only the save-cache job may write to the repository; the job that reads PR and Issue text
# keeps a read-only token.
on:
  workflow_run:
    workflows: ["Desktop Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read
  pages: write
  id-token: write

concurrency:
  group: agent-notes-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Each Note's timeline is read from the first-parent history of main.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Agent Notes
        run: node scripts/agent-notes/verify-agent-notes.mjs

      - name: Generate platform feature matrix
        run: node scripts/platform-feature-matrix/generate-platform-feature-matrix.mjs

      - name: Restore engineering board cache
        run: scripts/ci/deploy-agent-notes-board/board-cache.sh restore

      - name: Build engineering board
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/lithe-agent-notes-site"
          node scripts/agent-notes/build-agent-notes-board.mjs --out "$site"
          cp -R .artifacts/platform-feature-matrix "$site/platform-feature-matrix"
          touch "$site/.nojekyll"

      - name: Upload engineering board cache
        uses: actions/upload-artifact@v7
        with:
          name: engineering-board-cache
          path: .artifacts/agent-notes-board/cache/github.json
          if-no-files-found: error
          retention-days: 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/lithe-agent-notes-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  save-cache:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download engineering board cache
        uses: actions/download-artifact@v8
        with:
          name: engineering-board-cache
          path: .artifacts/agent-notes-board/cache

      - name: Save engineering board cache
        run: scripts/ci/deploy-agent-notes-board/board-cache.sh save
