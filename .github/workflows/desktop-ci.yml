name: Desktop CI

on:
  pull_request:
    branches: [main]
    # ready_for_review runs the macOS lane that drafts defer.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Every main commit gets its own group; a PR push cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Use the release Core in CI too: Lithe-IDEA tests Go code against a pinned Core revision,
  # so sharing the ~36 MiB staged release Core across CI, AutoBuild and Release eliminates the
  # 700+ MiB debug staticlib, speeds up cgo linking, and pre-warms release caches for free.
  LITHE_DESKTOP_CORE_PROFILE: release
  CARGO_INCREMENTAL: 0

jobs:
  pins:
    name: Verify pins
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false

      # A pin that was rewritten, mistyped or left behind a force-push fails here in a minute,
      # instead of inside a cold core build in each platform lane.
      - name: Verify the viva and core pins
        run: node scripts/desktop/validate-pins.mjs

  linux:
    name: Format and script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: false

      - name: Check gofmt
        working-directory: desktop
        run: make fmt-check

      - name: Install shell check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck zsh

      - name: Check shell script syntax
        run: |
          bash -n scripts/desktop/check.sh
          bash -n scripts/desktop/build-desktop-core.sh
          bash -n scripts/desktop/build-remote-server.sh
          bash -n scripts/desktop/desktop-go.sh
          bash -n scripts/desktop/package-desktop.sh
          bash -n scripts/desktop/generate-file-associations.sh
          bash -n scripts/desktop/build-viva-tool.sh
          bash -n scripts/desktop/perf/editor-bench.sh
          bash -n scripts/ci/desktop-release/package-release.sh
          bash -n scripts/ci/desktop-release/resolve-release-version.sh
          bash -n scripts/ci/desktop-release/publish-update-feed.sh
          bash -n scripts/ci/desktop-autobuild/package-autobuild.sh
          bash -n scripts/ci/desktop-autobuild/publish-autobuild.sh
          zsh -n scripts/desktop/generate-desktop-icons.sh
          zsh -n scripts/desktop/generate-desktop-file-icons.sh

      - name: Run ShellCheck
        run: |
          shellcheck -S warning \
            scripts/desktop/check.sh \
            scripts/desktop/build-desktop-core.sh \
            scripts/desktop/build-remote-server.sh \
            scripts/desktop/desktop-go.sh \
            scripts/desktop/package-desktop.sh \
            scripts/desktop/generate-file-associations.sh \
            scripts/desktop/build-viva-tool.sh \
            scripts/desktop/perf/editor-bench.sh \
            scripts/ci/desktop-release/package-release.sh \
            scripts/ci/desktop-release/resolve-release-version.sh \
            scripts/ci/desktop-release/publish-update-feed.sh \
            scripts/ci/desktop-autobuild/package-autobuild.sh \
            scripts/ci/desktop-autobuild/publish-autobuild.sh

      - name: Verify shared localization
        run: |
          node scripts/i18n/verify-app-language-localization.mjs
          node scripts/i18n/generate-i18n.mjs --check
          node --test --test-timeout=60000 scripts/i18n/test-i18n.mjs

      - name: Verify repository metadata
        run: |
          ./scripts/platform-feature-matrix/verify-platform-feature-matrix.sh
          ./scripts/agent-notes/verify-agent-notes.sh

      - name: Require capability records for platform changes
        if: github.event_name == 'pull_request'
        env:
          MATRIX_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MATRIX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MATRIX_UPDATE_EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'matrix-exempt') }}
        run: ./scripts/platform-feature-matrix/verify-platform-feature-matrix-change.sh

      - name: Check installed resource paths
        run: |
          ./scripts/desktop/verify/verify-runtime-bundle-immutability.sh
          node --test scripts/desktop/verify/test-runtime-bundle-immutability.mjs

      - name: Run script tests
        run: |
          node --test \
            scripts/release/notes/test-validate-stable-release-notes.mjs \
            scripts/desktop/package-desktop.test.mjs \
            scripts/desktop/verify/verify-remote-server-artifacts.test.mjs \
            scripts/desktop/perf/editor-perf-report.test.mjs \
            scripts/ci/cancel-closed-pr-runs/cancel-closed-pr-runs.test.mjs \
            scripts/ci/desktop-ci/verify-ci-gate.test.mjs \
            scripts/install/linux.test.mjs
          node --test --test-concurrency=1 scripts/ci/desktop-autobuild/package-autobuild.test.mjs scripts/ci/common/desktop-packages.test.mjs scripts/ci/desktop-release/package-release.test.mjs scripts/ci/desktop-release/resolve-release-version.test.mjs scripts/ci/desktop-release/publish-update-feed.test.mjs

  linux-test:
    name: Vet and test on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Resolve pinned Core revision
        id: core-pin
        run: |
          rev="$(sed -n 's/^PINNED_CORE_REVISION="\([0-9a-f]\{40\}\)"$/\1/p' scripts/desktop/build-desktop-core.sh)"
          if [[ -z "$rev" ]]; then
            printf '%s\n' 'Could not read PINNED_CORE_REVISION from scripts/desktop/build-desktop-core.sh.' >&2
            exit 1
          fi
          printf 'revision=%s\n' "$rev" >> "$GITHUB_OUTPUT"

      - name: Restore staged release Core
        id: core-stage
        uses: actions/cache@v6
        with:
          path: .artifacts/desktop/lithe-core/x86_64-unknown-linux-gnu/release
          key: desktop-core-staged-x86_64-unknown-linux-gnu-${{ steps.rust.outputs.cachekey }}-release-${{ steps.core-pin.outputs.revision }}

      - name: Restore the core build
        if: steps.core-stage.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .artifacts/desktop/lithe-core-rust
          key: desktop-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-release-x86_64-unknown-linux-gnu-${{ steps.core-pin.outputs.revision }}
          restore-keys: |
            desktop-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-release-x86_64-unknown-linux-gnu-

      - name: Ensure Core fixtures checkout
        run: ./scripts/desktop/build-desktop-core.sh --checkout-only > /dev/null

      - name: Stage release Core
        run: ./scripts/desktop/desktop-go.sh --print-core-stage > /dev/null

      - name: Verify Core cgo cache invalidation
        run: |
          mkdir -p .artifacts/test-stability
          node --test --test-reporter=junit --test-reporter-destination=.artifacts/test-stability/core-cache.junit.xml scripts/desktop/desktop-core-cache.test.mjs

      - name: Install CJK fonts for visual evidence
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match 'sans-serif:lang=zh-cn'

      - name: Capture plugin workflow surfaces
        id: plugin-workflow-visual
        timeout-minutes: 5
        env:
          LITHE_VISUAL_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/plugin-workflow-visual
        run: |
          ./scripts/desktop/desktop-go.sh test -tags 'vivahead lithevisual' ./internal/workbench \
            -run '^TestVisualPluginWorkflow$' -count=1 -timeout=90s

      - name: Upload plugin workflow screenshots
        if: ${{ !cancelled() && steps.plugin-workflow-visual.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-workflow-visual-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/plugin-workflow-visual/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Vet and test
        run: ./scripts/desktop/check.sh

      - name: Run command test discovery headless
        id: build-command-discovery-visual
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        timeout-minutes: 5
        env:
          LITHE_VISUAL_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/build-command-discovery-visual
        run: |
          ./scripts/desktop/desktop-go.sh test -v -tags 'vivahead lithevisual' ./internal/workbench \
            -run '^TestVisualBuildCommandDiscovery$' -count=1 -timeout=120s

      - name: Upload command test discovery screenshots
        if: ${{ !cancelled() && steps.build-command-discovery-visual.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: build-command-discovery-visual-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/build-command-discovery-visual/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Run LSP editor headless tests
        id: lsp-visual
        # Capture evidence even when an unrelated test in the full suite fails.
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        timeout-minutes: 5
        env:
          LITHE_VISUAL_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/lsp-editor-visual
        run: |
          ./scripts/desktop/desktop-go.sh test -v -tags 'vivahead lithevisual' ./internal/workbench \
            -run '^(TestLSP|TestCompletionPopup|TestVisual(LSPActions|CompletionPopup|HoverContentsContract)$)' -count=1 -timeout=120s

      - name: Upload LSP editor screenshots
        if: ${{ !cancelled() && steps.lsp-visual.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: lsp-editor-visual-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/lsp-editor-visual/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Capture search screenshots
        id: search-visual
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        timeout-minutes: 5
        env:
          LITHE_VISUAL_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/search-visual
        run: |
          ./scripts/desktop/desktop-go.sh test -tags 'vivahead lithevisual' ./internal/workbench ./internal/settingswindow \
            -run '^TestVisualSearch(Results|Preferences|FirstLineLanguage)$' -count=1 -timeout=120s

      - name: Upload search screenshots
        if: ${{ !cancelled() && steps.search-visual.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: search-visual-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/search-visual/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Capture toolchain provider settings
        id: toolchain-provider-visual
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        timeout-minutes: 5
        env:
          LITHE_VISUAL_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/toolchain-provider-visual
        run: |
          for language in en zh-Hans; do
            LITHE_VISUAL_LANGUAGE="$language" LITHE_VISUAL_OUTPUT_DIR="$LITHE_VISUAL_OUTPUT_DIR/$language" \
              ./scripts/desktop/desktop-go.sh test -tags 'vivahead lithevisual' ./internal/settingswindow \
                -run '^TestVisualSettings$/^m51-toolchain-provider-installation' -count=1 -timeout=120s
          done

      - name: Upload toolchain provider settings screenshots
        if: ${{ !cancelled() && steps.toolchain-provider-visual.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: toolchain-provider-visual-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/toolchain-provider-visual/**/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Capture project tree focus regression
        id: project-tree-visual
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        timeout-minutes: 5
        env:
          LITHE_VISUAL_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/project-tree-visual
        run: |
          ./scripts/desktop/desktop-go.sh test -tags 'vivahead lithevisual' ./internal/workbench \
            -run '^TestVisualProjectTreeMissingFile$' -count=1 -timeout=120s

      - name: Upload project tree screenshots
        if: ${{ !cancelled() && steps.project-tree-visual.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: project-tree-visual-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/project-tree-visual/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Capture run performance screenshots
        id: run-performance-visual
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        timeout-minutes: 5
        env:
          LITHE_VISUAL_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/run-performance-visual
        run: |
          ./scripts/desktop/desktop-go.sh test -tags 'vivahead lithevisual' ./internal/workbench \
            -run '^TestVisualRunConsoleWrap$' -count=1 -timeout=120s

      - name: Upload run performance screenshots
        if: ${{ !cancelled() && steps.run-performance-visual.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: run-performance-visual-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/run-performance-visual/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Capture new project field descriptions
        id: new-project-visual
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        timeout-minutes: 5
        env:
          LITHE_VISUAL_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/new-project-visual
        run: |
          ./scripts/desktop/desktop-go.sh test -tags 'vivahead lithevisual' ./internal/workbench \
            -run '^TestVisualNewProjectFieldDescriptions$' -count=1 -timeout=120s

      - name: Upload new project screenshots
        if: ${{ !cancelled() && steps.new-project-visual.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: new-project-visual-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/new-project-visual/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload native verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-cache-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/test-stability/
          if-no-files-found: warn
          retention-days: 14

  # Builds the remote workspace server for linux amd64 and arm64 in one job, then smoke tests
  # each on a runner of its own architecture. Desktop Release and Desktop AutoBuild call the same
  # workflow and embed the artifact it uploads.
  remote-server:
    name: Remote server
    uses: ./.github/workflows/desktop-remote-server.yml

  macos:
    name: Vet and test on macOS
    # Draft PRs run only the Linux lane; marking the PR ready runs this one.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    # A cold build of the pinned core takes most of this.
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Resolve pinned Core revision
        id: core-pin
        run: |
          rev="$(sed -n 's/^PINNED_CORE_REVISION="\([0-9a-f]\{40\}\)"$/\1/p' scripts/desktop/build-desktop-core.sh)"
          if [[ -z "$rev" ]]; then
            printf '%s\n' 'Could not read PINNED_CORE_REVISION from scripts/desktop/build-desktop-core.sh.' >&2
            exit 1
          fi
          printf 'revision=%s\n' "$rev" >> "$GITHUB_OUTPUT"

      - name: Restore staged release Core
        id: core-stage
        uses: actions/cache@v6
        with:
          path: .artifacts/desktop/lithe-core/aarch64-apple-darwin/release
          key: desktop-core-staged-aarch64-apple-darwin-${{ steps.rust.outputs.cachekey }}-release-${{ steps.core-pin.outputs.revision }}

      - name: Restore the core build
        if: steps.core-stage.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .artifacts/desktop/lithe-core-rust
          key: desktop-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-release-aarch64-apple-darwin-${{ steps.core-pin.outputs.revision }}
          restore-keys: |
            desktop-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-release-aarch64-apple-darwin-

      - name: Ensure Core fixtures checkout
        run: ./scripts/desktop/build-desktop-core.sh --checkout-only > /dev/null

      - name: Stage release Core
        run: ./scripts/desktop/desktop-go.sh --print-core-stage > /dev/null

      - name: Verify Core cgo cache invalidation
        run: |
          mkdir -p .artifacts/test-stability
          node --test --test-reporter=junit --test-reporter-destination=.artifacts/test-stability/core-cache.junit.xml scripts/desktop/desktop-core-cache.test.mjs

      - name: Vet and test
        run: ./scripts/desktop/check.sh

      - name: Capture native settings and diagnostic screenshots
        id: native-settings-visual
        env:
          LITHE_VISUAL_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/native-settings-visual
        run: |
          ./scripts/desktop/desktop-go.sh test -tags 'vivahead lithevisual' ./internal/settingswindow ./internal/workbench -run '^(TestVisualNativeSettingsForm|TestVisualDiagnosticUnderline|TestVisualUpdatesPage|TestVisualUpdateDialog)$' -count=1 -timeout=120s
          test_bash="$BASH"
          if command -v cygpath >/dev/null 2>&1; then
            test_bash="$(cygpath -w "$BASH")"
            case "$test_bash" in
              *.[Ee][Xx][Ee]) ;;
              *) test_bash="$test_bash.exe" ;;
            esac
          fi
          for language in en zh-Hans; do
            LITHE_VISUAL_LANGUAGE="$language" LITHE_VISUAL_OUTPUT_DIR="$LITHE_VISUAL_OUTPUT_DIR/$language" \
              node .agents/skills/write-stable-tests/scripts/run-go-tests-with-timing.mjs \
                --report ".artifacts/test-stability/global-sdk-$language.json" --suite-timeout-ms 240000 -- \
                "$test_bash" scripts/desktop/desktop-go.sh test -json -tags 'vivahead lithevisual' ./internal/settingswindow \
                -run '^TestVisualSettings$/33-settings-toolchains' -count=1 -timeout=120s
          done

      - name: Upload native settings visual evidence
        if: ${{ !cancelled() && steps.native-settings-visual.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-settings-visual-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/native-settings-visual/**/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload native verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-cache-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/test-stability/
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Vet and test on Windows
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-gnu

      - name: Ensure MinGW-w64
        uses: ./.github/actions/setup-desktop-windows-build-tools
        with:
          nsis: 'false'

      - name: Resolve pinned Core revision
        id: core-pin
        run: |
          rev="$(sed -n 's/^PINNED_CORE_REVISION="\([0-9a-f]\{40\}\)"$/\1/p' scripts/desktop/build-desktop-core.sh)"
          if [[ -z "$rev" ]]; then
            printf '%s\n' 'Could not read PINNED_CORE_REVISION from scripts/desktop/build-desktop-core.sh.' >&2
            exit 1
          fi
          printf 'revision=%s\n' "$rev" >> "$GITHUB_OUTPUT"

      - name: Restore staged release Core
        id: core-stage
        uses: actions/cache@v6
        with:
          path: .artifacts/desktop/lithe-core/x86_64-pc-windows-gnu/release
          key: desktop-core-staged-x86_64-pc-windows-gnu-${{ steps.rust.outputs.cachekey }}-release-${{ steps.core-pin.outputs.revision }}

      - name: Restore the core build
        if: steps.core-stage.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .artifacts/desktop/lithe-core-rust
          key: desktop-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-release-x86_64-pc-windows-gnu-${{ steps.core-pin.outputs.revision }}
          restore-keys: |
            desktop-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-release-x86_64-pc-windows-gnu-

      - name: Ensure Core fixtures checkout
        run: ./scripts/desktop/build-desktop-core.sh --checkout-only > /dev/null

      - name: Stage release Core
        run: ./scripts/desktop/desktop-go.sh --print-core-stage > /dev/null

      - name: Verify Core cgo cache invalidation
        run: |
          mkdir -p .artifacts/test-stability
          node --test --test-reporter=junit --test-reporter-destination=.artifacts/test-stability/core-cache.junit.xml scripts/desktop/desktop-core-cache.test.mjs

      - name: Vet and test
        run: ./scripts/desktop/check.sh

      - name: Capture native settings and diagnostic screenshots
        id: native-settings-visual
        env:
          LITHE_VISUAL_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/native-settings-visual
        run: |
          ./scripts/desktop/desktop-go.sh test -tags 'vivahead lithevisual' ./internal/settingswindow ./internal/workbench -run '^(TestVisualNativeSettingsForm|TestVisualDiagnosticUnderline|TestVisualUpdatesPage|TestVisualUpdateDialog)$' -count=1 -timeout=120s
          test_bash="$BASH"
          if command -v cygpath >/dev/null 2>&1; then
            test_bash="$(cygpath -w "$BASH")"
            case "$test_bash" in
              *.[Ee][Xx][Ee]) ;;
              *) test_bash="$test_bash.exe" ;;
            esac
          fi
          for language in en zh-Hans; do
            LITHE_VISUAL_LANGUAGE="$language" LITHE_VISUAL_OUTPUT_DIR="$LITHE_VISUAL_OUTPUT_DIR/$language" \
              node .agents/skills/write-stable-tests/scripts/run-go-tests-with-timing.mjs \
                --report ".artifacts/test-stability/global-sdk-$language.json" --suite-timeout-ms 240000 -- \
                "$test_bash" scripts/desktop/desktop-go.sh test -json -tags 'vivahead lithevisual' ./internal/settingswindow \
                -run '^TestVisualSettings$/33-settings-toolchains' -count=1 -timeout=120s
          done

      - name: Upload native settings visual evidence
        if: ${{ !cancelled() && steps.native-settings-visual.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-settings-visual-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/native-settings-visual/**/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload native verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-cache-${{ runner.os }}-${{ runner.arch }}
          path: .artifacts/test-stability/
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: Desktop CI gate
    needs: [pins, linux, linux-test, remote-server, macos, windows]
    # Aggregate failures as well as successes; missing dependencies fail closed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Require every selected lane to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
        run: node scripts/ci/desktop-ci/verify-ci-gate.mjs
