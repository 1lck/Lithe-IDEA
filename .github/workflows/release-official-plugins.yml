# Releases each official downloadable plugin through its own tag series
# (`plugin-<name>-v<version>`), independent of Lithe app releases. Listing a
# release in Plugins/marketplace/index.json is a separate, idempotent job: it
# lists every tagged version the index is missing, so a run whose index pull
# request failed after the release was published recovers on the next run.
# A plugin is only released when its package directory changed and its
# plugin.json declares a version without a tag; pull requests that change a
# released plugin without bumping its version fail the check job.
name: Release Official Plugins

on:
  pull_request:
    paths:
      - "Plugins/mac/Official/**"
      - "Plugins/marketplace/**"
      - "scripts/official-plugin-releases.mjs"
  push:
    branches:
      - preview
    paths:
      - "Plugins/mac/Official/**"
      - "Plugins/marketplace/official-plugins.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-official-plugins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan plugin releases
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}

    steps:
      - name: Check out source with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test release planning
        run: node --test scripts/official-plugin-releases.test.mjs

      - name: Require a new version for changed plugins
        run: node scripts/official-plugin-releases.mjs check

      - name: Plan untagged plugin versions
        id: plan
        run: echo "releases=$(node scripts/official-plugin-releases.mjs plan)" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ matrix.release.tag }}
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/preview' && needs.plan.outputs.releases != '[]'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Swift 6.3.3 and Xcode
        uses: ./.github/actions/setup-macos-toolchain

      - name: Build and sign the plugin package
        env:
          LITHE_PLUGIN_PACKAGE_PRIVATE_KEY: ${{ secrets.LITHE_PLUGIN_PACKAGE_PRIVATE_KEY }}
          PLUGIN_ID: ${{ matrix.release.id }}
          ASSET_NAME: ${{ matrix.release.assetName }}
        run: |
          test -n "$LITHE_PLUGIN_PACKAGE_PRIVATE_KEY" || { echo "Configure LITHE_PLUGIN_PACKAGE_PRIVATE_KEY before releasing plugins"; exit 1; }
          # Declarative packages contain no native code, so one archive serves
          # every macOS architecture listed in official-plugins.json.
          plugin_root=$(scripts/build-official-plugins.sh \
            --configuration release \
            --triple arm64-apple-macosx \
            --plugin-id "$PLUGIN_ID" \
            --output dist/official-plugins)
          ditto -c -k --sequesterRsrc --keepParent "$plugin_root/$PLUGIN_ID" "dist/$ASSET_NAME"
          shasum -a 256 "dist/$ASSET_NAME" | cut -d' ' -f1 > "dist/$ASSET_NAME.sha256"

      - name: Verify the archived package
        env:
          PLUGIN_ID: ${{ matrix.release.id }}
          VERSION: ${{ matrix.release.version }}
          ASSET_NAME: ${{ matrix.release.assetName }}
        run: |
          # The build script already verified the publisher signature; check
          # that the archive users download holds exactly that package.
          mkdir -p dist/verify
          ditto -x -k "dist/$ASSET_NAME" dist/verify
          manifest="dist/verify/$PLUGIN_ID/plugin.json"
          test "$(plutil -extract id raw "$manifest")" = "$PLUGIN_ID"
          test "$(plutil -extract version raw "$manifest")" = "$VERSION"
          test -f "dist/verify/$PLUGIN_ID/lithe-plugin-signature.json"

      - name: Publish the plugin release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.release.tag }}
          ASSET_NAME: ${{ matrix.release.assetName }}
          PLUGIN_ID: ${{ matrix.release.id }}
          VERSION: ${{ matrix.release.version }}
        run: |
          # Plugin releases must never take the repository's "Latest" slot:
          # app updates resolve releases/latest/download/appcast-*.xml, which
          # only the Lithe app releases publish.
          gh release create "$TAG" "dist/$ASSET_NAME" \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "$PLUGIN_ID $VERSION" \
            --notes "Official Lithe plugin $PLUGIN_ID $VERSION. SHA-256: $(cat "dist/$ASSET_NAME.sha256")"

  sync-index:
    name: List released plugins in the official index
    needs: [plan, release]
    # Runs after releases (even when one of them failed, since only tagged
    # versions are listed), after a skipped release, and on manual reruns, so
    # a listing that failed earlier is retried.
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/preview'
      && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out source with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Open index pull requests for unlisted releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Tags created by the release job are not in this checkout yet.
          git fetch --force --tags origin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pending=$(node scripts/official-plugin-releases.mjs pending-index)
          echo "Pending: $pending"
          echo "$pending" | jq -c '.[]' | while read -r release; do
            id=$(jq -r .id <<<"$release")
            version=$(jq -r .version <<<"$release")
            tag=$(jq -r .tag <<<"$release")
            asset=$(jq -r .assetName <<<"$release")
            branch="automation/plugin-index-$tag"
            if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" != "0" ]; then
              echo "$tag already has an open index pull request"
              continue
            fi
            # The checksum comes from the asset users will download, not from
            # a local build, so a rerun lists exactly what was published.
            rm -rf dist && mkdir -p dist
            gh release download "$tag" --pattern "$asset" --dir dist
            sha=$(sha256sum "dist/$asset" | cut -d' ' -f1)
            released=$(gh release view "$tag" --json publishedAt --jq '.publishedAt[0:10]')
            git switch --force-create "$branch" origin/preview
            node scripts/official-plugin-releases.mjs update-index "$id" "$version" "$sha" "$released"
            git add Plugins/marketplace/index.json
            git commit -m "chore(plugins): 将 $id $version 加入官方插件索引"
            git push --force origin "$branch"
            gh pr create --base preview --head "$branch" \
              --title "chore(plugins): 官方插件索引加入 $id $version" \
              --body "插件发布流程已发布 \`$tag\`（资产 \`$asset\`，SHA-256 \`$sha\`）。本 PR 只把该版本的下载地址和 SHA-256 写入 \`Plugins/marketplace/index.json\`，合并后用户在插件市场刷新即可看到新版本。"
          done
