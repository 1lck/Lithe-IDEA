# Releases each official downloadable plugin through its own tag series
# (`plugin-<name>-v<version>`), independent of Lithe app releases. Listing a
# release in Plugins/marketplace/index.json is a separate, idempotent job: it
# lists every tagged version the index is missing, so a run whose index pull
# request failed after the release was published recovers on the next run.
# A plugin is only released when its package directory changed and its
# plugin.json declares a version without a tag; pull requests that change a
# released plugin without bumping its version fail the check job.
name: Release Official Plugins

on:
  pull_request:
    paths:
      - "Plugins/mac/Official/**"
      - "Plugins/win/Official/JavaSupport/**"
      - "scripts/plugins/*windows-java*.py"
      - "Plugins/marketplace/**"
      - "scripts/plugins/official-plugin-releases.mjs"
      - "scripts/plugins/official-plugin-releases.test.mjs"
      - "scripts/plugins/official-plugin-distribution.mjs"
      - "scripts/plugins/test-official-plugin-distribution.mjs"
      - "scripts/plugins/build-official-plugins.sh"
      - "scripts/macos/prepare/prepare-jdtls.sh"
      - "scripts/macos/prepare/prepare-jdk.sh"
      - "third_party/jdtls/manifest.json"
      - "third_party/jdk/manifest.json"
      - ".github/workflows/release-official-plugins.yml"
  push:
    branches:
      - preview
    paths:
      - "Plugins/mac/Official/**"
      - "Plugins/win/Official/JavaSupport/**"
      - "scripts/plugins/*windows-java*.py"
      - "Plugins/marketplace/official-plugins.json"
      - "scripts/plugins/build-official-plugins.sh"
      - "scripts/macos/prepare/prepare-jdtls.sh"
      - "scripts/macos/prepare/prepare-jdk.sh"
      - "third_party/jdtls/manifest.json"
      - "third_party/jdk/manifest.json"
      - ".github/workflows/release-official-plugins.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-official-plugins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check plugin releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Test release planning
        run: node --test --test-timeout=15000 scripts/plugins/official-plugin-releases.test.mjs scripts/plugins/test-official-plugin-distribution.mjs

      - name: Test offline Windows release route
        run: python3 scripts/plugins/test-windows-java-release.py

      - name: Require a new version for changed plugins
        run: node scripts/plugins/official-plugin-releases.mjs check

  plan:
    name: Plan new and interrupted plugin releases
    needs: check
    if: github.repository == '1lck/Lithe-IDEA' && github.event_name != 'pull_request' && github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Drafts require push access. Untrusted PR checks retain read-only permissions.
    permissions:
      contents: write
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Include interrupted drafts with their immutable target SHA
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp 'repos/{owner}/{repo}/releases?per_page=100' > "$RUNNER_TEMP/plugin-releases.json"
          echo "releases=$(node scripts/plugins/official-plugin-releases.mjs plan "$RUNNER_TEMP/plugin-releases.json")" >> "$GITHUB_OUTPUT"
          echo "pending=$(node scripts/plugins/official-plugin-releases.mjs pending-index)" >> "$GITHUB_OUTPUT"

  release:
    name: Release ${{ matrix.release.tag }}
    needs: plan
    if: github.repository == '1lck/Lithe-IDEA' && github.event_name != 'pull_request' && github.ref == 'refs/heads/preview' && needs.plan.outputs.releases != '[]'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}

    steps:
      - name: Check out immutable release revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ matrix.release.revision }}

      - name: Check out current recovery tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          path: .release-tools

      - name: Set up Swift 6.3.3 and Xcode
        uses: ./.github/actions/setup-macos-toolchain

      - name: Build, sign, and verify every architecture
        env:
          LITHE_PLUGIN_PACKAGE_PRIVATE_KEY: ${{ secrets.LITHE_PLUGIN_PACKAGE_PRIVATE_KEY }}
          RELEASE_JSON: ${{ toJSON(matrix.release) }}
        run: |
          set -euo pipefail
          test -n "$LITHE_PLUGIN_PACKAGE_PRIVATE_KEY" || { echo "Configure LITHE_PLUGIN_PACKAGE_PRIVATE_KEY before releasing plugins"; exit 1; }
          id=$(jq -r .id <<<"$RELEASE_JSON")
          version=$(jq -r .version <<<"$RELEASE_JSON")
          swift build --product LitheOfficialPluginVerifier
          swift_bin=$(swift build --show-bin-path)
          mkdir -p dist
          printf '%s\n' "$RELEASE_JSON" > dist/plan.json
          node scripts/plugins/official-plugin-releases.mjs freeze "$id" "$(jq -r .revision <<<"$RELEASE_JSON")" > dist/recomputed-plan.json
          jq -S . dist/plan.json > dist/expected.json
          jq -S . dist/recomputed-plan.json > dist/actual.json
          cmp dist/expected.json dist/actual.json
          if jq -e '.assets | any(.os == "windows")' dist/plan.json >/dev/null; then
            python3 scripts/plugins/windows-java-release.py prepare --plan dist/plan.json --output .artifacts/windows-java-support/unused --report .artifacts/windows-java-support/prepare.json --timeout-seconds 600
            swift build --configuration release --product LithePluginPackageSigner
            signer="$(swift build --configuration release --show-bin-path)/LithePluginPackageSigner"
            python3 scripts/plugins/windows-java-release.py package --plan dist/plan.json --output .artifacts/windows-java-support/published --report .artifacts/windows-java-support/package.json --signer "$signer" --timeout-seconds 900
            cp .artifacts/windows-java-support/published/*.zip .artifacts/windows-java-support/published/*.sha256 dist/
            cp .artifacts/windows-java-support/package.json dist/windows-java-release.json
          fi
          jq -c '.assets[] | select(.os != "windows")' <<<"$RELEASE_JSON" | while read -r asset; do
            name=$(jq -r .assetName <<<"$asset")
            arch=$(jq -r '.arch // "arm64"' <<<"$asset")
            plugin_root=$(scripts/plugins/build-official-plugins.sh \
              --configuration release --triple arm64-apple-macosx --arch "$arch" \
              --plugin-id "$id" --package-directory "$(jq -r .packageDirectory <<<"$asset")" --output "dist/packages/$arch")
            ditto -c -k --keepParent "$plugin_root/$id" "dist/$name"
            verify="dist/verify/$arch"
            mkdir -p "$verify"
            ditto -x -k "dist/$name" "$verify"
            manifest="$verify/$id/plugin.json"
            test "$(plutil -extract id raw "$manifest")" = "$id"
            test "$(plutil -extract version raw "$manifest")" = "$version"
            "$swift_bin/LitheOfficialPluginVerifier" "$verify/$id"
            signer="$(swift build --configuration release --triple arm64-apple-macosx --show-bin-path)/LithePluginPackageSigner"
            "$signer" --verify "$verify/$id"
            # Preserve the pinned upstream runtime's native signatures. The
            # publisher signature alone does not prove macOS can launch it.
            runtime="$verify/$id/runtime/$arch"
            if [ -d "$runtime" ]; then
              lipo "$runtime/bin/java" -verify_arch "$arch"
              codesign --verify --strict "$runtime/bin/java"
              codesign --verify --strict "$runtime/lib/server/libjvm.dylib"
            fi
            shasum -a 256 "dist/$name" | cut -d' ' -f1 > "dist/$name.sha256"
          done

      - name: Publish all architectures in one release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JSON: ${{ toJSON(matrix.release) }}
        run: |
          set -euo pipefail
          # The builder stays frozen; recovery tooling comes from this workflow
          # revision so even older interrupted drafts can resume safely.
          node .release-tools/scripts/plugins/official-plugin-releases.mjs publish dist/plan.json dist

      - name: Clean owned package verification resources
        if: always()
        run: |
          rm -rf .artifacts/windows-java-support dist/packages dist/verify

  sync-index:
    name: List released plugins in the official index
    needs: [plan, release]
    # Runs after releases (even when one of them failed, since only tagged
    # versions are listed), after a skipped release, and on manual reruns, so
    # a listing that failed earlier is retried.
    if: >-
      !cancelled()
      && github.repository == '1lck/Lithe-IDEA'
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/preview'
      && needs.plan.result == 'success'
      && (needs.plan.outputs.releases != '[]' || needs.plan.outputs.pending != '[]')
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out source with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up the existing macOS publisher verifier
        uses: ./.github/actions/setup-macos-toolchain

      - name: Open index pull requests for unlisted releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Tags created by the release job are not in this checkout yet.
          git fetch --tags origin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pending=$(node scripts/plugins/official-plugin-releases.mjs pending-index)
          echo "Pending: $pending"
          echo "$pending" | jq -c '.[]' | while read -r release; do
            id=$(jq -r .id <<<"$release")
            version=$(jq -r .version <<<"$release")
            tag=$(jq -r .tag <<<"$release")
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false || continue
            branch="automation/plugin-index-$tag"
            if [ "$(gh pr list --head "$branch" --state open --json number --jq length)" != "0" ]; then
              echo "$tag already has an open index pull request"
              continue
            fi
            # A retry reads the tagged configuration and manifest, and hashes
            # every published archive before listing this version atomically.
            rm -rf dist && mkdir -p dist
            printf '%s\n' "$release" > dist/plan.json
            checksums='{}'
            while read -r asset; do
              gh release download "$tag" --pattern "$asset" --dir dist
              gh release download "$tag" --pattern "$asset.sha256" --dir dist
              sha=$(shasum -a 256 "dist/$asset" | cut -d' ' -f1)
              test "$sha" = "$(tr -d '\r\n' < "dist/$asset.sha256")"
              checksums=$(jq -c --arg name "$asset" --arg sha "$sha" '. + {($name): $sha}' <<<"$checksums")
            done < <(jq -r '.assets[].assetName' <<<"$release")
            evidence=""
            if jq -e '.assets | any(.os == "windows")' dist/plan.json >/dev/null; then
              # Reports downloaded from a release are not trust credentials.
              # Rebuild tagged inputs and rerun the trusted signer on each ZIP.
              python3 scripts/plugins/windows-java-release.py prepare --plan dist/plan.json --output .artifacts/windows-java-support/unused --report ".artifacts/windows-java-support/$tag-prepare.json" --timeout-seconds 600
              swift build --configuration release --product LithePluginPackageSigner
              signer="$(swift build --configuration release --show-bin-path)/LithePluginPackageSigner"
              mkdir -p ".artifacts/windows-java-support/$tag-assets"
              jq -r '.assets[] | select(.os == "windows") | .assetName' dist/plan.json | while read -r asset; do
                cp "dist/$asset" ".artifacts/windows-java-support/$tag-assets/"
              done
              python3 scripts/plugins/windows-java-release.py verify --plan dist/plan.json --output ".artifacts/windows-java-support/$tag-assets" --report ".artifacts/windows-java-support/$tag-verified.json" --signer "$signer" --timeout-seconds 900
              evidence=".artifacts/windows-java-support/$tag-verified.json"
            fi
            released=$(gh release view "$tag" --json publishedAt --jq '.publishedAt[0:10]')
            git switch --force-create "$branch" origin/preview
            node scripts/plugins/official-plugin-releases.mjs update-index "$id" "$version" "$checksums" "$released" "$evidence"
            git add Plugins/marketplace/index.json
            git commit -m "chore(plugins): 将 $id $version 加入官方插件索引"
            git push --force origin "$branch"
            printf '发布流程已发布 %s。本 PR 将该版本全部架构的下载地址、实际归档 SHA-256、API 等级和能力要求写入官方索引。\n' "$tag" > dist/index-pr.md
            gh pr create --draft --base preview --head "$branch" \
              --title "chore(plugins): 官方插件索引加入 $id $version" --body-file dist/index-pr.md
          done

      - name: Clean owned index verification resources
        if: always()
        run: |
          rm -rf .artifacts/windows-java-support dist
