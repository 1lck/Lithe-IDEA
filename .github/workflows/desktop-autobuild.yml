name: Desktop AutoBuild

# Builds the Viva desktop client (desktop/) from the main branch every day and publishes it to
# the rolling prerelease desktop-AutoBuild: macOS arm64 and x64, Windows x64, and Linux x64 and arm64.
# AutoBuild runs no application tests. It checks signatures and the complete download inventory;
# Desktop Release adds platform-specific package inspection. Its tag is separate from the AutoBuild
# tag that the SwiftUI and Tauri clients' updaters read, and the release is never marked latest.
on:
  schedule:
    # 10:00 UTC, which is 18:00 in China (UTC+8).
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to build"
        required: true
        type: string
        default: main

permissions:
  contents: read

# One publication at a time; a run that starts while another publishes waits for it.
concurrency:
  group: desktop-autobuild
  cancel-in-progress: false

env:
  RELEASE_TAG: desktop-AutoBuild
  SOURCE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || 'main' }}

jobs:
  prepare:
    name: Pin the source and build identity
    if: >-
      github.event_name == 'schedule' ||
      github.actor == github.repository_owner ||
      contains(format(',{0},', vars.LITHE_RELEASE_ACTOR), format(',{0},', github.actor))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      build: ${{ steps.identity.outputs.build }}
      timestamp: ${{ steps.identity.outputs.timestamp }}
      skip: ${{ steps.identity.outputs.skip }}

    steps:
      - name: Check out the source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_BRANCH }}

      - name: Resolve the shared package matrix
        id: packages
        run: |
          matrix="$(node scripts/ci/common/desktop-packages.mjs matrix)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      # Every build job checks out this commit, so a push during the run cannot mix two sources.
      # A scheduled run whose commit is already published builds nothing.
      - name: Record the source commit and build identity
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          version="$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' desktop/viva.toml)"
          if [[ -z "$version" ]]; then
            printf '%s\n' 'desktop/viva.toml has no [app] version.' >&2
            exit 1
          fi
          read -r build timestamp < <(date -u '+%Y%m%d.%H%M%S %Y-%m-%dT%H:%M:%SZ')
          skip=false
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            published="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null || true)"
            if [[ "$published" == "$sha" ]]; then
              skip=true
              printf '%s\n' "$RELEASE_TAG already holds $SOURCE_BRANCH at $sha; nothing to build." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          {
            printf 'sha=%s\n' "$sha"
            printf 'version=%s\n' "$version"
            printf 'build=%s\n' "$build"
            printf 'timestamp=%s\n' "$timestamp"
            printf 'skip=%s\n' "$skip"
          } >> "$GITHUB_OUTPUT"

  # The remote workspace server and Windows GNU release Core are prepared in parallel on Linux
  # runners before the platform packaging jobs start.
  remote-server:
    name: Remote server
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/desktop-remote-server.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  windows-core:
    name: Cross-build Windows Core on Linux
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the pinned source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-pc-windows-gnu

      - name: Resolve pinned Core revision
        id: core-pin
        run: |
          rev="$(sed -n 's/^PINNED_CORE_REVISION="\([0-9a-f]\{40\}\)"$/\1/p' scripts/desktop/build-desktop-core.sh)"
          if [[ -z "$rev" ]]; then
            printf '%s\n' 'Could not read PINNED_CORE_REVISION from scripts/desktop/build-desktop-core.sh.' >&2
            exit 1
          fi
          printf 'revision=%s\n' "$rev" >> "$GITHUB_OUTPUT"

      - name: Restore staged Windows release Core
        id: core-stage
        uses: actions/cache@v6
        with:
          path: .artifacts/desktop/lithe-core/x86_64-pc-windows-gnu/release
          key: desktop-core-staged-x86_64-pc-windows-gnu-${{ steps.rust.outputs.cachekey }}-release-${{ steps.core-pin.outputs.revision }}

      - name: Install MinGW-w64 cross toolchain
        if: steps.core-stage.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Restore the core build
        if: steps.core-stage.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .artifacts/desktop/lithe-core-rust
          key: desktop-core-cross-Linux-x86_64-pc-windows-gnu-${{ steps.rust.outputs.cachekey }}-release-${{ steps.core-pin.outputs.revision }}
          restore-keys: |
            desktop-core-cross-Linux-x86_64-pc-windows-gnu-${{ steps.rust.outputs.cachekey }}-release-

      - name: Cross-build Windows release Core
        env:
          LITHE_CORE_TARGET: x86_64-pc-windows-gnu
        run: ./scripts/desktop/build-desktop-core.sh --release > /dev/null

      - name: Upload staged Windows release Core
        uses: actions/upload-artifact@v7
        with:
          name: core-windows-amd64-release
          path: .artifacts/desktop/lithe-core/x86_64-pc-windows-gnu/release
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  build:
    name: Package ${{ matrix.os }} ${{ matrix.arch }}
    needs: [prepare, remote-server, windows-core]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out the pinned source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # package-desktop.sh checks the builds remote-server tested against the pinned core and
      # embeds them, instead of building the server again on this runner.
      - name: Download the remote server builds
        uses: actions/download-artifact@v8
        with:
          name: remote-server-linux-musl
          path: .artifacts/desktop/remote-server/

      # Artifacts do not keep file modes.
      - name: Use the downloaded remote server builds
        run: |
          chmod 0755 .artifacts/desktop/remote-server/*/lithe-remote-server
          printf 'LITHE_REMOTE_SERVER_STAGE=%s\n' "$PWD/.artifacts/desktop/remote-server" >> "$GITHUB_ENV"

      - name: Download cross-built Windows release Core
        if: matrix.os == 'windows'
        uses: actions/download-artifact@v8
        with:
          name: core-windows-amd64-release
          path: .artifacts/desktop/lithe-core/x86_64-pc-windows-gnu/release

      - name: Restore Windows helper executable mode
        if: matrix.os == 'windows'
        run: chmod 0755 .artifacts/desktop/lithe-core/x86_64-pc-windows-gnu/release/bin/lithe-mcp.exe

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Set up Rust
        id: rust
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.rust-target }}

      - name: Ensure Windows build tools
        if: matrix.os == 'windows'
        uses: ./.github/actions/setup-desktop-windows-build-tools

      - name: Resolve pinned Core revision
        id: core-pin
        if: matrix.os != 'windows'
        run: |
          rev="$(sed -n 's/^PINNED_CORE_REVISION="\([0-9a-f]\{40\}\)"$/\1/p' scripts/desktop/build-desktop-core.sh)"
          if [[ -z "$rev" ]]; then
            printf '%s\n' 'Could not read PINNED_CORE_REVISION from scripts/desktop/build-desktop-core.sh.' >&2
            exit 1
          fi
          printf 'revision=%s\n' "$rev" >> "$GITHUB_OUTPUT"

      # The same keys as Desktop Release and Desktop CI, so all workflows share one staged release Core.
      - name: Restore staged release Core (macOS arm64)
        id: core-stage-darwin-arm64
        if: matrix.os == 'darwin'
        uses: actions/cache@v6
        with:
          path: .artifacts/desktop/lithe-core/aarch64-apple-darwin/release
          key: desktop-core-staged-aarch64-apple-darwin-${{ steps.rust.outputs.cachekey }}-release-${{ steps.core-pin.outputs.revision }}

      - name: Restore staged release Core (macOS amd64)
        id: core-stage-darwin-amd64
        if: matrix.os == 'darwin'
        uses: actions/cache@v6
        with:
          path: .artifacts/desktop/lithe-core/x86_64-apple-darwin/release
          key: desktop-core-staged-x86_64-apple-darwin-${{ steps.rust.outputs.cachekey }}-release-${{ steps.core-pin.outputs.revision }}

      - name: Restore staged release Core (Linux)
        id: core-stage-linux
        if: matrix.os == 'linux'
        uses: actions/cache@v6
        with:
          path: .artifacts/desktop/lithe-core/${{ matrix.rust-target }}/release
          key: desktop-core-staged-${{ matrix.rust-target }}-${{ steps.rust.outputs.cachekey }}-release-${{ steps.core-pin.outputs.revision }}

      - name: Restore the core build
        if: >-
          (matrix.os == 'darwin' && (steps.core-stage-darwin-arm64.outputs.cache-hit != 'true' || steps.core-stage-darwin-amd64.outputs.cache-hit != 'true')) ||
          (matrix.os == 'linux' && steps.core-stage-linux.outputs.cache-hit != 'true')
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            .artifacts/desktop/lithe-core-rust
          key: desktop-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-release-${{ matrix.os }}-${{ matrix.arch }}-${{ steps.core-pin.outputs.revision }}
          restore-keys: |
            desktop-core-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-release-${{ matrix.os }}-${{ matrix.arch }}-

      # Each platform receives only its own signing secrets.
      - name: Package
        env:
          APPLE_CERTIFICATE: ${{ matrix.os == 'darwin' && secrets.MACOS_SIGNING_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'darwin' && secrets.MACOS_SIGNING_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'darwin' && vars.MACOS_SIGNING_IDENTITY || '' }}
          WINDOWS_CERTIFICATE: ${{ matrix.os == 'windows' && secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ matrix.os == 'windows' && secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD || '' }}
          WINDOWS_TIMESTAMP_URL: ${{ matrix.os == 'windows' && secrets.WINDOWS_TIMESTAMP_SERVER || '' }}
          DESKTOP_ARCHES: ${{ matrix.arches }}
          # Every platform records the same build time and commit. The feed keys are public; the
          # private signing key never reaches a packaging runner.
          LITHE_BUILD_TIME: ${{ needs.prepare.outputs.timestamp }}
          LITHE_BUILD_COMMIT: ${{ needs.prepare.outputs.sha }}
          LITHE_UPDATE_PUBLIC_KEYS: ${{ vars.LITHE_UPDATE_PUBLIC_KEYS }}
        run: |
          for arch in $DESKTOP_ARCHES; do
            skip_check=0
            if [[ "${{ matrix.os }}" == "darwin" && "$arch" != "arm64" ]]; then
              skip_check=1
            fi
            LITHE_SKIP_FILE_ASSOCIATIONS_CHECK="$skip_check" \
              bash scripts/ci/desktop-autobuild/package-autobuild.sh "$arch"
          done

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: desktop-autobuild-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/autobuild/
          if-no-files-found: error
          # The packages are already compressed, and the release keeps the copy users download.
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish the AutoBuild
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # The publication script comes from the workflow's own commit, not from the branch being built.
      - name: Check out the publication script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}

      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-autobuild-*
          merge-multiple: true
          path: dist/autobuild

      - name: Publish to the rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
          BUILD_TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          # The same conditions under which package-autobuild.sh signs; a partial pair fails the build.
          MACOS_SIGNED: ${{ secrets.MACOS_SIGNING_CERTIFICATE != '' }}
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD != '' }}
        run: bash scripts/ci/desktop-autobuild/publish-autobuild.sh dist/autobuild

      - name: Add the release link
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
        run: |
          {
            printf '%s\n' "Published $SOURCE_BRANCH at \`$SOURCE_SHA\` as build $BUILD_NUMBER."
            printf '%s\n' "[Download this build]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
