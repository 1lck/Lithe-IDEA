# Registered by the standalone preview repository.
name: macOS CI

on:
  pull_request:
    # ready_for_review reruns the deferred runner lanes after a draft is ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - preview
  workflow_dispatch:

permissions:
  contents: read
  # The classify job reads active jobs to choose a macOS runner pool.
  actions: read

# Pull request runs are not cancelled per branch: the lane-reuse step keeps an
# earlier run whose lanes it reuses and cancels the others. Pushes and manual
# runs still cancel the previous run on the same ref.
concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('run-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Cancels earlier runs of the same pull request that no lane reuses.
      actions: write
    outputs:
      swift: ${{ steps.classify.outputs.swift }}
      swift_database: ${{ steps.classify.outputs.swift_database }}
      rust_core: ${{ steps.classify.outputs.rust_core }}
      macos_release: ${{ steps.classify.outputs.macos_release }}
      rust_comments: ${{ steps.classify.outputs.rust_comments }}
      metadata: ${{ steps.classify.outputs.metadata }}
      git_validation: ${{ steps.classify.outputs.git_validation }}
      run_swift: ${{ steps.reuse.outputs.run_swift }}
      run_rust: ${{ steps.reuse.outputs.run_rust }}
      run_release: ${{ steps.reuse.outputs.run_release }}
      reuse: ${{ steps.reuse.outputs.reuse }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test CI change classifier
        shell: bash
        run: ./scripts/test-classify-ci-changes.sh

      - name: Test release scripts and Markdown preview
        timeout-minutes: 2
        run: |
          mkdir -p .artifacts/test-stability
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=.artifacts/test-stability/sparkle-baseline.junit.xml \
            scripts/test-download-sparkle-baseline.mjs scripts/test-publish-autobuild.mjs scripts/test-reuse-worktree-resources.mjs scripts/test-markdown-preview.mjs \
            scripts/test-codex-config-relay.mjs scripts/verify-release-signature.test.mjs \
            scripts/plan-ci-lane-reuse.test.mjs scripts/verify-reused-ci-jobs.test.mjs scripts/ci-workflow-gates.test.mjs scripts/cancel-closed-pr-runs.test.mjs

      - name: Generate Sparkle download timing report
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseJUnitCases } from './.agents/skills/write-stable-tests/scripts/parse-junit-cases.mjs';
          import { writeTestReportArtifacts } from './.agents/skills/write-stable-tests/scripts/generate-test-report.mjs';
          const stem = '.artifacts/test-stability/sparkle-baseline';
          const tests = parseJUnitCases(fs.readFileSync(`${stem}.junit.xml`, 'utf8'));
          if (tests.length === 0) throw new Error('Missing Sparkle download test results');
          fs.writeFileSync(`${stem}.json`, JSON.stringify({ runner: 'node', warnMs: 1000, maxMs: 15000, tests }));
          writeTestReportArtifacts(`${stem}.json`);
          NODE

      - name: Upload Sparkle download timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stability-sparkle-baseline
          path: .artifacts/test-stability/
          if-no-files-found: error

      - name: Resolve comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "manual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$PUSH_BASE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          fi
          {
            echo "manual=false"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        env:
          MANUAL: ${{ steps.base.outputs.manual }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          LITHE_CI_DRAFT_PULL_REQUEST: ${{ github.event.pull_request.draft == true }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        shell: bash
        run: |
          if [[ "$MANUAL" == "true" ]]; then
            {
              echo "ci_scope=pull_request"
              echo "swift=true"
              echo "swift_database=true"
              echo "rust_core=true"
              echo "macos_release=true"
              echo "rust_comments=false"
              echo "metadata=true"
              echo "git_validation=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export LITHE_CI_SCOPE=pull_request
          if [[ "$EVENT_NAME" == "push" ]]; then
            LITHE_CI_SCOPE=post_merge
          elif [[ "$BASE_REF" == "main" && "$HEAD_REF" == "preview" && "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            LITHE_CI_SCOPE=release_promotion
          fi
          ./scripts/classify-ci-changes.sh "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # Promoting preview to main reruns no lane: the same commit must already
      # have passed macOS CI as a preview push.
      - name: Require the preview verification of this commit
        if: steps.classify.outputs.ci_scope == 'release_promotion'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          conclusions=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-macos.yml/runs?head_sha=$HEAD_SHA&event=push&branch=preview" \
            --jq '[.workflow_runs[] | .status + ":" + (.conclusion // "")] | join(" ")')
          echo "preview push runs for $HEAD_SHA: ${conclusions:-none}"
          if [[ " $conclusions " != *" completed:success "* ]]; then
            echo "::error::macOS CI has not passed on preview for $HEAD_SHA. Wait for the preview push run to succeed, then re-run this job."
            exit 1
          fi

      # A lane already passed (or still running) on an earlier revision of this
      # pull request is reused when none of the pull request's own new changes
      # affect it; base-branch changes only count when they touch CI.
      - name: Reuse unaffected lane results
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LITHE_CI_WORKFLOW: macos
          LITHE_CI_WORKFLOW_FILE: ci-macos.yml
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          LITHE_CI_CLASSIFICATION: |
            ci_scope=${{ steps.classify.outputs.ci_scope }}
            swift=${{ steps.classify.outputs.swift }}
            swift_database=${{ steps.classify.outputs.swift_database }}
            rust_core=${{ steps.classify.outputs.rust_core }}
            macos_release=${{ steps.classify.outputs.macos_release }}
        shell: bash
        run: node scripts/plan-ci-lane-reuse.mjs

      - name: Validate changed text
        if: steps.base.outputs.manual == 'false'
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        shell: bash
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"

      - name: Reject newly added blocking test patterns
        if: steps.base.outputs.manual == 'false'
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        shell: bash
        run: ./.agents/skills/write-stable-tests/scripts/verify-test-stability.sh --platform all --base "$BASE_SHA" --head "$GITHUB_SHA"

      - name: Set up Rust for comment verification
        if: steps.classify.outputs.rust_core == 'false' && steps.classify.outputs.rust_comments == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Rust Core comment-only changes
        if: steps.classify.outputs.rust_core == 'false' && steps.classify.outputs.rust_comments == 'true'
        shell: bash
        run: ./scripts/verify-rust-core-comments.sh

      - name: Validate lightweight metadata changes
        if: steps.classify.outputs.metadata == 'true'
        shell: bash
        run: |
          ruby -c Casks/lithe.rb
          ruby -c scripts/update-homebrew-cask.rb

      - name: Summarize selected lanes
        shell: bash
        env:
          SWIFT: ${{ steps.classify.outputs.swift }}
          SWIFT_DATABASE: ${{ steps.classify.outputs.swift_database }}
          RUST_CORE: ${{ steps.classify.outputs.rust_core }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
          MACOS_RELEASE: ${{ steps.classify.outputs.macos_release }}
          RUST_COMMENTS: ${{ steps.classify.outputs.rust_comments }}
          METADATA: ${{ steps.classify.outputs.metadata }}
          GIT_VALIDATION: ${{ steps.classify.outputs.git_validation }}
          CI_SCOPE: ${{ steps.classify.outputs.ci_scope }}
        run: |
          {
            echo "### macOS CI lanes ($CI_SCOPE)"
            echo "| Lane | Run |"
            echo "| --- | --- |"
            echo "| Swift tests | $SWIFT |"
            echo "| Swift database tests | $SWIFT_DATABASE |"
            echo "| Rust Core tests | $RUST_CORE |"
            echo "| Release package verification | $MACOS_RELEASE |"
            echo "| Rust comment verification | $RUST_COMMENTS |"
            echo "| Metadata validation | $METADATA |"
            echo "| Git performance and observation | $GIT_VALIDATION |"
            if [[ "$DRAFT" == "true" ]]; then
              echo ""
              echo "Draft pull request: macOS runner lanes are deferred until it is marked ready for review."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The main and database Swift suites share one test build. A separate database
  # job spent about ten minutes compiling the same products for seconds of
  # filtered tests and held another of the five organization macOS runners.
  # The Rust Core bridge checks reuse the same build for the same reason.
  # Plugin tests stay in macOS Plugin CI so that unrelated changes skip them.
  swift-tests:
    name: Swift tests
    needs: changes
    if: needs.changes.outputs.run_swift == 'true'
    runs-on: macos-26
    timeout-minutes: 80

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Swift 6.3.3 and Xcode
        uses: ./.github/actions/setup-macos-toolchain

      # test-macos.sh links Rust Core; install it explicitly.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare verified SwiftPM cache
        uses: ./.github/actions/prepare-macos-dependency-cache
        with:
          swiftpm: "true"
          cargo: "true"

      # Compile and discover tests before starting the test execution deadline.
      # A cold Rust/Swift build still compiling Lithe exceeded 20 minutes in
      # run 39943871840, matching the plugin lane's 39741361768. Keep this hang
      # guard separate from test execution; test steps keep their own budgets.
      - name: Build Swift tests
        id: build
        timeout-minutes: 40
        run: ./scripts/test-macos.sh list > /dev/null

      - name: Verify the Rust Core Swift bridge
        if: needs.changes.outputs.rust_core == 'true'
        timeout-minutes: 20
        run: ./scripts/verify-rust-core-swift-bridge.sh --skip-build

      - name: Run Swift unit tests
        if: needs.changes.outputs.swift == 'true'
        timeout-minutes: 17
        env:
          LITHE_AGENT_ACTIVITY_SCREENSHOTS: ${{ github.workspace }}/.artifacts/test-stability
          LITHE_AGENT_SELECTOR_SCREENSHOTS: ${{ github.workspace }}/.artifacts/test-stability
          LITHE_AGENT_EDITOR_LAYOUT_SCREENSHOTS: ${{ github.workspace }}/.artifacts/test-stability
        run: |
          mkdir -p .artifacts/test-stability
          ./.agents/skills/write-stable-tests/scripts/test-stability-macos.sh \
            --report .artifacts/test-stability/macos-unit.json \
            --suite-timeout-seconds 960 -- --skip-build \
            --skip fullSignedDiskImageStagesWithoutChangingInstalledApp \
            --skip StableRollbackDiskImageIntegrationTests \
            --skip GitStatusObservationTests \
            --skip LitheGitPerformanceTests \
            --skip '(LitheDatabaseModuleTests|LitheTests\.LitheCoreLogicTests/database)' \
            --skip '([Pp]lugin|LinuxDo)'

      - name: Run stable rollback disk image integration test
        if: needs.changes.outputs.swift == 'true'
        timeout-minutes: 3
        run: |
          # Creating and mounting a real disk image has variable runner latency.
          ./.agents/skills/write-stable-tests/scripts/test-stability-macos.sh \
            --report .artifacts/test-stability/macos-rollback-dmg.json \
            --max-seconds 45 --suite-timeout-seconds 120 -- \
            --skip-build \
            --filter fullSignedDiskImageStagesWithoutChangingInstalledApp

      - name: Run Git performance baseline
        if: needs.changes.outputs.git_validation == 'true'
        timeout-minutes: 15
        env:
          LITHE_GIT_PERFORMANCE_SKIP_TEST_BUILD: "1"
        run: ./scripts/test-git-performance-baseline.sh

      - name: Run Git status observation tests
        if: needs.changes.outputs.git_validation == 'true'
        timeout-minutes: 3
        run: |
          ./scripts/test-macos.sh \
            --skip-build \
            --filter GitStatusObservationTests

      - name: Run stable rollback disk image integration tests
        if: needs.changes.outputs.swift == 'true'
        timeout-minutes: 3
        run: |
          # Builds, signs, and mounts a real disk image; CI runners measured
          # 17-20s, so it gets its own budget instead of raising the unit lane's.
          ./.agents/skills/write-stable-tests/scripts/test-stability-macos.sh \
            --report .artifacts/test-stability/macos-rollback-dmg.json \
            --max-seconds 60 --suite-timeout-seconds 150 -- \
            --skip-build \
            --filter StableRollbackDiskImageIntegrationTests

      - name: Run database-focused Swift tests
        if: needs.changes.outputs.swift_database == 'true'
        timeout-minutes: 17
        run: ./.agents/skills/write-stable-tests/scripts/test-stability-macos.sh --report .artifacts/test-stability/macos-database.json --suite-timeout-seconds 960 -- --skip-build --filter '(LitheDatabaseModuleTests|LitheTests\.LitheCoreLogicTests/database)'

      # A failed build cannot produce reports; the build step already fails the
      # job, so do not stack a second "no reports found" failure on top of it.
      - name: Generate combined Swift test report
        if: always() && steps.build.outcome == 'success'
        run: node .agents/skills/write-stable-tests/scripts/generate-test-report.mjs

      - name: Upload Swift test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stability-macos
          path: |
            .artifacts/test-stability/
            .artifacts/performance/
          if-no-files-found: ignore
          retention-days: 14

  # Rust-only checks. The Swift-linked bridge checks run in swift-tests, which
  # already builds the app with the same Core archive.
  rust-core-tests:
    name: Rust Core tests
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: macos-26
    # A cold Rust build without a compilation cache can take 20 minutes.
    # Individual test harness deadlines still bound the integration suites.
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Swift 6.3.3 and Xcode
        uses: ./.github/actions/setup-macos-toolchain

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Prepare verified dependency caches
        uses: ./.github/actions/prepare-macos-dependency-cache
        with:
          cargo: "true"

      - name: Run Rust Core tests
        run: ./scripts/verify-rust-core-crates.sh

      - name: Upload Rust test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-core-tests-macos
          path: |
            .artifacts/test-stability/git-host-rust.*
            .artifacts/test-stability/agent-host-rust.*
            .artifacts/test-stability/ide-host-rust.*
            .artifacts/test-stability/rust-comment-checker.xml
          if-no-files-found: ignore
          retention-days: 14

  release-build:
    name: Release package verification (${{ matrix.architecture }})
    needs: changes
    if: needs.changes.outputs.run_release == 'true'
    runs-on: macos-26
    # A universal build without a Cargo compilation cache takes about 45
    # minutes: Rust and Swift compile once per slice before packaging twice.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # PRs compile only arm64 so a push does not hold a second macOS runner.
        # Preview pushes and manual runs build the universal package, which
        # compiles and links x86_64 and checks both slices with lipo.
        architecture: ${{ fromJSON(github.event_name == 'pull_request' && '["arm64"]' || '["universal"]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Bun for shared editor assets
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/editor/package.json

      - name: Test shared editor source model
        run: node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --working-directory frontend/editor --report .artifacts/test-stability/shared-editor.json

      - name: Set up Swift 6.3.3 and Xcode
        uses: ./.github/actions/setup-macos-toolchain

      - name: Test Monaco workbench in WebKit
        if: matrix.architecture != 'x86_64'
        timeout-minutes: 5
        run: ./scripts/probe-macos-monaco.sh --workbench-tests

      - name: Upload Monaco workbench test report
        if: always() && matrix.architecture != 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: monaco-workbench-${{ matrix.architecture }}
          path: .artifacts/monaco-workbench/test-results/
          if-no-files-found: ignore

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # The app bundles the Linux remote workspace servers (scripts/build-remote-servers.sh).
          targets: ${{ format('{0},x86_64-unknown-linux-musl,aarch64-unknown-linux-musl', matrix.architecture == 'arm64' && 'aarch64-apple-darwin' || matrix.architecture == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin,x86_64-apple-darwin') }}

      - name: Prepare verified dependency caches
        id: dependency_cache
        uses: ./.github/actions/prepare-macos-dependency-cache
        with:
          swiftpm: "true"
          cargo: "true"
          cargo-build: "true"
          cargo-build-architecture: ${{ matrix.architecture }}
          jdtls: "true"
          jdk: "true"
          jdk-architecture: ${{ matrix.architecture }}

      - name: Check packaging scripts and metadata
        shell: zsh {0}
        run: |
          for script in scripts/*.sh; do
            if [[ "$(head -n 1 "$script")" == "#!/bin/zsh" ]]; then
              zsh -n "$script"
            fi
          done
          ruby -c scripts/update-homebrew-cask.rb
          ruby -c scripts/create-macos-update-manifest.rb
          ruby -c scripts/test-macos-update-manifest.rb
          ruby scripts/test-macos-update-manifest.rb
          plutil -lint macos/Resources/Info.plist

      - name: Build and verify default universal package
        if: matrix.architecture == 'universal'
        env:
          # Temporary: capture disk image state around create-dmg.sh while the
          # intermittent "hdiutil: create failed - Resource busy" is diagnosed.
          LITHE_DMG_DIAGNOSTICS: "1"
        run: |
          ./scripts/verify-macos-package.sh

      - name: Verify Sparkle update packaging
        run: |
          sparkle_tools=$(zsh scripts/prepare-sparkle-tools.sh)
          ruby scripts/test-sparkle-update.rb "$sparkle_tools"

      - name: Build complete macOS test package
        id: package
        env:
          LITHE_ARCH: ${{ matrix.architecture }}
          LITHE_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        shell: bash
        run: |
          # The universal smoke test uses Java fixtures in a temporary folder.
          # Assemble again with real tools, reusing its compiled Swift/Rust files.
          ./scripts/package-app.sh
          ./scripts/create-dmg.sh
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Resources/Info.plist)
          suffix="-$LITHE_ARCH"
          if [[ "$LITHE_ARCH" == "universal" ]]; then suffix=""; fi
          app_path="dist/Lithe${suffix}.app"
          dmg_name="Lithe-${version}${suffix}.dmg"
          codesign --verify --deep --strict "$app_path"
          architectures=("$LITHE_ARCH")
          if [[ "$LITHE_ARCH" == "universal" ]]; then architectures=(arm64 x86_64); fi
          for executable in \
            "$app_path/Contents/MacOS/Lithe" \
            "$app_path/Contents/Frameworks/Sparkle.framework/Sparkle" \
            "$app_path/Contents/Helpers/lithe-db-sidecar" \
            "$app_path/Contents/Helpers/lithe-db-mcp"; do
            test -x "$executable"
            lipo "$executable" -verify_arch "${architectures[@]}"
          done
          hdiutil imageinfo "dist/$dmg_name" > /dev/null
          test -s "dist/$dmg_name"
          (cd dist && shasum -a 256 "$dmg_name" > "$dmg_name.sha256" && shasum -a 256 -c "$dmg_name.sha256")
          echo "dmg=dist/$dmg_name" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload macOS test package
        id: installer
        uses: actions/upload-artifact@v7
        with:
          name: Lithe-macos-${{ matrix.architecture }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.dmg }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Add macOS download link
        env:
          ARTIFACT_URL: ${{ steps.installer.outputs.artifact-url }}
          PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_SHA: ${{ steps.package.outputs.sha }}
        shell: bash
        run: |
          {
            echo "### macOS test download ($PACKAGE_ARCHITECTURE)"
            echo "[Download DMG and SHA-256 checksum]($ARTIFACT_URL)"
            echo ""
            echo "Source: $SOURCE_SHA"
            echo ""
            echo "Requires GitHub sign-in. Retained for 14 days. Includes the bundled Java tools."
            echo "The app is ad-hoc signed for testing. Check the CI gate for the combined test result."
          } >> "$GITHUB_STEP_SUMMARY"

      # Preview pushes save even when the job times out or a newer push cancels
      # it, so the next build resumes instead of starting cold again. Pull
      # requests restore preview's entries without saving: PR-scoped copies are
      # unreadable by preview and pushed its own entries past the cache quota.
      - name: Save Cargo compilation cache
        if: always() && github.event_name != 'pull_request'
        uses: ./.github/actions/save-macos-cargo-build-cache
        with:
          key: ${{ steps.dependency_cache.outputs.cargo-build-key }}
          exact-hit: ${{ steps.dependency_cache.outputs.cargo-build-hit }}
          job-status: ${{ job.status }}

  gate:
    name: macOS CI gate
    needs:
      - changes
      - swift-tests
      - rust-core-tests
      - release-build
    if: always() && !cancelled()
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SWIFT_RESULT: ${{ needs.swift-tests.result }}
          RUST_CORE_RESULT: ${{ needs.rust-core-tests.result }}
          RELEASE_RESULT: ${{ needs.release-build.result }}
          RUN_SWIFT: ${{ needs.changes.outputs.run_swift }}
          RUN_RUST: ${{ needs.changes.outputs.run_rust }}
          RUN_RELEASE: ${{ needs.changes.outputs.run_release }}
          SWIFT_SELECTED: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.swift_database == 'true' || needs.changes.outputs.rust_core == 'true' }}
          RUST_CORE_SELECTED: ${{ needs.changes.outputs.rust_core }}
          RELEASE_SELECTED: ${{ needs.changes.outputs.macos_release }}
          REUSE: ${{ needs.changes.outputs.reuse }}
        shell: bash
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]
          # Every selected lane either ran here or has a reused result, so a
          # missing plan can never turn into a gate that passes without tests.
          require_covered() {
            local selected="$1" ran="$2" lane="$3"
            [[ "$selected" != "true" || "$ran" == "true" ]] && return 0
            jq -e --arg lane "$lane" 'has($lane)' <<< "${REUSE:-{\}}" > /dev/null || {
              echo "::error::Lane $lane is selected but neither ran nor reused an earlier result"
              return 1
            }
          }
          require_covered "$SWIFT_SELECTED" "$RUN_SWIFT" swift
          require_covered "$RUST_CORE_SELECTED" "$RUN_RUST" rust
          require_covered "$RELEASE_SELECTED" "$RUN_RELEASE" release
          # A lane that ran must pass; a lane that did not run is either not
          # selected or reused, and reused results are checked below.
          require_job() {
            local ran="$1"
            local result="$2"
            if [[ "$ran" == "true" ]]; then
              [[ "$result" == "success" ]]
            else
              [[ "$result" == "skipped" ]]
            fi
          }
          require_job "$RUN_SWIFT" "$SWIFT_RESULT"
          require_job "$RUN_RUST" "$RUST_CORE_RESULT"
          require_job "$RUN_RELEASE" "$RELEASE_RESULT"

      - name: Check out the reused-result verifier
        if: needs.changes.result == 'success' && needs.changes.outputs.reuse != '{}' && needs.changes.outputs.reuse != ''
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/verify-reused-ci-jobs.mjs
          sparse-checkout-cone-mode: false

      - name: Verify reused lane results
        if: needs.changes.result == 'success' && needs.changes.outputs.reuse != '{}' && needs.changes.outputs.reuse != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LITHE_CI_REUSE: ${{ needs.changes.outputs.reuse }}
        timeout-minutes: 95
        run: node scripts/verify-reused-ci-jobs.mjs
