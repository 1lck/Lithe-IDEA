name: macOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.classify.outputs.plugins }}
      swift_database: ${{ steps.classify.outputs.swift_database }}
      rust_database: ${{ steps.classify.outputs.rust_database }}
      editor_tests: ${{ steps.classify.outputs.editor_tests }}
      swift: ${{ steps.classify.outputs.swift }}
      rust_core: ${{ steps.classify.outputs.rust_core }}
      macos_release: ${{ steps.classify.outputs.macos_release }}
      rust_comments: ${{ steps.classify.outputs.rust_comments }}
      metadata: ${{ steps.classify.outputs.metadata }}
      git_validation: ${{ steps.classify.outputs.git_validation }}
      macos_rollback: ${{ steps.classify.outputs.macos_rollback }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test CI classification and orchestration
        timeout-minutes: 3
        shell: bash
        run: |
          ./scripts/test-classify-ci-changes.sh
          mkdir -p .artifacts/test-stability
          node --test --test-timeout=60000 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=.artifacts/test-stability/ci-workflows.junit.xml \
            scripts/test-ci-workflows.mjs

      - name: Test release scripts and Markdown preview
        timeout-minutes: 2
        run: |
          mkdir -p .artifacts/test-stability
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=.artifacts/test-stability/sparkle-baseline.junit.xml \
            scripts/test-download-sparkle-baseline.mjs scripts/test-reuse-worktree-resources.mjs scripts/test-markdown-preview.mjs \
            scripts/test-codex-config-relay.mjs scripts/test-verify-download-cache.mjs

      - name: Generate CI tool timing reports
        if: always()
        run: node scripts/report-ci-tool-tests.mjs

      - name: Upload CI tool timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stability-ci-tooling
          path: .artifacts/test-stability/
          if-no-files-found: error

      - name: Resolve comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "manual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$PUSH_BASE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          fi
          {
            echo "manual=false"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        env:
          MANUAL: ${{ steps.base.outputs.manual }}
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        shell: bash
        run: |
          if [[ "$MANUAL" == "true" ]]; then
            {
              echo "plugins=true"
              echo "swift_database=true"
              echo "rust_database=true"
              echo "editor_tests=true"
              echo "swift=true"
              echo "rust_core=true"
              echo "macos_release=true"
              echo "rust_comments=false"
              echo "metadata=true"
              echo "git_validation=true"
              echo "macos_rollback=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ./scripts/classify-ci-changes.sh "$BASE_SHA" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Bun for selected shared editor tests
        if: steps.classify.outputs.editor_tests == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/editor/package.json

      - name: Test shared editor source model once
        if: steps.classify.outputs.editor_tests == 'true'
        timeout-minutes: 3
        run: node .agents/skills/write-stable-tests/scripts/run-bun-tests-with-timing.mjs --working-directory frontend/editor --suite-timeout-ms 120000 --report .artifacts/test-stability/shared-editor.json

      - name: Upload shared editor test reports
        if: always() && steps.classify.outputs.editor_tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-stability-shared-editor
          path: .artifacts/test-stability/shared-editor.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate changed text
        if: steps.base.outputs.manual == 'false'
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        shell: bash
        run: git diff --check "$BASE_SHA" "$GITHUB_SHA"

      - name: Reject newly added blocking test patterns
        if: steps.base.outputs.manual == 'false'
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
        shell: bash
        run: ./.agents/skills/write-stable-tests/scripts/verify-test-stability.sh --platform all --base "$BASE_SHA" --head "$GITHUB_SHA"

      - name: Set up Rust for comment verification
        if: steps.classify.outputs.rust_core == 'false' && steps.classify.outputs.rust_comments == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Validate Rust Core comment-only changes
        if: steps.classify.outputs.rust_core == 'false' && steps.classify.outputs.rust_comments == 'true'
        shell: bash
        run: ./scripts/verify-rust-core-comments.sh

      - name: Validate lightweight metadata changes
        if: steps.classify.outputs.metadata == 'true'
        shell: bash
        run: |
          ruby -c Casks/lithe.rb
          ruby -c scripts/update-homebrew-cask.rb

      - name: Summarize selected lanes
        shell: bash
        env:
          PLUGINS: ${{ steps.classify.outputs.plugins }}
          SWIFT_DATABASE: ${{ steps.classify.outputs.swift_database }}
          RUST_DATABASE: ${{ steps.classify.outputs.rust_database }}
          EDITOR_TESTS: ${{ steps.classify.outputs.editor_tests }}
          SWIFT: ${{ steps.classify.outputs.swift }}
          RUST_CORE: ${{ steps.classify.outputs.rust_core }}
          MACOS_RELEASE: ${{ steps.classify.outputs.macos_release }}
          RUST_COMMENTS: ${{ steps.classify.outputs.rust_comments }}
          METADATA: ${{ steps.classify.outputs.metadata }}
          GIT_VALIDATION: ${{ steps.classify.outputs.git_validation }}
          MACOS_ROLLBACK: ${{ steps.classify.outputs.macos_rollback }}
        run: |
          for selected in "$PLUGINS" "$SWIFT_DATABASE" "$RUST_DATABASE" "$EDITOR_TESTS" "$SWIFT" "$RUST_CORE" "$MACOS_RELEASE" "$RUST_COMMENTS" "$METADATA" "$GIT_VALIDATION" "$MACOS_ROLLBACK"; do
            if [[ "$selected" != "true" && "$selected" != "false" ]]; then
              echo "Invalid or missing macOS CI selection: $selected" >&2
              exit 1
            fi
          done
          {
            echo "### macOS CI lanes"
            echo "| Lane | Run |"
            echo "| --- | --- |"
            echo "| Swift tests | $SWIFT |"
            echo "| Plugin tests and packages | $PLUGINS |"
            echo "| Swift database tests | $SWIFT_DATABASE |"
            echo "| Rust database tests | $RUST_DATABASE |"
            echo "| Shared editor tests | $EDITOR_TESTS |"
            echo "| Rust Core tests | $RUST_CORE |"
            echo "| Release package verification | $MACOS_RELEASE |"
            echo "| Rust comment verification | $RUST_COMMENTS |"
            echo "| Metadata validation | $METADATA |"
            echo "| Git performance and observation | $GIT_VALIDATION |"
            echo "| Signed rollback disk image | $MACOS_ROLLBACK |"
          } >> "$GITHUB_STEP_SUMMARY"

  swift-tests:
    name: Swift tests
    needs: changes
    if: needs.changes.outputs.swift == 'true' || needs.changes.outputs.plugins == 'true' || needs.changes.outputs.swift_database == 'true' || needs.changes.outputs.rust_core == 'true'
    runs-on: macos-26
    # Core/bridge shares the canonical Swift build instead of a second runner.
    # Individual build and suite deadlines remain separate.
    timeout-minutes: 150

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Swift 6.3.3 and Xcode
        uses: ./.github/actions/setup-macos-toolchain

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Prepare verified SwiftPM cache
        uses: ./.github/actions/prepare-macos-dependency-cache
        with:
          swiftpm: "true"
          cargo: "true"
          cargo-build: "true"
          cargo-build-architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}

      - name: Run Rust Core tests
        if: needs.changes.outputs.rust_core == 'true'
        timeout-minutes: 20
        run: ./scripts/verify-rust-core.sh --rust-only

      # Compile and discover tests before starting the test execution deadline.
      - name: Build Swift tests
        timeout-minutes: 20
        run: ./scripts/test-macos.sh list > /dev/null

      - name: Verify Swift bridge and Git integrations
        if: needs.changes.outputs.rust_core == 'true'
        timeout-minutes: 17
        run: ./scripts/verify-rust-core.sh --bridge-only

      - name: Run Swift unit tests
        if: needs.changes.outputs.swift == 'true'
        timeout-minutes: 17
        run: |
          ./.agents/skills/write-stable-tests/scripts/test-stability-macos.sh \
            --report .artifacts/test-stability/macos-unit.json \
            --suite-timeout-seconds 960 -- --skip-build \
            --skip fullSignedDiskImageStagesWithoutChangingInstalledApp \
            --skip StableRollbackDiskImageIntegrationTests \
            --skip GitStatusObservationTests \
            --skip LitheGitPerformanceTests \
            --skip '(LitheDatabaseModuleTests|LitheTests\.LitheCoreLogicTests/database)' \
            --skip '([Pp]lugin|LitheGoSupportModuleTests|LithePhpSupportModuleTests|LinuxDo)'

      - name: Run Git performance baseline
        if: needs.changes.outputs.git_validation == 'true'
        timeout-minutes: 15
        env:
          LITHE_GIT_PERFORMANCE_SKIP_TEST_BUILD: "1"
        run: ./scripts/test-git-performance-baseline.sh

      - name: Run Git status observation tests
        if: needs.changes.outputs.git_validation == 'true'
        timeout-minutes: 3
        run: |
          ./scripts/test-macos.sh \
            --skip-build \
            --filter GitStatusObservationTests

      - name: Run stable rollback disk image integration tests
        if: needs.changes.outputs.macos_rollback == 'true'
        timeout-minutes: 3
        run: |
          # Builds, signs, and mounts a real disk image; CI runners measured
          # 17-20s, so it gets its own budget instead of raising the unit lane's.
          ./.agents/skills/write-stable-tests/scripts/test-stability-macos.sh \
            --report .artifacts/test-stability/macos-rollback-dmg.json \
            --max-seconds 60 --suite-timeout-seconds 150 -- \
            --skip-build \
            --filter StableRollbackDiskImageIntegrationTests

      - name: Run plugin-focused Swift tests
        if: needs.changes.outputs.plugins == 'true'
        timeout-minutes: 17
        run: ./.agents/skills/write-stable-tests/scripts/test-stability-macos.sh --report .artifacts/test-stability/macos-plugins.json --suite-timeout-seconds 960 -- --skip-build --filter '([Pp]lugin|LitheGoSupportModuleTests|LithePhpSupportModuleTests|LinuxDo)'

      - name: Build and verify official plugin packages
        if: needs.changes.outputs.plugins == 'true'
        timeout-minutes: 10
        run: ./scripts/verify-official-plugins.sh

      - name: Run database-focused Swift tests
        if: needs.changes.outputs.swift_database == 'true'
        timeout-minutes: 17
        run: ./.agents/skills/write-stable-tests/scripts/test-stability-macos.sh --report .artifacts/test-stability/macos-database.json --suite-timeout-seconds 960 -- --skip-build --filter '(LitheDatabaseModuleTests|LitheTests\.LitheCoreLogicTests/database)'

      - name: Generate combined Swift test report
        if: always()
        run: node .agents/skills/write-stable-tests/scripts/generate-test-report.mjs

      - name: Upload Swift test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stability-macos
          path: |
            .artifacts/test-stability/
            .artifacts/performance/
          if-no-files-found: ignore
          retention-days: 14

  release-build:
    name: Release package verification (${{ matrix.architecture }})
    needs: changes
    if: needs.changes.outputs.macos_release == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # PRs compile each architecture concurrently. Main and manual runs also
        # exercise the default universal assembly path and its negative checks.
        architecture: ${{ fromJSON(github.event_name == 'pull_request' && '["arm64","x86_64"]' || '["universal"]') }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Bun for shared editor assets
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/editor/package.json

      - name: Set up Swift 6.3.3 and Xcode
        uses: ./.github/actions/setup-macos-toolchain

      - name: Test Monaco workbench in WebKit
        if: matrix.architecture != 'x86_64'
        timeout-minutes: 5
        run: ./scripts/probe-macos-monaco.sh --workbench-tests

      - name: Upload Monaco workbench test report
        if: always() && matrix.architecture != 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: monaco-workbench-${{ matrix.architecture }}
          path: .artifacts/monaco-workbench/test-results/
          if-no-files-found: ignore

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.architecture == 'arm64' && 'aarch64-apple-darwin' || matrix.architecture == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin,x86_64-apple-darwin' }}

      - name: Prepare verified dependency caches
        uses: ./.github/actions/prepare-macos-dependency-cache
        with:
          swiftpm: "true"
          cargo: "true"
          cargo-build: "true"
          cargo-build-architecture: ${{ matrix.architecture }}
          jdtls: "true"
          jdk: "true"
          jdk-architecture: ${{ matrix.architecture }}

      - name: Check packaging scripts and metadata
        shell: zsh {0}
        run: |
          for script in scripts/*.sh; do
            if [[ "$(head -n 1 "$script")" == "#!/bin/zsh" ]]; then
              zsh -n "$script"
            fi
          done
          ruby -c scripts/update-homebrew-cask.rb
          ruby -c scripts/create-macos-update-manifest.rb
          ruby -c scripts/test-macos-update-manifest.rb
          ruby scripts/test-macos-update-manifest.rb
          plutil -lint macos/Resources/Info.plist

      - name: Build and verify default universal package
        if: matrix.architecture == 'universal'
        env:
          # Temporary: capture disk image state around create-dmg.sh while the
          # intermittent "hdiutil: create failed - Resource busy" is diagnosed.
          LITHE_DMG_DIAGNOSTICS: "1"
        run: |
          ./scripts/verify-macos-package.sh

      - name: Verify Sparkle update packaging
        run: |
          sparkle_tools=$(zsh scripts/prepare-sparkle-tools.sh)
          ruby scripts/test-sparkle-update.rb "$sparkle_tools"

      - name: Build complete macOS test package
        id: package
        env:
          LITHE_ARCH: ${{ matrix.architecture }}
          LITHE_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        shell: bash
        run: |
          # The universal smoke test uses Java fixtures in a temporary folder.
          # Assemble again with real tools, reusing its compiled Swift/Rust files.
          ./scripts/package-app.sh
          ./scripts/create-dmg.sh
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Resources/Info.plist)
          suffix="-$LITHE_ARCH"
          if [[ "$LITHE_ARCH" == "universal" ]]; then suffix=""; fi
          app_path="dist/Lithe${suffix}.app"
          dmg_name="Lithe-${version}${suffix}.dmg"
          codesign --verify --deep --strict "$app_path"
          architectures=("$LITHE_ARCH")
          if [[ "$LITHE_ARCH" == "universal" ]]; then architectures=(arm64 x86_64); fi
          for executable in \
            "$app_path/Contents/MacOS/Lithe" \
            "$app_path/Contents/Frameworks/Sparkle.framework/Sparkle" \
            "$app_path/Contents/Helpers/lithe-db-sidecar" \
            "$app_path/Contents/Helpers/lithe-db-mcp"; do
            test -x "$executable"
            lipo "$executable" -verify_arch "${architectures[@]}"
          done
          hdiutil imageinfo "dist/$dmg_name" > /dev/null
          test -s "dist/$dmg_name"
          (cd dist && shasum -a 256 "$dmg_name" > "$dmg_name.sha256" && shasum -a 256 -c "$dmg_name.sha256")
          echo "dmg=dist/$dmg_name" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload macOS test package
        id: installer
        uses: actions/upload-artifact@v7
        with:
          name: Lithe-macos-${{ matrix.architecture }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.dmg }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Add macOS download link
        env:
          ARTIFACT_URL: ${{ steps.installer.outputs.artifact-url }}
          PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_SHA: ${{ steps.package.outputs.sha }}
        shell: bash
        run: |
          {
            echo "### macOS test download ($PACKAGE_ARCHITECTURE)"
            echo "[Download DMG and SHA-256 checksum]($ARTIFACT_URL)"
            echo ""
            echo "Source: $SOURCE_SHA"
            echo ""
            echo "Requires GitHub sign-in. Retained for 14 days. Includes the bundled Java tools."
            echo "The app is ad-hoc signed for testing. Check the CI gate for the combined test result."
          } >> "$GITHUB_STEP_SUMMARY"

  rust-database-tests:
    name: Rust database tests
    needs: changes
    if: needs.changes.outputs.rust_database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Restore Cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
          key: cargo-dependencies-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Validate database container configuration
        run: docker compose -f infra/docker/database-validation/compose.yaml config --quiet

      - name: Check formatting and test database crates
        run: |
          cargo fmt --manifest-path rust/Cargo.toml -p lithe-db-sidecar -p lithe-db-mcp -- --check
          cargo test --manifest-path rust/Cargo.toml -p lithe-db-sidecar
          cargo test --manifest-path rust/Cargo.toml -p lithe-db-mcp

  gate:
    name: macOS CI gate
    needs:
      - changes
      - swift-tests
      - release-build
      - plugin-gate
      - database-gate
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        env:
          PLUGIN_SELECTED: ${{ needs.changes.outputs.plugins }}
          DATABASE_SELECTED: ${{ needs.changes.outputs.swift_database == 'true' || needs.changes.outputs.rust_database == 'true' }}
          PLUGIN_GATE_RESULT: ${{ needs.plugin-gate.result }}
          DATABASE_GATE_RESULT: ${{ needs.database-gate.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SWIFT_RESULT: ${{ needs.swift-tests.result }}
          SWIFT_SELECTED: ${{ needs.changes.outputs.swift == 'true' || needs.changes.outputs.plugins == 'true' || needs.changes.outputs.swift_database == 'true' || needs.changes.outputs.rust_core == 'true' }}
          RELEASE_SELECTED: ${{ needs.changes.outputs.macos_release }}
          RELEASE_RESULT: ${{ needs.release-build.result }}
        shell: bash
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]
          require_selected_job() {
            local selected="$1"
            local result="$2"
            if [[ "$selected" == "true" ]]; then
              [[ "$result" == "success" ]]
            elif [[ "$selected" == "false" ]]; then
              [[ "$result" == "skipped" ]]
            else
              return 1
            fi
          }
          require_selected_job "$PLUGIN_SELECTED" "$PLUGIN_GATE_RESULT"
          require_selected_job "$DATABASE_SELECTED" "$DATABASE_GATE_RESULT"
          require_selected_job "$SWIFT_SELECTED" "$SWIFT_RESULT"
          require_selected_job "$RELEASE_SELECTED" "$RELEASE_RESULT"

  plugin-gate:
    name: Plugin CI gate
    needs:
      - changes
      - swift-tests
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.plugins == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PLUGIN_SELECTED: ${{ needs.changes.outputs.plugins }}
          PLUGIN_RESULT: ${{ needs.swift-tests.result }}
        shell: bash
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$PLUGIN_SELECTED" == "true" || "$PLUGIN_SELECTED" == "false" ]]
          if [[ "$PLUGIN_SELECTED" == "true" ]]; then
            [[ "$PLUGIN_RESULT" == "success" ]]
          fi

  database-gate:
    name: Database CI gate
    needs:
      - changes
      - swift-tests
      - rust-database-tests
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.swift_database == 'true' || needs.changes.outputs.rust_database == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SWIFT_DATABASE_SELECTED: ${{ needs.changes.outputs.swift_database }}
          RUST_DATABASE_SELECTED: ${{ needs.changes.outputs.rust_database }}
          SWIFT_DATABASE_RESULT: ${{ needs.swift-tests.result }}
          RUST_DATABASE_RESULT: ${{ needs.rust-database-tests.result }}
        shell: bash
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]
          require_selected_job() {
            local selected="$1"
            local result="$2"
            if [[ "$selected" == "true" ]]; then
              [[ "$result" == "success" ]]
            elif [[ "$selected" == "false" ]]; then
              [[ "$result" == "skipped" ]]
            else
              return 1
            fi
          }
          [[ "$SWIFT_DATABASE_SELECTED" == "true" || "$SWIFT_DATABASE_SELECTED" == "false" ]]
          if [[ "$SWIFT_DATABASE_SELECTED" == "true" ]]; then
            [[ "$SWIFT_DATABASE_RESULT" == "success" ]]
          fi
          require_selected_job "$RUST_DATABASE_SELECTED" "$RUST_DATABASE_RESULT"
