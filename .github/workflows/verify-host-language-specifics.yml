name: Verify Host Language Specifics

# Host code must not name specific languages or build tools (#1495). The gate
# keeps a per-file baseline that may only go down; see
# .agents/notes/proposed/architecture/2026-11-04-java-extraction-generic-apis-and-gate.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "rust/lithe-core/src/**"
      - "macos/Sources/**"
      - "frontend/editor/src/**"
      - "shared/contracts/plugins/v1/**"
      - "windows/tauri/src/**"
      - "windows/tauri/src-tauri/src/**"
      - "scripts/architecture/verify-no-host-language-specifics*.mjs"
      - "scripts/architecture/language-specifics-*.json"
      - ".agents/skills/write-stable-tests/scripts/**"
      - ".github/workflows/verify-host-language-specifics.yml"
  push:
    branches: [preview]
    paths:
      - "rust/lithe-core/src/**"
      - "macos/Sources/**"
      - "frontend/editor/src/**"
      - "shared/contracts/plugins/v1/**"
      - "windows/tauri/src/**"
      - "windows/tauri/src-tauri/src/**"
      - "scripts/architecture/verify-no-host-language-specifics*.mjs"
      - "scripts/architecture/language-specifics-*.json"
      - ".agents/skills/write-stable-tests/scripts/**"
      - ".github/workflows/verify-host-language-specifics.yml"
  workflow_dispatch:

permissions:
  contents: read

# Every main commit gets its own group, including pending runs. PR pushes
# cancel their predecessor immediately; only completed results may be reused.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Host Language Specifics (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # HEAD^1 is the base tip of a pull request merge commit, or the
          # previous preview commit on push; --base compares against it.
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Test the gate
        timeout-minutes: 2
        run: |
          mkdir -p .artifacts/test-stability
          # Node 22 also applies this timeout to the whole file. Each case keeps
          # its explicit 15s (or lower) bound in the test file.
          node --test --test-timeout=60000 --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=.artifacts/test-stability/host-language-specifics-node.junit.xml \
            scripts/architecture/verify-no-host-language-specifics.test.mjs
      - name: Check host language specifics
        timeout-minutes: 2
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            node scripts/architecture/verify-no-host-language-specifics.mjs
          else
            node scripts/architecture/verify-no-host-language-specifics.mjs --base HEAD^1
          fi
      - name: Generate per-test timing report
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseJUnitCases } from './.agents/skills/write-stable-tests/scripts/parse-junit-cases.mjs';
          import { writeTestReportArtifacts } from './.agents/skills/write-stable-tests/scripts/generate-test-report.mjs';
          const stem = '.artifacts/test-stability/host-language-specifics-node';
          const tests = parseJUnitCases(fs.readFileSync(`${stem}.junit.xml`, 'utf8'));
          if (!tests.length) throw new Error('Missing host language specifics test durations');
          fs.writeFileSync(`${stem}.json`, JSON.stringify({ runner: 'node', warnMs: 1000, maxMs: 15000, tests }));
          writeTestReportArtifacts(`${stem}.json`);
          NODE
      - name: Upload timing report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: host-language-specifics-ubuntu-latest
          path: .artifacts/test-stability/
