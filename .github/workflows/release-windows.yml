name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Both platform workflows update the same Release and latest.json asset.
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Lithe for Windows
    if: github.actor == github.repository_owner
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $env:MANUAL_VERSION
          } else {
            $env:GITHUB_REF_NAME.Substring(1)
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release version must use the form MAJOR.MINOR.PATCH: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows Tauri application
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Configuration Release

      - name: Import Authenticode certificate
        id: signing
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) {
            Write-Output "No Authenticode certificate is configured; the Windows installer will be unsigned."
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP "lithe-signing.pfx"
          [System.IO.File]::WriteAllBytes(
            $path,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path `
            -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if ($null -eq $certificate) { throw "Could not import the Authenticode certificate." }
          "LITHE_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
          "signed=true" >> $env:GITHUB_OUTPUT

      - name: Package Windows installer
        shell: pwsh
        env:
          LITHE_VERSION: ${{ steps.version.outputs.version }}
          LITHE_WINDOWS_TIMESTAMP_SERVER: ${{ secrets.WINDOWS_TIMESTAMP_SERVER }}
          WINDOWS_RELEASE_SIGNED: ${{ steps.signing.outputs.signed }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          LITHE_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $packageArgs = @{
            Configuration = "Release"
            Version = $env:LITHE_VERSION
            UpdaterEndpoint = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json"
            RequireUpdaterArtifacts = $true
          }
          if ($env:WINDOWS_RELEASE_SIGNED -eq "true") {
            $packageArgs.RequireAuthenticodeSignature = $true
          } else {
            Write-Output "Packaging an unsigned Windows installer."
          }
          ./scripts/package-windows.ps1 @packageArgs

      - name: Create updater manifest
        shell: pwsh
        run: |
          ./scripts/create-windows-updater-manifest.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Repository "$env:GITHUB_REPOSITORY" `
            -ReleaseTag "${{ steps.version.outputs.tag }}" `
            -ReleaseNotesPath "docs/releases/v${{ steps.version.outputs.version }}.md"

      - name: Verify installer checksum
        shell: pwsh
        run: |
          $installer = "dist/Lithe-${{ steps.version.outputs.version }}-windows-x64.exe"
          $expected = ((Get-Content "$installer.sha256" -Raw) -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "Installer checksum mismatch" }

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          LITHE_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $notes = "docs/releases/v$env:LITHE_VERSION.md"
          $createArgs = @(
            $env:RELEASE_TAG,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", "Lithe $env:RELEASE_TAG"
          )
          $existing = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path -LiteralPath $notes) { $createArgs += @("--notes-file", $notes) }
            else { $createArgs += "--generate-notes" }
            gh release create @createArgs
            if ($LASTEXITCODE -ne 0) {
              $existing = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
              if ($LASTEXITCODE -ne 0) { throw "Could not create or find release $env:RELEASE_TAG" }
            }
          }

          $existingManifestDirectory = Join-Path $env:RUNNER_TEMP "lithe-existing-update-manifest"
          New-Item -ItemType Directory -Force -Path $existingManifestDirectory | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "latest.json" `
            --dir $existingManifestDirectory 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existingManifest = Get-Content -LiteralPath (Join-Path $existingManifestDirectory "latest.json") -Raw | ConvertFrom-Json
            if ($existingManifest.schemaVersion -eq 1) {
              $windowsManifest = Get-Content -LiteralPath "dist/latest.json" -Raw | ConvertFrom-Json
              foreach ($property in @("schemaVersion", "releaseURL", "assets")) {
                $windowsManifest | Add-Member -NotePropertyName $property -NotePropertyValue $existingManifest.$property -Force
              }
              $windowsManifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath "dist/latest.json" -Encoding utf8
            }
          }
          gh release upload $env:RELEASE_TAG `
            "dist/Lithe-$env:LITHE_VERSION-windows-x64.exe" `
            "dist/Lithe-$env:LITHE_VERSION-windows-x64.exe.sha256" `
            "dist/Lithe-$env:LITHE_VERSION-windows-x64-updater.exe" `
            "dist/Lithe-$env:LITHE_VERSION-windows-x64-updater.exe.sig" `
            "dist/latest.json" `
            --repo $env:GITHUB_REPOSITORY --clobber
