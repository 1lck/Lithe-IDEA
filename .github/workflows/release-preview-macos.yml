name: Release AutoBuild

on:
  schedule:
    # Scheduled runs use the default branch workflow, then check out PREVIEW_BRANCH.
    # GitHub Actions schedules are approximate and may be delayed by queueing.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Preview branch to build"
        required: true
        default: "preview"
        type: string

permissions:
  contents: read

concurrency:
  group: release-preview-macos
  cancel-in-progress: false

env:
  PREVIEW_BRANCH: preview
  PREVIEW_TAG: AutoBuild

jobs:
  prepare:
    name: Pin preview source and build identity
    if: github.actor == github.repository_owner || contains(format(',{0},', vars.LITHE_RELEASE_ACTOR), format(',{0},', github.actor)) || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      build: ${{ steps.source.outputs.build }}
      timestamp: ${{ steps.source.outputs.timestamp }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || env.PREVIEW_BRANCH }}
      - name: Record immutable build identity
        id: source
        run: |
          version=$(python3 -c 'import json; print(json.load(open("windows/tauri/src-tauri/tauri.conf.json"))["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid source version: $version" >&2; exit 1; }
          read -r build timestamp < <(date -u '+%Y%m%d.%H%M%S %Y-%m-%dT%H:%M:%SZ')
          {
            echo "version=$version"
            echo "sha=$(git rev-parse HEAD)"
            echo "build=$build"
            echo "timestamp=$timestamp"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.architecture }} preview
    needs: prepare
    if: github.actor == github.repository_owner || contains(format(',{0},', vars.LITHE_RELEASE_ACTOR), format(',{0},', github.actor)) || github.event_name == 'schedule'
    runs-on: macos-26
    # Intel packaging took ~26 minutes before Sparkle in AutoBuild run 40812978761.
    # Match stable release budgets so update generation has its own bounded window.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm64
          - x86_64

    steps:
      - name: Check out preview source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Record source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun for shared editor assets
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/editor/package.json

      - name: Set up Swift 6.3.3 and Xcode
        uses: ./.github/actions/setup-macos-toolchain

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          # The app bundles the Linux remote workspace servers (scripts/remote/build-remote-servers.sh).
          targets: ${{ format('{0},x86_64-unknown-linux-musl,aarch64-unknown-linux-musl', matrix.architecture == 'arm64' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') }}

      - name: Prepare verified dependency caches
        id: dependency_cache
        uses: ./.github/actions/prepare-macos-dependency-cache
        with:
          swiftpm: "true"
          cargo: "true"
          cargo-build: "true"
          cargo-build-architecture: ${{ matrix.architecture }}
          jdtls: "true"
          jdk: "true"
          jdk-architecture: ${{ matrix.architecture }}

      - name: Import Developer ID signing identity
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          LITHE_CODESIGN_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          if [[ -n "$MACOS_SIGNING_CERTIFICATE" ]]; then
            zsh scripts/release/macos/import-macos-signing.sh
          elif [[ -n "$MACOS_SIGNING_PASSWORD" || -n "$LITHE_CODESIGN_IDENTITY" ]]; then
            echo "Incomplete Developer ID configuration: provide the certificate or remove the optional identity and password."
            exit 1
          else
            echo "Developer ID is not configured; the preview app will be ad-hoc signed. Official plugin packages use Lithe Ed25519 signatures."
          fi

      - name: Build and package the preview app
        timeout-minutes: 35
        env:
          LITHE_ARCH: ${{ matrix.architecture }}
          LITHE_VERSION: ${{ needs.prepare.outputs.version }}
          LITHE_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
          LITHE_BUILD_TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          LITHE_BUILD_GIT_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.source_branch || env.PREVIEW_BRANCH }}
          LITHE_UPDATE_CHANNEL: preview
          LITHE_PREVIEW_TAG: ${{ env.PREVIEW_TAG }}
          LITHE_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          test -n "$LITHE_SPARKLE_PUBLIC_KEY" || { echo "Configure SPARKLE_PUBLIC_KEY before publishing preview updates"; exit 1; }
          ./scripts/macos/package/package-app.sh
          ./scripts/macos/package/create-dmg.sh
          dmg_name="Lithe-${LITHE_VERSION}-${LITHE_ARCH}.dmg"
          (cd dist && shasum -a 256 "$dmg_name" > "$dmg_name.sha256")

      - name: Verify the preview bundle and disk image
        env:
          LITHE_ARCH: ${{ matrix.architecture }}
          LITHE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          app_path="dist/Lithe-${LITHE_ARCH}.app"
          dmg_path="dist/Lithe-${LITHE_VERSION}-${LITHE_ARCH}.dmg"
          codesign --verify --deep --strict "$app_path"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app_path/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app_path/Contents/Info.plist"
          lipo "$app_path/Contents/MacOS/Lithe" -verify_arch "$LITHE_ARCH"
          hdiutil imageinfo "$dmg_path" > /dev/null
          test -s "$dmg_path"
          (cd dist && shasum -a 256 -c "Lithe-${LITHE_VERSION}-${LITHE_ARCH}.dmg.sha256")

      - name: Generate signed preview updates
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          LITHE_ARCH: ${{ matrix.architecture }}
          LITHE_VERSION: ${{ needs.prepare.outputs.version }}
          LITHE_BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
          LITHE_BUILD_TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          LITHE_UPDATE_CHANNEL: preview
          LITHE_PREVIEW_TAG: ${{ env.PREVIEW_TAG }}
          LITHE_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: zsh scripts/release/sparkle/create-sparkle-update.sh

      - name: Record artifact identity
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          PREVIEW_BUILD: ${{ needs.prepare.outputs.build }}
          LITHE_BUILD_TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          LITHE_VERSION: ${{ needs.prepare.outputs.version }}
          LITHE_ARCH: ${{ matrix.architecture }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node <<'NODE'
          require('fs').writeFileSync(`dist/identity-${process.env.LITHE_ARCH}.json`, JSON.stringify({source:process.env.SOURCE_SHA,build:process.env.PREVIEW_BUILD,timestamp:process.env.LITHE_BUILD_TIMESTAMP,version:process.env.LITHE_VERSION}));
          NODE

      - name: Upload preview artifacts
        id: artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-preview-${{ matrix.architecture }}
          path: |
            dist/identity-${{ matrix.architecture }}.json
            dist/Lithe-${{ needs.prepare.outputs.version }}-${{ matrix.architecture }}.dmg
            dist/Lithe-${{ needs.prepare.outputs.version }}-${{ matrix.architecture }}.dmg.sha256
            dist/sparkle-${{ matrix.architecture }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Add preview download link
        env:
          ARTIFACT_URL: ${{ steps.artifacts.outputs.artifact-url }}
          PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        shell: bash
        run: |
          {
            echo "### macOS preview ($PACKAGE_ARCHITECTURE)"
            echo "[Download this build]($ARTIFACT_URL)"
            echo ""
            echo "Source: $SOURCE_SHA"
            echo ""
            echo "Requires GitHub sign-in; retained for 14 days. Available before the rolling Release finishes publishing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/lithe-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/lithe-signing.keychain-db"
          fi

      - name: Save Cargo compilation cache
        if: always()
        uses: ./.github/actions/save-macos-cargo-build-cache
        with:
          key: ${{ steps.dependency_cache.outputs.cargo-build-key }}
          exact-hit: ${{ steps.dependency_cache.outputs.cargo-build-hit }}
          job-status: ${{ job.status }}

  windows:
    name: Build Windows AutoBuild
    needs: prepare
    uses: ./.github/workflows/release-preview-windows.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      build: ${{ needs.prepare.outputs.build }}
      timestamp: ${{ needs.prepare.outputs.timestamp }}
    secrets: inherit

  publish:
    name: Publish verified AutoBuild
    needs: [prepare, build, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out trusted publication implementation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: macos-preview-*
          path: dist
          merge-multiple: true
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-autobuild
          path: dist
      - name: Stage trusted plugin mirrors and publish latest complete manifest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          PREVIEW_BUILD: ${{ needs.prepare.outputs.build }}
          LITHE_BUILD_TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
          LITHE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/release/autobuild/publish-autobuild.mjs
