<!doctype html>
<html><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; worker-src blob:;">
<link rel="stylesheet" href="workbench.css">
<style>@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono-Medium.ttf") format("truetype");font-weight:500;font-style:normal;font-display:block}
@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono-SemiBold.ttf") format("truetype");font-weight:600;font-style:normal;font-display:block}
@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono-Bold.ttf") format("truetype");font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono-Italic.ttf") format("truetype");font-weight:400;font-style:italic;font-display:block}
@font-face{font-family:"JetBrains Mono";src:url("fonts/JetBrainsMono-BoldItalic.ttf") format("truetype");font-weight:700;font-style:italic;font-display:block}
html,body,.monaco-editor{font-family:"JetBrains Mono",monospace;--monaco-monospace-font:"JetBrains Mono",monospace}
html,body,#editor{height:100%;margin:0;overflow:hidden}#error{position:fixed;bottom:0;background:#8b2525;color:white;font:13px "JetBrains Mono",monospace;padding:8px;z-index:1000;display:none}</style>
<div id="editor"></div><div id="error"></div><script src="workbench.js"></script></html>
