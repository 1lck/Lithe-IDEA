[package]
name = "lithe-git-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Git process adapter for Lithe hosts"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Security"] }
