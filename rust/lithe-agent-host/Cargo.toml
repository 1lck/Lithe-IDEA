[package]
name = "lithe-agent-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared ACP session and agent process host for Lithe"

[dependencies]
agent-client-protocol = "=2.2.0"
futures = "0.3"
kill_tree = { version = "0.2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "test-util"] }
