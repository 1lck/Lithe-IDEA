[package]
name = "lithe-remote-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Workspace server that Lithe starts on SSH hosts and in containers"
publish = false

# The server runs on Linux and macOS hosts only. Linux builds target musl so a
# single static binary works across distributions and minimal images.
[dependencies]
libc = "0.2"
lithe-remote-protocol = { path = "../lithe-remote-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
trash = { version = "5.2.6", default-features = false, features = ["chrono"] }

[dev-dependencies]
lithe-remote-client = { path = "../lithe-remote-client" }
