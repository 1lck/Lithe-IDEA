[package]
name = "lithe-linux"
version = "0.1.0"
edition = "2021"

[dependencies]
rfd = "0.16"
gpui-kit = { version = "0.6", features = [
    "tree-sitter-bash",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-markdown-inline",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
lithe-core = { path = "../rust/lithe-core" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
