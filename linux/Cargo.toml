[package]
name = "lithe-linux"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui-kit = "0.6"
lithe-core = { path = "../rust/lithe-core" }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
