[package]
name = "lithe-legacy-tooling"
version = "0.1.0"
# Edition 2021 on purpose: most of this crate is code copied verbatim from
# lithe-core, which is an edition 2021 crate. Keeping the edition means the
# copies behave exactly as they did there, which is the whole point of the crate.
edition = "2021"

[dependencies]
lithe-core = { path = "../../../../rust/lithe-core" }
quick-xml = "0.37"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tree-sitter = "0.25"
tree-sitter-java = "0.23"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
