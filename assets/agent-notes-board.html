<script>
window.__LITHE_BOARD_MODE__ = "static";
</script>
<script>
'use strict';
// The board reads data/index.json (lists, relations, Notes) and fetches PR and Issue bodies
// from data/bodies/<shard>.json when a drawer opens. The build script and the local server
// write both; see scripts/agent-notes/engineering-board-model.mjs.
const L = window.LitheEngineeringBoardLinks;
const MODE = window.__LITHE_BOARD_MODE__;
// The local server's data changes in memory, so live mode never reuses a stored copy. The
// published site changes only at release time: revalidating lets the browser keep its copy
// and receive 304 Not Modified until a new snapshot is deployed.
const FETCH_CACHE = MODE === 'live' ? 'no-store' : 'no-cache';
const PAGE = 200;
const DAY = 864e5;
const LIFE = { implemented: '已落地', proposed: '待评审', rejected: '已否决', archived: '已归档' };
const CLASSES = ['architecture', 'feature', 'bug-fix', 'simplification', 'process', 'testing'];
const CLASS_LABELS = { architecture: '架构设计', feature: '功能特性', 'bug-fix': '缺陷修复', simplification: '化简裁撤', process: '流程规范', testing: '测试基建' };
const ACT = { A: '新增', M: '修改', R: '移动', D: '删除' };
const EXTERNAL = new Set(['CONTRIBUTOR', 'FIRST_TIME_CONTRIBUTOR', 'FIRST_TIMER', 'NONE', 'MANNEQUIN']);
const REL_TEXT = {
  closes: { out: '解决', in: '解决它' }, refs: { out: '相关', in: '相关' }, mention: { out: '提到', in: '提到它' },
  body: { out: '正文提到', in: '正文提到它' }, cites: { out: '引用', in: '被引用' },
  A: '新增', M: '修改', R: '移动', D: '删除', sibling: '同一 Issue',
};
const STRONG = new Set(['closes', 'refs', 'A', 'M', 'R', 'D']);
const ROLE_ORDER = { app: 0, core: 1, store: 2, fork: 3, plugin: 4, other: 5 };
const TABS = ['monitor', 'prs', 'issues', 'notes'];
const SUBS = ['baseline', 'timeline', 'alternatives', 'directory'];

const S = {
  idx: null, byKey: new Map(), noteById: new Map(), repoBy: new Map(), canon: new Map(), adj: new Map(),
  inCount: new Map(), slugToId: new Map(), scanner: null,
  tab: 'monitor', sub: 'baseline', stack: [], bodies: new Map(), live: null,
  f: {
    mon: { kind: '', sig: 'attention', repo: '', sort: 'new' },
    pr: { state: '', type: '', repo: '', link: '' },
    issue: { state: '', pr: '', repo: '' },
    timeline: { month: '', cls: '' },
    dir: { st: '', cls: '', sort: 'new', q: '' },
    alt: '',
  },
  shown: { mon: PAGE, pr: PAGE, issue: PAGE },
  allRepos: false,
};

/* ---------- 基础 ---------- */
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const unesc = (v) => String(v).replace(/&(amp|lt|gt|quot|#39);/g, (_, e) => ({ amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'" })[e]);
const fmtDate = (iso) => (iso ? iso.slice(0, 10) : '');
const fmtTime = (iso) => (iso ? new Date(iso).toLocaleString('zh-CN', { hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '');
const daysSince = (iso) => (iso ? Math.floor((Date.now() - Date.parse(iso)) / DAY) : 0);
function ago(iso) {
  if (!iso) return '';
  const m = Math.floor((Date.now() - Date.parse(iso)) / 6e4);
  if (m < 1) return '刚刚';
  if (m < 60) return `${m} 分钟前`;
  if (m < 1440) return `${Math.floor(m / 60)} 小时前`;
  const d = Math.floor(m / 1440);
  return d < 60 ? `${d} 天前` : fmtDate(iso);
}
const primary = () => S.idx.primaryRepo;
const repoInfo = (full) => S.repoBy.get(full) || { full, label: full, role: 'other', url: `https://github.com/${full}` };
const refName = (repo, n) => (repo === primary() ? `#${n}` : `${repoInfo(repo).label} #${n}`);
const repoTag = (repo) => (repo === primary() ? '' : `<span class="repo-tag role-${repoInfo(repo).role}" title="${esc(repo)}">${esc(repoInfo(repo).label)}</span>`);
const ghItemUrl = (repo, n, kind) => `https://github.com/${repo}/${kind === 'pr' ? 'pull' : 'issues'}/${n}`;
// The number of a PR or Issue links to its GitHub page in a new tab, wherever it is printed.
const ghLink = (it, text = `#${it.n}`) => `<a class="gh" href="${esc(ghItemUrl(it.repo, it.n, it.kind))}" target="_blank" rel="noopener" title="在 GitHub 打开 ${esc(refName(it.repo, it.n))}">${esc(text)}</a>`;
const noteUrl = (id) => `https://github.com/${primary()}/blob/main/.agents/notes/${id}`;
const kindOf = (k) => (k.startsWith('note:') ? 'note' : S.byKey.get(k)?.kind);
const known = (k) => (k.startsWith('note:') ? S.noteById.has(k.slice(5)) : S.byKey.has(k));

function prState(p) {
  if (p.state === 'MERGED') return { cls: 's-merged', label: '已合入', color: 'var(--purple)' };
  if (p.state === 'CLOSED') return { cls: 's-closed', label: '已关闭', color: 'var(--red)' };
  if (p.draft) return { cls: 's-draft', label: '草稿', color: '#64748B' };
  return { cls: 's-open', label: '打开', color: 'var(--green)' };
}
function issueState(i) {
  if (i.state === 'OPEN') return { cls: 's-open', label: '打开', color: 'var(--green)' };
  if (i.reason === 'NOT_PLANNED') return { cls: 's-np', label: '不计划', color: '#64748B' };
  if (i.reason === 'DUPLICATE') return { cls: 's-np', label: '重复', color: '#64748B' };
  return { cls: 's-done', label: '已完成', color: 'var(--purple)' };
}
const stateOf = (it) => (it.kind === 'pr' ? prState(it) : issueState(it));
function prType(title) {
  const m = /^(\w+)(?:\(([^)]*)\))?!?:\s*(.*)$/.exec(title);
  if (!m) return { type: 'other', raw: '', scope: '', rest: title };
  const t = m[1].toLowerCase();
  return { type: ['feat', 'fix', 'docs', 'release'].includes(t) ? t : 'other', raw: t, scope: m[2] || '', rest: m[3] || title };
}
function issueTag(title) {
  const m = /^\[([^\]]+)\]\s*(.*)$/.exec(title);
  return m ? { tag: m[1], rest: m[2] || title } : { tag: '', rest: title };
}
const shortTitle = (it) => (it.kind === 'pr' ? prType(it.title).rest : issueTag(it.title).rest);
function stateIcon(it) {
  const s = stateOf(it);
  if (it.kind === 'pr') {
    return `<svg class="dot" viewBox="0 0 16 16" fill="${s.color}"><path d="M5 3.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm0 2.122a2.25 2.25 0 1 0-1.5 0v5.256a2.251 2.251 0 1 0 1.5 0Zm7.5-.122v4.878a2.25 2.25 0 1 1-1.5 0V5.25A1.75 1.75 0 0 0 9.25 3.5H8.06l.97.97a.75.75 0 0 1-1.06 1.06L5.72 3.28a.75.75 0 0 1 0-1.06l2.25-2.25a.75.75 0 0 1 1.06 1.06l-.97.97h1.19a3.25 3.25 0 0 1 3.25 3.25Z"/></svg>`;
  }
  return `<svg class="dot" viewBox="0 0 16 16" fill="${s.color}"><path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"/></svg>`;
}
function labelChips(labels, max = 99) {
  return labels.slice(0, max).map(([name, color]) => {
    const c = /^[0-9a-f]{6}$/i.test(color || '') ? `#${color}` : 'var(--ink-3)';
    return `<span class="lbl"><i style="background:${c}"></i>${esc(name)}</span>`;
  }).join('');
}
const isExternal = (it) => !it.bot && EXTERNAL.has(it.assoc);

/* ---------- 数据与关联 ---------- */
function ingest(idx) {
  S.idx = idx;
  S.byKey = new Map(idx.items.map((it) => [it.k, it]));
  S.noteById = new Map(idx.notes.map((n) => [n.id, n]));
  S.repoBy = new Map(idx.repos.map((r) => [r.full, r]));
  S.canon = new Map(idx.repos.map((r) => [r.full.toLowerCase(), r.full]));
  S.slugToId = new Map(idx.notes.map((n) => [n.slug, n.id]));
  S.scanner = L.createRefScanner({
    repos: [...new Set([...idx.repos.map((r) => r.full), ...Object.values(idx.prefixes)])],
    prefixes: idx.prefixes,
  });
  S.adj = new Map();
  const add = (a, entry) => { if (!S.adj.has(a)) S.adj.set(a, []); S.adj.get(a).push(entry); };
  for (const [from, to, rel] of idx.relations) {
    add(from, { key: to, rel, dir: 'out' });
    add(to, { key: from, rel, dir: 'in' });
  }
  S.inCount = new Map();
  for (const n of idx.notes) {
    for (const t of n.outLinks) {
      if (!S.noteById.has(t) || t === n.id) continue;
      S.inCount.set(t, (S.inCount.get(t) || 0) + 1);
      add(L.noteKey(n.id), { key: L.noteKey(t), rel: 'cites', dir: 'out' });
      add(L.noteKey(t), { key: L.noteKey(n.id), rel: 'cites', dir: 'in' });
    }
  }
  S.stack = S.stack.filter(known);
}
const rank = (rel) => (rel === 'cites' ? 4.5 : rel === 'sibling' ? 5.5 : L.relRank(rel));
function stamp(k) {
  if (k.startsWith('note:')) { const n = S.noteById.get(k.slice(5)); return n?.history[0]?.date || n?.date || ''; }
  return S.byKey.get(k)?.updated || '';
}
function neighbors(k, kind, { strongOnly = false } = {}) {
  const best = new Map();
  for (const e of S.adj.get(k) || []) {
    if (e.key === k || kindOf(e.key) !== kind || (strongOnly && !STRONG.has(e.rel))) continue;
    const cur = best.get(e.key);
    if (!cur || rank(e.rel) < rank(cur.rel)) best.set(e.key, e);
  }
  return [...best.values()].sort((a, b) => rank(a.rel) - rank(b.rel) || stamp(b.key).localeCompare(stamp(a.key)));
}
function uniq(list) {
  const seen = new Set();
  return list.filter((e) => !seen.has(e.key) && seen.add(e.key));
}
function relText(e) {
  const t = REL_TEXT[e.rel];
  if (!t) return '';
  return typeof t === 'string' ? t : t[e.dir] || t.out;
}

/* ---------- 监控信号 ---------- */
// hot marks the signals that put an open item in the「需要关注」queue.
function signals(it) {
  const out = [];
  if (it.kind === 'pr') {
    if (it.draft) out.push({ k: 'draft', cls: 'draft', t: '草稿' });
    else if (it.review === 'CHANGES_REQUESTED') out.push({ k: 'changes', cls: 'bad', t: '要求修改', hot: true });
    else if (it.review === 'APPROVED') out.push({ k: 'approved', cls: 'ok', t: '已批准', hot: true });
    else if (it.review === 'REVIEW_REQUIRED') out.push({ k: 'review', cls: 'warn', t: '待评审', hot: true });
    if (it.ci === 'FAILURE' || it.ci === 'ERROR') out.push({ k: 'ci', cls: 'bad', t: 'CI 失败', hot: !it.draft });
    else if (it.ci === 'PENDING' || it.ci === 'EXPECTED') out.push({ k: 'run', cls: 'run', t: 'CI 运行中' });
    else if (it.ci === 'SUCCESS') out.push({ k: 'pass', cls: 'ok', t: 'CI 通过' });
    if (it.mergeable === 'CONFLICTING') out.push({ k: 'conflict', cls: 'bad', t: '有冲突', hot: !it.draft });
  } else if (it.comments === 0) {
    out.push({ k: 'noreply', cls: 'warn', t: '无回复', hot: true });
  }
  if (isExternal(it)) out.push({ k: 'ext', cls: 'ext', t: '外部贡献', hot: true });
  if (it.bot) out.push({ k: 'bot', cls: 'mute', t: '机器人' });
  const days = daysSince(it.updated);
  if (days >= 30) out.push({ k: 'stale', cls: 'bad', t: `${days} 天未动` });
  else if (days >= 7) out.push({ k: 'idle', cls: 'warn', t: `${days} 天未动` });
  return out;
}
const sigHtml = (list) => list.map((s) => `<span class="sig sig-${s.cls}">${esc(s.t)}</span>`).join('');

/* ---------- 引用与 Markdown ---------- */
function refChip(repo, n, label) {
  const k = L.itemKey(repo, n);
  const it = S.byKey.get(k);
  const text = label || refName(repo, n);
  if (!it) return `<a class="ref out" href="${esc(`https://github.com/${repo}/issues/${n}`)}" target="_blank" rel="noopener" title="不在看板里，在 GitHub 打开">${esc(text)} ↗</a>`;
  return `<a class="ref" data-open="${esc(k)}" href="${esc(ghItemUrl(it.repo, it.n, it.kind))}" title="${esc(it.title)}（⌘ 或 Ctrl 点击在 GitHub 打开）"><span class="s ${stateOf(it).cls}"></span>${esc(text)}</a>`;
}
function noteChip(id, label) {
  const n = S.noteById.get(id);
  if (!n) return `<span class="ref plain note-ref">${esc(label || id.split('/').pop())}</span>`;
  return `<a class="ref note-ref" data-open="note:${esc(id)}" title="${esc(n.title)}">◆ ${esc(label || n.title)}</a>`;
}
function resolvePath(base, href) {
  const parts = base.split('/').slice(0, -1);
  for (const seg of href.split(/[?#]/)[0].split('/')) {
    if (seg === '..') parts.pop();
    else if (seg && seg !== '.') parts.push(seg);
  }
  return parts.join('/');
}

// ctx.repo resolves bare #N; ctx.path is the repository file the text comes from, so relative
// links in a Note open the right file on GitHub.
function renderMarkdown(text, ctx) {
  if (!text) return '';
  let src = String(text).replace(/\r\n?/g, '\n').replace(/<!--[\s\S]*?-->/g, '');
  src = src.replace(/<img\b[^>]*?src=["']([^"']+)["'][^>]*>/gi, (_, url) => `![](${url})`);
  src = src.replace(/<\/?(details|summary|p|div|sub|sup|b|i|br|kbd)\b[^>]*>/gi, '\n');
  const lines = src.split('\n');
  const tokens = [];
  const stash = (v) => `\u0000${tokens.push(v) - 1}\u0000`;
  const restore = (v) => v.replace(/\u0000(\d+)\u0000/g, (_, i) => tokens[+i] ?? '');

  function link(tHtml, href) {
    const gm = /^https?:\/\/github\.com\/([\w.-]+)\/([\w.-]+)\/(?:pull|issues)\/(\d+)/.exec(href);
    if (gm) return refChip(S.canon.get(`${gm[1]}/${gm[2]}`.toLowerCase()) || `${gm[1]}/${gm[2]}`, +gm[3], unesc(tHtml));
    const np = /\.agents\/notes\/((?:implemented|proposed|rejected|archived)\/[\w-]+\/[\w.-]+\.md)/.exec(href);
    if (np && S.noteById.has(np[1])) return noteChip(np[1], unesc(tHtml));
    if (!/^[a-z]+:/i.test(href) && /\.md(?:#.*)?$/.test(href)) {
      const slug = href.split('#')[0].split('/').pop().replace(/\.md$/, '');
      if (S.slugToId.has(slug)) return noteChip(S.slugToId.get(slug), unesc(tHtml));
    }
    if (/^https?:\/\//i.test(href)) return `<a class="ext-link" target="_blank" rel="noopener" href="${esc(href)}">${tHtml}</a>`;
    if (ctx.path && !href.startsWith('#') && !/^[a-z]+:/i.test(href)) {
      return `<a class="ext-link" target="_blank" rel="noopener" href="${esc(`https://github.com/${primary()}/blob/main/${resolvePath(ctx.path, href)}`)}">${tHtml}</a>`;
    }
    return tHtml;
  }
  function linkRefs(v) {
    const refs = S.scanner.scan(v, ctx.repo);
    if (!refs.length) return v;
    let out = '';
    let at = 0;
    for (const r of refs) {
      const seg = v.slice(r.index, r.end);
      if (seg.includes('\u0000')) continue;
      out += v.slice(at, r.index) + stash(refChip(r.repo, r.number, /^https?:/.test(seg) ? null : unesc(seg)));
      at = r.end;
    }
    return out + v.slice(at);
  }
  function inline(raw) {
    let v = esc(raw);
    v = v.replace(/`([^`\n]+)`/g, (_, c) => stash(`<code>${c}</code>`));
    v = v.replace(/!\[([^\]]*)\]\((https:\/\/[^)\s]+)\)/g, (_, alt, url) => stash(`<img loading="lazy" alt="${alt}" src="${url}">`));
    v = v.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, href) => stash(link(t, unesc(href))));
    v = linkRefs(v);
    v = v.replace(/https?:\/\/[^\s<\u0000]*[^\s<\u0000.,;:!?)\]）。，；：]/g, (url) => stash(`<a class="ext-link" target="_blank" rel="noopener" href="${url}">${url}</a>`));
    v = v.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(?<![\w*])\*([^*\n]+)\*(?![\w*])/g, '<em>$1</em>');
    return restore(v);
  }
  const cells = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map((c) => c.trim());
  const isSep = (l) => { const c = cells(l); return c.length > 0 && c.every((x) => /^:?-{3,}:?$/.test(x)); };
  const LIST = /^(\s*)([-+*]|\d+[.)])\s+(.+)$/;
  const out = [];
  let para = [];
  let i = 0;
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join('\n'))}</p>`); para = []; } };
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      flush();
      const code = [];
      i += 1;
      while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) code.push(lines[i++]);
      out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
      i += 1;
      continue;
    }
    const h = /^\s*(#{1,6})\s+(.+?)\s*#*\s*$/.exec(line);
    if (h) { flush(); const lv = Math.min(h[1].length + 1, 5); out.push(`<h${lv}>${inline(h[2])}</h${lv}>`); i += 1; continue; }
    if (line.trim() && i + 1 < lines.length && line.includes('|') && isSep(lines[i + 1])) {
      flush();
      const head = cells(line);
      const rows = [];
      i += 2;
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(cells(lines[i++]));
      out.push(`<div class="tw"><table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${head.map((_, j) => `<td>${inline(r[j] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }
    if (/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)) { flush(); out.push('<hr>'); i += 1; continue; }
    const first = LIST.exec(line);
    if (first) {
      flush();
      const tag = /\d/.test(first[2]) ? 'ol' : 'ul';
      const items = [];
      while (i < lines.length) {
        const m = LIST.exec(lines[i]);
        if (!m) {
          if (items.length && /^\s{2,}\S/.test(lines[i])) { items[items.length - 1].text += ` ${lines[i].trim()}`; i += 1; continue; }
          break;
        }
        items.push({ indent: m[1].length, text: m[3] });
        i += 1;
      }
      out.push(`<${tag}>${items.map(({ indent, text }) => {
        const t = /^\[( |x|X|N\/A)\]\s*(.*)$/.exec(text);
        const pad = indent >= 2 ? ` style="margin-left:${Math.min(indent, 8) * 7}px"` : '';
        if (t) {
          const mark = t[1] === ' ' ? '<span class="tb o">☐</span>' : /x/i.test(t[1]) ? '<span class="tb x">✓</span>' : '<span class="tb na">N/A</span>';
          return `<li class="task"${pad}>${mark}${inline(t[2])}</li>`;
        }
        return `<li${pad}>${inline(text)}</li>`;
      }).join('')}</${tag}>`);
      continue;
    }
    if (/^\s*>\s?/.test(line)) {
      flush();
      const ql = [];
      while (i < lines.length && /^\s*>\s?(.*)$/.test(lines[i])) ql.push(inline(/^\s*>\s?(.*)$/.exec(lines[i++])[1]));
      out.push(`<blockquote>${ql.join('<br>')}</blockquote>`);
      continue;
    }
    if (!line.trim()) { flush(); i += 1; continue; }
    para.push(line);
    i += 1;
  }
  flush();
  return out.join('');
}

/* ---------- PR 与 Issue 正文 ---------- */
function splitSections(body) {
  const clean = (body || '').replace(/\r\n?/g, '\n').replace(/<!--[\s\S]*?-->/g, '');
  const parts = clean.split(/^##\s+/m);
  const pre = parts.shift().trim();
  const secs = parts.map((p) => {
    const nl = p.indexOf('\n');
    return { title: (nl < 0 ? p : p.slice(0, nl)).trim(), body: nl < 0 ? '' : p.slice(nl + 1).trim() };
  });
  if (pre) secs.unshift({ title: '', body: pre });
  return secs;
}
function tally(body) {
  const x = (body.match(/^\s*[-*]\s+\[[xX]\]/gm) || []).length;
  const o = (body.match(/^\s*[-*]\s+\[ \]/gm) || []).length;
  const na = (body.match(/^\s*[-*]\s+\[N\/A\]/gm) || []).length;
  const lines = body.split('\n').filter((l) => l.trim()).length;
  return { x, o, na, heavy: x + o + na >= 2 && (x + o + na) / Math.max(lines, 1) > 0.4 };
}
const titleZh = (t) => { const parts = t.split(' / '); return parts.find((x) => /[一-鿿]/.test(x)) || parts[0]; };
function renderPrBody(it, body) {
  const ctx = { repo: it.repo };
  const secs = splitSections(body);
  if (!secs.length) return '<div class="md"><p class="muted">（PR 没有填写描述）</p></div>';
  return secs.map((s) => {
    if (/^PR 类型|^Type$/i.test(s.title)) return '';
    const t = tally(s.body);
    const html = `<div class="md">${renderMarkdown(s.body, ctx) || '<p class="muted">（空）</p>'}</div>`;
    if (t.heavy) {
      const tl = `<span class="tally"><span class="ok">✓ ${t.x}</span>${t.na ? ` · N/A ${t.na}` : ''}${t.o ? ` · <span class="todo">☐ ${t.o}</span>` : ''}</span>`;
      return `<details class="sec"><summary><div class="sec-h">${esc(titleZh(s.title))} ${tl}</div></summary>${html}</details>`;
    }
    return `<div class="sec">${s.title ? `<div class="sec-h">${esc(titleZh(s.title))}</div>` : ''}${html}</div>`;
  }).join('');
}
function renderIssueBody(it, body) {
  const ctx = { repo: it.repo };
  const secs = (body || '').replace(/\r\n?/g, '\n').split(/^###\s+/m);
  if (secs.length > 1 && !secs[0].trim()) {
    const fields = secs.slice(1).map((p) => {
      const nl = p.indexOf('\n');
      const label = (nl < 0 ? p : p.slice(0, nl)).trim();
      const val = nl < 0 ? '' : p.slice(nl + 1).trim();
      if (!val || val === '_No response_') return '';
      return `<div class="field"><div class="field-l">${esc(titleZh(label))}</div><div class="md">${renderMarkdown(val, ctx)}</div></div>`;
    }).join('');
    if (fields) return fields;
  }
  return `<div class="md">${renderMarkdown(body, ctx) || '<p class="muted">（Issue 没有正文）</p>'}</div>`;
}
// Must match shardName() in engineering-board-model.mjs.
function shardName(repo, n) {
  return `${repo.replace(/[^A-Za-z0-9_-]/g, '_')}--${Math.floor(n / S.idx.shardSize)}.json`;
}
async function loadBody(it) {
  if (!it.bodySize) return '';
  const name = shardName(it.repo, it.n);
  if (!S.bodies.has(name)) {
    S.bodies.set(name, fetch(`data/bodies/${name}`, { cache: FETCH_CACHE }).then((r) => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }).catch((err) => { S.bodies.delete(name); throw err; }));
  }
  return (await S.bodies.get(name))[it.n] ?? '';
}

/* ---------- 列表共用 ---------- */
function chipGroup(label, scope, name, options) {
  const cur = S.f[scope][name] ?? '';
  return `<div class="fgroup"><span>${label}</span>${options.map(([v, t, c]) => `<span class="chip ${cur === v ? 'on' : ''}" data-f="${scope}.${name}" data-v="${esc(v)}">${esc(t)}${c == null ? '' : `<span class="c">${c}</span>`}</span>`).join('')}</div>`;
}
function repoSelect(scope, items) {
  const counts = new Map();
  for (const it of items) counts.set(it.repo, (counts.get(it.repo) || 0) + 1);
  const repos = S.idx.repos.filter((r) => counts.has(r.full))
    .sort((a, b) => ROLE_ORDER[a.role] - ROLE_ORDER[b.role] || a.label.localeCompare(b.label));
  const cur = S.f[scope].repo;
  return `<div class="fgroup"><span>仓库</span><select class="sel" data-fsel="${scope}.repo"><option value="">全部（${items.length}）</option>${repos.map((r) => `<option value="${esc(r.full)}" ${cur === r.full ? 'selected' : ''}>${esc(r.label)}（${counts.get(r.full)}）</option>`).join('')}</select></div>`;
}
function moreButton(scope, total) {
  const shown = S.shown[scope];
  return total > shown ? `<button class="more-rows" data-more="${scope}">再显示 ${Math.min(PAGE, total - shown)} 条（还有 ${total - shown} 条）</button>` : '';
}
function groupBy(items, labelOf) {
  const groups = [];
  let cur = null;
  for (const it of items) {
    const label = labelOf(it);
    if (!cur || cur.label !== label) { cur = { label, items: [] }; groups.push(cur); }
    cur.items.push(it);
  }
  return groups;
}
const selKey = () => S.stack.at(-1);
const kpiHtml = (list) => list.map(([v, l, color, kpi]) => `<div class="kpi" ${kpi != null ? `data-kpi="${esc(kpi)}"` : ''}><div class="v">${v}</div><div class="l">${esc(l)}</div>${color ? `<div class="bar" style="background:${color}"></div>` : ''}</div>`).join('');
const numCell = (it) => `<span class="num">${repoTag(it.repo)}${ghLink(it)}</span>`;
function titleCell(it) {
  if (it.kind === 'pr') {
    const t = prType(it.title);
    return `<span class="title">${t.raw ? `<span class="type type-${t.type}">${esc(t.raw)}</span>` : ''}${t.scope ? `<span class="scope">${esc(t.scope)}</span>` : ''}<span class="txt" title="${esc(it.title)}">${esc(t.rest)}</span></span>`;
  }
  const t = issueTag(it.title);
  return `<span class="title">${t.tag ? `<span class="type type-other">${esc(t.tag)}</span>` : ''}<span class="txt" title="${esc(it.title)}">${esc(t.rest)}</span></span>`;
}
// In a list row, a reference into the row's own repository is written as a bare #N.
function chipFor(e, rowRepo = '') {
  if (e.key.startsWith('note:')) return noteChip(e.key.slice(5));
  const it = S.byKey.get(e.key);
  return refChip(it.repo, it.n, it.repo === rowRepo ? `#${it.n}` : '');
}

/* ---------- 待处理 ---------- */
const MON_SIGS = [
  ['attention', '需要关注'], ['', '全部打开'], ['ext', '外部贡献'], ['review', '待评审'], ['changes', '要求修改'],
  ['approved', '已批准待合入'], ['ci', 'CI 失败'], ['conflict', '有冲突'], ['noreply', '无回复 Issue'], ['draft', '草稿'], ['stale', '30 天未动'],
];
function renderMonitor() {
  const open = S.idx.items.filter((it) => it.state === 'OPEN');
  const sigs = new Map(open.map((it) => [it.k, signals(it)]));
  const has = (it, k) => sigs.get(it.k).some((s) => s.k === k);
  const hot = (it) => sigs.get(it.k).some((s) => s.hot);
  const prs = open.filter((it) => it.kind === 'pr');
  const issues = open.filter((it) => it.kind === 'issue');

  const src = S.idx.source;
  $('monitor-note').innerHTML = MODE === 'live'
    ? `实时模式：GitHub 数据${src.githubFetchedAt ? `读取于 ${esc(fmtTime(src.githubFetchedAt))}` : '还没有读取'}。页面开着时每 10 分钟自动刷新，打开的 PR 的评审、CI 和冲突状态每次都重新读取。`
    : `这是发版时生成的快照（GitHub 数据读取于 ${esc(fmtTime(src.githubFetchedAt) || '—')}），评审、CI 和冲突状态可能已经变化。要看实时状态，在仓库根目录运行 <code>node scripts/agent-notes/serve-agent-notes-board.mjs</code>。`;

  $('mon-kpis').innerHTML = kpiHtml([
    [open.filter(hot).length, '需要关注', 'var(--red)', 'sig:attention'],
    [prs.filter((p) => !p.draft).length, '打开的 PR（不含草稿）', 'var(--green)', 'pr:'],
    [prs.filter((p) => p.draft).length, '草稿 PR', '#94A3B8', 'sig:draft'],
    [issues.length, '打开的 Issue', 'var(--blue)', 'issue:'],
    [open.filter((it) => has(it, 'ext')).length, '外部贡献', 'var(--purple)', 'sig:ext'],
    [prs.filter((p) => has(p, 'ci') && !p.draft).length, 'CI 失败（不含草稿）', 'var(--red)', 'sig:ci'],
    [issues.filter((i) => has(i, 'noreply')).length, '没有回复的 Issue', 'var(--amber)', 'sig:noreply'],
  ]);

  const byRepo = new Map(S.idx.repos.map((r) => [r.full, { r, pr: 0, draft: 0, issue: 0, hot: 0, ext: 0, last: '' }]));
  for (const it of S.idx.items) {
    const row = byRepo.get(it.repo);
    if (row && it.updated > row.last) row.last = it.updated;
  }
  for (const it of open) {
    const row = byRepo.get(it.repo);
    if (!row) continue;
    if (it.kind === 'pr') row[it.draft ? 'draft' : 'pr'] += 1; else row.issue += 1;
    if (hot(it)) row.hot += 1;
    if (has(it, 'ext')) row.ext += 1;
  }
  const total = (x) => x.pr + x.draft + x.issue;
  const rows = [...byRepo.values()].sort((a, b) => b.hot - a.hot || total(b) - total(a)
    || ROLE_ORDER[a.r.role] - ROLE_ORDER[b.r.role] || a.r.label.localeCompare(b.r.label));
  const cell = (v, isHot) => `<td class="n ${v ? (isHot ? 'hot' : '') : 'zero'}">${v}</td>`;
  // Repos with nothing open stay folded unless asked for (or picked as the filter).
  const quiet = rows.filter((x) => !total(x) && S.f.mon.repo !== x.r.full);
  const shownRows = S.allRepos ? rows : rows.filter((x) => !quiet.includes(x));
  const toggle = quiet.length
    ? `<tr class="fold"><td colspan="7"><button class="fold-btn" data-repos-toggle>${S.allRepos ? '只看有打开项的仓库' : `其余 ${quiet.length} 个仓库没有打开的 PR 和 Issue · 显示全部`}</button></td></tr>`
    : '';
  $('repo-table').innerHTML = `<thead><tr><th>仓库</th><th class="n">需要关注</th><th class="n">打开 PR</th><th class="n">草稿</th><th class="n">打开 Issue</th><th class="n">外部贡献</th><th>最近活动</th></tr></thead><tbody>${shownRows.map((x) => `
    <tr data-repo="${esc(x.r.full)}" class="${S.f.mon.repo === x.r.full ? 'on' : ''}">
      <td>${x.r.full === primary() ? '<b>Lithe</b>' : `<span class="repo-tag role-${x.r.role}">${esc(x.r.label)}</span>`}<span class="full">${esc(x.r.full)}</span></td>
      ${cell(x.hot, true)}${cell(x.pr)}${cell(x.draft)}${cell(x.issue)}${cell(x.ext, true)}
      <td class="when">${esc(ago(x.last))}</td>
    </tr>`).join('')}${toggle}</tbody>`;

  const f = S.f.mon;
  const inScope = open.filter((it) => (!f.repo || it.repo === f.repo) && (!f.kind || it.kind === f.kind));
  const match = (it, sig) => (sig === '' ? true : sig === 'attention' ? hot(it) : has(it, sig));
  const list = inScope.filter((it) => match(it, f.sig))
    .sort((a, b) => (f.sort === 'old' ? a.updated.localeCompare(b.updated) : b.updated.localeCompare(a.updated)));
  $('mon-filters').innerHTML =
    chipGroup('类型', 'mon', 'kind', [['', '全部'], ['pr', 'PR'], ['issue', 'Issue']]) +
    chipGroup('信号', 'mon', 'sig', MON_SIGS.map(([v, t]) => [v, t, inScope.filter((it) => match(it, v)).length])) +
    repoSelect('mon', open.filter((it) => !f.kind || it.kind === f.kind)) +
    `<div class="fgroup"><span>排序</span><select class="sel" data-fsel="mon.sort"><option value="new" ${f.sort === 'new' ? 'selected' : ''}>最近更新</option><option value="old" ${f.sort === 'old' ? 'selected' : ''}>最久未动</option></select></div>` +
    `<span class="count">${list.length} 项</span>`;
  const sel = selKey();
  $('mon-list').innerHTML = list.length ? list.slice(0, S.shown.mon).map((it) => `
    <div class="row ${sel === it.k ? 'sel' : ''}" data-open="${esc(it.k)}">
      ${stateIcon(it)}${numCell(it)}${titleCell(it)}
      <span class="side">${sigHtml(sigs.get(it.k))}</span>
      <span class="meta">${esc(it.author)} · ${esc(ago(it.updated))}</span>
    </div>`).join('') + moreButton('mon', list.length) : '<div class="empty">// 没有需要处理的项</div>';
  $('n-monitor').textContent = open.filter(hot).length;
}

/* ---------- PR ---------- */
const prDate = (p) => p.merged || p.closed || p.updated;
function renderPrs() {
  const all = S.idx.items.filter((it) => it.kind === 'pr').sort((a, b) => prDate(b).localeCompare(prDate(a)));
  const f = S.f.pr;
  const scoped = all.filter((p) => !f.repo || p.repo === f.repo);
  const list = scoped.filter((p) => {
    if (f.state && prState(p).label !== f.state) return false;
    if (f.type && prType(p.title).type !== f.type) return false;
    if (f.link === 'issue' && !neighbors(p.k, 'issue').length) return false;
    if (f.link === 'noissue' && neighbors(p.k, 'issue').length) return false;
    if (f.link === 'note' && !neighbors(p.k, 'note').length) return false;
    return true;
  });
  const now = Date.now();
  const withIssue = scoped.filter((p) => neighbors(p.k, 'issue', { strongOnly: true }).length).length;
  $('pr-kpis').innerHTML = kpiHtml([
    [scoped.filter((p) => p.state === 'OPEN' && !p.draft).length, '打开、待合入', 'var(--green)'],
    [scoped.filter((p) => p.state === 'OPEN' && p.draft).length, '草稿', '#94A3B8'],

/* ---------- 决策 ---------- */
const clsBadge = (c) => `<span class="cls cls-${esc(c)}">${esc(CLASS_LABELS[c] || c)}</span>`;
const lifeBadge = (l) => `<span class="life life-${esc(l)}">${esc(LIFE[l] || l)}</span>`;

const deliveries = (n) => n.history.filter((h) => h.pr).length;
// Excerpt text: Markdown tables, links and emphasis reduced to their words.
const plain = (v, max) => (v || '')
  .replace(/^\s*\|?(?:\s*:?-{3,}:?\s*\|)+\s*:?-*:?\s*$/gm, ' ')
  .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
  .replace(/^\s*(?:#{1,6}|>)\s*/gm, '')
  .replace(/\*\*|`/g, '')
  .replace(/\|/g, ' ')
  .replace(/\s+/g, ' ')
  .trim()
  .slice(0, max);

function alternativeItems() {
  const items = [];
  for (const n of S.idx.notes) {
    if (n.lifecycle === 'rejected') {
      items.push({ id: n.id, cls: n.cls, title: n.title, gave: `已否决的提案：${n.title}`, why: n.reason || n.problem || '', won: '提案未采纳' });
    }
    if (!n.alternatives) continue;
    for (const part of n.alternatives.split(/\n(?=###? |- |\d+\. )/)) {
      const clean = part.replace(/^[-#*\d. ]+/, '').trim();
      if (clean.length <= 5) continue;
      const colon = clean.indexOf('：') > -1 ? clean.indexOf('：') : clean.indexOf(':');
      const cut = colon > 0 && colon < 40;
      items.push({ id: n.id, cls: n.cls, title: n.title, gave: (cut ? clean.slice(0, colon) : clean.slice(0, 48)).replace(/\*\*/g, ''), why: cut ? clean.slice(colon + 1).trim() : clean, won: `采纳：${n.title}` });
    }
  }
  return items;
}
function renderAlternatives() {
  const q = S.f.alt.toLowerCase();
  const list = alternativeItems().filter((it) => !q || `${it.gave} ${it.why} ${it.title}`.toLowerCase().includes(q));
  $('alt-count').textContent = `${list.length} 条`;
  $('pitfalls').innerHTML = list.map((it) => `
    <div class="pitfall" data-open="note:${esc(it.id)}">
      <div class="ph">${clsBadge(it.cls)}<span>${esc(it.id.split('/').pop().replace(/\.md$/, ''))}</span></div>

}

/* ---------- 侧栏 ---------- */
function labelOf(k) {
  if (k.startsWith('note:')) { const n = S.noteById.get(k.slice(5)); return `◆ ${n ? n.title : k.slice(5)}`; }
  const it = S.byKey.get(k);
  return it ? `${it.kind === 'pr' ? 'PR' : 'Issue'} ${refName(it.repo, it.n)}` : k;
}
function nodeHtml(e, curKey) {
  const cur = e.key === curKey;
  const attrs = cur ? '' : `data-open="${esc(e.key)}"`;
  const rel = e.rel ? relText(e) : '';
  if (e.key.startsWith('note:')) {
    const n = S.noteById.get(e.key.slice(5));
    return `<div class="node ${cur ? 'cur' : ''}" ${attrs}><div class="nh"><span style="color:var(--amber)">◆</span>${esc(LIFE[n.lifecycle])}${rel ? ` · ${esc(rel)}` : ''}</div><div class="nt">${esc(n.title)}</div></div>`;
  }
  const it = S.byKey.get(e.key);
  return `<div class="node ${cur ? 'cur' : ''}" ${attrs}><div class="nh"><span class="s ${stateOf(it).cls}"></span>${ghLink(it, refName(it.repo, it.n))} · ${esc(stateOf(it).label)}${rel ? ` · ${esc(rel)}` : ''}</div><div class="nt">${esc(shortTitle(it))}</div></div>`;
}
function lane(title, hint, entries, curKey) {
  const LIMIT = 6;
  const body = entries.slice(0, LIMIT).map((e) => nodeHtml(e, curKey)).join('') || '<div class="lane-empty">—</div>';
  const more = entries.length > LIMIT
    ? `<div class="more" data-expand>还有 ${entries.length - LIMIT} 项</div><div hidden>${entries.slice(LIMIT).map((e) => nodeHtml(e, curKey)).join('')}</div>`
    : '';
  const count = entries.filter((e) => e.key !== curKey).length;
  return `<div class="lane"><div class="lane-h">${title}<span class="k">${hint} · ${count}</span></div>${body}${more}</div>`;
}
// Three lanes around the open item. A PR also shows the other PRs that close or reference the
// same Issue; an Issue and a Note reach through their strongly linked PRs one step further.
function traceFor(k) {
  const self = { key: k, rel: '' };
  const kind = kindOf(k);
  let issues;
  let prs;
  let notes;
  if (kind === 'note') {
    prs = neighbors(k, 'pr');
    issues = uniq([...neighbors(k, 'issue'), ...prs.filter((e) => STRONG.has(e.rel)).flatMap((p) => neighbors(p.key, 'issue', { strongOnly: true }))]);
    notes = [self, ...neighbors(k, 'note')];
  } else if (kind === 'pr') {
    issues = neighbors(k, 'issue');
    const siblings = issues.filter((e) => STRONG.has(e.rel))
      .flatMap((i) => neighbors(i.key, 'pr', { strongOnly: true }))
      .map((e) => ({ key: e.key, rel: 'sibling' }));
    prs = uniq([self, ...neighbors(k, 'pr'), ...siblings]);
    notes = neighbors(k, 'note');
  } else {
    prs = neighbors(k, 'pr');
    issues = [self, ...neighbors(k, 'issue')];
    notes = uniq([...neighbors(k, 'note'), ...prs.filter((e) => STRONG.has(e.rel)).flatMap((p) => neighbors(p.key, 'note'))]);
  }
  return `<div class="trace">
    <div class="trace-h"><span>关联链路</span><span>点编号去 GitHub，点其他位置在侧栏里继续看</span></div>
    <div class="lanes">${lane('问题', 'Issue', issues, k)}${lane('交付', 'PR', prs, k)}${lane('决策', 'Note', notes, k)}</div>
  </div>`;
}

function renderNoteDrawer(n) {

  const ctx = { repo: primary(), path: `.agents/notes/${n.id}` };
  const hist = n.history.map((h) => {
    const it = h.pr ? S.byKey.get(h.pr) : null;
    const what = it
      ? `${refChip(it.repo, it.n)} ${esc(shortTitle(it))}`
      : `<a class="sha" href="${esc(`https://github.com/${primary()}/commit/${h.sha}`)}" target="_blank" rel="noopener">${esc(h.sha.slice(0, 9))} ↗</a> ${esc(h.subject)}`;
    const moved = h.action === 'R' && h.from ? `<span class="muted" style="font-size:12px">（从 ${esc(h.from.split('/').slice(0, 2).join('/'))}）</span>` : '';
    return `<div class="hist-i"><span class="when">${esc(h.date)}</span><span class="act">${esc(ACT[h.action] || h.action)}</span>${what}${moved}</div>`;
  }).join('');
  $('d-body').innerHTML = `

    <div class="anchor"><code>${esc(anchor)}</code><button data-copy="${esc(anchor)}">复制代码注释</button></div>
    ${traceFor(L.noteKey(n.id))}

    ${[['问题', n.problem], ['决策', n.decision], ['考虑过的备选方案', n.alternatives], ['后果', n.consequences]]
      .filter(([, v]) => v).map(([t, v]) => `<div class="sec"><div class="sec-h">${t}</div><div class="md">${renderMarkdown(v, ctx)}</div></div>`).join('')}`;
}

function renderItemDrawer(it) {
  const s = stateOf(it);
  $('d-ext').href = ghItemUrl(it.repo, it.n, it.kind);
  const pt = it.kind === 'pr' ? prType(it.title) : null;
  const itag = it.kind === 'issue' ? issueTag(it.title) : null;
  const who = `${esc(it.author)}${isExternal(it) ? '（外部贡献）' : ''}${it.bot ? '（机器人）' : ''}`;
  const when = it.merged ? `合入 ${fmtDate(it.merged)}` : it.closed ? `关闭 ${fmtDate(it.closed)}` : `更新 ${fmtDate(it.updated)}`;
  const meta = [ghLink(it, refName(it.repo, it.n)), who, `创建 ${fmtDate(it.created)}`, when,
    it.kind === 'pr' && it.head ? `${esc(it.head)} → ${esc(it.base)}` : '', `${it.comments} 条评论`];
  const sigs = it.state === 'OPEN' ? signals(it) : [];
  $('d-body').innerHTML = `
    <div class="d-badges">
      <span class="state-badge" style="background:${s.color}">${it.kind === 'pr' ? 'PR' : 'Issue'} · ${s.label}</span>
      ${pt?.raw ? `<span class="type type-${pt.type}">${esc(pt.raw)}</span>` : ''}${pt?.scope ? `<span class="scope">${esc(pt.scope)}</span>` : ''}
      ${itag?.tag ? `<span class="type type-other">${esc(itag.tag)}</span>` : ''}
      ${repoTag(it.repo)}${sigHtml(sigs)}${labelChips(it.labels)}
    </div>
    <h1 class="d-title">${esc(pt ? pt.rest : itag.rest)}</h1>
    <div class="d-meta">${meta.filter(Boolean).map((m) => `<span>${m}</span>`).join('<span>·</span>')}</div>
    ${traceFor(it.k)}
    <div id="d-content"><div class="loading">正在载入正文…</div></div>`;
  const k = it.k;
  loadBody(it).then((body) => {
    if (selKey() !== k) return;
    $('d-content').innerHTML = it.kind === 'pr' ? renderPrBody(it, body) : renderIssueBody(it, body);
  }).catch((err) => {
    if (selKey() !== k) return;
    // fetch() rejects with a TypeError only when nothing answered: in live mode the local server
    // has usually been stopped, and the browser's own message ("Failed to fetch") says nothing.
    const why = !(err instanceof TypeError) ? err.message
      : MODE === 'live' ? '连不上本地服务，它可能已经停止。重新运行 serve-agent-notes-board.mjs 后刷新页面。'
        : '网络请求没有得到响应，刷新页面再试。';
    $('d-content').innerHTML = `<div class="loading">正文载入失败：${esc(why)}</div>`;
  });
}

function renderDrawer({ keepScroll = false } = {}) {
  const k = selKey();
  if (!k) return;
  const top = $('d-body').scrollTop;
  $('d-back').disabled = S.stack.length < 2;
  $('d-crumbs').innerHTML = S.stack.map((s, i) => `<span class="crumb ${i === S.stack.length - 1 ? 'cur' : ''}" data-crumb="${i}">${esc(labelOf(s))}</span>`).join('<span>›</span>');
  if (k.startsWith('note:')) renderNoteDrawer(S.noteById.get(k.slice(5)));
  else renderItemDrawer(S.byKey.get(k));
  $('d-body').scrollTop = keepScroll ? top : 0;
  markSelected();
  writeHash();
}
function markSelected() {
  const k = selKey();
  document.querySelectorAll('main .row.sel').forEach((el) => el.classList.remove('sel'));
  if (k) document.querySelectorAll(`main .row[data-open="${CSS.escape(k)}"]`).forEach((el) => el.classList.add('sel'));
}
function openKey(k, { reset = false } = {}) {
  if (!k || !known(k)) return;
  if (reset) S.stack = [];
  const at = S.stack.indexOf(k);
  if (at >= 0) S.stack = S.stack.slice(0, at + 1); else S.stack.push(k);
  $('drawer').classList.add('open');
  $('curtain').classList.add('open');
  renderDrawer();
}
function closeDrawer() {
  S.stack = [];
  $('drawer').classList.remove('open');
  $('curtain').classList.remove('open');
  markSelected();
  writeHash();
}
function back() {
  if (S.stack.length < 2) return;
  S.stack.pop();
  renderDrawer();
}

/* ---------- 地址栏 ---------- */
// #tab=prs&sub=…&open=k1,k2 keeps the view and the drawer stack. The old board's #baseline
// style tabs and #note=<id> still open.
function writeHash() {
  const p = new URLSearchParams();
  if (S.tab !== 'monitor') p.set('tab', S.tab);
  if (S.tab === 'notes' && S.sub !== 'baseline') p.set('sub', S.sub);
  if (S.stack.length) p.set('open', S.stack.join(','));
  const hash = p.toString();
  const url = hash ? `#${hash}` : location.pathname + location.search;
  if (url !== location.hash) history.replaceState(null, '', url);
}
function readHash() {
  const raw = location.hash.slice(1);
  if (!raw) return;
  if (SUBS.includes(raw)) { switchTab('notes', raw); return; }
  const p = new URLSearchParams(raw);
  if (p.get('note')) { openKey(L.noteKey(p.get('note')), { reset: true }); return; }
  if (p.get('tab')) switchTab(p.get('tab'), p.get('sub'));
  const keys = (p.get('open') || '').split(',').filter(known);
  if (keys.length) keys.forEach((k, i) => openKey(k, { reset: i === 0 }));
}
function switchTab(tab, sub) {
  S.tab = TABS.includes(tab) ? tab : 'monitor';
  if (SUBS.includes(sub)) S.sub = sub;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === S.tab));
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === `view-${S.tab}`));
  document.querySelectorAll('#subnav button').forEach((b) => b.classList.toggle('on', b.dataset.sub === S.sub));
  document.querySelectorAll('.sub').forEach((v) => v.classList.toggle('on', v.id === `sub-${S.sub}`));
  writeHash();
}

/* ---------- 搜索 ---------- */
function search(q) {
  const pop = $('pop');
  q = q.trim();
  if (!q) { pop.classList.remove('open'); return; }
  const lower = q.toLowerCase();
  const exact = S.scanner.scan(q, primary()).map((r) => S.byKey.get(L.itemKey(r.repo, r.number))).filter(Boolean);
  const num = /^#?(\d+)$/.exec(q)?.[1];
  let items;
  if (num) {
    items = S.idx.items.filter((it) => String(it.n) === num)
      .sort((a, b) => Number(b.repo === primary()) - Number(a.repo === primary()));
  } else {
    items = S.idx.items.filter((it) => it.title.toLowerCase().includes(lower) || it.author.toLowerCase() === lower
      || it.labels.some(([name]) => name.toLowerCase().includes(lower)));
  }
  items = [...new Set([...exact, ...items])];
  const notes = num ? [] : S.idx.notes.filter((n) => `${n.title} ${n.slug} ${n.problem} ${n.decision} ${n.alternatives}`.toLowerCase().includes(lower));
  const group = (label, arr, fn) => (arr.length ? `<div class="pop-group">${label} · ${arr.length}</div>${arr.slice(0, 8).map(fn).join('')}` : '');
  const itemRow = (it) => `<div class="pop-item" data-open="${esc(it.k)}">${stateIcon(it)}<span class="t">${esc(it.title)}</span><span class="num">${ghLink(it, refName(it.repo, it.n))}</span></div>`;
  pop.innerHTML = (group('PR', items.filter((i) => i.kind === 'pr'), itemRow)
    + group('Issue', items.filter((i) => i.kind === 'issue'), itemRow)
    + group('决策', notes, (n) => `<div class="pop-item" data-open="note:${esc(n.id)}"><span style="color:var(--amber)">◆</span><span class="t">${esc(n.title)}</span><span class="num">${esc(LIFE[n.lifecycle])}</span></div>`)
    || '<div class="pop-group">没有结果</div>')
    + '<div class="pop-hint">PR 和 Issue 搜标题、作者、标签和编号；决策搜全文。每组最多列 8 项。</div>';
  pop.classList.add('open');
}

/* ---------- 状态条 ---------- */
function renderStatus() {
  const src = S.idx?.source || {};
  const live = S.live || {};
  const chip = $('status-chip');
  const refreshing = live.refreshing ?? src.refreshing;
  // The local server sends complete messages; a static snapshot only carries the GitHub error.
  const error = 'error' in live ? live.error : src.githubError && `GitHub 数据没有更新：${src.githubError}`;
  const fetched = live.githubFetchedAt || src.githubFetchedAt;
  chip.classList.toggle('live', MODE === 'live');
  chip.classList.toggle('busy', Boolean(refreshing));
  if (MODE === 'live') {
    $('status-text').textContent = refreshing ? '正在读取 GitHub…' : `实时 · GitHub ${fetched ? ago(fetched) : '未读取'}`;
    if (!$('refresh')) {
      const btn = document.createElement('button');
      btn.id = 'refresh';
      btn.textContent = '刷新';
      btn.title = '立刻从 GitHub 读取变化';
      chip.appendChild(btn);
    }
    $('refresh').disabled = Boolean(refreshing);
  } else {
    $('status-text').textContent = `快照 · ${fmtTime(S.idx?.generatedAt)}`;
  }
  const banner = [];
  if (error) banner.push(esc(error));
  if (S.idx && !fetched) banner.push('现在只有决策数据，还没有 PR 和 Issue。');
  $('banner').hidden = !banner.length;
  $('banner-text').innerHTML = banner.join('<br>');
}

/* ---------- 事件 ---------- */
function resetPage(scope) { if (scope in S.shown) S.shown[scope] = PAGE; }
document.addEventListener('click', (e) => {
  const expand = e.target.closest('[data-expand]');
  if (expand) { expand.nextElementSibling.hidden = false; expand.remove(); return; }
  const copy = e.target.closest('[data-copy]');
  if (copy) {
    navigator.clipboard?.writeText(copy.dataset.copy);
    copy.textContent = '已复制';
    setTimeout(() => { copy.textContent = '复制代码注释'; }, 1500);
    return;
  }
  const more = e.target.closest('[data-more]');
  if (more) { S.shown[more.dataset.more] += PAGE; renderAll(); return; }
  if (e.target.closest('[data-repos-toggle]')) { S.allRepos = !S.allRepos; renderAll(); return; }
  const f = e.target.closest('[data-f]');
  if (f) {
    const [scope, name] = f.dataset.f.split('.');
    S.f[scope][name] = f.dataset.v;
    resetPage(scope);
    renderAll();
    return;
  }
  const kpi = e.target.closest('[data-kpi]');
  if (kpi) {
    const [scope, rest] = kpi.dataset.kpi.split(':');
    if (scope === 'dir') {
      const [name, value] = rest.split('=');
      Object.assign(S.f.dir, { st: '', cls: '', q: '', [name]: value });
      switchTab('notes', 'directory');
    } else if (scope === 'sig') {
      Object.assign(S.f.mon, { sig: rest, kind: rest === 'noreply' ? 'issue' : '' });
    } else {
      Object.assign(S.f.mon, { sig: '', kind: scope });
    }
    resetPage('mon');
    renderAll();
    return;
  }
  const repoRow = e.target.closest('[data-repo]');
  if (repoRow) {
    S.f.mon.repo = S.f.mon.repo === repoRow.dataset.repo ? '' : repoRow.dataset.repo;
    resetPage('mon');
    renderMonitor();
    $('mon-filters').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const crumb = e.target.closest('[data-crumb]');
  if (crumb) { S.stack = S.stack.slice(0, +crumb.dataset.crumb + 1); renderDrawer(); return; }
  // A link to GitHub navigates by itself, even inside a row or card that opens the drawer. A
  // reference chip opens the drawer on a plain click and GitHub with ⌘, Ctrl or Shift held.
  const link = e.target.closest('a[href]');
  if (link && (!link.dataset.open || e.metaKey || e.ctrlKey || e.shiftKey)) { $('pop').classList.remove('open'); return; }
  const o = e.target.closest('[data-open]');
  if (o) {
    e.preventDefault();
    $('pop').classList.remove('open');
    openKey(o.dataset.open, { reset: !o.closest('#drawer') });
    return;
  }
  const tab = e.target.closest('.tab');
  if (tab) { switchTab(tab.dataset.tab); return; }
  const sub = e.target.closest('#subnav button');
  if (sub) { switchTab('notes', sub.dataset.sub); return; }
  if (e.target.id === 'refresh') { requestRefresh(); return; }
  if (!e.target.closest('.search')) $('pop').classList.remove('open');
});
document.addEventListener('change', (e) => {
  const s = e.target.closest('[data-fsel]');
  if (!s) return;
  const [scope, name] = s.dataset.fsel.split('.');
  S.f[scope][name] = s.value;
  resetPage(scope);
  renderAll();
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') search(e.target.value);
  if (e.target.id === 'alt-q') { S.f.alt = e.target.value; renderAlternatives(); }
  if (e.target.id === 'dir-q') { S.f.dir.q = e.target.value; renderDirectoryList(); }
});
$('curtain').onclick = closeDrawer;
$('d-close').onclick = closeDrawer;
$('d-back').onclick = back;
document.addEventListener('keydown', (e) => {
  const typing = ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName);
  if (e.key === 'Escape') {
    if ($('pop').classList.contains('open')) $('pop').classList.remove('open'); else closeDrawer();
  }
  if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); }
  if (e.key === 'Backspace' && !typing && S.stack.length > 1) { e.preventDefault(); back(); }
});

/* ---------- 载入与实时更新 ---------- */
async function fetchIndex() {
  const r = await fetch('data/index.json', { cache: FETCH_CACHE });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
function renderFooter() {
  const repoLinks = S.idx.repos.filter((r) => ['app', 'core', 'store'].includes(r.role))
    .map((r) => `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.full === primary() ? 'Lithe' : r.label)}</a>`).join(' · ');
  $('footer').innerHTML = `<div>决策来自 .agents/notes；PR 和 Issue 来自 ${S.idx.repos.length} 个公开且未归档的仓库，只含标题、正文、状态和标签，不含代码和评论内容</div>`
    + `<div>${repoLinks}${MODE === 'static' ? ' · <a href="platform-feature-matrix/">平台功能矩阵</a>' : ''}</div>`;
}
async function reload() {
  ingest(await fetchIndex());
  S.bodies.clear();
  renderAll();
  renderFooter();
  if (S.stack.length) renderDrawer({ keepScroll: true }); else if ($('drawer').classList.contains('open')) closeDrawer();
}
async function requestRefresh() {
  S.live = { ...(S.live || {}), refreshing: true };
  renderStatus();
  try {
    const r = await fetch('refresh', { method: 'POST' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
  } catch (err) {
    S.live = { ...(S.live || {}), refreshing: false, error: `刷新请求失败：${err.message}` };
    renderStatus();
  }
}
// The server sends a status event on connect and after every build; a revision newer than
// the loaded index means the board changed, so the page fetches it again.
let syncing = false;
async function syncBoard() {
  if (syncing) return;
  syncing = true;
  try {
    let last = null;
    while (S.live?.revision && S.live.revision !== S.idx.source.revision && S.idx.source.revision !== last) {
      last = S.idx.source.revision;
      await reload();
    }
  } catch (err) {
    console.error(err);
  } finally {
    syncing = false;
  }
}
function connectLive() {
  const events = new EventSource('events');
  events.addEventListener('status', (e) => {
    S.live = JSON.parse(e.data);
    renderStatus();
    syncBoard();
  });
  events.onerror = () => {
    if (events.readyState === EventSource.OPEN) return;
    S.live = { ...(S.live || {}), refreshing: false, error: '和本地服务的连接断开了，正在重连。服务已经停止时，重新运行后刷新页面。' };
    renderStatus();
  };
}

(async () => {
  try {
    ingest(await fetchIndex());
  } catch (err) {
    $('status-text').textContent = '数据载入失败';
    $('banner').hidden = false;
    $('banner-text').textContent = `读取 data/index.json 失败（${err.message}）。直接双击打开文件时浏览器不允许读取数据，请在仓库根目录运行 node scripts/agent-notes/serve-agent-notes-board.mjs。`;
    return;
  }
  renderAll();
  renderFooter();
  readHash();
  if (MODE === 'live') connectLive();
  window.addEventListener('hashchange', readHash);
  setInterval(() => { renderStatus(); }, 60_000);
})();
</script>
</body>
