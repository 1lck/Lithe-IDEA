# How viva package builds and bundles the Lithe desktop client. scripts/desktop/package-desktop.sh
# (make package) supplies the staged Lithe-core-rust cgo environment. The client embeds this file
# (desktop/version.go), so the version it displays and the package metadata share one source.
#
# [app] version is the client's version. The Desktop Release workflow refuses a tag that does
# not match it, so a release changes it here first.
[app]
name = "Lithe Desktop"
# A separate identity from the SwiftUI client (app.lithe.desktop), so both can be installed
# while this client grows.
id = "app.lithe.viva"
version = "0.7.0"
executable = "lithe"
package = "./cmd/lithe"
# The full-bleed square of the SwiftUI client's icon; viva package shapes it into the macOS tile.
icon = "assets/icon.png"

[mac]
# scripts/desktop/desktop-go.sh builds the program and the core for macOS 13.0.
min_system = "13.0"
category = "public.app-category.developer-tools"
copyright = "Copyright 2026 Lithe contributors"

[windows]
publisher = "Lithe contributors"
scope = "user"
url = "https://github.com/1lck/Lithe-IDEA"

[linux]
category = "Development"
comment = "Native code editor and project workbench."
maintainer = "Lithe contributors <noreply@github.com>"
homepage = "https://github.com/1lck/Lithe-IDEA"
keywords = ["code", "editor", "development", "IDE"]
# Viva adds Vulkan, base XCB and Cairo dependencies; these packages provide its remaining dlopen libraries.
depends = [
  "libfontconfig1",
  "libglib2.0-0",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libpangoft2-1.0-0",
  "libxcb-cursor0",
  "libxcb-randr0",
  "libxcb-render0",
  "libxcb-shape0",
  "libxcb-sync1",
]
